		<link
			rel="preconnect"

			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&family=Rajdhani:wght@500;600;700&family=Teko:wght@300;400;500;600&display=swap"

		<script>
			tailwind.config = {
				darkMode: "class",
				theme: {
					extend: {
						fontFamily: {
							sans: ["Montserrat", "sans-serif"],
							display: ["Rajdhani", "sans-serif"],
							headline: ["Teko", "sans-serif"]

						colors: {
							brand: {
								blue: "#1C86EE",
								electric: "#00F0FF", // Cyberpunk blue
								dark: "#050505",
								surface: "#0F1115",

							}

						backgroundImage: {
							"grid-pattern":
								"linear-gradient(to right, #1C86EE 1px, transparent 1px), linear-gradient(to bottom, #1C86EE 1px, transparent 1px)"
						}

				}
			};

		<style>
			/* CRITICAL FOR PRINTING DARK BACKGROUNDS */
			@media print {
				body {
					-webkit-print-color-adjust: exact !important;
					print-color-adjust: exact !important;
					background-color: white !important;
					height: 100vh !important;
					margin: 0 !important;
					padding: 0 !important;
					display: flex !important;
					align-items: center !important;
					justify-content: center !important;
					overflow: visible !important;
				}

				.no-print,
				#controls-container {
					display: none !important;
				}

				.scale-wrapper {
					transform: none !important;
					width: 100% !important;
					height: 100% !important;
					margin: 0 !important;
					display: flex !important;
					align-items: center !important;
					justify-content: center !important;
					overflow: visible !important;
				}

				.flyer-container {
					box-shadow: none !important;
					margin: 0 !important;
					transform: none !important;
					width: auto !important;
					height: 95vh !important;
					max-width: 100% !important;
					page-break-after: always;
					border: none !important;
					outline: 2px dashed #9ca3af !important;
				}
			}

			* {
				box-sizing: border-box;
			}

			body {
				background-color: #e5e7eb;
				transition:
					background-color 0.5s ease,
					color 0.5s ease;
				color: #1a1a1a;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: flex-start;
				min-height: 100vh;
				margin: 0;
				padding: 10px;
				font-family: "Montserrat", sans-serif;
				cursor: default;
				overflow-x: hidden;
			}

			html.dark body {
				background-color: #111;
				color: white;
			}

			.scale-wrapper {
				position: relative;
				display: flex;
				justify-content: center;
				align-items: flex-start;
				margin-top: 20px;
				margin-bottom: 50px;
				width: 100%;
				transition:
					height 0.3s ease,
					opacity 0.3s ease;
				opacity: 0;
			}

			.flyer-container {
				width: 1000px;
				height: auto;
				aspect-ratio: 9/16;
				display: flex;
				flex-direction: column;
				flex-shrink: 0;
				position: relative;
				transform-origin: top center;
				will-change: transform;
			}

			.cyber-grid {
				position: absolute;
				inset: 0;
				background-size: 40px 40px;
				background-image:
					linear-gradient(
						to right,
						rgba(28, 134, 238, 0.05) 1px,
						transparent 1px
					),
					linear-gradient(
						to bottom,
						rgba(28, 134, 238, 0.05) 1px,
						transparent 1px
					);
				z-index: 0;
				mask-image: radial-gradient(
					circle at center,
					black 40%,
					transparent 100%
				);
				pointer-events: none;
			}

			.spotlight {
				position: absolute;
				top: -20%;
				left: 50%;
				transform: translateX(-50%);
				width: 120%;
				height: 60%;
				background: radial-gradient(
					circle,
					rgba(28, 134, 238, 0.2) 0%,
					transparent 70%
				);
				z-index: 0;
				pointer-events: none;
			}

			.menu-item {
				transition: all 0.3s ease;
			}

			/* Global Two Column Grid for Menu Items */
			#menu-items-container {
				display: grid !important;
				grid-template-columns: 1fr 1fr !important;
				gap: 1rem !important;
			}

			.flyer-container.layout-digital-dense .menu-item {
				padding-top: 0.35rem !important;
				padding-bottom: 0.35rem !important;
			}

			/* --- TYPOGRAPHY FOR LONG TITLE MODE --- */
			.flyer-container.is-long-title .main-headline {
				font-size: 3.5rem !important;
				line-height: 1 !important;
				letter-spacing: 0.05em !important;
			}
			.flyer-container.is-long-title .sub-headline {
				font-size: 4.5rem !important;
				line-height: 0.9 !important;
			}

			#controls-scroll::-webkit-scrollbar {
				height: 4px;
			}
			#controls-scroll::-webkit-scrollbar-track {
				background: rgba(255, 255, 255, 0.1);
			}
			#controls-scroll::-webkit-scrollbar-thumb {
				background: #1c86ee;
				border-radius: 4px;
			}

			.no-scrollbar::-webkit-scrollbar {
				display: none;
			}
			.no-scrollbar {
				-ms-overflow-style: none;
				scrollbar-width: none;
			}

			/* Discount Badge Styling - Raised by 25px (from 80px to 55px) */
			.discount-badge {
				position: absolute;
				top: 55px;
				right: 40px;
				z-index: 50;
				pointer-events: none;
			}
		</style>
	</head>

	<body>

					<button

		</div>

		<script>
			// --- DATA SOURCE ---
			const allMenuItems = [
				{ title: "Myers Cocktail", highlight: false },
				{ title: "Reboot", highlight: false },
				{ title: "Recovery", highlight: false },
				{ title: "Growth Factors", highlight: false },
				{ title: "Immunity Boost", highlight: false },
				{ title: "Beauty", highlight: false },
				{ title: "NAD+ Therapy", highlight: false },
				{ title: "Alpha Lipoic Acid", highlight: false },
				{ title: "Get Up & Go", highlight: false },
				{ title: "Add-ons", highlight: false },
				{ title: "Glutathione", highlight: false },
				{ title: "Exosomes", highlight: false }
			];

			const themeBtn = document.getElementById("theme-toggle");
			const htmlElement = document.documentElement;
			themeBtn.addEventListener("click", () =>
				htmlElement.classList.toggle("dark")
			);

			const borderBtn = document.getElementById("border-toggle");
			const borderIcon = document.getElementById("border-icon");
			const paddingContainer = document.getElementById(
				"outer-padding-container"
			);
			const contentFrame = document.getElementById("content-frame");
			let borderActive = false;

			borderBtn.addEventListener("click", () => {
				borderActive = !borderActive;
				if (borderActive) {
					paddingContainer.classList.add(
						"p-[30px]",
						"border",
						"border-dashed",
						"border-gray-400",
						"dark:border-white/30"
					);
					contentFrame.classList.add("border", "border-brand-blue");
					borderIcon.className =
						"fa-solid fa-ban text-brand-blue text-sm";
				} else {
					paddingContainer.classList.remove(
						"p-[30px]",
						"border",
						"border-dashed",
						"border-gray-400",
						"dark:border-white/30"
					);
					contentFrame.classList.remove(
						"border",
						"border-brand-blue"
					);
					borderIcon.className =
						"fa-regular fa-square text-brand-blue text-sm";
				}
			});

			const flyerContainer = document.getElementById("flyer-container");
			const flyerWrapper = document.getElementById("scale-wrapper");
			const menuContainer = document.getElementById(
				"menu-items-container"
			);
			const sizeButtons = document.querySelectorAll(".size-btn");
			const mainHeadline = document.getElementById("main-headline");
			const subHeadline = document.getElementById("sub-headline");
			const topLabel = document.getElementById("top-label");
			const titleSection = document.getElementById("title-section");
			const menuHeader = document.getElementById("menu-header");
			const menuSection = document.getElementById("menu-section");
			const brandSlogan = document.getElementById("brand-slogan");
			let currentType = "digital";

			function renderMenu(param) {
				menuContainer.innerHTML = "";
				let itemsToShow = Array.isArray(param)
					? param
					: allMenuItems.slice(0, param);

				itemsToShow.forEach((item, index) => {
					const borderClass =
						index % 2 === 0 ? "bg-brand-blue" : "bg-brand-electric";
					const isHigh = item.highlight;

					const html = `
                        <div class="menu-item p-2 flex flex-col justify-center relative overflow-hidden border ${isHigh ? "bg-brand-blue/10 border-brand-blue" : "bg-brand-light dark:bg-white/5 border-brand-blue/20"} min-h-[85px]">
                            ${isHigh ? '<div class="absolute -right-6 -top-6 w-24 h-24 bg-brand-blue blur-[50px] opacity-20 dark:opacity-40"></div>' : ""}
                            <div class="absolute left-0 top-0 w-2 h-full ${borderClass}"></div>
                            <div class="relative z-10 pl-1">
                                <h3 class="menu-title font-display font-bold text-4xl text-brand-dark dark:text-white uppercase tracking-wide leading-tight transition-all duration-300">${item.title}</h3>
                            </div>
                        </div>`;
					menuContainer.insertAdjacentHTML("beforeend", html);
				});
			}

			function setFlyerSize(type) {
				currentType = type;
				sizeButtons.forEach((btn) => {
					btn.classList.remove(
						"border-2",
						"border-brand-blue",
						"bg-brand-blue",
						"text-white",
						"shadow-lg",
						"font-bold"
					);
					btn.classList.add(
						"border-brand-blue/30",
						"bg-brand-surface",
						"text-white",
						"font-medium"
					);
				});

				const activeBtn = document.getElementById(`btn-${type}`);
				if (activeBtn) {
					activeBtn.classList.remove(
						"border-brand-blue/30",
						"bg-brand-surface",
						"text-white",
						"font-medium"
					);
					activeBtn.classList.add(
						"border-2",
						"border-brand-blue",
						"bg-brand-blue",
						"text-white",
						"shadow-lg",
						"font-bold"
					);
				}

				flyerContainer.classList.remove(
					"layout-narrow",
					"scale-content-up",
					"layout-half",
					"layout-digital-dense"
				);
				titleSection.style.display = "flex";
				menuHeader.style.display = "flex";
				menuSection.classList.remove("mt-6", "mt-12");

				if (type === "club2") {
					brandSlogan.innerText = "IV & Regenerative Bar";
				} else {
					brandSlogan.innerText =
						"Discover • Optimize • Regenerate • IV & Regenerative Bar";
				}

				if (type === "club" || type === "club2") {
					flyerContainer.classList.remove("is-long-title");
					mainHeadline.innerText = "POST PARTY RECOVERY";
					mainHeadline.style.fontSize = "5.5rem";
					subHeadline.innerText = "";
					topLabel.style.display = "block";
					titleSection.style.display = "flex";
				} else {
					flyerContainer.classList.add("is-long-title");
					mainHeadline.innerText = "PERFORMANCE & REGENERATIVE";
					mainHeadline.style.fontSize = "";
					subHeadline.innerText = "THERAPIES";
					topLabel.style.display = "none";
				}

				switch (type) {
					case "half":
						flyerContainer.style.aspectRatio = "5.5 / 8.5";
						flyerContainer.classList.add("layout-half");
						renderMenu(10);
						break;
					case "rack":
						flyerContainer.style.aspectRatio = "4 / 9";
						flyerContainer.classList.add("layout-narrow");
						renderMenu(10);
						break;
					case "club":
						menuHeader.style.display = "none";
						menuSection.classList.add("mt-6");
						flyerContainer.style.aspectRatio = "4.25 / 5.5";
						renderMenu([
							allMenuItems[0],
							allMenuItems[1],
							allMenuItems[2],
							allMenuItems[3],
							allMenuItems[11]
						]);
						break;
					case "club2":
						flyerContainer.style.aspectRatio = "4.25 / 5.5";
						// Custom order for Club 2:
						// Row 1: [Myers, Beauty] | Row 2: [Recovery, Reboot] | Row 3: [Immunity, Growth Factors]
						// This results in Beauty, Reboot, Growth Factors being in the right column.
						renderMenu([
							allMenuItems[0], // Myers (Col 1)
							allMenuItems[5], // Beauty (Col 2)
							allMenuItems[2], // Recovery (Col 1)
							allMenuItems[1], // Reboot (Col 2)
							allMenuItems[4], // Immunity (Col 1)
							allMenuItems[3] // Growth Factors (Col 2)
						]);
						break;
					case "digital":
					default:
						flyerContainer.style.aspectRatio = "9 / 16";
						flyerContainer.classList.add(
							"layout-narrow",
							"layout-digital-dense"
						);
						renderMenu(12);
						break;
				}
				updateScale();
			}

			function updateScale() {
				const baseWidth = 1000;
				const padding = 40;
				const availableWidth = window.innerWidth - padding;
				let scale = Math.min(availableWidth / baseWidth, 1);

				flyerContainer.style.transform = `scale(${scale})`;
				flyerWrapper.style.width = `${baseWidth * scale}px`;
				flyerWrapper.style.height = `${flyerContainer.offsetHeight * scale}px`;
				flyerWrapper.style.opacity = "1";
			}

			window.addEventListener("resize", updateScale);
			window.addEventListener("load", updateScale);
			new ResizeObserver(updateScale).observe(flyerContainer);
			setFlyerSize("digital");
		</script>
	</body>
</html>
