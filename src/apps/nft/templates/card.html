<article
	class="card flex-grow-1 mb-0"
	style="flex-basis:320px;min-width:min(280px,100%);max-width:460px"
	template>
	<div class="card-body d-flex align-items-center gap-3">
		<div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0">
			<div class="avatar-title bg-primary-subtle text-primary">
				<i class="ri-gallery-line fs-4"></i>
			</div>
		</div>
		<div class="min-width:0">
			<h5 class="mb-1 text-truncate">{{object.name}}</h5>
			<p class="mb-0 text-muted text-truncate">{{object.description}}</p>
		</div>
	</div>
</article>
