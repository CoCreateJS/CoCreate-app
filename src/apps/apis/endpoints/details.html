<form
	class="app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	data-component-form
	array
	object
	autocomplete="off">
	<header
		class="card-header offcanvas-app-topbar flex-shrink-0"
		src="/apps/apis/endpoints/header.html"
		aria-label="Details controls"></header>

	<div
		class="component-form-body flex-grow-1 min-height:0"
		plugin='{"$SimpleBar": ["$this", {}]}'>
		<div class="card-body d-flex flex-wrap gap-4">

            <div class="flex-shrink-0 d-flex flex-column align-items-center width:100% m-2">

                <div class="avatar-lg rounded-circle d-flex align-items-center justify-content-center bg-primary-subtle text-primary material-shadow fs-24" style="width: 80px; height: 80px;">
                    <i class="ri-terminal-box-line"></i>
                </div>

                <h5 class="mt-4 mb-1 text-dark fw-bold font-monospace" key="endpoint" aria-label="Route Identifier"></h5>

                <!-- Dynamic lookup pointing directly to the parent APIs provider metadata table -->
                <code>
                    <span
                        class="text-uppercase fw-bold fs-12 text-primary bg-primary-subtle px-2 py-1 rounded"
                        array="apis"
                        object="{{object.api_id}}"
                        key="name"
                        aria-label="API Provider Name"></span>
                </code>

                <!-- Quick developer sandbox actions -->
                <ul class="list-inline mb-0 d-flex gap-2 mt-3" aria-label="Integration Operations">
                    <li class="avatar-xs">
                        <button
                            type="button"
                            class="avatar-title bg-info-subtle text-info fs-15 rounded border-0"
                            aria-label="Export API Schema Draft">
                            <i class="ri-download-2-line"></i>
                        </button>
                    </li>
                    <li class="avatar-xs">
                        <button
                            type="button"
                            class="avatar-title bg-success-subtle text-success fs-15 rounded border-0"
                            aria-label="Execute Direct Postman Ping Handshake">
                            <i class="ri-pulse-line"></i>
                        </button>
                    </li>
                </ul>
            </div>

            <div class="flex-grow-1" style="flex-basis: 0; min-width: 300px">
                <h6
                    class="text-muted text-uppercase fw-semibold mb-3"
                    aria-label="Endpoint Specifications Profile">
                    Endpoint Specifications
                </h6>

                <p
                    class="text-muted mb-4 fs-14"
                    key="description"
                    aria-describedby="endpoint-specs-heading"></p>

                <div class="table-responsive table-card">
                    <table
                        class="table table-borderless mb-0"
                        aria-label="Endpoint Config Registry Parameters">
                        <tbody>
                            <tr>
                                <td class="fw-medium text-muted" scope="row" style="width: 35%;">API Provider</td>
                                <td>
                                    <!-- Relational dynamic database link inside details panel -->
                                    <span
                                        class="fw-bold text-dark text-capitalize"
                                        array="apis"
                                        object="{{object.api_id}}"
                                        key="name"></span>
                                </td>
                            </tr>
                            <tr>
                                <td class="fw-medium text-muted" scope="row">Target Route</td>
                                <td><code class="text-danger" key="endpoint" aria-label="Base End Route"></code></td>
                            </tr>
                            <tr>
                                <td class="fw-medium text-muted" scope="row">Path Override</td>
                                <td><code class="text-dark" key="path" aria-label="Internal Path Override"></code></td>
                            </tr>
                            <tr>
                                <td class="fw-medium text-muted" scope="row">System Status</td>
                                <td aria-label="Routing Status">
                                    <span key="status" class="badge bg-success-subtle text-success text-uppercase">Active</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Outbound Activity and Execution Logs -->
            <div
                class="w-100"
                src="components/activities.html"
                aria-label="API Transaction Event History Logs"></div>
        </div>
	</div>
</form>
