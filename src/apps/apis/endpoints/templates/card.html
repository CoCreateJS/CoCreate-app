<article class="card flex-grow-1 mb-0" style="flex-basis:320px;min-width:min(280px,100%);max-width:460px" template>
	<a class="card-body d-flex flex-column gap-3 text-reset" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/apis/endpoints/details.html" aria-controls="offcanvas-app" aria-open>
		<div state-to="offcanvas-app-form" state.array="endpoints" state.object="{{object._id}}"></div>
		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="d-flex align-items-center gap-3 min-width:0">
				<div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0">
					<div class="avatar-title bg-primary-subtle text-primary material-shadow">
						<i class="ri-terminal-box-line fs-4"></i>
					</div>
				</div>
				<div class="min-width:0">
					<h5 class="mb-1 text-truncate">{{object.name}}</h5>
					<div class="text-muted fs-12"><i class="ri-key-2-line me-1"></i><span class="text-uppercase fw-semibold text-primary" array="apis" object="{{object.api_id}}" key="name"></span></div>
				</div>
			</div>
			<span class="badge bg-primary-subtle text-primary text-uppercase">{{object.method}}</span>
		</div>
		<p class="text-muted mb-0 line-clamp:2">{{object.description}}</p>
		<div class="d-flex align-items-center justify-content-end gap-3 pt-2 border-top border-top-dashed">
			<div class="d-flex align-items-center gap-1 text-muted fs-12">
				<span>Enabled</span>
				<span class="badge bg-success-subtle text-success text-capitalize">{{object.enabled}}</span>
			</div>
		</div>
	</a>
</article>
<div onload.array="endpoints" onload-query="$parent"></div>
