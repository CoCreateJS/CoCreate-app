<div
	class="offcanvas-app-create app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	role="region"
	aria-label="Create apis endpoints">
	<header
		src="/components/offcanvas-app/header.html"
		value-replace="/\{\{app\.name\}\}/g"
		value-replacement="Endpoints"
		value-type="outerHtml"></header>
	<div
		class="component-form-body flex-grow-1 min-height:0"
		src="/apps/apis/endpoints/components/form.html"
		onload.plugin='({"$SimpleBar": ["$this", {}]})'
		onload-query="form > .card-body[]"></div>
</div>
