<div
	id="apis-endpoints-aside"
	class="offcanvas-app-shell app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	role="region"
	aria-label="Apis Endpoints record">
	<link rel="stylesheet" href="/apps/apis/endpoints/aside.css" />
	<header
		src="/components/offcanvas-app/header.html"
		value-replace="/\{\{app\.name\}\}/g"
		value-replacement="Endpoints"
		value-type="outerHtml"></header>
	<div
		class="component-form-body flex-grow-1 min-height:0"
		onload.plugin='({"$SimpleBar": ["$this", {}]})'
		onload-query=".offcanvas-app-view > form > .card-body[]">
		<div
			id="Endpoints-details-view"
			class="offcanvas-app-view"
			data-view="details"
			role="tabpanel"
			aria-labelledby="Endpoints-details-btn"
			tabindex="0"
			src="/apps/apis/endpoints/components/details.html"
			aria-hidden="false"
			state-id="apis-endpoints-details"
			state.aria-hidden
			hidden></div>
		<div
			id="Endpoints-form-view"
			class="offcanvas-app-view"
			data-view="form"
			role="tabpanel"
			aria-labelledby="Endpoints-form-btn"
			tabindex="0"
			src="/apps/apis/endpoints/components/form.html"
			aria-hidden="true"
			state-id="apis-endpoints-form"
			state.aria-hidden
			hidden></div>
		<div
			id="Endpoints-codearea-view"
			class="offcanvas-app-view"
			data-view="codearea"
			role="tabpanel"
			aria-labelledby="Endpoints-codearea-btn"
			tabindex="0"
			src="/components/offcanvas-app/codearea.html"
			aria-hidden="true"
			state-id="apis-endpoints-codearea"
			state.aria-hidden
			hidden></div>
	</div>
</div>
