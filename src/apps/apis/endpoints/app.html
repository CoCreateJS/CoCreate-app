<div
	id="apis-endpoints-aside"
	class="offcanvas-app-shell app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	role="region"
	aria-label="Apis Endpoints record">
	<header
		src="/components/offcanvas-app/header.html"
		value-replace="/\{\{app\.name\}\}/g"
		value-replacement="Endpoints"
		value-type="outerHtml"></header>
	<div class="component-form-body flex-grow-1 min-height:0">
		<div
			id="Endpoints-details-view"
			class="offcanvas-app-view"
			data-view="details"
			role="tabpanel"
			aria-labelledby="Endpoints-details-btn"
			tabindex="0"
			aria-hidden="false"
			state-id="apis-endpoints-details"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				array
				object
				autocomplete="off"
				class="app-details app-with-image">
				<div scrollbar>
					<div
						src="/apps/apis/endpoints/components/details.html"></div>
				</div>
			</form>
		</div>
		<div
			id="Endpoints-form-view"
			class="offcanvas-app-view"
			data-view="form"
			role="tabpanel"
			aria-labelledby="Endpoints-form-btn"
			tabindex="0"
			aria-hidden="true"
			state-id="apis-endpoints-form"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				array
				object
				autocomplete="off"
				class="app-form app-with-image">
				<div scrollbar>
					<div src="/apps/apis/endpoints/components/form.html"></div>
				</div>
				<footer
					src="/components/offcanvas-app/footer.html"
					value-type="outerHtml"></footer>
			</form>
		</div>
		<div
			id="Endpoints-codearea-view"
			class="offcanvas-app-view"
			data-view="codearea"
			role="tabpanel"
			aria-labelledby="Endpoints-codearea-btn"
			tabindex="0"
			aria-hidden="true"
			state-id="apis-endpoints-codearea"
			state.aria-hidden
			hidden>
			<form
				state-id="offcanvas-app-form"
				array
				object
				autocomplete="off">
				<div scrollbar>
					<div src="/components/offcanvas-app/codearea.html"></div>
				</div>
				<footer
					src="/components/offcanvas-app/footer.html"
					value-type="outerHtml"></footer>
			</form>
		</div>
	</div>
</div>
