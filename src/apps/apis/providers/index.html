<section
	id="apis-provider-workflow"
	class="app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	data-provider-workflow
	data-provider-step="cloud"
	data-component-form>
	<style>
		[data-provider-workflow] [data-provider-workflow-view],
		[data-provider-workflow] [data-provider-step-controls] {
			display: none;
		}
		[data-provider-workflow]:has(
				> footer:not([hidden])
			)[data-provider-step="cloud"]
			[data-provider-workflow-view="cloud"],
		[data-provider-workflow][data-provider-step="cloud"]
			[data-provider-step-controls="cloud"],
		[data-provider-workflow][data-provider-step="configuration"]
			[data-provider-workflow-view="configuration"],
		[data-provider-workflow][data-provider-step="configuration"]
			[data-provider-step-controls="configuration"],
		[data-provider-workflow]:has(
				> footer:not([hidden])
			)[data-provider-step="storage"]
			[data-provider-workflow-view="storage"],
		[data-provider-workflow][data-provider-step="storage"]
			[data-provider-step-controls="storage"],
		[data-provider-workflow][data-provider-step="deployment"]
			[data-provider-workflow-view="deployment"],
		[data-provider-workflow][data-provider-step="deployment"]
			[data-provider-step-controls="deployment"],
		[data-provider-workflow][data-provider-step="success"]
			[data-provider-workflow-view="success"],
		[data-provider-workflow][data-provider-step="success"]
			[data-provider-step-controls="success"] {
			display: block;
		}
		[data-provider-workflow]:has(> footer[hidden])
			[data-provider-workflow-view="providers"] {
			display: block;
		}
	</style>
	<header
		class="card-header d-flex align-items-center justify-content-between flex-shrink-0">
		<span class="fw-medium">
			<span
				state-id="apis-providers-title"
				data-provider-name="Storage"></span>
			Providers
		</span>
		<button
			type="button"
			class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle text-muted"
			aria-label="Close providers"
			title="Close"
			aria-controls="create-panel"
			aria-expanded="true"
			aria-close>
			<i
				src="/assets/svg/remix/close-line.svg"
				class="align-middle fs-22"
				aria-hidden="true"></i>
		</button>
	</header>
	<div
		class="component-form-body flex-grow-1 min-height:0"
		scrollbar>
		<div
			class="card-body pb-0"
			state-id="apis-providers-steps"
			hidden
			src="/components/steps/header.html"></div>
		<div
			id="storage-providers-create-view"
			class="min-height:100%"
			data-provider-workflow-view="providers"
			state-id="storage-providers-create-view"
			src="/apps/apis/providers/list/storage.html"></div>
		<div
			class="min-height:100%"
			data-provider-workflow-view="cloud"
			src="/apps/apis/providers/list/cloud.html"></div>
		<div
			class="min-height:100%"
			data-provider-workflow-view="storage"
			src="/apps/apis/providers/list/storage.html"></div>
		<form
			id="cluster-configuration-form"
			class="cluster-provision-data card-body min-height:100%"
			data-provider-workflow-view="configuration"
			state-id="cluster-configuration-form"
			array="clusters"
			object>
			<input
				id="cluster-object-id"
				type="hidden"
				key="_id"
				save="false"
				input-query="$document #first-deployment-cluster-id"
				input.value="$value" />
			<input
				id="cluster-providers"
				type="text"
				class="visually-hidden"
				tabindex="-1"
				aria-label="Cloud provider"
				aria-errormessage="cluster-providers-error"
				array="clusters"
				object
				key="providers"
				value-type="array"
				required />
			<input
				id="cluster-storage-providers"
				type="text"
				class="visually-hidden"
				tabindex="-1"
				aria-label="Storage provider"
				aria-errormessage="cluster-storage-providers-error"
				array="clusters"
				object
				key="storageProviders"
				value-type="array"
				required />
			<div src="/apps/clusters/components/configuration.html"></div>
			<button
				id="save-cluster"
				type="button"
				hidden
				actions="save, action($document #save-first-deployment-server)"></button>
		</form>
		<form
			id="first-deployment-form"
			class="server-provision-data card-body min-height:100%"
			data-provider-workflow-view="deployment"
			array="servers"
			object
			api="aws"
			aws-endpoint="create-instance"
			aws-method="post">
			<input
				id="first-deployment-server-id"
				type="hidden"
				array="servers"
				object
				key="_id"
				aws-key="server_id"
				aws-response="false"
				save="false" />
			<input
				id="first-deployment-cluster-id"
				type="hidden"
				array="servers"
				object
				key="cluster_id"
				aws-key="cluster_id"
				aws-response="false" />
			<input
				id="first-deployment-api-id"
				type="hidden"
				array="servers"
				object
				key="api_id" />
			<input
				id="first-deployment-infrastructure-api-id"
				type="hidden"
				array="servers"
				object
				key="infrastructure.api_id" />
			<input
				id="first-deployment-status"
				type="hidden"
				array="servers"
				object
				key="status"
				value="provisioning" />
			<input
				type="hidden"
				array="servers"
				object
				key="totalWorkers"
				value="0"
				value-type="number" />
			<textarea
				id="first-deployment-startup-script"
				hidden
				form-attributes="false"
				array="servers_config"
				object
				key="config.startupScript"
				filter-query-key="type"
				filter-query-value="startupscript"
				filter-limit="1"
				aws-key="startupScript"
				aws-response="false"
				value-type="json"
				value-evaluate="false"
				save="false"
				readonly></textarea>
			<input
				id="first-deployment-binary-url"
				type="hidden"
				form-attributes="false"
				array="servers_config"
				object
				key="config.binaryUrl"
				filter-query-key="type"
				filter-query-value="startupscript"
				filter-limit="1"
				aws-key="binaryUrl"
				aws-response="false"
				save="false"
				readonly />
			<input
				id="first-deployment-host"
				type="hidden"
				form-attributes="false"
				array="servers_config"
				object
				key="config.host"
				filter-query-key="type"
				filter-query-value="startupscript"
				filter-limit="1"
				aws-key="host"
				aws-response="false"
				save="false"
				readonly />
			<input
				id="first-deployment-storage"
				type="hidden"
				aws-key="storage"
				aws-response="false" />
			<input
				id="first-deployment-environment"
				type="hidden"
				aws-key="environment"
				aws-response="false" />
			<input
				id="first-deployment-vm-type"
				type="hidden"
				array="servers"
				object
				key="infrastructure.vmType"
				aws-key="vmType"
				aws-response="false" />
			<input
				id="first-deployment-vcpu"
				type="hidden"
				array="servers"
				object
				key="infrastructure.vCPU"
				aws-key="vCPU"
				aws-response="false"
				value-type="number" />
			<input
				id="first-deployment-memory"
				type="hidden"
				array="servers"
				object
				key="infrastructure.memoryGb"
				aws-key="memoryGb"
				aws-response="false"
				value-type="number" />
			<div src="/apps/clusters/components/deployment.html"></div>
			<button
				id="run-first-deployment"
				type="button"
				hidden
				actions="action($document #save-cluster)"></button>
			<button
				id="save-first-deployment-server"
				type="button"
				hidden
				actions="save, action($document #prepare-server-api), aws.create-instance, action($document #mark-server-starting)"></button>
			<button
				id="mark-server-starting"
				type="button"
				hidden
				actions="click, save, action($document #show-deployment-success)"
				click-query="$document #first-deployment-status"
				click.value="starting"></button>
		</form>
		<button
			id="show-cluster-configuration"
			type="button"
			hidden
			click-query="$document #apis-provider-workflow"
			click.data-provider-step="cloud, configuration"></button>
		<button
			id="show-first-deployment"
			type="button"
			hidden
			click-query="$document #apis-provider-workflow"
			click.data-provider-step="storage, deployment"></button>
		<button
			id="prepare-server-api"
			type="button"
			hidden></button>
		<button
			id="show-deployment-success"
			type="button"
			hidden
			click-query="$document #apis-provider-workflow"
			click.data-provider-step="deployment, success"></button>
		<section
			class="card-body min-height:100% text-center"
			data-provider-workflow-view="success"
			src="/apps/clusters/components/success.html"></section>
	</div>
	<footer
		class="card-footer width:100% flex-shrink-0"
		state-id="apis-providers-steps"
		hidden
		src="/components/steps/footer.html"></footer>
</section>

<script src="/apps/apis/providers/deploy.js"></script>
