<section
	class="app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	data-component-form>
	<header
		class="card-header d-flex align-items-center justify-content-between flex-shrink-0">
		<span class="fw-medium">
			<span
				state-id="apis-providers-title"
				data-provider-name="Storage"></span>
			Providers
		</span>
		<button
			type="button"
			class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle text-muted"
			aria-label="Close providers"
			title="Close"
			aria-controls="create-panel"
			aria-expanded="true"
			aria-close>
			<i
				class="ri-close-line align-middle fs-22"
				aria-hidden="true"></i>
		</button>
	</header>
	<div
		class="component-form-body flex-grow-1 min-height:0"
		plugin='{"$SimpleBar": ["$this", {}]}'>
		<div
			id="storage-providers-create-view"
			class="min-height:100%"
			state-id="storage-providers-create-view"
			src="/apps/apis/providers.html"></div>
	</div>
</section>
