<section
	class="card-body d-flex flex-column gap-4 min-height:100%"
	data-storage-providers-create>
	<header>
		<h5 class="mb-1">Configure Cloud providers</h5>
		<p class="text-muted mb-0">
			Configure your provider credentials. Enable the connections you
			want available to your organization.
		</p>
	</header>
	<span
		id="cluster-providers-error"
		class="text-danger small"
		hidden></span>
	<div
		id="cluster-cloud-providers-list"
		class="d-flex flex-column gap-3"
		array="apis"
		object
		filter-query-key="type"
		filter-query-value="cloud"
		filter-sort-key="name"
		filter-sort-direction="asc"
		filter-limit="0"
		render-query="[template='cluster-cloud-provider']">
		<article
			class="apis-provider-option border rounded position-relative"
			template="cluster-cloud-provider"
			src="/apps/apis/providers/cloud-card.html"></article>
	</div>
</section>
