<label class="d-flex align-items-center gap-3 p-3 mb-0">
	<input
		type="checkbox"
		class="cluster-provision-data"
		name="storage-expansion"
		array="clusters"
		object
		key="{{object.type === 'storage' ? 'storageProviders' : 'providers'}}"
		value="{{object._id}}"
		data-provider="{{object.provider}}"
		data-api-url="{{object.url}}" />
	<div
		class="flex-grow-1 min-width:0"
		src="/apps/apis/templates/list.html"></div>
	<span
		data-storage-configured-badge
		class="badge bg-success-subtle text-success flex-shrink-0 pe-none">
		Configured
	</span>
</label>

<form
	class="apis-provider-fields border-top p-3"
	array="apis"
	object="{{object._id}}"
	data-api-fields-parent
	autocomplete="off">
	<div src="/apps/apis/components/fields.html"></div>
	<div class="clearfix mt-3">
		<button
			class="btn btn-success btn-spinner float-end"
			id="save-btn"
			aria-label="Save form"
			actions="validate, disabled, save, timeout(2000), disabled">
			<span
				class="spinner-border spinner-border-sm display:none"
				role="status"
				aria-hidden="true">
			</span>
			<span class="button-text">Save</span>
		</button>
	</div>
</form>
