<article class="card mb-0">
	<div class="card-body d-flex flex-column gap-3">
		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="d-flex align-items-center gap-3 min-width:0">
				<div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0">
					<div class="avatar-title bg-primary-subtle text-primary material-shadow">
						<span class="avatar-initial" key="name[0]"></span>
					</div>
				</div>
				<div class="min-width:0">
					<h5 class="mb-1 text-truncate text-capitalize" key="name"></h5>
					<code class="d-block text-truncate fs-12" key="url"></code>
				</div>
			</div>
			<div class="d-flex align-items-center gap-1 text-muted fs-12">
				<span>Enabled</span>
				<span class="badge bg-success-subtle text-success text-capitalize" key="enabled"></span>
			</div>
		</div>
		<p class="text-muted mb-0 line-clamp:2" key="description"></p>
	</div>
</article>
