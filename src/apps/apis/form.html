<form
	state-id="offcanvas-app-form"
	array
	object
	autocomplete="off">
	<link
		rel="stylesheet"
		href="/components/codearea/index.css" />
	<div class="card-body d-flex flex-column gap-4 h-100">
		<input
			type="hidden"
			key="_id" />

		<section class="pb-3">
			<div
				class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
				<h6 class="text-muted text-uppercase fw-semibold mb-0">
					API details
				</h6>
				<label class="form-check form-switch mb-0">
					<input
						class="form-check-input"
						type="checkbox"
						role="switch"
						id="api-enabled"
						key="enabled" />
					<span class="form-check-label">Enabled</span>
				</label>
			</div>
			<div class="row g-3 mx-0">
				<div class="col-12">
					<label
						class="form-label"
						for="api-name"
						>Name</label
					>
					<input
						type="text"
						id="api-name"
						key="name"
						class="form-control"
						placeholder="Production Stripe"
						required />
				</div>
				<div class="col-12 col-sm-6">
					<label
						class="form-label"
						for="api-provider"
						>Provider</label
					>
					<input
						type="text"
						id="api-provider"
						key="provider"
						class="form-control"
						placeholder="stripe"
						required />
				</div>
				<div class="col-12 col-sm-6">
					<label
						class="form-label"
						for="api-type"
						>Type</label
					>
					<input
						type="text"
						id="api-type"
						name="api-integration-type"
						key="type"
						autocomplete="off"
						data-lpignore="true"
						data-1p-ignore
						class="form-control"
						placeholder="storage" />
				</div>
				<div class="col-12">
					<label
						class="form-label"
						for="api-description"
						>Description</label
					>
					<textarea
						height="auto"
						id="api-description"
						key="description"
						class="form-control"
						rows="3"
						placeholder="Describe this integration"
						required></textarea>
				</div>
			</div>
		</section>

		<section class="border-top border-top-dashed pt-3 pb-3">
			<h6 class="text-muted text-uppercase fw-semibold mb-3">Base URL</h6>
			<pre class="border rounded p-3 mb-0 text-wrap text-break">
                <code type="code" lang="json" key="url" value-type="text" value-evaluate="false" aria-label="API base URL configuration" height="auto"></code>
            </pre>
		</section>

		<section class="border-top border-top-dashed pt-3 pb-3">
			<h6 class="text-muted text-uppercase fw-semibold mb-3">
				<label
					for="api-headers"
					class="mb-0"
					>Credentials</label
				>
			</h6>
			<div src="/apps/apis/components/field-render.html"></div>
		</section>

		<section class="border-top border-top-dashed pt-3 pb-3">
			<h6 class="text-muted text-uppercase fw-semibold mb-3">
				<label
					for="api-headers"
					class="mb-0"
					>Request headers</label
				>
			</h6>
			<codearea class="component-codearea border rounded p-3">
				<pre
					aria-hidden="true"><code class="language-json"></code></pre>
				<textarea
					height="auto"
					type="code"
					lang="json"
					id="api-headers"
					key="headers"
					value-type="json"
					class="form-control font-monospace"
					height="auto"
					rows="1"
					spellcheck="false"
					value-evaluate="false"
					aria-describedby="api-headers-help"
					placeholder='{"Authorization":{"$concat":["Bearer ","$key"]}}'></textarea>
			</codearea>
			<p
				id="api-headers-help"
				class="text-muted fs-12 mt-2 mb-0">
				Enter headers as a JSON object. Expressions and variables are
				preserved.
			</p>
		</section>
	</div>
	<footer
		src="/apps/apis/components/footer.html"
		value-type="outerHtml"></footer>
</form>
