<form
	class="app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	data-component-form
	array
	object
	autocomplete="off">
<header
		class="card-header offcanvas-app-topbar flex-shrink-0"
		src="/apps/apis/header.html"
		aria-label="Form controls"></header>
	<div
		class="component-form-body flex-grow-1 min-height:0"
		plugin='{"$SimpleBar": ["$this", {}]}'>
<div class="card-body d-flex flex-column gap-4">
			<input type="hidden" key="_id" />

			<section>
				<h5 class="text-uppercase fw-semibold mb-3">Integration identity</h5>
				<div class="d-flex flex-wrap gap-3">
					<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:220px min-width:200px">
						Name
						<input
							type="text"
							id="api-name"
							key="name"
							class="form-control text-lowercase"
							placeholder="stripe"
							required />
					</label>
					<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:220px min-width:200px">
						Provider
						<input
							type="text"
							id="api-provider"
							key="provider"
							class="form-control text-lowercase"
							placeholder="stripe"
							required />
					</label>
					<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:180px min-width:160px">
						Type
						<input
							type="text"
							id="api-type"
							key="type"
							class="form-control"
							placeholder="storage" />
					</label>
					<label class="form-check form-switch d-flex align-items-center gap-2 flex-grow-1 flex-basis:140px min-width:130px mt-4">
						<input
							class="form-check-input"
							type="checkbox"
							role="switch"
							id="api-enabled"
							key="enabled" />
						<span class="form-check-label">Enabled</span>
					</label>
				</div>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<h5 class="text-uppercase fw-semibold mb-3">Connection and credentials</h5>
				<div class="d-flex flex-wrap gap-3">
					<label class="form-label d-flex flex-column gap-1 flex-grow-2 flex-basis:360px min-width:260px">
						Base URL
						<input
							type="url"
							id="api-url"
							key="url"
							class="form-control text-lowercase"
							placeholder="https://api.provider.com/v1" />
					</label>
					<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:280px min-width:240px">
						Account SID
						<input
							type="text"
							id="api-account-sid"
							key="accountSid"
							class="form-control"
							placeholder="Provider account SID" />
					</label>
					<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:320px min-width:260px">
						API Key / Credential
						<div class="input-group">
							<input
								type="password"
								id="api-key"
								key="key"
								class="form-control"
								placeholder="API key, token, or credential pair" />
							<button
								class="btn btn-outline-secondary"
								type="button"
								onclick="
									const input = this.previousElementSibling;
									input.type = input.type === 'password' ? 'text' : 'password';
									this.querySelector('i').className = input.type === 'password' ? 'ri-eye-line' : 'ri-eye-off-line';
								"
								aria-label="Toggle API credential visibility">
								<i class="ri-eye-line"></i>
							</button>
						</div>
					</label>
					<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:320px min-width:260px">
						Webhook Signing Secret
						<input
							type="password"
							id="api-webhook-secret"
							key="webhookSecret"
							class="form-control"
							placeholder="Webhook signing secret" />
					</label>
				</div>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<h5 class="text-uppercase fw-semibold mb-3">Provider metadata</h5>
				<div class="d-flex flex-wrap gap-3">
					<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:220px min-width:200px">
						Project
						<input type="text" class="form-control" id="api-project" key="project" placeholder="GCP project ID" />
					</label>
					<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:220px min-width:200px">
						Project ID
						<input type="text" class="form-control" id="api-project-id" key="projectId" placeholder="Provider project ID" />
					</label>
					<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:240px min-width:220px">
						Subscription ID
						<input type="text" class="form-control" id="api-subscription-id" key="subscriptionId" placeholder="Azure subscription ID" />
					</label>
					<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:220px min-width:200px">
						Resource Group
						<input type="text" class="form-control" id="api-resource-group" key="resourceGroup" placeholder="Azure resource group" />
					</label>
					<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:300px min-width:260px">
						Compartment ID
						<input type="text" class="form-control" id="api-compartment-id" key="compartmentId" placeholder="OCI compartment ID" />
					</label>
				</div>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<h5 class="text-uppercase fw-semibold mb-3">Request configuration</h5>
				<label class="form-label d-flex flex-column gap-1">
					Headers
					<textarea
						id="api-headers"
						key="headers"
						value-type="json"
						class="form-control font-monospace"
						rows="10"
						spellcheck="false"
						placeholder='{"Authorization":{"$concat":["Bearer ","$key"]}}'></textarea>
				</label>
				<p class="text-muted fs-12 mb-0">Headers are saved as a JSON object and may use CoCreate AST expressions.</p>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<label class="form-label d-flex flex-column gap-1">
					Description
					<textarea
						id="api-description"
						key="description"
						class="form-control"
						rows="4"
						placeholder="Describe the integration and how its credentials are used"
						required></textarea>
				</label>
			</section>
		</div>
	</div>
	<footer class="card-footer flex-shrink-0">
		<div class="hstack gap-2 justify-content-end">
			<button
				type="button"
				class="btn btn-light"
				data-component-form-close
				aria-label="Cancel form"
				aria-expanded="true"
				aria-close>Cancel</button>
			<button
				class="btn btn-success btn-spinner"
				aria-label="Save form"
				actions="validate, disabled, save, timeout(2000), disabled">
				<span class="spinner-border spinner-border-sm display:none" role="status" aria-hidden="true"></span>
				<span class="button-text">Save</span>
			</button>
		</div>
	</footer>
</form>
