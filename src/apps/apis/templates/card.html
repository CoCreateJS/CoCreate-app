<article class="card flex-grow-1 mb-0" style="flex-basis:320px;min-width:min(280px,100%);max-width:460px" template>
	<a class="card-body d-flex flex-column gap-3 text-reset" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/apis/details.html" aria-controls="offcanvas-app" aria-open>
		<div state-to="offcanvas-app-form" state.array="apis" state.object="{{object._id}}"></div>
		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="d-flex align-items-center gap-3 min-width:0">
				<div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0">
					<div class="avatar-title bg-primary-subtle text-primary material-shadow">
						<span class="avatar-initial">{{object.name[0]}}</span>
					</div>
				</div>
				<div class="min-width:0">
					<h5 class="mb-1 text-truncate text-capitalize">{{object.name}}</h5>
					<code class="d-block text-truncate fs-12">{{object.url}}</code>
				</div>
			</div>
			<div class="d-flex align-items-center gap-1 text-muted fs-12">
				<span>Enabled</span>
				<span class="badge bg-success-subtle text-success text-capitalize">{{object.enabled}}</span>
			</div>
		</div>
		<p class="text-muted mb-0 line-clamp:2">{{object.description}}</p>
	</a>
</article>
<div onload.array="apis" onload-query="$parent"></div>
