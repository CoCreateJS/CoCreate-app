<article
	class="apis-grid-card card flex-grow-1 mb-0"
	style="flex-basis: 320px; min-width: min(280px, 100%); max-width: 460px"
	template>
	<link rel="stylesheet" href="/apps/apis/templates/card.css" />
	<a
		class="card-body d-flex flex-column gap-3 text-reset"
		role="button"
		tabindex="0"
		state-to="offcanvas-app-view"
		state.src="/apps/apis/aside.html"
		aria-controls="offcanvas-app"
		aria-haspopup="dialog"
		aria-expanded="false"
		aria-label="Open API {{object.name}}"
		aria-open>
		<div
			hidden
			state-to="offcanvas-app-form"
			state.array="apis"
			state.object="{{object._id}}"></div>
		<div class="d-flex flex-wrap align-items-start gap-2 w-100">
			<h4 class="mb-0 flex-grow-1 text-capitalize text-break min-width:0">{{object.name}}</h4>
			<div class="d-flex flex-wrap align-items-center justify-content-end ms-auto gap-2">
				<span
					class="badge bg-primary-subtle text-primary text-capitalize"
					aria-label="Type">{{object.type}}</span>
				<div
					class="apis-grid-status"
					data-enabled="{{object.enabled}}"
					role="status"
					aria-label="API status">
					<span class="apis-grid-enabled badge bg-success-subtle text-success">Enabled</span>
					<span class="apis-grid-disabled badge bg-secondary-subtle text-muted">Disabled</span>
				</div>
			</div>
		</div>
		<div class="w-100 min-width:0">
			<div class="d-flex flex-wrap align-items-baseline gap-2 fs-13">
				<span class="text-muted">Provider</span>
				<span class="fw-medium text-capitalize text-break">{{object.provider}}</span>
			</div>
			<p class="text-muted mt-3 mb-0 text-break line-clamp:2">{{object.description}}</p>
		</div>
	</a>
</article>
<div
	onload.array="apis"
	onload-query="$parent"></div>
