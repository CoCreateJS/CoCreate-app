<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}">
		<div class="card-body d-flex flex-column gap-3 text-reset">
			<div class="app-heading">
				<div class="app-identity">
					<span class="app-provider-image flex-shrink-0 app-identity-image"
						><img
							class="app-provider-default flex-shrink-0"
							src="/assets/svg/providers/{{object.provider}}.svg"
							alt=""
							width="50"
							height="50"
							onload="this.hidden = false"
							onerror="this.hidden = true" />
						<img
							class="app-provider-custom"
							src="{{object.avatar[0].src}}"
							alt=""
							width="50"
							height="50"
							hidden
							onload="this.hidden = false"
							onerror="this.hidden = true" />
					</span>
					<div class="min-width:0">
						<h5
							class="app-title mb-0 text-capitalize text-break">
							<a
								class="text-reset text-decoration-none"
								role="button"
								tabindex="0"
								state-to="offcanvas-app-view"
								state.src="/apps/apis/app.html"
								aria-controls="offcanvas-app"
								aria-haspopup="dialog"
								aria-expanded="false"
								aria-label="Open API {{object.name}}"
								aria-open
								><span
									hidden
									state-to="offcanvas-app-form"
									state.array="apis"
									state.object="{{object._id}}"></span>
								{{object.name}}
							</a>
						</h5>
					</div>
				</div>
				<div class="app-badges">
					<span
						class="badge text-capitalize"
						aria-label="Type"
						 key="type" data-value="{{object.type}}">{{object.type}}</span
					>
					<span class="badge text-capitalize" role="status" aria-label="API enabled status" key="enabled" data-value="{{object.enabled}}">{{object.enabled}}</span>
				</div>
			</div>
			<p class="text-muted mb-0 text-break line-clamp:2">
				{{object.description}}
			</p>
		</div>
	</article>
</template>

<div
	onload.array="apis"
	onload-query="$parent"></div>
