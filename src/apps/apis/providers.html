<link
	rel="stylesheet"
	href="/apps/apis/templates/card.css" />
<link
	rel="stylesheet"
	href="/apps/apis/aside.css" />
<style>
	.apis-credential textarea[type="password"] {
		-webkit-text-security: disc;
	}

	.apis-credential textarea[type="text"] {
		-webkit-text-security: none;
	}

	.apis-credential-field > textarea {
		padding-right: 4.5rem;
		background-color: var(--coc-body-bg);
		resize: none;
	}

	.apis-credential-field:has(textarea:not([hidden])) > button {
		top: 0.3rem;
		transform: none;
	}

	[data-provider-name]::before {
		content: attr(data-provider-name);
	}

	.apis-provider-option > label {
		cursor: pointer;
	}

	.apis-provider-option {
		transition:
			border-color 0.15s ease,
			background-color 0.15s ease;
	}

	.apis-provider-option:has(input[name="storage-expansion"]:checked) {
		border-color: var(--coc-primary) !important;
		background: rgba(var(--coc-primary-rgb), 0.08);
	}

	.apis-provider-option > label > input[name="storage-expansion"] {
		position: absolute;
		opacity: 0;
		pointer-events: none;
	}

	.apis-provider-fields {
		display: none;
	}

	.apis-provider-option:has(input[name="storage-expansion"]:checked)
		> .apis-provider-fields {
		display: block;
	}

	.apis-provider-option:not(
			:has(.apis-provider-fields [render-clone] textarea)
		)
		[data-storage-configured-badge],
	.apis-provider-option:has(
			.apis-provider-fields [render-clone] textarea:invalid
		)
		[data-storage-configured-badge] {
		display: none;
	}
</style>
<section
	class="card-body d-flex flex-column gap-4 min-height:100%"
	data-storage-providers-create>
	<header>
		<h5 class="mb-1">
			Configure
			<span
				state-id="apis-providers-heading"
				data-provider-name="Storage"></span>
			providers
		</h5>
		<p class="text-muted mb-0">
			Configure your provider credentials. Enable the connections you
			want available to your organization.
		</p>
	</header>
	<div
		id="apis-providers-list"
		state-id="apis-providers-list"
		class="d-flex flex-column gap-3"
		array="apis"
		object
		filter-query-key="type"
		filter-query-value="storage"
		filter-sort-key="name"
		filter-sort-direction="asc"
		filter-limit="0"
		render-query="[template='api-provider']">
		<article
			class="apis-provider-option border rounded position-relative"
			template="api-provider">
			<label class="d-flex align-items-center gap-3 p-3 mb-0">
				<input
					type="checkbox"
					name="storage-expansion"
					value="{{object._id}}"
					aria-controls="storage-provider-fields-{{object._id}}" />
				<div
					class="flex-grow-1 min-width:0"
					src="/apps/apis/templates/list.html"></div>
				<span
					data-storage-configured-badge
					class="badge bg-success-subtle text-success flex-shrink-0">
					Configured
				</span>
			</label>

			<form
				id="storage-provider-fields-{{object._id}}"
				class="apis-provider-fields border-top p-3"
				array="apis"
				object="{{object._id}}"
				data-api-fields-parent
				autocomplete="off">
				<div src="/apps/apis/components/fields.html"></div>
			</form>
		</article>
	</div>
</section>
