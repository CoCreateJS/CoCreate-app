<span
	class="app-provider-image app-identity-image"
	aria-hidden="true"
	object="{{object.api_id}}{{object.cloud}}"
	key="api_id"
	value
	input.object="$value"
	input-query="[array][]">
	<input
		type="hidden"
		array="apis"
		object="{{object.api_id}}{{object.cloud}}"
		key="alt"
		input-query="$next"
		input.alt="$value" />
	<img
		class="app-provider-default"
		form-attributes="false"
		array="apis"
		key="icon"
		object="{{object.api_id}}{{object.cloud}}"
		alt=""
		width="36"
		height="36"
		onerror="this.src = '/assets/svg/providers/api.svg'" />
</span>
