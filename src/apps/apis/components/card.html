<div class="app-heading">
	<div class="app-identity">
		<span class="app-provider-image app-identity-image" aria-hidden="true">
			<img
				class="app-provider-default"
				key="icon"
				alt=""
				width="36"
				height="36"
				onload="this.hidden = false"
				onerror="
					if (
						this.getAttribute('src') === '/assets/svg/providers/api.svg'
					) {
						this.hidden = true;
					} else {
						this.src = '/assets/svg/providers/api.svg';
					}
				" />
		</span>
		<div class="min-width:0">
			<h5
				class="app-title mb-0 text-capitalize text-break"
				key="name"></h5>
		</div>
	</div>
	<div class="app-badges">
		<span
			class="badge text-capitalize"
			key="type" data-value input.data-value="$value"></span
		><span class="badge text-capitalize" role="status" aria-label="Enabled status" key="enabled" data-value input.data-value="$value"></span>
	</div>
</div>
<p
	class="text-muted mb-0 line-clamp:2"
	key="description"></p>
