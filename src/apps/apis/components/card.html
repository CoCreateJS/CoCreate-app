<div class="app-heading">
	<div class="app-badges">
		<span
			class="badge border border-primary text-primary text-capitalize"
			key="type"></span
		><span
			class="app-enabled-status"
			role="status"
			aria-label="Status"
			><input
				type="hidden"
				key="enabled"
				input-query="$parent"
				input.data-enabled="$value" /><span
				class="app-enabled badge border border-success text-success"
				>Enabled</span
			><span class="app-disabled badge border text-muted"
				>Disabled</span
			></span
		>
	</div>

	<div class="d-flex align-items-start gap-3 min-width:0">
		<span class="app-provider-image" aria-hidden="true">
			<img
				class="app-provider-default"
				key="icon"
				alt=""
				width="36"
				height="36"
				onload="this.hidden = false"
				onerror="
					if (
						this.getAttribute('src') === '/assets/svg/providers/api.svg'
					) {
						this.hidden = true;
					} else {
						this.src = '/assets/svg/providers/api.svg';
					}
				" />
		</span>
		<div class="min-width:0">
			<h5
				class="app-title mb-0 text-capitalize text-break"
				key="name"></h5>
		</div>
	</div>
</div>
<p
	class="text-muted mb-0 line-clamp:2"
	key="description"></p>
