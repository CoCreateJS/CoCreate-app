<form
	state-id="offcanvas-app-form"
	array
	object
	autocomplete="off">
	<div class="card-body d-flex flex-column gap-4 h-100">
		<section class="d-flex flex-column align-items-start gap-3 pb-3">
			<div class="d-flex flex-wrap align-items-start gap-2 w-100">
				<h4
					class="mb-0 flex-grow-1 text-capitalize text-break min-width:0"
					key="name"
					aria-label="API name"></h4>
				<div
					class="d-flex flex-wrap align-items-center justify-content-end ms-auto gap-2">
					<span
						class="badge bg-primary-subtle text-primary text-capitalize"
						key="type"
						aria-label="Type"></span>
					<div
						class="apis-status"
						role="status"
						aria-label="API status">
						<input
							type="checkbox"
							key="enabled"
							disabled
							hidden />
						<span
							class="apis-status-enabled badge bg-success-subtle text-success"
							>Enabled</span
						>
						<span
							class="apis-status-disabled badge bg-secondary-subtle text-muted"
							>Disabled</span
						>
					</div>
				</div>
			</div>
			<div class="w-100">
				<div class="d-flex flex-wrap align-items-baseline gap-2 fs-13">
					<span class="text-muted">Provider</span>
					<span
						class="fw-medium text-capitalize"
						key="provider"
						aria-label="Provider"></span>
				</div>
				<p
					class="text-muted mt-3 mb-0 text-break"
					key="description"></p>
			</div>
		</section>

		<section class="border-top border-top-dashed pt-3 pb-3">
			<h6 class="text-muted text-uppercase fw-semibold mb-3">Base URL</h6>
			<pre class="border rounded p-3 mb-0 text-wrap text-break">
                <code type="code" lang="json" key="url" value-type="text" value-evaluate="false" aria-label="API base URL configuration" height="auto"></code>
            </pre>
		</section>

		<section class="border-top border-top-dashed pt-3 pb-3">
			<h6 class="text-muted text-uppercase fw-semibold mb-3">
				<label
					for="api-headers"
					class="mb-0"
					>Credentials</label
				>
			</h6>
			<div src="/apps/apis/components/field-render.html"></div>
		</section>

		<section class="border-top border-top-dashed pt-3">
			<h6 class="text-muted text-uppercase fw-semibold mb-3">
				Request headers
			</h6>
			<pre class="border rounded p-3 mb-0 text-wrap text-break">
                <code type="code" lang="json" key="headers" value-type="text" value-evaluate="false" height="auto"></code>
            </pre>
		</section>

		<div
			class="w-100"
			src="/components/activities.html"
			aria-label="API Activities"></div>
	</div>
</form>
