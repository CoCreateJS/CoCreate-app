<div class="card-body d-flex flex-column gap-4">
	<section class="d-flex flex-wrap align-items-center gap-3">
		<div
			class="avatar-lg rounded-circle d-flex align-items-center justify-content-center bg-primary-subtle text-primary material-shadow fs-24">
			<i class="ri-key-2-line"></i>
		</div>
		<div
			class="flex-grow-1"
			style="min-width: 220px">
			<div class="d-flex flex-wrap align-items-center gap-2">
				<h4
					class="mb-0 text-capitalize"
					key="name"
					aria-label="API Name"></h4>
				<span
					class="badge bg-primary-subtle text-primary text-uppercase"
					key="provider"></span>
				<span
					class="badge bg-secondary-subtle text-secondary text-uppercase"
					key="type"></span>
			</div>
			<p
				class="text-muted mt-2 mb-0"
				key="description"></p>
		</div>
		<div class="d-flex align-items-center gap-2">
			<span class="text-muted">Enabled</span>
			<input
				class="form-check-input"
				type="checkbox"
				role="switch"
				key="enabled"
				disabled />
		</div>
	</section>

	<section class="border-top border-top-dashed pt-3">
		<div
			class="d-flex align-items-center justify-content-between gap-3 mb-3">
			<h6 class="text-muted text-uppercase fw-semibold mb-0">
				Connection
			</h6>
			<a
				href=""
				key="url"
				input.href="$value"
				target="_blank"
				rel="noopener noreferrer"
				class="btn btn-sm btn-soft-primary"
				aria-label="Open API base URL">
				<i class="ri-external-link-line me-1"></i>Open endpoint
			</a>
		</div>
		<div class="table-responsive">
			<table
				class="table table-borderless mb-0"
				aria-label="API Connection Details">
				<tbody>
					<tr>
						<td
							class="fw-medium text-muted"
							style="width: 35%">
							Base URL
						</td>
						<td>
							<code
								class="text-break"
								key="url"></code>
						</td>
					</tr>
					<tr>
						<td class="fw-medium text-muted">Account SID</td>
						<td>
							<code
								class="text-break"
								key="accountSid"></code>
						</td>
					</tr>
					<tr>
						<td class="fw-medium text-muted">
							API Key / Credential
						</td>
						<td>
							<input
								type="password"
								key="key"
								class="form-control form-control-sm font-monospace"
								readonly
								aria-label="API credential" />
						</td>
					</tr>
					<tr>
						<td class="fw-medium text-muted">
							Webhook Signing Secret
						</td>
						<td>
							<input
								type="password"
								key="webhookSecret"
								class="form-control form-control-sm font-monospace"
								readonly
								aria-label="Webhook signing secret" />
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</section>

	<section class="border-top border-top-dashed pt-3">
		<h6 class="text-muted text-uppercase fw-semibold mb-3">
			Provider metadata
		</h6>
		<div class="d-flex flex-wrap gap-3">
			<div
				class="border border-dashed rounded p-3 flex-grow-1"
				style="flex-basis: 220px; min-width: 200px">
				<span class="text-muted d-block mb-1">Project</span>
				<code
					class="text-break"
					key="project"></code>
			</div>
			<div
				class="border border-dashed rounded p-3 flex-grow-1"
				style="flex-basis: 220px; min-width: 200px">
				<span class="text-muted d-block mb-1">Project ID</span>
				<code
					class="text-break"
					key="projectId"></code>
			</div>
			<div
				class="border border-dashed rounded p-3 flex-grow-1"
				style="flex-basis: 220px; min-width: 200px">
				<span class="text-muted d-block mb-1">Subscription ID</span>
				<code
					class="text-break"
					key="subscriptionId"></code>
			</div>
			<div
				class="border border-dashed rounded p-3 flex-grow-1"
				style="flex-basis: 220px; min-width: 200px">
				<span class="text-muted d-block mb-1">Resource Group</span>
				<code
					class="text-break"
					key="resourceGroup"></code>
			</div>
			<div
				class="border border-dashed rounded p-3 flex-grow-1"
				style="flex-basis: 280px; min-width: 240px">
				<span class="text-muted d-block mb-1">Compartment ID</span>
				<code
					class="text-break"
					key="compartmentId"></code>
			</div>
		</div>
	</section>

	<section class="border-top border-top-dashed pt-3">
		<h6 class="text-muted text-uppercase fw-semibold mb-3">
			Request headers
		</h6>
		<pre
			class="bg-light border rounded p-3 mb-0 text-wrap"><code key="headers"></code></pre>
	</section>

	<div
		class="w-100"
		src="components/activities.html"
		aria-label="API Activities"></div>
</div>
