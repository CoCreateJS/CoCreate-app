<article
	class="card flex-grow-1 mb-0 app-card app-without-image"
	style="flex-basis:320px;min-width:min(280px,100%);max-width:460px"
	template role="row" aria-selected="false" array="{{object.$array[0]}}" object="{{object._id}}" read="false">

	<div class="card-body d-flex align-items-center gap-3">

		<div class="min-width:0">
			<h5 class="text-truncate app-title mb-1">{{object.name}}</h5>
			<p class="mb-0 text-muted text-truncate">{{object.description}}</p>
		</div>
	</div>
</article>
