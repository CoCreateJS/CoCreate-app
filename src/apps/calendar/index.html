<div class="container-fluid">
	<div class="row">
		<div class="col-12">
			<div class="row">
				<div class="col-xl-3">
					<div class="card card-h-100">
						<div class="card-body">
							<button
								class="btn btn-primary w-100"
								id="btn-new-event">
								<i class="mdi mdi-plus"></i>
								Create New Event
							</button>

							<div id="external-events">
								<br />
								<p class="text-muted">
									Drag and drop your event or click in the
									calendar
								</p>
								<div
									class="external-event fc-event bg-success-subtle text-success"
									data-class="bg-success-subtle">
									<i
										class="mdi mdi-checkbox-blank-circle me-2"></i
									>New Event Planning
								</div>
								<div
									class="external-event fc-event bg-info-subtle text-info"
									data-class="bg-info-subtle">
									<i
										class="mdi mdi-checkbox-blank-circle me-2"></i
									>Meeting
								</div>
								<div
									class="external-event fc-event bg-warning-subtle text-warning"
									data-class="bg-warning-subtle">
									<i
										class="mdi mdi-checkbox-blank-circle me-2"></i
									>Generating Reports
								</div>
								<div
									class="external-event fc-event bg-danger-subtle text-danger"
									data-class="bg-danger-subtle">
									<i
										class="mdi mdi-checkbox-blank-circle me-2"></i
									>Create New theme
								</div>
							</div>
						</div>
					</div>
					<div>
						<h5 class="mb-1">Upcoming Events</h5>
						<p class="text-muted">Don't miss scheduled events</p>
						<div
							class="pe-2 me-n1 mb-3"
							plugin='{"SimpleBar": ["$this", {}]}'
							style="height: 400px">
							<div id="upcoming-event-list"></div>
						</div>
					</div>

					<div class="card">
						<div class="card-body bg-info-subtle">
							<div class="d-flex">
								<div class="flex-shrink-0">
									<i
										data-feather="calendar"
										class="text-info icon-dual-info"></i>
								</div>
							</div>
						</div>
					</div>
					<!--end card-->
				</div>
				<!-- end col-->

				<div class="col-xl-9">
					<div class="card card-h-100">
						<div class="card-body">
							<!-- The core FullCalendar element bound to the CoCreate CRUD Ecosystem -->
							<div
								id="calendar"
								array="calendar"
								object
								component
								filter-limit
								plugin='{
									"FullCalendar": {
										"Calendar": [
											"$this",
											{
												"timeZone": "local",
												"editable": true,
												"droppable": true,
												"selectable": true,
												"navLinks": true,
												"initialView": "dayGridMonth",
												"themeSystem": "bootstrap",
												"headerToolbar": {
													"left": "prev,next today",
													"center": "title",
													"right": "dayGridMonth,timeGridWeek,timeGridDay,listMonth"
												},
												"events": [
													{ "title": "Initial AST Meeting", "start": "2026-07-13" }
												]
											}
										]
									},
									"FullCalendar.render": [],
									"getValue": "$FullCalendar.getEvents",
									"setValue": { "$FullCalendar.addEvent": "$event.value" }
								}'>
							</div>
						</div>
					</div>
				</div>
				<!-- end col -->
			</div>
			<!--end row-->

			<div style="clear: both"></div>

		</div>
	</div>
	<!-- end row-->
</div>
<!-- container-fluid -->
