<div class="app-heading">
	<div class="app-identity">
		<img
			class="app-avatar object-fit-contain flex-shrink-0"
			src="/assets/images/icons/512x512.png"
			key="avatar[0].src"
			alt="Organization image"
			onload="this.hidden = false"
			onerror="this.hidden = true" />
		<div class="min-width:0">
			<h5 class="app-title mb-0 text-break"><span key="name"></span></h5>
		</div>
	</div>
</div>
<p class="text-muted mb-0" key="tagline"></p>
