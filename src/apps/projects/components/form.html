<form
	state-id="offcanvas-app-form"
	class="app-form app-with-image"
	array
	object
	autocomplete="off">

	<div
		class="card-body align-items:flex-start width:100% d-flex flex-column gap-4 h-100">
		<section
			class="d-flex flex-column gap-4 flex-grow:2 flex-shrink:1 flex-basis:520px min-width:300px">
			<div class="d-flex flex-wrap gap-3">
				<label
					class="form-label flex-grow:2 flex-basis:280px min-width:220px"
					for="project-name-input">
					Project Name
					<input
						type="text"
						class="form-control"
						id="project-name-input"
						placeholder="Enter project name"
						key="name"
						aria-="true" />
				</label>
				<label
					class="form-label flex-grow-1 flex-basis:220px min-width:200px"
					for="project-thumbnail-img">
					Thumbnail Image
					<input
						class="form-control"
						id="project-thumbnail-img"
						type="file"
						accept="image/png, image/gif, image/jpeg"
						key="thumbnail"
						aria-label="Upload thumbnail image" />
				</label>
				<label
					class="form-label flex-grow-1 width:100%"
					for="project-description-editor">
					Project Description
					<div
						plugin='{"$ClassicEditor.create":["$this"]}'
						key="description"
						id="project-description-editor"
						aria-label="Project description editor">
						<p>
							It will be as simple as occidental in fact, it
							will be Occidental. To an English person, it
							will seem like simplified English, as a
							skeptical Cambridge friend of mine told me what
							Occidental is. The European languages are
							members of the same family. Their separate
							existence is a myth. For science, music, sport,
							etc, Europe uses the same vocabulary.
						</p>
						<ul>
							<li>
								Product Design, Figma (Software), Prototype
							</li>
							<li>
								Four Dashboards : Ecommerce, Analytics,
								Project etc.
							</li>
							<li>
								Create calendar, chat and email app pages.
							</li>
							<li>Add authentication pages</li>
						</ul>
					</div>
				</label>
				<div class="d-flex flex-wrap gap-3 width:100%">
					<label
						for="choices-priority-input"
						class="form-label flex-grow-1 flex-basis:140px min-width:140px">
						Priority
						<select
							class="form-select"
							plugin='{"$Choices":["$this",{}]}'
							data-choices-search-false
							id="choices-priority-input"
							key="priority"
							aria-label="Select project priority">
							<option
								value="High"
								selected>
								High
							</option>
							<option value="Medium">Medium</option>
							<option value="Low">Low</option>
						</select>
					</label>
					<label
						for="choices-status-input"
						class="form-label flex-grow-1 flex-basis:140px min-width:140px">
						Status
						<select
							class="form-select"
							plugin='{"$Choices":["$this",{}]}'
							data-choices-search-false
							id="choices-status-input"
							key="status"
							aria-label="Select project status">
							<option
								value="Inprogress"
								selected>
								Inprogress
							</option>
							<option value="Completed">Completed</option>
						</select>
					</label>
					<label
						for="datepicker-deadline-input"
						class="form-label flex-grow:2 flex-basis:180px min-width:160px">
						Deadline
						<input
							type="text"
							class="form-control"
							id="datepicker-deadline-input"
							placeholder="Enter due date"
							plugin='{"$flatpickr":["$this",{}]}'
							key="deadline"
							aria-label="Select project deadline" />
					</label>
				</div>
			</div>
			<div class="width:100%">
				<div class="mb-3">
					<h5 class="card-title mb-0">Attached files</h5>
				</div>
				<div>
					<p class="text-muted">Add Attached files here.</p>
					<div
						plugin='{"$Dropzone":["$this",{}]}'
						class="dropzone"
						key="attachments"
						aria-label="File attachment dropzone">
						<div class="fallback">
							<input
								name="file"
								type="file"
								multiple="multiple"
								aria-label="Upload project attachments" />
						</div>
						<div class="dz-message needsclick">
							<div class="mb-3">
								<i
									class="display-4 text-muted ri-upload-cloud-2-fill"></i>
							</div>
							<h5>Drop files here or click to upload.</h5>
						</div>
					</div>
					<ul
						class="list-unstyled mb-0"
						id="dropzone-preview"
						aria-live="polite">
						<li
							class="mt-2"
							id="dropzone-preview-list">
							<div class="border rounded">
								<div class="d-flex p-2">
									<div class="flex-shrink-0 me-3">
										<div
											class="avatar-sm bg-light rounded">
											<img
												src="#"
												alt="Project-Image"
												data-dz-thumbnail
												class="img-fluid rounded d-block" />
										</div>
									</div>
									<div class="flex-grow-1">
										<div class="pt-1">
											<h5
												class="fs-14 mb-1"
												data-dz-name>
												&nbsp;
											</h5>
											<p
												class="fs-13 text-muted mb-0"
												data-dz-size></p>
											<strong
												class="error text-danger"
												data-dz-errormessage></strong>
										</div>
									</div>
									<div class="flex-shrink-0 ms-3">
										<button
											data-dz-remove
											class="btn btn-sm btn-danger"
											aria-label="Delete attachment">
											Delete
										</button>
									</div>
								</div>
							</div>
						</li>
					</ul>
				</div>
			</div>
		</section>

		<section
			class="d-flex flex-column gap-4 flex-grow-1 flex-shrink:1 flex-basis:320px min-width:280px">
			<div class="width:100%">
				<div class="mb-3">
					<h5 class="card-title mb-0">Privacy</h5>
				</div>
				<div>
					<label
						for="choices-privacy-status-input"
						class="form-label flex-grow-1">
						Status
						<select
							class="form-select"
							plugin='{"$Choices":["$this",{}]}'
							data-choices-search-false
							id="choices-privacy-status-input"
							aria-label="Select privacy status">
							<option
								value="Private"
								selected>
								Private
							</option>
							<option value="Team">Team</option>
							<option value="Public">Public</option>
						</select>
					</label>
				</div>
			</div>

			<div class="width:100%">
				<div class="mb-3">
					<h5 class="card-title mb-0">Tags</h5>
				</div>
				<div class="d-flex flex-wrap gap-3">
					<label
						for="choices-categories-input"
						class="form-label flex-grow-1 flex-basis:160px">
						Categories
						<select
							class="form-select"
							plugin='{"$Choices":["$this",{}]}'
							data-choices-search-false
							id="choices-categories-input"
							aria-label="Select project categories">
							<option
								value="Designing"
								selected>
								Designing
							</option>
							<option value="Development">Development</option>
						</select>
					</label>
					<label
						for="choices-text-input"
						class="form-label flex-grow:2 flex-basis:220px">
						Skills
						<input
							class="form-control"
							id="choices-text-input"
							plugin='{"$Choices":["$this",{}]}'
							data-choices-limit=" Limit"
							placeholder="Enter Skills"
							type="text"
							value="UI/UX, Figma, HTML, CSS, Javascript, C#, Nodejs"
							aria-label="Enter project skills" />
					</label>
				</div>
			</div>
			<div class="width:100%">
				<div class="mb-3">
					<h5 class="card-title mb-0">Members</h5>
				</div>
				<div class="d-flex flex-wrap gap-3">
					<label
						for="choices-lead-input"
						class="form-label flex-grow-1 flex-basis:180px">
						Team Lead
						<select
							class="form-select"
							plugin='{"$Choices":["$this",{}]}'
							data-choices-search-false
							id="choices-lead-input"
							aria-label="Select team lead">
							<option
								value="Brent Gonzalez"
								selected>
								Brent Gonzalez
							</option>
							<option value="Darline Williams">
								Darline Williams
							</option>
							<option value="Sylvia Wright">
								Sylvia Wright
							</option>
							<option value="Ellen Smith">Ellen Smith</option>
							<option value="Jeffrey Salazar">
								Jeffrey Salazar
							</option>
							<option value="Mark Williams">
								Mark Williams
							</option>
						</select>
					</label>
					<label class="form-label flex-grow:2 flex-basis:240px">
						Team Members
						<div
							src="components/avatar-group.html"
							aria-label="Avatar group for team members"></div>
						<div
							src="components/members.html"
							aria-label="List of team members"></div>
					</label>
				</div>
			</div>
		</section>
	</div>

	<footer src="/components/offcanvas-app/footer.html" value-type="outerHtml"></footer>
</form>
