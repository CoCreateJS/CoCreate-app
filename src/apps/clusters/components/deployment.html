<h5 class="mb-1">First deployment</h5>
<p
	class="text-muted"
	data-deployment-description>
	Choose where to deploy the first server. As resource needs change, servers
	are automatically added or removed across your selected cloud providers
	according to the cluster’s scaling settings.
</p>
<div class="row g-3">
	<div
		class="col-12"
		data-initial-provider-field>
		<span class="form-label d-block">Cloud provider</span>
		<div class="dropdown">
			<button
				type="button"
				id="first-deployment-provider"
				class="first-deployment-provider-select form-select text-start"
				aria-controls="first-deployment-provider-options"
				aria-expanded="false"
				aria-label="Cloud provider">
				<span id="first-deployment-provider-label"
					>Choose a cloud provider</span
				>
			</button>
			<div
				id="first-deployment-provider-options"
				class="dropdown-menu"
				role="radiogroup"
				aria-label="Cloud provider"
				aria-hidden="true"
				aria-close-on="anywhere"
				form-attributes="false"
				array=""
				object
				filter-query-key="type"
				filter-query-value="cloud"
				filter-limit="0"
				filter-sort-key="name"
				filter-sort-direction="asc"
				render-query="template">
				<template>
					<label
						class="dropdown-item d-flex align-items-center gap-2">
						<input
							type="radio"
							name="first-deployment-provider"
							array="servers"
							object
							key="infrastructure.provider"
							value="{{object.provider}}"
							aria-errormessage="first-deployment-provider-error"
							input-query="$document #first-deployment-api-request"
							input.object="{{object._id}}"
							input.array="apis"
							change-query="$document #first-deployment-provider-label"
							change.textContent="{{object.name}}"
							required />
						<div
							value-type="outerHTML"
							src="/apps/apis/components/provider-icon.html"></div>
						<span class="text-truncate">{{object.name}}</span>
					</label>
				</template>
			</div>
		</div>
		<span
			id="first-deployment-provider-error"
			class="text-danger small"
			hidden></span>
	</div>
</div>
<style>
	.first-deployment-provider-select,
	.first-deployment-region-select {
		width: 100%;
	}

	#first-deployment-provider-options,
	#first-deployment-region-options {
		width: 100%;
		max-height: 18rem;
		overflow-y: auto;
	}

	#first-deployment-provider-options .dropdown-item,
	#first-deployment-region-options .dropdown-item {
		cursor: pointer;
		position: relative;
	}

	#first-deployment-provider-options input[type="radio"],
	#first-deployment-region-options input[type="radio"] {
		position: absolute;
		width: 1px;
		height: 1px;
		opacity: 0;
	}

	#first-deployment-provider-options .dropdown-item:focus-within,
	#first-deployment-region-options .dropdown-item:focus-within {
		outline: 2px solid var(--coc-primary);
		outline-offset: -2px;
	}

	#first-deployment-provider-options .dropdown-item:has(input:checked),
	#first-deployment-region-options .dropdown-item:has(input:checked) {
		background: var(--coc-tertiary-bg);
	}

	#first-deployment-provider-options .apis-provider-image {
		width: 28px;
		height: 28px;
		flex-basis: 28px;
	}
</style>

<input
	id="first-deployment-status"
	type="hidden"
	array="servers"
	object
	key="status"
	value="provisioning" />
<input
	type="hidden"
	array="servers"
	object
	key="totalWorkers"
	value="0"
	value-type="number" />
<div
	id="first-deployment-api-request"
	form-attributes="false"
	array=""
	object=""
	render-query="template">
	<template>
		<div
			api="{{object.name}}"
			{{object.name}}-endpoint="create-instance"
			{{object.name}}-method="post">
			<input
				id="first-deployment-api-id"
				type="hidden"
				array="servers"
				object
				key="api_id"
				value="{{object._id}}" />
			<input
				id="first-deployment-infrastructure-api-id"
				type="hidden"
				array="servers"
				object
				key="infrastructure.api_id"
				value="{{object._id}}" />
			<div
				id="first-deployment-profile"
				form-attributes="false"
				array="servers_config"
				object
				filter-query-key="provider"
				filter-query-value="{{object.provider}}"
				filter-limit="1"
				render-query="template">
				<template>
					<div>
						<div
							template="first-deployment-profile"
							render="object.config"
							render-as="profile">
							<div class="dropdown mt-3">
								<span class="form-label d-block">Region</span>
								<button
									type="button"
									id="first-deployment-region"
									class="first-deployment-region-select form-select text-start"
									aria-controls="first-deployment-region-options"
									aria-expanded="false"
									aria-label="Region">
									<span id="first-deployment-region-label">Choose a region</span>
								</button>
								<div
									id="first-deployment-region-options"
									class="dropdown-menu"
									role="radiogroup"
									aria-label="Region"
									aria-hidden="true"
									aria-close-on="anywhere">
									<label
										template
										render="profile.value.regions"
										render-as="region"
										class="dropdown-item d-flex align-items-center gap-2">
										<input
											type="radio"
											name="first-deployment-region"
											array="servers"
											object
											key="infrastructure.region"
											value="{{region.region}}"
											{{object.provider}}-key="region"
											{{object.provider}}-response="false"
											change-query="$document #first-deployment-region-label"
											change.textContent="{{region.name}} ({{region.region}})"
											required />
										<span>{{region.name}} ({{region.region}})</span>
									</label>
								</div>
							</div>
							<select
								id="first-deployment-vm-type"
								hidden
								array="servers"
								object
								key="infrastructure.vmType"
								{{object.provider}}-key="vmType"
								{{object.provider}}-response="false">
								<option
									template
									render="profile.value.instances"
									render-as="instance"
									value="{{instance.name}}"
									data-vcpu="{{instance.vCPU}}"
									data-memory-gb="{{instance.memoryGb}}"
									data-default="{{instance.default}}"
									onload-query="$closest select option[data-default='true']"
									onload.selected="true">{{instance.name}}</option>
							</select>
						</div>
					</div>
				</template>
			</div>
			<input
				id="first-deployment-server-id"
				type="hidden"
				array="servers"
				object
				key="_id"
				{{object.name}}-key="server_id"
				{{object.name}}-response="false"
				value="$query($document #first-deployment-form).getAttribute('object')"
				save="false" />
			<input
				id="first-deployment-cluster-id"
				type="hidden"
				array="servers"
				object
				key="cluster_id"
				{{object.name}}-key="cluster_id"
				{{object.name}}-response="false" />
			<div
				id="first-deployment-startup-script"
				component
				hidden
				form-attributes="false"
				array="servers_config"
				object
				key="config.startupScript"
				filter-query-key="type"
				filter-query-value="startupscript"
				filter-limit="1"
				{{object.name}}-key="startupScript"
				{{object.name}}-response="false"
				save="false"></div>
			<input
				id="first-deployment-binary-url"
				type="hidden"
				form-attributes="false"
				{{object.name}}-key="binaryUrl"
				{{object.name}}-response="false"
				value="$query($document #cluster-configuration-form [key='binaryUrl']).getValue()" />
			<input
				id="first-deployment-host"
				type="hidden"
				form-attributes="false"
				{{object.name}}-key="host"
				{{object.name}}-response="false"
				value="$query($document #cluster-configuration-form [key='host']).getValue()" />
			<input
				id="first-deployment-storage"
				type="hidden"
				{{object.name}}-key="storage"
				{{object.name}}-response="false"
				value="$query($document #cluster-storage-providers-list input[key='storage']:checked).dataset.apiUrl" />
			<input
				id="first-deployment-environment"
				type="hidden"
				{{object.name}}-key="environment"
				{{object.name}}-response="false"
				value="server_id=$query($document #first-deployment-server-id).getValue()&#10;cluster_id=$query($document #first-deployment-cluster-id).getValue()" />
			<input
				id="first-deployment-vcpu"
				type="hidden"
				array="servers"
				object
				key="infrastructure.vCPU"
				{{object.name}}-key="vCPU"
				{{object.name}}-response="false"
				value="$query($document #first-deployment-vm-type option:checked).dataset.vcpu"
				value-type="number" />
			<input
				id="first-deployment-memory"
				type="hidden"
				array="servers"
				object
				key="infrastructure.memoryGb"
				{{object.name}}-key="memoryGb"
				{{object.name}}-response="false"
				value="$query($document #first-deployment-vm-type option:checked).dataset.memoryGb"
				value-type="number" />
			<button
				type="button"
				hidden
				actions="{{object.name}}.create-instance, action($document #mark-server-starting)"></button>
		</div>
	</template>
</div>
