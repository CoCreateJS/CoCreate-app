<ul
	class="list-inline hstack justify-content-between align-items-center gap-2 mb-0"
	style="min-height: unset"
	role="toolbar"
	aria-label="Cluster controls">
	<style>
		#clusters-form-btn,
		#clusters-details-btn {
			display: none;
		}

		.offcanvas-app-content:has(
				#offcanvas-app-view[src*="/apps/clusters/details.html"]
			)
			#clusters-form-btn {
			display: inline-flex;
		}

		.offcanvas-app-content:has(
				#offcanvas-app-view[src*="/apps/clusters/form.html"]
			)
			#clusters-details-btn {
			display: inline-flex;
		}

		#create-panel .clusters-record-actions,
		#create-panel .clusters-dock-control {
			display: none !important;
		}
	</style>

	<li class="clusters-record-actions list-inline-item">
		<div
			class="dropdown d-inline-block"
			role="region"
			aria-label="Cluster actions">
			<a
				class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle dropdown text-muted"
				role="button"
				aria-haspopup="menu"
				aria-controls="clusters-header-dropdown"
				aria-expanded="false"
				aria-label="More actions">
				<i
					class="ri-more-2-fill align-middle fs-22"
					aria-hidden="true"></i>
			</a>
			<ul
				id="clusters-header-dropdown"
				class="dropdown-menu dropdown-menu-start"
				aria-close-on="anywhere"
				role="menu"
				aria-label="Cluster actions menu">
				<li>
					<a
						class="dropdown-item"
						state-to="offcanvas-app-view"
						state.src="/apps/clusters/details.html"
						role="menuitem">
						<i
							class="ri-eye-fill align-bottom me-2 text-muted"
							aria-hidden="true"></i
						>View
					</a>
				</li>
				<li>
					<a
						class="dropdown-item"
						state-to="offcanvas-app-view"
						state.src="/apps/clusters/form.html"
						role="menuitem">
						<i
							class="ri-pencil-fill align-bottom me-2 text-muted"
							aria-hidden="true"></i
						>Edit
					</a>
				</li>
				<li>
					<a
						class="dropdown-item remove-item-btn"
						aria-haspopup="dialog"
						aria-label="Delete Cluster"
						aria-controls="removeItemModal"
						role="menuitem"
						state-to="delete-record"
						state.array="clusters"
						state.object="">
						<input
							key="_id"
							input.state.object="$value"
							input-query="$parent"
							hidden />
						<i
							class="ri-delete-bin-fill align-bottom me-2 text-muted"
							aria-hidden="true"></i
						>Delete
					</a>
				</li>
			</ul>
		</div>

		<div
			role="group"
			aria-label="Primary Cluster actions"
			class="d-inline-block align-middle">
			<button
				id="clusters-details-btn"
				type="button"
				state-to="offcanvas-app-view"
				state.src="/apps/clusters/details.html"
				class="btn btn-sm btn-outline-primary ms-2"
				title="Details"
				aria-label="Details">
				<i
					class="ri-eye-fill align-bottom"
					aria-hidden="true"></i>
				<span>Details</span>
			</button>

			<button
				id="clusters-form-btn"
				type="button"
				state-to="offcanvas-app-view"
				state.src="/apps/clusters/form.html"
				class="btn btn-sm btn-outline-primary ms-2"
				title="Edit"
				aria-label="Edit">
				<i
					class="ri-pencil-fill align-bottom"
					aria-hidden="true"></i>
				<span>Edit</span>
			</button>
		</div>
	</li>

	<div
		role="group"
		aria-label="Window controls"
		class="hstack gap-1">
		<li class="clusters-dock-control d-none d-md-inline">
			<a
				role="button"
				title="Dock Right"
				aria-label="Dock Right"
				toggle.docked="true, false"
				toggle-query="$document #offcanvas-app"
				class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle text-muted">
				<i
					toggle.class="ri-layout-right-2-line, ri-layout-right-line"
					class="ri-layout-right-line align-middle fs-22"
					aria-hidden="true"></i>
			</a>
		</li>
		<li title="Close">
			<a
				role="button"
				aria-label="Close"
				aria-controls="offcanvas-app"
				aria-close
				aria-expanded="true"
				class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle text-muted">
				<i
					class="ri-close-line align-middle fs-22"
					aria-hidden="true"></i>
			</a>
		</li>
	</div>
</ul>
