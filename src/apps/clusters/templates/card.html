<article
	class="card flex-grow-1 mb-0 app-card app-with-image"
	style="flex-basis: 320px; min-width: min(280px, 100%); max-width: 460px"
	template
	data-select-card
	array="{{object.$array[0]}}"
	object="{{object._id}}"
	read="false">
	<div class="card-body d-flex flex-column gap-3 text-reset">
		<div class="app-heading">
			<div class="d-flex align-items-center gap-3 min-width:0">
				<span class="avatar-sm app-card-icon flex-shrink-0">
					<span
						class="avatar-title bg-primary-subtle text-primary rounded-circle">
						<i src="/assets/svg/remix/stack-line.svg" aria-hidden="true"></i>
					</span>
				</span>
				<div class="min-width:0">
					<h5 class="app-title mb-0 text-break">
						<a
							class="text-reset text-decoration-none"
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/clusters/app.html"
							aria-controls="offcanvas-app"
							aria-haspopup="dialog"
							aria-expanded="false"
							aria-open
							data-card-open
							><span
								state-to="offcanvas-app-form"
								state.array="clusters"
								state.object="{{object._id}}"
								hidden></span
							>{{object.name}}</a
						>
					</h5>
				</div>
			</div>
			<div class="app-badges">
				<span
					class="badge border border-secondary text-secondary text-uppercase"
					role="status"
					>{{object.status}}</span
				>
			</div>
		</div>
		<p class="text-muted mb-0 text-break line-clamp:2">
			{{object.description}}
		</p>
		<div
			class="d-flex flex-wrap align-items-center gap-2 text-muted fs-12 pt-2 border-top border-top-dashed"
			style="margin-top: auto">
			<span class="d-flex align-items-center gap-1">
				<i src="/assets/svg/remix/server-line.svg" aria-hidden="true"></i>
				<span
					array="servers"
					object
					key="$length"
					filter-query-key="cluster_id"
					filter-query-value="{{object._id}}"
					filter-limit
					>0</span
				>
				servers
			</span>

			<span
				render="object.storage"
				render-as="storage"
				value-type="object"
				template
				class="d-flex align-items-center gap-1 ms-auto min-width:0"
				style="max-width: 100%"
				title="Storage: {{storage.key}}">
				<i src="/assets/svg/remix/database-2-line.svg" class="flex-shrink-0"
					aria-hidden="true"></i>
				<span class="visually-hidden">Storage: </span>
				<span class="text-truncate">{{storage.key}}</span>
			</span>
		</div>
	</div>
</article>
<div
	onload.array="clusters"
	onload-query="$parent"></div>
