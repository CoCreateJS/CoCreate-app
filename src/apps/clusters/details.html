<form
	state-id="offcanvas-app-form"
	class="app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	data-component-form
	array
	object
	autocomplete="off">
	<header
		class="card-header offcanvas-app-topbar flex-shrink-0"
		src="/apps/clusters/header.html"
		aria-label="Details controls"></header>

	<div
		class="component-form-body flex-grow-1 min-height:0"
		plugin='{"$SimpleBar": ["$this", {}]}'>
		<div class="card-body d-flex flex-column gap-4">
	<input type="hidden" key="_id" />
	<section class="d-flex align-items-center gap-3">
		<span class="avatar-lg flex-shrink-0">
			<span class="avatar-title rounded-circle bg-primary-subtle text-primary">
				<i class="ri-stack-line fs-24"></i>
			</span>
		</span>
		<div class="flex-grow-1 min-width:0">
			<h4 class="mb-1 text-truncate" key="name"></h4>
			<span class="badge bg-secondary-subtle text-secondary text-uppercase" key="status"></span>
		</div>
	</section>
</div>
	</div>
</form>
