<form
	class="app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	data-component-form
	array
	object
	autocomplete="off">
<header
		class="card-header offcanvas-app-topbar flex-shrink-0"
		src="/apps/candidates/header.html"
		aria-label="Form controls"></header>
	<div
		class="component-form-body flex-grow-1 min-height:0"
		plugin='{"$SimpleBar": ["$this", {}]}'>
<div class="card-body d-flex flex-wrap align-items:flex-start gap-3">
			<input type="hidden" key="type[0]" value="candidate" />
			<section
				class="d-flex flex-column flex-grow-1 flex-basis:400px min-width:280px">
				<div class="mb-3">
					<h5 class="card-title mb-0">Candidate Information</h5>
				</div>
				<div class="d-flex flex-column gap-3">
						<label class="form-label"
							>First Name
							<input
								type="text"
								key="first_name"
								class="form-control"
								placeholder="Enter first name"
								aria-label="First Name" />
						</label>
						<label class="form-label"
							>Last Name
							<input
								type="text"
								key="last_name"
								class="form-control"
								placeholder="Enter last name"
								aria-label="Last Name" />
						</label>
						<label class="form-label"
							>Email
							<input
								type="email"
								key="email"
								class="form-control"
								placeholder="candidate@example.com"
								aria-label="Email" />
						</label>
						<label class="form-label"
							>Phone Number
							<input
								type="tel"
								key="phone"
								class="form-control"
								placeholder="(123) 456-7890"
								aria-label="Phone Number" />
						</label>
						<label class="form-label"
							>Company
							<input
								type="text"
								key="company"
								class="form-control"
								placeholder="Enter company name"
								aria-label="Company" />
						</label>
						<label class="form-label"
							>Title
							<input
								type="text"
								key="title"
								class="form-control"
								placeholder="e.g., Software Engineer"
								aria-label="Title" />
						</label>
				</div>
			</section>
			<section
				class="d-flex flex-column flex-grow-1 flex-basis:400px min-width:280px">
				<div class="mb-3">
					<h5 class="card-title mb-0">Additional Details</h5>
				</div>
				<div class="d-flex flex-column gap-3">
						<label class="form-label"
							>Website
							<input
								type="url"
								key="website"
								class="form-control"
								placeholder="https://www.example.com"
								aria-label="Website" />
						</label>
						<label class="form-label"
							>Description
							<textarea
								key="description"
								class="form-control"
								placeholder="Brief candidate description"
								rows="5"
								aria-label="Description"></textarea>
						</label>
						<label class="form-label"
							>Tags
							<select
								key="tags"
								class="form-select"
								multiple
								plugin='{"$Choices":["$this",{}]}'
								aria-label="Tags"></select>
						</label>
				</div>
			</section>
		</div>
	</div>
	<footer class="card-footer flex-shrink-0">
		<div class="hstack gap-2 justify-content-end">
			<button
				type="button"
				class="btn btn-light"
				data-component-form-close
				aria-label="Cancel form"
				aria-expanded="true"
				aria-close>Cancel</button>
			<button
				class="btn btn-success btn-spinner"
				aria-label="Save form"
				actions="validate, disabled, save, timeout(2000), disabled">
				<span class="spinner-border spinner-border-sm display:none" role="status" aria-hidden="true"></span>
				<span class="button-text">Save</span>
			</button>
		</div>
	</footer>
</form>
