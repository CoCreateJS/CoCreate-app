<div class="d-flex align-items-center gap-2">
	<span class="avatar-xs rounded-circle position-relative overflow-hidden flex-shrink-0">
		<span class="avatar-title bg-info-subtle text-info">
			<span class="avatar-initial" key="first_name[0]"></span>
			<span class="avatar-initial" key="last_name[0]"></span>
			<img
				class="position-absolute object-fit-cover"
				key="avatar[0].src"
				src="/assets/images/transparent.png"
				alt="Candidate avatar"
				width="100%"
				height="100%"
				onerror="this.onerror=null; this.src='/assets/images/transparent.png';" />
		</span>
	</span>
	<span class="flex-grow-1 text-start text-truncate">
		<span key="name"></span>
	</span>
</div>
