<article class="card mb-0"><div class="card-body d-flex flex-column gap-3"><div class="d-flex align-items-start justify-content-between gap-3"><div class="d-flex align-items-center gap-3 min-width:0"><div class="avatar-sm rounded-circle position-relative overflow-hidden flex-shrink-0"><div class="avatar-title bg-secondary-subtle text-secondary"><span class="avatar-initial" key="first_name[0]"></span><span class="avatar-initial" key="last_name[0]"></span><img class="position-absolute object-fit-cover" key="avatar[0].src" src="/assets/images/transparent.png" alt="Candidate avatar" width="100%" height="100%" onerror="this.onerror=null; this.src='/assets/images/transparent.png';" /></div></div><div class="min-width:0"><h5 class="mb-1 text-truncate" key="name"></h5><span class="text-muted fs-12" key="availability"></span></div></div><span class="badge bg-success-subtle text-success text-capitalize" key="status"></span></div><p class="text-muted mb-0 line-clamp:2" key="description"></p><div class="d-flex flex-wrap gap-1 pt-2 border-top border-top-dashed" key="skills" render-query="[template='candidate-card-skill']"><span template="candidate-card-skill" class="badge bg-info-subtle text-info">{{skills}}</span></div></div></article>
