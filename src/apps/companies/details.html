<div class="card-body d-flex flex-wrap gap-4">
			<div
				class="flex-shrink-0 d-flex flex-column align-items-center width:100% mb-4">
				<div class="position-relative d-inline-block">
					<img
						src="/assets/images/multi-user.jpg"
						key="logo[0].src"
						alt="Company Logo"
						class="avatar-xl rounded-circle img-thumbnail material-shadow" />
				</div>
				<h5
					class="mt-4 mb-1"
					key="company_name"
					aria-label="Company Name"></h5>
				<p class="text-muted" key="industry" aria-label="Industry"></p>
				<ul class="list-inline mb-0 d-flex gap-2 mt-3">
					<li class="avatar-xs">
						<input
							type="hidden"
							key="phone"
							input.href="$value"
							input-query="$next"
							value-prefix="tel:"
							aria-label="Phone Number Input" />
						<a
							href="javascript:void(0);"
							class="avatar-title bg-success-subtle text-success fs-15 rounded"
							role="button"
							aria-label="Call Company Phone Number">
							<i class="ri-phone-line"></i>
						</a>
					</li>
					<li class="avatar-xs">
						<input
							type="hidden"
							key="email"
							input.href="$value"
							input-query="$next"
							value-prefix="mailto:"
							aria-label="Email Address Input" />
						<a
							href="javascript:void(0);"
							class="avatar-title bg-danger-subtle text-danger fs-15 rounded"
							role="button"
							aria-label="Email Company">
							<i class="ri-mail-line"></i>
						</a>
					</li>
					<li class="avatar-xs">
						<input
							type="hidden"
							key="website"
							input.href="$value"
							input-query="$next"
							value-prefix="http://" />
						<a
							href="javascript:void(0);"
							target="_blank"
							class="avatar-title bg-primary-subtle text-primary fs-15 rounded"
							role="link"
							aria-label="Visit Company Website">
							<i class="ri-global-line"></i>
						</a>
					</li>
				</ul>
			</div>
			<div class="flex-grow-1" style="flex-basis: 0; min-width: 300px">
				<h6 class="text-muted text-uppercase fw-semibold mb-3">
					Company Information
				</h6>
				<p
					class="text-muted mb-4"
					key="description"
					aria-label="Company Description"></p>
				<div class="table-responsive table-card">
					<table class="table table-borderless mb-0">
						<tbody>
							<tr>
								<td class="fw-medium" scope="row">
									Company Name
								</td>
								<td
									key="company_name"
									aria-label="Company Name"></td>
							</tr>
							<tr>
								<td class="fw-medium" scope="row">Email</td>
								<td key="email" aria-label="Company Email"></td>
							</tr>
							<tr>
								<td class="fw-medium" scope="row">Phone</td>
								<td key="phone" aria-label="Company Phone"></td>
							</tr>
							<tr>
								<td class="fw-medium" scope="row">Website</td>
								<td>
									<a
										href=""
										key="website"
										input.href="$value"
										target="_blank"
										aria-label="Company Website Link"></a>
								</td>
							</tr>
							<tr>
								<td class="fw-medium" scope="row">Address</td>
								<td
									key="address"
									aria-label="Company Address"></td>
							</tr>
							<tr>
								<td class="fw-medium" scope="row">Employees</td>
								<td
									key="employee_count"
									aria-label="Number of Employees"></td>
							</tr>
							<tr>
								<td class="fw-medium" scope="row">
									Annual Revenue
								</td>
								<td
									key="annual_revenue"
									aria-label="Annual Revenue"></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
			<div class="w-100" src="components/activities.html"></div>
		</div>
