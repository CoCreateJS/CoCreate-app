<ul
	class="list-inline hstack justify-content-between align-items-center gap-2 mb-0"
	style="min-height: unset"
	role="toolbar"
	aria-label="Company controls">
	<style>
		#companies-form-btn,
		#companies-details-btn {
			display: none;
		}

		.offcanvas-app-content:has(#offcanvas-app-view[src*="/apps/companies/details.html"])
			#companies-form-btn {
			display: inline-flex;
		}

		.offcanvas-app-content:has(#offcanvas-app-view[src*="/apps/companies/form.html"])
			#companies-details-btn {
			display: inline-flex;
		}

		#create-panel .companies-record-actions,
		#create-panel .companies-dock-control {
			display: none !important;
		}
	</style>

	<li class="companies-record-actions list-inline-item">
		<div
			class="dropdown d-inline-block"
			role="region"
			aria-label="Company actions">
			<a
				class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle dropdown text-muted"
				role="button"
				aria-haspopup="menu"
				aria-controls="companies-header-dropdown"
				aria-expanded="false"
				aria-label="More actions">
				<i class="ri-more-2-fill align-middle fs-22" aria-hidden="true"></i>
			</a>
			<ul
				id="companies-header-dropdown"
				class="dropdown-menu dropdown-menu-start"
				aria-close-on="anywhere"
				role="menu"
				aria-label="Company actions menu">
				<li>
					<a
						class="dropdown-item"
						state-to="offcanvas-app-view"
						state.src="/apps/companies/details.html"
						role="menuitem">
						<i class="ri-eye-fill align-bottom me-2 text-muted" aria-hidden="true"></i>View
					</a>
				</li>
				<li>
					<a
						class="dropdown-item"
						state-to="offcanvas-app-view"
						state.src="/apps/companies/form.html"
						role="menuitem">
						<i class="ri-pencil-fill align-bottom me-2 text-muted" aria-hidden="true"></i>Edit
					</a>
				</li>
				<li>
					<a
						class="dropdown-item remove-item-btn"
						aria-haspopup="dialog"
						aria-label="Delete Company"
						aria-controls="removeItemModal"
						role="menuitem"
						state-to="delete-record"
						state.array="companies"
						state.object="">
						<input
							key="_id"
							input.state.object="$value"
							input-query="$parent"
							hidden />
						<i class="ri-delete-bin-fill align-bottom me-2 text-muted" aria-hidden="true"></i>Delete
					</a>
				</li>
			</ul>
		</div>

		<div
			role="group"
			aria-label="Primary Company actions"
			class="d-inline-block align-middle">
			<button
				id="companies-details-btn"
				type="button"
				state-to="offcanvas-app-view"
				state.src="/apps/companies/details.html"
				class="btn btn-sm btn-outline-primary ms-2"
				title="Details"
				aria-label="Details">
				<i class="ri-eye-fill align-bottom" aria-hidden="true"></i>
				<span>Details</span>
			</button>

			<button
				id="companies-form-btn"
				type="button"
				state-to="offcanvas-app-view"
				state.src="/apps/companies/form.html"
				class="btn btn-sm btn-outline-primary ms-2"
				title="Edit"
				aria-label="Edit">
				<i class="ri-pencil-fill align-bottom" aria-hidden="true"></i>
				<span>Edit</span>
			</button>
		</div>
	</li>

	<div
		role="group"
		aria-label="Window controls"
		class="hstack gap-1">
		<li class="companies-dock-control d-none d-md-inline">
			<a
				role="button"
				title="Dock Right"
				aria-label="Dock Right"
				toggle.docked="true, false"
				toggle-query="$document #offcanvas-app"
				class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle text-muted">
				<i
					toggle.class="ri-layout-right-line, ri-layout-right-2-line"
					class="ri-layout-right-2-line align-middle fs-22"
					aria-hidden="true"></i>
			</a>
		</li>
		<li title="Close">
			<a
				role="button"
				data-component-form-close
				aria-label="Close"
				aria-expanded="true"
				class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle text-muted">
				<i class="ri-close-line align-middle fs-22" aria-hidden="true"></i>
			</a>
		</li>
	</div>
</ul>
