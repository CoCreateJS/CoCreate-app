
<article class="app-card card mb-0">
	<div class="card-body d-flex flex-column gap-3">
		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="app-identity">
				<div class="avatar-sm rounded-circle position-relative overflow-hidden flex-shrink-0 app-identity-image"><div class="avatar-title bg-primary-subtle text-primary"><span class="avatar-initial" key="name[0]"></span><img class="position-absolute object-fit-cover" key="logo" src="/assets/images/transparent.png" alt="Company logo" width="100%" height="100%" onerror="this.onerror=null; this.src='/assets/images/transparent.png';" /></div></div>
				<div class="min-width:0"><h5 class="app-title mb-1 text-truncate" key="name"></h5><span class="text-muted text-truncate d-block" key="industry"></span></div>
			</div>
			<span class="badge text-capitalize" key="status" data-value input.data-value="$value"></span>
		</div>
		<div class="d-flex flex-wrap gap-3"><div><span class="text-muted fs-12 d-block">Rating</span><strong><i src="/assets/svg/remix/star-fill.svg" class="text-warning me-1"></i><span key="rating"></span></strong></div><div><span class="text-muted fs-12 d-block">Employees</span><strong key="employees"></strong></div><div><span class="text-muted fs-12 d-block">Since</span><strong key="since"></strong></div></div>
		<div class="d-flex flex-column gap-2 text-muted fs-12"><span><i src="/assets/svg/remix/mail-line.svg" class="me-2"></i><span key="email"></span></span><span><i src="/assets/svg/remix/global-line.svg" class="me-2"></i><span key="website"></span></span><span><i src="/assets/svg/remix/map-pin-line.svg" class="me-2"></i><span key="location"></span></span></div>
		<div class="d-flex flex-wrap gap-1 pt-2 border-top border-top-dashed" key="type" render-query="[template='company-card-type']"><span template="company-card-type" class="badge border border-info text-info">{{type}}</span></div>
		<div class="d-flex flex-wrap gap-1" key="tags" render-query="[template='company-card-tag']"><span template="company-card-tag" class="badge border border-secondary text-secondary">{{tags}}</span></div>
	</div>
</article>
