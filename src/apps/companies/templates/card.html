<article class="card flex-grow-1 mb-0" style="flex-basis:320px; min-width:min(280px, 100%); max-width:460px" template>
	<a class="card-body d-flex flex-column gap-3 text-reset" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/companies/details.html" aria-controls="offcanvas-app" aria-haspopup="dialog" aria-expanded="false" aria-open>
		<div state-to="offcanvas-app-form" state.array="companies" state.object="{{object._id}}"></div>
		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="d-flex align-items-center gap-3 min-width:0"><div class="avatar-sm rounded-circle position-relative overflow-hidden flex-shrink-0"><div class="avatar-title bg-primary-subtle text-primary"><span class="avatar-initial">{{object.name[0]}}</span><img class="position-absolute object-fit-cover" src="{{object.logo}}" alt="{{object.name}}" width="100%" height="100%" onerror="this.onerror=null; this.src='/assets/images/transparent.png';" /></div></div><div class="min-width:0"><h5 class="mb-1 text-truncate">{{object.name}}</h5><span class="text-muted text-truncate d-block">{{object.industry}}</span></div></div>
			<span class="badge bg-success-subtle text-success text-capitalize">{{object.status}}</span>
		</div>
		<div class="d-flex flex-wrap gap-3"><div><span class="text-muted fs-12 d-block">Rating</span><strong><i class="ri-star-fill text-warning me-1"></i>{{object.rating}}</strong></div><div><span class="text-muted fs-12 d-block">Employees</span><strong>{{object.employees}}</strong></div><div><span class="text-muted fs-12 d-block">Since</span><strong>{{object.since}}</strong></div></div>
		<div class="d-flex flex-column gap-2 text-muted fs-12"><span><i class="ri-mail-line me-2"></i>{{object.email}}</span><span><i class="ri-global-line me-2"></i>{{object.website}}</span><span><i class="ri-map-pin-line me-2"></i>{{object.location}}</span></div>
		<div class="d-flex flex-wrap gap-1 pt-2 border-top border-top-dashed" array="companies" object="{{object._id}}" key="type" render-query="[template='company-card-type']"><span template="company-card-type" class="badge bg-info-subtle text-info">{{type}}</span></div>
		<div class="d-flex flex-wrap gap-1" array="companies" object="{{object._id}}" key="tags" render-query="[template='company-card-tag']"><span template="company-card-tag" class="badge bg-secondary-subtle text-secondary">{{tags}}</span></div>
	</a>
</article>
<div onload.array="companies" onload-query="$parent"></div>
