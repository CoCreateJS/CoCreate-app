<div class="d-flex align-items-center gap-2">
	<span
		class="avatar-xs app-list-image rounded-circle position-relative overflow-hidden flex-shrink-0">
		<span class="avatar-title bg-primary-subtle text-primary">
			<span
				class="avatar-initial"
				key="name[0]"></span>
			<img
				class="position-absolute object-fit-cover"
				key="logo"
				src="/assets/images/transparent.png"
				alt="Company logo"
				width="100%"
				height="100%"
				onerror="
					this.onerror = null;
					this.src = '/assets/images/transparent.png';
				" />
		</span>
	</span>
	<span class="flex-grow-1 text-start text-truncate">
		<span key="name"></span>
	</span>
</div>
