<div class="col col-sm-auto order-1 d-block d-lg-none">
	<button
		type="button"
		class="btn btn-soft-success btn-icon btn-sm fs-16 email-menu-btn material-shadow-none"
		aria-haspopup="menu"
		aria-controls="email-sidenav"
		aria-expanded="false"
		id="email-sidenav-toggle">
		<i class="ri-menu-2-fill align-bottom"></i>
	</button>
</div>
<div class="col-sm order-3 order-sm-2">
	<div class="hstack gap-sm-1 align-items-center flex-wrap email-topbar-link">
		<div class="form-check fs-14 m-0">
			<input
				class="form-check-input"
				type="checkbox"
				value=""
				id="checkall" />
			<label class="form-check-label" for="checkall"></label>
		</div>
		<div id="email-topbar-actions">
			<div class="hstack gap-sm-1 align-items-center flex-wrap">
				<button
					type="button"
					class="btn btn-ghost-secondary btn-icon btn-sm fs-16 material-shadow-none"
					data-bs-toggle="tooltip"
					data-bs-trigger="hover"
					data-bs-placement="top"
					title="Archive">
					<i class="ri-inbox-archive-fill align-bottom"></i>
				</button>
				<button
					type="button"
					class="btn btn-ghost-secondary btn-icon btn-sm fs-16 material-shadow-none"
					data-bs-toggle="tooltip"
					data-bs-trigger="hover"
					data-bs-placement="top"
					title="Report Spam">
					<i class="ri-error-warning-fill align-bottom"></i>
				</button>
				<div
					data-bs-toggle="tooltip"
					data-bs-trigger="hover"
					data-bs-placement="top"
					title="Trash">
					<button
						type="button"
						class="btn btn-ghost-secondary btn-icon btn-sm fs-16 material-shadow-none"
						aria-haspopup="dialog"
						aria-label="Remove selected items"
						aria-controls="removeItemModal">
						<i class="ri-delete-bin-5-fill align-bottom"></i>
					</button>
				</div>
			</div>
		</div>
		<div class="vr align-self-center mx-2"></div>
		<div class="dropdown">
			<button
				class="btn btn-ghost-secondary btn-icon btn-sm fs-16 material-shadow-none"
				type="button"
				data-bs-toggle="dropdown"
				aria-haspopup="true"
				aria-expanded="false">
				<i class="ri-price-tag-3-fill align-bottom"></i>
			</button>
			<div class="dropdown-menu" aria-close-on="anywhere">
				<a class="dropdown-item" href="#">Support</a>
				<a class="dropdown-item" href="#">Freelance</a>
				<a class="dropdown-item" href="#">Social</a>
				<a class="dropdown-item" href="#">Friends</a>
				<a class="dropdown-item" href="#">Family</a>
			</div>
		</div>
		<div class="dropdown">
			<button
				class="btn btn-ghost-secondary btn-icon btn-sm fs-16 material-shadow-none"
				type="button"
				data-bs-toggle="dropdown"
				aria-haspopup="true"
				aria-expanded="false">
				<i class="ri-more-2-fill align-bottom"></i>
			</button>
			<div class="dropdown-menu dropdown-menu-end" aria-close-on="anywhere">
				<a class="dropdown-item" href="#" id="mark-all-read"
					>Mark all as Read</a
				>
			</div>
		</div>
		<div
			class="alert alert-warning alert-dismissible unreadConversations-alert px-4 fade show"
			id="unreadConversations"
			role="alert">
			No Unread Conversations
		</div>
	</div>
</div>
<div class="col-auto order-2 order-sm-3">
	<div class="d-flex gap-sm-1 email-topbar-link">
		<button
			type="button"
			class="btn btn-ghost-secondary btn-icon btn-sm fs-16 material-shadow-none">
			<i class="ri-refresh-line align-bottom"></i>
		</button>
		<div class="dropdown">
			<button
				class="btn btn-ghost-secondary btn-icon btn-sm fs-16 material-shadow-none"
				type="button"
				data-bs-toggle="dropdown"
				aria-haspopup="true"
				aria-expanded="false">
				<i class="ri-more-2-fill align-bottom"></i>
			</button>
			<div class="dropdown-menu dropdown-menu-end" aria-close-on="anywhere">
				<a class="dropdown-item" href="#">Mark as Unread</a>
				<a class="dropdown-item" href="#">Mark as Important</a>
				<a class="dropdown-item" href="#">Add to Tasks</a>
				<a class="dropdown-item" href="#">Add Star</a>
				<a class="dropdown-item" href="#">Mute</a>
			</div>
		</div>
	</div>
</div>
