<div class="width:100% min-width:0 p-3">
	<section
		role="banner"
		class="position-relative">
		<div
			class="profile-wid-bg mx-n5 my-n3 height:480px@xxs&xs height:370px@sm height:300px@md&xxxl">
			<img
				src="/assets/images/profile-bg.jpg"
				alt=""
				class="profile-wid-img"
				key="cover_image" />
		</div>

		<div class="mb-4 mb-lg-3 pb-lg-4">
			<div class="d-flex flex-wrap gap-4">
				<div
					src="/components/profile-img.html"
					input.src="/assets/images/user.png"
					input-query="[src]"></div>

				<div
					class="position-relative flex-grow-1 mb-3 width:100%@xxs&xs">
					<div>
						<h3 class="text-white mb-1">
							<span key="first_name"></span>
							<span key="last_name"></span>
						</h3>
						<p
							class="text-white text-opacity-75"
							key="title"></p>
					</div>
					<div
						class="d-flex flex-wrap flex-column@xxs@xs gap-2 text-white-50">
						<div class="flex-grow:1@xxs">
							<i
								class="ri-building-line me-1 text-white text-opacity-75 fs-16 align-middle"></i
							><span key="company"></span>
						</div>
						<div>
							<i
								class="ri-map-pin-user-line me-1 text-white text-opacity-75 fs-16 align-middle"></i
							><span key="city"></span>,
							<span key="country"></span>
						</div>
					</div>
				</div>

				<div
					class="position-relative d-flex justify-content-between text text-white-50 text-center width:250px mb-2 width:100%@xxs&xs">
					<div class="p-2">
						<h4
							class="text-white mb-1"
							key="followers">
							0
						</h4>
						<p class="fs-14 mb-0">Followers</p>
					</div>

					<div class="p-2">
						<h4
							class="text-white mb-1"
							key="following">
							0
						</h4>
						<p class="fs-14 mb-0">Following</p>
					</div>
				</div>
				<!--end col-->
			</div>
			<!--end row-->
		</div>

	</section>

	<section class="pt-4 text-muted">
		<div class="d-flex flex-wrap gap-4 min-width:0">
			<div class="flex-grow-1 flex-basis:300px min-width:min(280px,100%)">
				<div src="/apps/profile/components/complete-profile.html"></div>
				<div src="/apps/profile/components/info.html"></div>
				<div src="/apps/profile/components/about.html"></div>
				<div src="/apps/profile/components/portfolio.html"></div>
				<div src="/apps/profile/components/skills.html"></div>
				<div src="/apps/profile/components/suggestions.html"></div>
				<div src="/apps/profile/components/popular-posts.html"></div>
			</div>
			<div class="flex-grow-1 flex-basis:500px min-width:min(320px,100%) max-width:100%">
				<div src="widgets/projects.html"></div>
			</div>
		</div>
	</section>
</div>
