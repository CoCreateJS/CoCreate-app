<form
	array="contacts"
	object="$user_id">
	<section
		role="banner"
		class="position-relative">
		<div
			class="profile-wid-bg mx-n5 my-n3 height:480px@xxs&xs height:370px@sm height:300px@md&xxxl">
			<img
				src="/assets/images/profile-bg.jpg"
				alt=""
				class="profile-wid-img"
				key="cover_image" />
		</div>

		<div class="mb-4 mb-lg-3 pb-lg-4">
			<div class="d-flex flex-wrap gap-4">
				<div
					src="/components/profile-img.html"
					input.src="/assets/images/user.png"
					input-query="[src]"></div>

				<div
					class="position-relative flex-grow-1 mb-3 width:100%@xxs&xs">
					<div>
						<h3 class="text-white mb-1">
							<span key="first_name"></span>
							<span key="last_name"></span>
						</h3>
						<p
							class="text-white text-opacity-75"
							key="title"></p>
					</div>
					<div
						class="d-flex flex-wrap flex-column@xxs@xs gap-2 text-white-50">
						<div class="flex-grow:1@xxs">
							<i
								class="ri-building-line me-1 text-white text-opacity-75 fs-16 align-middle"></i
							><span key="company"></span>
						</div>
						<div>
							<i
								class="ri-map-pin-user-line me-1 text-white text-opacity-75 fs-16 align-middle"></i
							><span key="city"></span>,
							<span key="country"></span>
						</div>
					</div>
				</div>

				<div
					class="position-relative d-flex justify-content-between text text-white-50 text-center width:250px mb-2 width:100%@xxs&xs">
					<div class="p-2">
						<h4
							class="text-white mb-1"
							key="followers">
							0
						</h4>
						<p class="fs-14 mb-0">Followers</p>
					</div>

					<div class="p-2">
						<h4
							class="text-white mb-1"
							key="following">
							0
						</h4>
						<p class="fs-14 mb-0">Following</p>
					</div>
				</div>
				<!--end col-->
			</div>
			<!--end row-->
		</div>

		<div class="d-flex">
			<!-- Nav tabs -->
			<ul
				class="nav nav-pills animation-nav profile-nav gap-2 gap-lg-3 flex-grow-1"
				role="tablist">
				<li class="nav-item">
					<a
						class="nav-link fs-14 active"
						role="tab"
						id="overview-tab-btn"
						aria-selected="true"
						aria-controls="overview-tab"
						tabindex="0"
						click.class="active"
						click-group="profile-tabs">
						<i class="ri-airplay-fill d-inline-block d-md-none"></i>
						<span class="d-none d-md-inline-block">Overview</span>
					</a>
				</li>
				<li class="nav-item">
					<a
						class="nav-link fs-14"
						role="tab"
						id="activities-tab-btn"
						aria-selected="false"
						aria-controls="activities"
						tabindex="0"
						click.class="active"
						click-group="profile-tabs">
						<i
							class="ri-list-unordered d-inline-block d-md-none"></i>
						<span class="d-none d-md-inline-block">Activities</span>
					</a>
				</li>
				<li class="nav-item">
					<a
						class="nav-link fs-14"
						role="tab"
						id="projects-tab-btn"
						aria-selected="false"
						aria-controls="projects"
						tabindex="0"
						click.class="active"
						click-group="profile-tabs">
						<i
							class="ri-price-tag-line d-inline-block d-md-none"></i>
						<span class="d-none d-md-inline-block">Projects</span>
					</a>
				</li>
				<li>
					<a
						class="nav-link fs-14"
						role="tab"
						id="documents-tab-btn"
						aria-selected="false"
						aria-controls="documents"
						tabindex="0"
						click.class="active"
						click-group="profile-tabs">
						<i
							class="ri-folder-4-line d-inline-block d-md-none"></i>
						<span class="d-none d-md-inline-block">Documents</span>
					</a>
				</li>
			</ul>

			<a
				role="button"
				state-to="adminView"
				state.src="/apps/profile/form.html"
				class="btn btn-success z-index:1"
				href="javascript:void(0);">
				<i class="ri-edit-box-line align-bottom"></i>
				<span class="d-none d-sm-inline-block">Edit Profile</span>
			</a>
		</div>
	</section>

	<!-- Tab panes -->
	<section class="tab-content pt-4 text-muted">
		<div
			class="tab-pane show"
			id="overview-tab"
			role="tabpanel">
			<div class="d-flex flex-wrap gap-4">
				<div
					class="flex-grow-1 width:300px max-width:420px min-width:100%@xxs&lg">
					<div
						src="/apps/profile/components/complete-profile.html"></div>
					<div src="/apps/profile/components/info.html"></div>
					<div src="/apps/profile/components/about.html"></div>
					<div src="/apps/profile/components/portfolio.html"></div>
					<div src="/apps/profile/components/skills.html"></div>
					<div src="/apps/profile/components/suggestions.html"></div>
					<div
						src="/apps/profile/components/popular-posts.html"></div>
				</div>
				<div class="flex-grow-1 width:500px">
					<!-- <div class="col-lg-12" src="/apps/activities/index.html"></div> -->
					<div
						class="col-lg-12"
						src="widgets/projects.html"></div>
				</div>
			</div>
		</div>
		<div
			class="tab-pane fade"
			id="activities"
			role="tabpanel"
			src="/apps/activities/index.html"></div>
		<!--end tab-pane-->
		<div
			class="tab-pane fade"
			id="projects"
			role="tabpanel"
			src="/apps/projects/profile-list.html"></div>
		<!--end tab-pane-->
		<div
			class="tab-pane fade"
			id="documents"
			role="tabpanel"
			src="/apps/file-manager/list.html"></div>
		<!--end tab-pane-->
	</section>
	<!--end tab-content-->
</form>
