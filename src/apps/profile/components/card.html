<div class="app-heading">
	<div class="d-flex align-items-center gap-3 min-width:0">
		<img
			class="app-avatar rounded-circle object-fit-cover flex-shrink-0"
			src="/assets/images/user.jpg"
			key="avatar"
			alt="Profile photo"
			onload="this.hidden = false"
			onerror="this.hidden = true" />
		<div class="min-width:0">
			<h5 class="app-title mb-0 text-break">
				<span key="first_name"></span> <span key="last_name"></span>
			</h5>
		</div>
	</div>
</div>
<p
	class="text-muted mb-0"
	key="title"></p>
<div class="d-flex flex-wrap gap-2 text-muted">
	<span
		><i
			src="/assets/svg/remix/building-line.svg"
			class="me-1"
			aria-hidden="true"></i
		><span key="company"></span
	></span>
	<span
		><i
			src="/assets/svg/remix/map-pin-user-line.svg"
			class="me-1"
			aria-hidden="true"></i
		><span key="city"></span>, <span key="country"></span
	></span>
</div>
