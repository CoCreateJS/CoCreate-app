<div
	class="tab-pane active"
	id="personalDetails"
	role="tabpanel"
	aria-labelledby="personalDetails-tab">
	<div class="app-fields d-flex flex-wrap gap-3">
		<div class="app-field app-field-half">
			<label
				for="first_nameInput"
				class="form-label"
				>First Name</label
			>
			<input
				type="text"
				class="form-control"
				id="first_nameInput"
				placeholder="Enter your first_name"
				key="first_name"
				aria-label="First Name"
				autocomplete="given-name" />
		</div>
		<div class="app-field app-field-half">
			<label
				for="last_nameInput"
				class="form-label"
				>Last Name</label
			>
			<input
				type="text"
				class="form-control"
				id="last_nameInput"
				placeholder="Enter your last_name"
				key="last_name"
				aria-label="Last Name"
				autocomplete="family-name" />
		</div>
		<div class="app-field app-field-half">
			<label
				for="phonenumberInput"
				class="form-label"
				>Phone Number</label
			>
			<input
				type="text"
				class="form-control"
				id="phonenumberInput"
				placeholder="Enter your phone number"
				key="phone_number"
				aria-label="Phone Number"
				autocomplete="tel" />
		</div>
		<div class="app-field app-field-half">
			<label
				for="emailInput"
				class="form-label"
				>Email Address</label
			>
			<input
				type="email"
				class="form-control"
				id="emailInput"
				placeholder="Enter your email"
				key="email"
				aria-label="Email Address"
				autocomplete="email" />
		</div>
		<div class="app-field app-field-full">
			<label
				for="JoiningdatInput"
				class="form-label"
				>Joining Date</label
			>
			<input
				type="text"
				class="form-control"
				date-picker="flatpickr"
				id="JoiningdatInput"
				data-date-format="d M, Y"
				data-deafult-date="24 Nov, 2021"
				placeholder="Select date"
				key="created.on"
				aria-label="Joining Date"
				autocomplete="off" />
		</div>
		<div class="app-field app-field-full">
			<label
				for="skillsInput"
				class="form-label"
				>Skills</label
			>
			<select
				class="form-control"
				name="skillsInput"
				plugin='{"$Choices":["$this",{}]}'
				data-choices-text-unique-true
				multiple
				id="skillsInput"
				key="skills[]"
				aria-label="Skills">
				<option value="illustrator">Illustrator</option>
				<option value="photoshop">Photoshop</option>
				<option value="css">CSS</option>
				<option value="html">HTML</option>
				<option
					value="javascript"
					selected>
					Javascript
				</option>
				<option value="python">Python</option>
				<option value="php">PHP</option>
			</select>
		</div>
		<div class="app-field app-field-half">
			<label
				for="companyNameInput"
				class="form-label"
				>Company Name</label
			>
			<input
				type="text"
				class="form-control"
				id="companyNameInput"
				placeholder="Company Name"
				key="company"
				aria-label="Company Name"
				autocomplete="organization" />
		</div>
		<div class="app-field app-field-half">
			<label
				for="titleInput"
				class="form-label"
				>Title</label
			>
			<input
				type="text"
				class="form-control"
				id="titleInput"
				placeholder="Title"
				key="title"
				aria-label="Title"
				autocomplete="organization-title" />
		</div>
		<div class="app-field app-field-half">
			<label
				for="websiteInput1"
				class="form-label"
				>Website</label
			>
			<input
				type="text"
				class="form-control"
				id="websiteInput1"
				placeholder="www.example.com"
				key="website"
				aria-label="Website"
				autocomplete="url" />
		</div>
		<div class="app-field app-field-third">
			<label
				for="cityInput"
				class="form-label"
				>City</label
			>
			<input
				type="text"
				class="form-control"
				id="cityInput"
				placeholder="City"
				key="city"
				aria-label="City"
				autocomplete="address-level2" />
		</div>
		<div class="app-field app-field-third">
			<label
				for="countryInput"
				class="form-label"
				>Country</label
			>
			<input
				type="text"
				class="form-control"
				id="countryInput"
				placeholder="Country"
				key="country"
				aria-label="Country"
				autocomplete="country" />
		</div>
		<div class="app-field app-field-third">
			<label
				for="zipcodeInput"
				class="form-label"
				>Zip Code</label
			>
			<input
				type="text"
				class="form-control"
				minlength="5"
				maxlength="6"
				id="zipcodeInput"
				placeholder="Enter zipcode"
				key="zip_code"
				aria-label="Zip Code"
				autocomplete="postal-code" />
		</div>
		<div class="app-field app-field-full">
			<div class="mb-3 pb-2">
				<label
					for="exampleFormControlTextarea"
					class="form-label"
					>Description</label
				>
				<textarea
					class="form-control"
					id="exampleFormControlTextarea"
					placeholder="Enter your description"
					rows="3"
					key="description"
					aria-label="Description"></textarea>
			</div>
		</div>
	</div>
</div>
