<div
	id="profile-aside"
	class="offcanvas-app-shell app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	role="region"
	aria-label="Profile record">
	<header
		src="/components/offcanvas-app/header.html"
		value-replace="/\{\{app\.name\}\}/g"
		value-replacement="Profile"
		value-type="outerHtml"></header>
	<div
		class="component-form-body flex-grow-1 min-height:0"
		onload.plugin='({"$SimpleBar": ["$this", {}]})'
		onload-query=".offcanvas-app-view > form > .card-body[]">
		<div
			id="Profile-details-view"
			class="offcanvas-app-view"
			data-view="details"
			role="tabpanel"
			aria-labelledby="Profile-details-btn"
			tabindex="0"
			src="/apps/profile/components/details.html"
			aria-hidden="false"
			state-id="profile-details"
			state.aria-hidden
			hidden></div>
		<div
			id="Profile-form-view"
			class="offcanvas-app-view"
			data-view="form"
			role="tabpanel"
			aria-labelledby="Profile-form-btn"
			tabindex="0"
			src="/apps/profile/components/form.html"
			aria-hidden="true"
			state-id="profile-form"
			state.aria-hidden
			hidden></div>
		<div
			id="Profile-codearea-view"
			class="offcanvas-app-view"
			data-view="codearea"
			role="tabpanel"
			aria-labelledby="Profile-codearea-btn"
			tabindex="0"
			src="/components/offcanvas-app/codearea.html"
			aria-hidden="true"
			state-id="profile-codearea"
			state.aria-hidden
			hidden></div>
	</div>
</div>
