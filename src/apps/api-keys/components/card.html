<div class="app-heading">
	<div class="app-identity">
		<span class="avatar-sm app-card-icon flex-shrink-0 app-identity-image">
			<span class="avatar-title bg-primary-subtle text-primary rounded-circle">
				<i src="/assets/svg/remix/key-line.svg" aria-hidden="true"></i>
			</span>
		</span>
		<div class="min-width:0">
			<h5 class="app-title mb-0 text-capitalize text-break" key="name"></h5>
		</div>
	</div>
	<div class="app-badges">
		<span
			class="badge text-capitalize"
			aria-label="Type" key="type" data-value input.data-value="$value"></span>
		<span
			class="badge text-capitalize"
			role="status"
			aria-label="API key status" key="status" data-value input.data-value="$value"></span>
	</div>
</div>
<p class="text-muted mb-0 text-break line-clamp:2" key="description"></p>
