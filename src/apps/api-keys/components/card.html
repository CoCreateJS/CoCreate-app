<div class="app-heading">
	<div class="d-flex align-items-start gap-3 min-width:0">
		<span class="avatar-sm app-card-icon flex-shrink-0">
			<span class="avatar-title bg-primary-subtle text-primary rounded-circle">
				<i class="ri-key-line" aria-hidden="true"></i>
			</span>
		</span>
		<div class="min-width:0">
			<h5 class="app-title mb-0 text-capitalize text-break" key="name"></h5>
		</div>
	</div>
	<div class="app-badges">
		<span
			class="badge border border-primary text-primary text-capitalize"
			aria-label="Type" key="type"></span>
		<span
			class="badge border border-success text-success text-capitalize"
			role="status"
			aria-label="API key status" key="status"></span>
	</div>
</div>
<p class="text-muted mb-0 text-break line-clamp:2" key="description"></p>
