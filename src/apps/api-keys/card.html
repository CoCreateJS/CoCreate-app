<article class="card mb-0">
	<div class="card-body d-flex flex-column gap-3">
		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="d-flex align-items-center gap-3 min-width:0">
				<div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0">
					<div class="avatar-title bg-warning-subtle text-warning material-shadow">
						<i class="ri-key-line fs-4"></i>
					</div>
				</div>
				<div class="min-width:0">
					<h5 class="mb-1 text-truncate" key="name"></h5>
					<span class="badge bg-primary-subtle text-primary text-uppercase" key="type"></span>
				</div>
			</div>
			<span class="badge bg-success-subtle text-success text-capitalize" key="status"></span>
		</div>
		<p class="text-muted mb-0 line-clamp:2" key="description"></p>
		<div class="d-flex align-items-center justify-content-between gap-3 pt-2 border-top border-top-dashed">
			<span class="text-muted fs-12">Credential</span>
			<span class="text-muted font-monospace" aria-label="API key hidden">●●●●●●●●●●●●</span>
		</div>
	</div>
</article>
