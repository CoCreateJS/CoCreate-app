<article
	class="card flex-grow-1 mb-0 app-card app-with-image"
	style="flex-basis: 320px; min-width: min(280px, 100%); max-width: 460px"
	template
	role="row" aria-selected="false"
	array="{{object.$array[0]}}"
	object="{{object._id}}"
	read="false">
	<div class="card-body d-flex flex-column gap-3 text-reset">
		<div class="app-heading">
			<div class="d-flex align-items-start gap-3 min-width:0">
				<span class="avatar-sm app-card-icon flex-shrink-0">
					<span class="avatar-title bg-primary-subtle text-primary rounded-circle">
						<i src="/assets/svg/remix/key-line.svg" aria-hidden="true"></i>
					</span>
				</span>
				<div class="min-width:0">
					<h5 class="app-title mb-0 text-capitalize text-break">
						<a
							class="text-reset text-decoration-none"
							role="button"
							tabindex="0"
							state-to="offcanvas-app-view"
							state.src="/apps/api-keys/app.html"
							aria-controls="offcanvas-app"
							aria-haspopup="dialog"
							aria-expanded="false"
							aria-label="Open API key {{object.name}}"
							aria-open
							><span
								hidden
								state-to="offcanvas-app-form"
								state.array="keys"
								state.object="{{object._id}}"></span>
							{{object.name}}
						</a>
					</h5>
				</div>
			</div>
			<div class="app-badges">
				<span
					class="badge border border-primary text-primary text-capitalize"
					aria-label="Type">{{object.type}}</span>
				<span
					class="badge border border-success text-success text-capitalize"
					role="status"
					aria-label="API key status">{{object.status}}</span>
			</div>
		</div>
		<p class="text-muted mb-0 text-break line-clamp:2">
			{{object.description}}
		</p>
	</div>
</article>
<div
	onload.array="keys"
	onload-query="$parent"></div>
