<article class="card flex-grow-1 mb-0" style="flex-basis:320px;min-width:min(280px,100%);max-width:460px" template>
	<a class="card-body d-flex flex-column gap-3 text-reset" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/api-keys/form.html" aria-controls="offcanvas-app" aria-open>
		<div state-to="offcanvas-app-form" state.array="keys" state.object="{{object._id}}"></div>
		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="d-flex align-items-center gap-3 min-width:0">
				<div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0">
					<div class="avatar-title bg-warning-subtle text-warning material-shadow">
						<i class="ri-key-line fs-4"></i>
					</div>
				</div>
				<div class="min-width:0">
					<h5 class="mb-1 text-truncate">{{object.name}}</h5>
					<span class="badge bg-primary-subtle text-primary text-uppercase">{{object.type}}</span>
				</div>
			</div>
			<span class="badge bg-success-subtle text-success text-capitalize">{{object.status}}</span>
		</div>
		<p class="text-muted mb-0 line-clamp:2">{{object.description}}</p>
		<div class="d-flex align-items-center justify-content-between gap-3 pt-2 border-top border-top-dashed">
			<span class="text-muted fs-12">Credential</span>
			<span class="text-muted font-monospace" aria-label="API key hidden">●●●●●●●●●●●●</span>
		</div>
	</a>
</article>
<div onload.array="keys" onload-query="$parent"></div>
