<div class="container-fluid">
	<div class="d-flex gap-4" style="overflow-x: hidden">
		<div class="flex-grow-1" style="min-width: 300px">
			<div id="job-view" src="components/table.html"></div>
			<template
				observe-target="#table-view td[field='']"
				observe-query="$document tda[]"
				observe-insert-adjacent="afterbegin">
			</template>
			<!-- Filters Offcanvas -->
			<div src="components/filters.html"></div>
		</div>
		<form
			id="offcanvas-app"
			state-id="offcanvas-app"
			state-overwrite
			array="job"
			view="details"
			class="offcanvas offcanvas-end flex-grow-1 card apps-view-right mb-0"
			tabindex="-1"
			aria-labelledby="offcanvas-app-label"
			role="dialog"
			aria-close-on="button">
			<div
				class="card-header text-center border-bottom-0"
				src="components/offcanvas-header.html"></div>
			<div class="card-body" plugin='{"SimpleBar": ["$this", {}]}'>
				<div
					id="detail-view"
					src="/apps/job/details.html"></div>
				<div
					id="form-view"
					src="/apps/job/form.html"></div>
			</div>
		</form>
	</div>
</div>
<!-- container-fluid -->
