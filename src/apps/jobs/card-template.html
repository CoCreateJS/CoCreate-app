<article class="card flex-grow-1 mb-0" style="flex-basis:320px;min-width:min(280px,100%);max-width:460px" template><a class="card-body d-flex flex-column gap-3 text-reset" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/jobs/details.html" aria-controls="offcanvas-app" aria-open><div state-to="offcanvas-app-form" state.array="jobPosts" state.object="{{object._id}}"></div><div class="d-flex align-items-start justify-content-between gap-3"><div class="d-flex align-items-center gap-3 min-width:0"><div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0"><div class="avatar-title bg-info-subtle text-info"><i class="ri-briefcase-2-line fs-4"></i></div></div><div class="min-width:0"><h5 class="mb-1 text-truncate">{{object.jobTitle}}</h5><span class="text-muted fs-12">{{object.companyName}}</span></div></div><span class="badge bg-success-subtle text-success text-capitalize">{{object.status}}</span></div><p class="text-muted mb-0 line-clamp:2">{{object.description}}</p><div class="d-flex flex-wrap gap-3"><div><span class="text-muted fs-12 d-block">Type</span><strong>{{object.type}}</strong></div><div><span class="text-muted fs-12 d-block">Experience</span><strong>{{object.experience}}</strong></div><div><span class="text-muted fs-12 d-block">Position</span><strong>{{object.position}}</strong></div></div><div class="d-flex flex-column gap-2 text-muted fs-12"><span><i class="ri-map-pin-line me-2"></i>{{object.location}}</span><span><i class="ri-money-dollar-circle-line me-2"></i>{{object.start_salary}}–{{object.last_salary}}</span></div><div class="d-flex justify-content-between pt-2 border-top border-top-dashed text-muted fs-12"><span>Closes: {{object.close_date}}</span><strong>{{object.applied}}</strong></div></a></article><div onload.array="jobPosts" onload-query="$parent"></div>
