<article
	template
	class="card flex-grow-1 mb-0 app-card app-with-image"
	style="flex-basis: 320px; min-width: min(280px, 100%); max-width: 460px" role="row" aria-selected="false" array="{{object.$array[0]}}" object="{{object._id}}" read="false">

	<div class="card-body d-flex flex-column gap-3 text-reset">

		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="d-flex align-items-center gap-3 min-width:0">
				<div
					class="avatar-sm rounded-circle position-relative overflow-hidden flex-shrink-0">
					<div
						class="avatar-title bg-secondary-subtle text-secondary">
						<span class="avatar-initial">{{object.first_name[0]}}</span>
						<span class="avatar-initial">{{object.last_name[0]}}</span>
						<img
							class="position-absolute object-fit-cover"
							src="{{object.avatar[0].src}}"
							alt="{{object.name}}"
							width="100%"
							height="100%"
							onerror="
								this.onerror = null;
								this.src = '/assets/images/transparent.png';
							" />
					</div>
				</div>
				<div class="min-width:0">
					<h5 class="text-truncate app-title mb-1"><a
	 class="text-reset text-decoration-none"
		role="button"
		tabindex="0"
		state-to="offcanvas-app-view"
		state.src="/apps/contacts/app.html"
		aria-controls="offcanvas-app"
		aria-haspopup="dialog"
		aria-expanded="false"
		aria-open><span
			state-to="offcanvas-app-form"
			state.array="contacts"
			state.object="{{object._id}}" hidden></span>{{object.name}}</a></h5>
					<span class="text-muted d-block text-truncate">
						<span>{{object.title}}</span>
						<span aria-hidden="true"> · </span>
						<span>{{object.company}}</span>
					</span>
				</div>
			</div>
			<span
			class="badge border border-success text-success text-capitalize">{{object.status}}</span>
		</div>
		<div>
			<p
				class="text-muted mb-1 line-clamp:2">{{object.description}}</p>
		</div>
		<div class="d-flex flex-column gap-2 text-muted fs-12">
			<span><i src="/assets/svg/remix/mail-line.svg" class="me-2"></i>{{object.email}}</span>
			<span><i src="/assets/svg/remix/phone-line.svg" class="me-2"></i>{{object.phone}}</span>
			<span>
				<i src="/assets/svg/remix/map-pin-line.svg" class="me-2"></i>{{object.city}}, {{object.country}}
			</span>
		</div>
		<div
			class="d-flex flex-wrap gap-1 pt-2 border-top border-top-dashed"
			array="contacts"
			object="{{object._id}}"
			key="type"
			render-query="[template='contact-card-type']">
			<span
				template="contact-card-type"
				class="badge border border-info text-info"
				>{{type}}</span
			>
		</div>
		<div
			class="d-flex flex-wrap gap-1"
			array="contacts"
			object="{{object._id}}"
			key="tags"
			render-query="[template='contact-card-tag']">
			<span
				template="contact-card-tag"
				class="badge border border-secondary text-secondary"
				>{{tags}}</span
			>
		</div>
	</div>
</article>
<div onload.array="contacts" onload-query="$parent"></div>
