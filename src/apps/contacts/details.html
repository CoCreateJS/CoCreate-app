<form
	class="app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	data-component-form
	array
	object
	autocomplete="off">
	<header
		class="card-header offcanvas-app-topbar flex-shrink-0"
		src="/apps/contacts/header.html"
		aria-label="Details controls"></header>

	<div
		class="component-form-body flex-grow-1 min-height:0"
		plugin='{"$SimpleBar": ["$this", {}]}'>
		<div
			class="card-body d-flex flex-wrap gap-4"
			aria-label="Contact Information Container">
			<div
				class="flex-shrink-0 d-flex flex-column align-items-center width:100%">
				<img
					src="/assets/images/users.jpg"
					key="avatar[0].src"
					alt="Contact Avatar"
					class="avatar-xl rounded-circle img-thumbnail material-shadow"
					onerror="
						this.onerror = null;
						this.src = '/assets/images/user.jpg';
					" />

				<h5
					class="mt-4 mb-1"
					key="name"
					aria-label="Contact Name"></h5>
				<p
					class="text-muted"
					key="company"
					aria-label="Contact Company"></p>
				<ul
					class="list-inline mb-0 d-flex gap-2 mt-3"
					aria-label="Contact Actions">
					<li class="avatar-xs">
						<a
							href=""
							key="phone"
							input.href="$value"
							value-prefix="tel:"
							value=""
							class="avatar-title bg-success-subtle text-success fs-15 rounded"
							aria-label="Call Contact">
							<i class="ri-phone-line"></i>
						</a>
					</li>
					<li class="avatar-xs">
						<a
							href=""
							key="email"
							input.href="$value"
							value-prefix="mailto:"
							value=""
							class="avatar-title bg-danger-subtle text-danger fs-15 rounded"
							aria-label="Email Contact">
							<i class="ri-mail-line"></i>
						</a>
					</li>
					<li class="avatar-xs">
						<a
							href=""
							key="phone"
							input.href="$value"
							value-prefix="sms:"
							value=""
							class="avatar-title bg-warning-subtle text-warning fs-15 rounded"
							aria-label="Text Contact">
							<i class="ri-question-answer-line"></i>
						</a>
					</li>
				</ul>
			</div>
			<div
				class="flex-grow-1"
				style="flex-basis: 0; min-width: 0">
				<h6
					class="text-muted text-uppercase fw-semibold mb-3"
					aria-label="Personal Information Section">
					Personal Information
				</h6>
				<p
					class="text-muted mb-4"
					key="description"
					aria-describedby="personal-info-heading"></p>
				<div class="d-flex flex-wrap gap-3">
					<div class="flex-grow-1 flex-basis:150px min-width:140px">
						<div class="text-muted mb-1">Name</div>
						<div
							class="fw-medium"
							key="name"
							aria-label="Contact Name"></div>
					</div>
					<div class="flex-grow-1 flex-basis:150px min-width:140px">
						<div class="text-muted mb-1">Email</div>
						<div
							class="fw-medium"
							key="email"
							aria-label="Contact Email"></div>
					</div>
					<div class="flex-grow-1 flex-basis:150px min-width:140px">
						<div class="text-muted mb-1">Phone</div>
						<div
							class="fw-medium"
							key="phone"
							aria-label="Contact Phone"></div>
					</div>
					<div class="flex-grow-1 flex-basis:150px min-width:140px">
						<div class="text-muted mb-1">Tags</div>
						<div
							class="d-flex flex-wrap gap-1"
							key="tags"
							render-query="[template]"
							aria-label="Contact Tags">
							<span
								template
								class="badge bg-primary-subtle text-primary"
								>{{tags}}</span
							>
						</div>
					</div>
				</div>
			</div>
			<div
				class="w-100"
				src="components/activities.html"
				aria-label="Contact Activities Section"></div>
		</div>
	</div>
</form>
