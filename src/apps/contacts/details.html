<form
	class="card mb-0"
	array="contacts"
	object
	state-id="offcanvas-app-form"
	state-overwrite>
	<div
		class="card-header text-center border-bottom-0"
		input-query=".form-view-btn[]"
		input.state.src="/apps/contacts/form.html"
		src="components/offcanvas-header.html"
		aria-label="Contact Details Header"></div>
	<div
		class="form-container"
		plugin='{"$SimpleBar": ["$this", {}]}'
		aria-label="Contact Information Container">
		<div class="card-body d-flex flex-wrap gap-4">
			<div
				class="flex-shrink-0 d-flex flex-column align-items-center width:100% m-2">
				<img
					src="/assets/images/users.jpg"
					key="avatar[0].src"
					alt="Contact Avatar"
					class="avatar-xl rounded-circle img-thumbnail material-shadow"
					onerror="
						this.onerror = null;
						this.src = '../assets/images/user.jpg';
					" />

				<h5
					class="mt-4 mb-1"
					key="name"
					aria-label="Contact Name"></h5>
				<p
					class="text-muted"
					key="company"
					aria-label="Contact Company"></p>
				<ul
					class="list-inline mb-0 d-flex gap-2 mt-3"
					aria-label="Contact Actions">
					<li class="avatar-xs">
						<a
							href=""
							key="phone"
							input.href="$value"
							value-prefix="tel:"
							value=""
							class="avatar-title bg-success-subtle text-success fs-15 rounded"
							aria-label="Call Contact">
							<i class="ri-phone-line"></i>
						</a>
					</li>
					<li class="avatar-xs">
						<a
							href=""
							key="email"
							input.href="$value"
							value-prefix="mailto:"
							value=""
							class="avatar-title bg-danger-subtle text-danger fs-15 rounded"
							aria-label="Email Contact">
							<i class="ri-mail-line"></i>
						</a>
					</li>
					<li class="avatar-xs">
						<a
							href=""
							key="phone"
							input.href="$value"
							value-prefix="sms:"
							value=""
							class="avatar-title bg-warning-subtle text-warning fs-15 rounded"
							aria-label="Text Contact">
							<i class="ri-question-answer-line"></i>
						</a>
					</li>
				</ul>
			</div>
			<div
				class="flex-grow-1"
				style="flex-basis: 0; min-width: 300px">
				<h6
					class="text-muted text-uppercase fw-semibold mb-3"
					aria-label="Personal Information Section">
					Personal Information
				</h6>
				<p
					class="text-muted mb-4"
					key="description"
					aria-describedby="personal-info-heading"></p>
				<div class="table-responsive table-card">
					<table
						class="table table-borderless mb-0"
						aria-label="Contact Details Table">
						<tbody>
							<tr>
								<td
									class="fw-medium"
									scope="row">
									Name
								</td>
								<td
									key="name"
									aria-label="Contact Name"></td>
							</tr>
							<tr>
								<td
									class="fw-medium"
									scope="row">
									Email
								</td>
								<td
									key="email"
									aria-label="Contact Email"></td>
							</tr>
							<tr>
								<td
									class="fw-medium"
									scope="row">
									Phone
								</td>
								<td
									key="phone"
									aria-label="Contact Phone"></td>
							</tr>
							<tr>
								<td
									class="fw-medium"
									scope="row">
									Lead Score
								</td>
								<td
									key="lead_score"
									aria-label="Contact Lead Score"></td>
							</tr>
							<tr>
								<td
									class="fw-medium"
									scope="row">
									Tags
								</td>
								<td aria-label="Contact Tags">
									<span
										key="tags"
										render-query="[template]">
										<span
											template
											class="badge bg-primary-subtle text-primary me-1"
											>{{tags}}</span
										>
									</span>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
			<div
				class="w-100"
				src="components/activities.html"
				aria-label="Contact Activities Section"></div>
		</div>
	</div>
</form>
