<article
	class="card flex-grow-1 mb-0"
	style="flex-basis: 320px; min-width: min(280px, 100%)"
	template>
	<a
		class="card-body d-flex flex-column gap-3 text-reset"
		role="button"
		tabindex="0"
		state-to="offcanvas-app-view"
		state.src="/apps/blog/details.html"
		aria-controls="offcanvas-app"
		aria-open
		><div
			state-to="offcanvas-app-form"
			state.array="posts"
			state.object="{{object._id}}"></div>
		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="d-flex align-items-center gap-3 min-width:0">
				<div
					class="avatar-sm rounded-circle overflow-hidden flex-shrink-0">
					<div class="avatar-title bg-primary-subtle text-primary">
						<i class="ri-rss-line fs-4"></i>
					</div>
				</div>
				<div class="min-width:0">
					<h5 class="mb-1 text-truncate">{{object.title}}</h5>
					<span class="text-muted fs-12">By {{object.author}}</span>
				</div>
			</div>
			<span class="badge bg-success-subtle text-success text-capitalize"
				>{{object.publish_status}}</span
			>
		</div>
		<p class="text-muted mb-0 line-clamp:2">{{object.caption}}</p>
		<div
			class="d-flex justify-content-between pt-2 border-top border-top-dashed text-muted fs-12">
			<span>Published: {{object.publish_date}}</span
			><span
				><i class="ri-map-pin-line me-1"></i>{{object.location}}</span
			>
		</div></a
	>
</article>
<div
	hidden
	onload.array="posts"
	onload-query="$parent"></div>
