<form
	state-id="offcanvas-app-form"
	class="app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	data-component-form
	array
	object
	autocomplete="off">
	<header
		class="card-header offcanvas-app-topbar flex-shrink-0"
		src="/apps/blog/header.html"
		aria-label="Details controls"></header>

	<div
		class="component-form-body flex-grow-1 min-height:0"
		plugin='{"$SimpleBar": ["$this", {}]}'>
		<div class="card-body d-flex flex-column gap-4">
			<img
				src="/assets/images/blog/overview.jpg"
				key="image"
				alt="Blog featured image"
				class="width:100% max-height:360px object-fit-cover rounded"
				onerror="
					this.onerror = null;
					this.src = '/assets/images/blog/overview.jpg';
				" />

			<header class="d-flex flex-column gap-2">
				<div class="d-flex flex-wrap align-items-center gap-2">
					<span
						class="badge bg-primary-subtle text-primary"
						key="category"></span>
					<span class="text-muted" key="author"></span>
				</div>
				<h3 class="mb-0" key="title" aria-label="Blog title"></h3>
				<p class="text-muted mb-0" key="post-summary" aria-label="Blog summary"></p>
			</header>

			<section class="border-top border-top-dashed pt-3">
				<div key="content" value-type="html" aria-label="Blog content"></div>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<h5 class="text-uppercase fw-semibold mb-3">Post details</h5>
				<div class="d-flex flex-wrap gap-3">
					<div class="flex-grow-1 flex-basis:180px min-width:160px">
						<div class="text-muted mb-1">Slug</div>
						<div key="slug"></div>
					</div>
					<div class="flex-grow-1 flex-basis:180px min-width:160px">
						<div class="text-muted mb-1">Comments</div>
						<div key="comments.state"></div>
					</div>
					<div class="flex-grow-1 flex-basis:180px min-width:160px">
						<div class="text-muted mb-1">Meta title</div>
						<div key="meta-title"></div>
					</div>
				</div>
			</section>
		</div>
	</div>
</form>
