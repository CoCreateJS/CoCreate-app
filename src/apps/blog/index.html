<div class="container-fluid">
	<div
		class="d-flex gap-4"
		style="overflow-x: hidden">
		<div
			class="flex-grow-1"
			style="min-width: 300px">
			<div
				id="blog-view"
				src="components/table.html"></div>
			<template
				observe-target="#table-view td[field='']"
				observe-query="$document tda[]"
				observe-insert-adjacent="afterbegin">
			</template>
			<!-- Filters Offcanvas -->
			<div src="components/filters.html"></div>
		</div>
		<form
			id="offcanvas-app"
			state-id="offcanvas-app"
			array="blog"
			view="details"
			class="app-panel offcanvas offcanvas-end flex-grow-1 apps-view-right"
			tabindex="-1"
			aria-labelledby="offcanvas-app-label"
			role="dialog"
			aria-close-on="button">
			<div
				class="card-header text-center border-bottom-0"
				src="components/offcanvas-header.html"></div>
			<div
				class="card-body"
				plugin='{"$SimpleBar": ["$this", {}]}'>
				<div
					id="detail-view"
					src="/apps/blog/details.html"></div>
				<div
					id="form-view"
					src="/apps/blog/form.html"></div>
			</div>
		</form>
	</div>
</div>
<!-- container-fluid -->
