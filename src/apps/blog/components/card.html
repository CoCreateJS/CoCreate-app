
<article class="app-card card mb-0">
	<div class="card-body d-flex flex-column gap-3">
		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="app-identity">
				<div
					class="avatar-sm rounded-circle overflow-hidden flex-shrink-0 app-identity-image">
					<div class="avatar-title bg-primary-subtle text-primary">
						<i src="/assets/svg/remix/rss-line.svg" class="fs-4"></i>
					</div>
				</div>
				<div class="min-width:0">
					<h5
						class="mb-1 text-truncate app-title"
						key="title"></h5>
					<span class="text-muted fs-12"
						>By <span key="author"></span
					></span>
				</div>
			</div>
			<span
				class="badge text-capitalize"
				key="publish_status" data-value input.data-value="$value"></span>
		</div>
		<p
			class="text-muted mb-0 line-clamp:2"
			key="caption"></p>
		<div
			class="d-flex justify-content-between pt-2 border-top border-top-dashed text-muted fs-12">
			<span>Published: <span key="publish_date"></span></span
			><span
				><i src="/assets/svg/remix/map-pin-line.svg" class="me-1"></i><span key="location"></span
			></span>
		</div>
	</div>
</article>
