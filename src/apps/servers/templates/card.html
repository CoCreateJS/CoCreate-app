<article class="card flex-grow-1 mb-0 app-card app-with-image" style="flex-basis:320px;min-width:min(280px,100%);max-width:460px" template role="row" aria-selected="false" array="{{object.$array[0]}}" object="{{object._id}}" read="false">
	<div class="card-body d-flex flex-column gap-3 text-reset">
		<div class="app-heading">
			<div class="d-flex align-items-center gap-3 min-width:0">
				<span class="app-provider-reference" src="/apps/apis/components/provider-icon.html"></span>
				<div class="min-width:0">
					<h5 class="app-title mb-0 text-break"><a class="text-reset text-decoration-none" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/servers/app.html" aria-controls="offcanvas-app" aria-haspopup="dialog" aria-expanded="false" aria-open><span state-to="offcanvas-app-form" state.array="servers" state.object="{{object._id}}" hidden></span>{{object.name}}</a></h5>
				</div>
			</div>
			<div class="app-badges">
				<span class="badge border border-success text-success text-capitalize" role="status">{{object.status}}</span>
			</div>
		</div>
		<code class="fs-12 text-break">{{object.host}}</code>
		<div class="d-flex flex-wrap gap-3">
			<div><span class="text-muted fs-12 d-block">Region</span><strong>{{object.infrastructure.region}}</strong></div>
			<div><span class="text-muted fs-12 d-block">Zone</span><strong>{{object.infrastructure.zone}}</strong></div>
		</div>
		<div class="d-flex flex-column gap-2 text-muted fs-12">
			<span><i src="/assets/svg/remix/cpu-line.svg" class="me-2" aria-hidden="true"></i><span>{{object.infrastructure.vmType}}</span></span>
			<span><i src="/assets/svg/remix/map-pin-line.svg" class="me-2" aria-hidden="true"></i><span>{{object.location.city}}</span>, <span>{{object.location.country}}</span></span>
		</div>
		<div class="d-flex flex-wrap justify-content-between gap-2 pt-2 border-top border-top-dashed" style="margin-top: auto">
			<span class="text-muted fs-12">Master: <strong class="text-capitalize">{{object.master.status}}</strong></span>
			<span class="text-muted fs-12">Workers: <strong>{{object.totalWorkers}}</strong></span>
		</div>
	</div>
</article>
<div onload.array="servers" onload-query="$parent"></div>
