<article
	class="card flex-grow-1 mb-0 app-card app-with-image"
	style="flex-basis:320px;min-width:min(280px,100%);max-width:460px"
	template data-select-card array="{{object.$array[0]}}" object="{{object._id}}" read="false">

	<div class="card-body d-flex align-items-center gap-3"><span class="avatar-sm app-card-icon flex-shrink-0"><span class="avatar-title bg-primary-subtle text-primary rounded-circle"><i src="/assets/svg/remix/instance-line.svg" aria-hidden="true"></i></span></span>

		<div class="min-width:0">
			<h5 class="text-truncate app-title mb-1">{{object.name}}</h5>
			<p class="mb-0 text-muted text-truncate">{{object.description}}</p>
		</div>
	</div>
</article>
