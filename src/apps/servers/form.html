<form
    class="card mb-0"
    array="apis"
    object
    state-id="offcanvas-app-form"
    state-overwrite>

    <div
        class="card-header text-center border-bottom-0"
        input-query=".details-view-btn[]"
        input.state.src="/apps/apis/details.html"
        src="components/offcanvas-header.html"
        aria-label="API Form Header"></div>

    <div class="form-container" plugin='{"$SimpleBar": ["$this", {}]}'>
        <div class="card-body d-flex flex-wrap gap-4">

            <!-- Dynamic Integration Identity Placeholder Icon -->
            <div class="text-center w-100 mb-2">
                <div class="avatar-lg rounded-circle d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary material-shadow fs-24 m-auto" style="width: 80px; height: 80px;">
                    <i class="ri-key-2-line"></i>
                </div>
                <p class="text-muted mt-2 fs-13">Configure Integration Credentials</p>
            </div>

            <label class="form-label w-100" id="provider-name-label">
                Provider Name
                <input
                    type="text"
                    id="api-name"
                    key="name"
                    name="name"
                    class="form-control text-capitalize"
                    placeholder="e.g. stripe, twilio, openai"
                    required
                    aria-labelledby="provider-name-label" />
            </label>

            <label class="form-label w-100" id="endpoint-label">
                Base URL / Endpoint
                <input
                    type="url"
                    id="api-url"
                    key="url"
                    name="url"
                    class="form-control text-lowercase"
                    placeholder="https://api.provider.com/v1"
                    required
                    aria-labelledby="endpoint-label" />
            </label>

            <label class="form-label w-100" id="secret-key-label">
                Signing Key / API Secret Token
                <div class="input-group">
                    <input
                        type="password"
                        id="api-key"
                        key="key"
                        name="key"
                        class="form-control"
                        placeholder="sk_live_..."
                        required
                        aria-labelledby="secret-key-label" />
                    <button
                        class="btn btn-outline-secondary"
                        type="button"
                        id="toggle-secret-visibility"
                        onclick="
                            const input = document.getElementById('api-key');
                            const icon = this.querySelector('i');
                            if (input.type === 'password') {
                                input.type = 'text';
                                icon.className = 'ri-eye-off-line';
                            } else {
                                input.type = 'password';
                                icon.className = 'ri-eye-line';
                            }
                        "
                        aria-label="Toggle signing key visibility">
                        <i class="ri-eye-line"></i>
                    </button>
                </div>
            </label>

            <label class="form-label w-100" id="description-label">
                Description / Purpose
                <textarea
                    key="description"
                    name="description"
                    class="form-control"
                    rows="3"
                    placeholder="Describe this API's purpose or environment details..."
                    aria-labelledby="description-label"></textarea>
            </label>

            <label class="form-label w-100" id="status-label">
                Connection Status
                <select
                    class="form-select"
                    key="status"
                    name="status"
                    aria-labelledby="status-label">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </label>

            <!-- Unified Standard Action Control Buttons -->
            <div
                src="/components/form-buttons.html"
                role="region"
                aria-label="Form Actions"></div>
        </div>
    </div>
</form>
