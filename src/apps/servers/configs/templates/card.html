<article class="card flex-grow-1 mb-0" style="flex-basis:320px;min-width:min(280px,100%);max-width:460px" template>
	<a class="card-body d-flex flex-column gap-3 text-reset" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/servers/configs/details.html" aria-controls="offcanvas-app" aria-open>
		<div state-to="offcanvas-app-form" state.array="servers_config" state.object="{{object._id}}"></div>
		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="d-flex align-items-center gap-3 min-width:0">
				<div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0">
					<div class="avatar-title bg-primary-subtle text-primary">
						<i class="ri-settings-3-line fs-4"></i>
					</div>
				</div>
				<div class="min-width:0">
					<h5 class="mb-1 text-truncate">{{object.name}}</h5>
					<span class="badge bg-primary-subtle text-primary text-uppercase">{{object.type}}</span>
				</div>
			</div>
			<span class="badge bg-secondary-subtle text-secondary text-capitalize">{{object.enabled}}</span>
		</div>
		<div class="d-flex flex-wrap gap-3">
			<div><span class="text-muted fs-12 d-block">Provider</span><strong class="text-uppercase">{{object.provider}}</strong></div>
			<div><span class="text-muted fs-12 d-block">Driver</span><strong>{{object.driver}}</strong></div>
		</div>
		<div class="d-flex flex-wrap gap-3 pt-2 border-top border-top-dashed text-muted fs-12">
			<span><i class="ri-stack-line me-1"></i>{{object.cluster}}</span>
			<span><i class="ri-server-line me-1"></i>{{object.server}}</span>
			<span><i class="ri-cpu-line me-1"></i>{{object.worker}}</span>
		</div>
	</a>
</article>
<div onload.array="servers_config" onload-query="$parent"></div>
