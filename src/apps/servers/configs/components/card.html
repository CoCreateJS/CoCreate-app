<div class="app-heading">
	<div class="d-flex align-items-center gap-3 min-width:0">
		<span class="app-provider-image" aria-hidden="true">
			<img class="app-provider-default" src="/assets/images/providers/configuration.svg" key="provider" set-value-prefix="/assets/images/providers/" set-value-suffix=".svg" alt="" width="36" height="36" onload="this.hidden = false" onerror="if (this.getAttribute('src') === '/assets/images/providers/configuration.svg') { this.hidden = true; } else { this.src = '/assets/images/providers/configuration.svg'; }" />
			<img class="app-provider-custom" form-attributes="false" array="apis" key="avatar[0].src" alt="" width="36" height="36" hidden onload="this.hidden = false" onerror="this.hidden = true" />
		</span>
		<div class="min-width:0">
			<h5 class="app-title mb-0"><span class="text-truncate" key="name"></span></h5>
		</div>
	</div>
	<div class="app-badges">
		<span class="badge border border-primary text-primary text-uppercase" key="type"></span>
		<span class="app-enabled-status" role="status" aria-label="Status">
			<input type="hidden" key="enabled" input-query="$parent" input.data-enabled="$value" />
			<span class="app-enabled badge border border-success text-success">Enabled</span>
			<span class="app-disabled badge border text-muted">Disabled</span>
		</span>
	</div>
</div>
<div class="d-flex flex-wrap gap-3">
	<div><span class="text-muted fs-12 d-block">Driver</span><strong key="driver"></strong></div>
</div>
<div class="d-flex flex-wrap gap-3 pt-2 border-top border-top-dashed text-muted fs-12" style="margin-top: auto">
	<span class="text-break"><i src="/assets/svg/remix/stack-line.svg" class="me-1" aria-hidden="true"></i><span key="cluster"></span></span>
	<span class="text-break"><i src="/assets/svg/remix/server-line.svg" class="me-1" aria-hidden="true"></i><span key="server"></span></span>
	<span class="text-break"><i src="/assets/svg/remix/cpu-line.svg" class="me-1" aria-hidden="true"></i><span key="worker"></span></span>
</div>
