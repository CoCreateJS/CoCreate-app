<form
	state-id="offcanvas-app-form"
	class="app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	data-component-form
	array
	object
	autocomplete="off">
	<header
		class="card-header offcanvas-app-topbar flex-shrink-0"
		src="/apps/servers/configs/header.html"
		aria-label="Form controls"></header>
	<div
		class="component-form-body flex-grow-1 min-height:0"
		plugin='{"$SimpleBar": ["$this", {}]}'>
		<div class="card-body d-flex flex-column gap-4">
			<input
				type="hidden"
				key="_id" />

			<section>
				<h5 class="text-uppercase fw-semibold mb-3">
					Configuration identity
				</h5>
				<div class="d-flex flex-wrap gap-3">
					<label
						class="form-label d-flex flex-column gap-1 width:100% flex-basis:100%">
						Name
						<input
							type="text"
							id="server-config-name"
							key="name"
							class="form-control"
							placeholder="Configuration name"
							required />
					</label>
					<label
						class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:200px min-width:180px">
						Type
						<input
							type="text"
							id="server-config-type"
							key="type"
							list="server-config-types"
							class="form-control text-lowercase"
							placeholder="ai, autoscaler, storage, telemetry"
							required />
						<datalist id="server-config-types">
							<option value="ai"></option>
							<option value="autoscaler"></option>
							<option value="storage"></option>
							<option value="telemetry"></option>
						</datalist>
					</label>
					<label
						class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:200px min-width:180px">
						Provider
						<input
							type="text"
							id="server-config-provider"
							key="provider"
							class="form-control text-lowercase"
							placeholder="aws, openai, mongodb" />
					</label>
					<label
						class="form-check form-switch d-flex align-items-center gap-2 flex-grow-1 flex-basis:140px min-width:130px mt-4">
						<input
							class="form-check-input"
							type="checkbox"
							role="switch"
							id="server-config-enabled"
							key="enabled" />
						<span class="form-check-label">Enabled</span>
					</label>
				</div>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<h5 class="text-uppercase fw-semibold mb-2">
					Runtime targeting
				</h5>
				<p class="text-muted mb-3">
					Use <code>*</code> for every target,
					<code>default</code> for the default scope, or an exact
					identifier.
				</p>
				<div class="d-flex flex-wrap gap-3">
					<label
						class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:220px min-width:190px">
						Cluster
						<input
							type="text"
							id="server-config-cluster"
							key="cluster"
							class="form-control"
							placeholder="*" />
					</label>
					<label
						class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:260px min-width:220px">
						Server
						<input
							type="text"
							id="server-config-server"
							key="server"
							class="form-control"
							placeholder="* or server ID" />
					</label>
					<label
						class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:200px min-width:180px">
						Worker
						<input
							type="text"
							id="server-config-worker"
							key="worker"
							class="form-control"
							placeholder="* or worker ID" />
					</label>
				</div>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<h5 class="text-uppercase fw-semibold mb-2">
					Runtime configuration
				</h5>
				<p class="text-muted mb-3">
					The object is merged with other enabled records that match
					the same runtime scope. Dot-notation keys are supported.
				</p>
				<textarea
					id="server-config-json"
					key="config"
					value-type="json"
					class="form-control font-monospace"
					rows="20"
					spellcheck="false"
					placeholder='{"enabled": true}'
					required></textarea>
			</section>
		</div>
	</div>
	<footer class="card-footer flex-shrink-0">
		<div class="hstack gap-2 justify-content-end">
			<button
				type="button"
				class="btn btn-light"
				aria-label="Cancel form"
				aria-controls="offcanvas-app"
				data-panel-close="offcanvas-app"
				aria-expanded="true"
				aria-close>
				Cancel
			</button>
			<button
				type="button"
				class="btn btn-light"
				aria-label="Cancel form"
				aria-controls="create-panel"
				data-panel-close="create-panel"
				aria-expanded="true"
				aria-close>
				Cancel
			</button>
			<button
				class="btn btn-success btn-spinner"
				aria-label="Save form"
				actions="validate, disabled, save, timeout(2000), disabled">
				<span
					class="spinner-border spinner-border-sm display:none"
					role="status"
					aria-hidden="true"></span>
				<span class="button-text">Save</span>
			</button>
		</div>
	</footer>
</form>
