<div class="card-body d-flex flex-column gap-4">
			<input type="hidden" key="_id" />

			<section>
				<h5 class="text-uppercase fw-semibold mb-3">Configuration identity</h5>
				<div class="d-flex flex-wrap gap-3">
					<label class="form-label d-flex flex-column gap-1 flex-grow-2 flex-basis:320px min-width:240px">
						Name
						<input
							type="text"
							id="server-config-name"
							key="name"
							class="form-control"
							placeholder="Configuration name"
							required />
					</label>
					<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:200px min-width:180px">
						Type
						<input
							type="text"
							id="server-config-type"
							key="type"
							list="server-config-types"
							class="form-control text-lowercase"
							placeholder="ai, autoscaler, storage, telemetry"
							required />
						<datalist id="server-config-types">
							<option value="ai"></option>
							<option value="autoscaler"></option>
							<option value="storage"></option>
							<option value="telemetry"></option>
						</datalist>
					</label>
					<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:200px min-width:180px">
						Provider
						<input
							type="text"
							id="server-config-provider"
							key="provider"
							class="form-control text-lowercase"
							placeholder="aws, openai, mongodb" />
					</label>
					<label class="form-check form-switch d-flex align-items-center gap-2 flex-grow-1 flex-basis:140px min-width:130px mt-4">
						<input
							class="form-check-input"
							type="checkbox"
							role="switch"
							id="server-config-enabled"
							key="enabled" />
						<span class="form-check-label">Enabled</span>
					</label>
				</div>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<h5 class="text-uppercase fw-semibold mb-2">Runtime targeting</h5>
				<p class="text-muted mb-3">Use <code>*</code> for every target, <code>default</code> for the default scope, or an exact identifier.</p>
				<div class="d-flex flex-wrap gap-3">
					<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:220px min-width:190px">
						Cluster
						<input
							type="text"
							id="server-config-cluster"
							key="cluster"
							class="form-control"
							placeholder="*" />
					</label>
					<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:260px min-width:220px">
						Server
						<input
							type="text"
							id="server-config-server"
							key="server"
							class="form-control"
							placeholder="* or server host" />
					</label>
					<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:200px min-width:180px">
						Worker
						<input
							type="text"
							id="server-config-worker"
							key="worker"
							class="form-control"
							placeholder="* or worker ID" />
					</label>
				</div>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<h5 class="text-uppercase fw-semibold mb-2">Runtime configuration</h5>
				<p class="text-muted mb-3">The object is merged with other enabled records that match the same runtime scope. Dot-notation keys are supported.</p>
				<textarea
					id="server-config-json"
					key="config"
					value-type="json"
					class="form-control font-monospace"
					rows="20"
					spellcheck="false"
					placeholder='{"enabled": true}'
					required></textarea>
			</section>
		</div>
