<form
	class="card mb-0"
	array="servers_config"
	object
	state-id="offcanvas-app-form"
	state-overwrite>
	<div
		class="card-header text-center border-bottom-0"
		input-query=".form-view-btn[]"
		input.state.src="/apps/servers/configs/form.html"
		src="components/offcanvas-header.html"
		aria-label="Server Configuration Details Header"></div>

	<div
		class="form-container"
		plugin='{"$SimpleBar": ["$this", {}]}'
		aria-label="Server Configuration Details Container">
		<div class="card-body d-flex flex-column gap-4">
			<section class="d-flex flex-wrap align-items-center gap-3">
				<div
					class="avatar-lg rounded-circle d-flex align-items-center justify-content-center bg-primary-subtle text-primary material-shadow fs-24">
					<i class="ri-settings-3-line"></i>
				</div>
				<div class="flex-grow-1" style="min-width: 220px">
					<div class="d-flex flex-wrap align-items-center gap-2">
						<h4 class="mb-0" key="name" aria-label="Configuration Name"></h4>
						<span class="badge bg-primary-subtle text-primary text-uppercase" key="type"></span>
					</div>
					<div class="d-flex flex-wrap gap-3 mt-2 text-muted">
						<span><i class="ri-cloud-line me-1"></i><span key="provider"></span></span>
						<span><i class="ri-database-2-line me-1"></i><span key="driver"></span></span>
					</div>
				</div>
				<div class="d-flex align-items-center gap-2">
					<span class="text-muted">Enabled</span>
					<input class="form-check-input" type="checkbox" role="switch" key="enabled" disabled />
				</div>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<h6 class="text-muted text-uppercase fw-semibold mb-3">Runtime scope</h6>
				<div class="d-flex flex-wrap gap-3">
					<div class="border border-dashed rounded p-3 flex-grow-1" style="flex-basis: 200px; min-width: 180px">
						<span class="text-muted d-block mb-1">Cluster</span>
						<code class="text-break" key="cluster"></code>
					</div>
					<div class="border border-dashed rounded p-3 flex-grow-1" style="flex-basis: 240px; min-width: 210px">
						<span class="text-muted d-block mb-1">Server</span>
						<code class="text-break" key="server"></code>
					</div>
					<div class="border border-dashed rounded p-3 flex-grow-1" style="flex-basis: 200px; min-width: 180px">
						<span class="text-muted d-block mb-1">Worker</span>
						<code class="text-break" key="worker"></code>
					</div>
				</div>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<h6 class="text-muted text-uppercase fw-semibold mb-3">Configuration</h6>
				<pre class="bg-light border rounded p-3 mb-0 text-wrap"><code key="config"></code></pre>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<h6 class="text-muted text-uppercase fw-semibold mb-3">Record information</h6>
				<div class="d-flex flex-wrap gap-4">
					<div>
						<span class="text-muted d-block">Record ID</span>
						<code key="_id"></code>
					</div>
					<div>
						<span class="text-muted d-block">Last modified</span>
						<span key="modified.on"></span>
					</div>
				</div>
			</section>

			<div
				class="w-100"
				src="components/activities.html"
				aria-label="Server Configuration Activities"></div>
		</div>
	</div>
</form>
