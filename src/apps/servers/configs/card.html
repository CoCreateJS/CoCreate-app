<article class="card mb-0">
	<div class="card-body d-flex flex-column gap-3">
		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="d-flex align-items-center gap-3 min-width:0">
				<div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0">
					<div class="avatar-title bg-primary-subtle text-primary">
						<i class="ri-settings-3-line fs-4"></i>
					</div>
				</div>
				<div class="min-width:0">
					<h5 class="mb-1 text-truncate" key="name"></h5>
					<span class="badge bg-primary-subtle text-primary text-uppercase" key="type"></span>
				</div>
			</div>
			<span class="badge bg-secondary-subtle text-secondary text-capitalize" key="enabled"></span>
		</div>
		<div class="d-flex flex-wrap gap-3">
			<div><span class="text-muted fs-12 d-block">Provider</span><strong class="text-uppercase" key="provider"></strong></div>
			<div><span class="text-muted fs-12 d-block">Driver</span><strong key="driver"></strong></div>
		</div>
		<div class="d-flex flex-wrap gap-3 pt-2 border-top border-top-dashed text-muted fs-12">
			<span><i class="ri-stack-line me-1"></i><span key="cluster"></span></span>
			<span><i class="ri-server-line me-1"></i><span key="server"></span></span>
			<span><i class="ri-cpu-line me-1"></i><span key="worker"></span></span>
		</div>
	</div>
</article>
