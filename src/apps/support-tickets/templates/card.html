<article class="card flex-grow-1 mb-0 app-card app-without-image" style="flex-basis:320px; min-width:min(280px, 100%); max-width:460px" template data-select-card array="{{object.$array[0]}}" object="{{object._id}}" read="false">

	<div class="card-body d-flex flex-column gap-3 text-reset">

		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="d-flex align-items-center gap-3 min-width:0"><div class="min-width:0"><span class="text-muted fs-12">{{object.ticketId}}</span><h5 class="text-truncate app-title mb-1"><a class="text-reset text-decoration-none" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/support-tickets/aside.html" aria-controls="offcanvas-app" aria-haspopup="dialog" aria-expanded="false" aria-open data-card-open><span state-to="offcanvas-app-form" state.array="support_tickets" state.object="{{object._id}}" hidden></span>{{object.title}}</a></h5></div></div>
			<span class="badge border border-primary text-primary text-capitalize">{{object.status}}</span>
		</div>
		<p class="text-muted mb-0 line-clamp:2">{{object.description}}</p>
		<div class="d-flex flex-wrap gap-3"><div><span class="text-muted fs-12 d-block">Client</span><strong>{{object.client_name}}</strong></div><div><span class="text-muted fs-12 d-block">Assigned to</span><strong>{{object.assigned_to}}</strong></div><div><span class="text-muted fs-12 d-block">Stage</span><strong class="text-capitalize">{{object.stage}}</strong></div></div>
		<div class="d-flex align-items-center justify-content-between gap-3 pt-2 border-top border-top-dashed"><div class="text-muted fs-12"><span><i src="/assets/svg/remix/calendar-check-line.svg" class="me-1"></i>Created: {{object.create_date}}</span><span class="ms-3"><i src="/assets/svg/remix/calendar-event-line.svg" class="me-1"></i>Due: {{object.due_date}}</span></div><span class="badge border border-warning text-warning text-capitalize">{{object.priority}}</span></div>
		<div class="d-flex flex-wrap gap-1" key="tags" render-query="[template='support-ticket-card-tag']"><span template="support-ticket-card-tag" class="badge border border-secondary text-secondary">{{tags}}</span></div>
	</div>
</article>
<div onload.array="support_tickets" onload-query="$parent"></div>
