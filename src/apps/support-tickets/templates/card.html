<article class="card flex-grow-1 mb-0" style="flex-basis:320px; min-width:min(280px, 100%); max-width:460px" template>
	<a class="card-body d-flex flex-column gap-3 text-reset" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/support-tickets/details.html" aria-controls="offcanvas-app" aria-haspopup="dialog" aria-expanded="false" aria-open>
		<div state-to="offcanvas-app-form" state.array="support_tickets" state.object="{{object._id}}"></div>
		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="d-flex align-items-center gap-3 min-width:0"><div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0"><div class="avatar-title bg-info-subtle text-info"><i class="ri-ticket-line fs-4"></i></div></div><div class="min-width:0"><span class="text-muted fs-12">{{object.ticketId}}</span><h5 class="mb-0 text-truncate">{{object.title}}</h5></div></div>
			<span class="badge bg-primary-subtle text-primary text-capitalize">{{object.status}}</span>
		</div>
		<p class="text-muted mb-0 line-clamp:2">{{object.description}}</p>
		<div class="d-flex flex-wrap gap-3"><div><span class="text-muted fs-12 d-block">Client</span><strong>{{object.client_name}}</strong></div><div><span class="text-muted fs-12 d-block">Assigned to</span><strong>{{object.assigned_to}}</strong></div><div><span class="text-muted fs-12 d-block">Stage</span><strong class="text-capitalize">{{object.stage}}</strong></div></div>
		<div class="d-flex align-items-center justify-content-between gap-3 pt-2 border-top border-top-dashed"><div class="text-muted fs-12"><span><i class="ri-calendar-check-line me-1"></i>Created: {{object.create_date}}</span><span class="ms-3"><i class="ri-calendar-event-line me-1"></i>Due: {{object.due_date}}</span></div><span class="badge bg-warning-subtle text-warning text-capitalize">{{object.priority}}</span></div>
		<div class="d-flex flex-wrap gap-1" key="tags" render-query="[template='support-ticket-card-tag']"><span template="support-ticket-card-tag" class="badge bg-secondary-subtle text-secondary">{{tags}}</span></div>
	</a>
</article>
<div onload.array="support_tickets" onload-query="$parent"></div>
