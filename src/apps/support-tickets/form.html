<form
	class="card mb-0"
	array
	object
	state-id="offcanvas-app-form"
	state-overwrite>
	<div
		class="card-header text-center border-bottom-0"
		input-query=".details-view-btn[]"
		input.state.src="/apps/support-tickets/details.html"
		src="components/offcanvas-header.html"
		role="region"
		aria-label="Support Ticket Form Header"></div>
	<div class="card-body">
		<div
			class="form-container"
			plugin="SimpleBar"
			simplebar='["$this", {}]'>
			<div class="card-body d-flex flex-wrap gap-4">
				<label class="form-label" id="label-ticket-id"
					>ID
					<input
						type="text"
						key="ticket_id"
						name="ticket_id"
						class="form-control"
						placeholder="ID"
						value="#VLZ462"
						readonly
						aria-labelledby="label-ticket-id" />
				</label>

				<label class="form-label" id="label-ticket-title"
					>Title
					<input
						type="text"
						key="title"
						name="title"
						class="form-control"
						placeholder="Ticket title"
						aria-labelledby="label-ticket-title" />
				</label>

				<label class="form-label" id="label-client-name"
					>Client Name
					<input
						type="text"
						key="client_name"
						name="client_name"
						class="form-control"
						placeholder="Client name"
						aria-labelledby="label-client-name" />
				</label>

				<label class="form-label" id="label-assigned-to"
					>Assigned To
					<input
						type="text"
						key="assigned_to"
						name="assigned_to"
						class="form-control"
						placeholder="Assigned to"
						aria-labelledby="label-assigned-to" />
				</label>

				<div style="display: flex; gap: 1rem">
					<label
						class="form-label"
						style="flex: 1"
						id="label-create-date"
						>Create Date
						<input
							type="text"
							key="create_date"
							name="create_date"
							class="form-control"
							date-picker="flatpickr"
							data-date-format="d M, Y"
							placeholder="Create Date"
							aria-labelledby="label-create-date" />
					</label>

					<label
						class="form-label"
						style="flex: 1"
						id="label-due-date"
						>Due Date
						<input
							type="text"
							key="due_date"
							name="due_date"
							class="form-control"
							date-picker="flatpickr"
							data-date-format="d M, Y"
							placeholder="Due Date"
							aria-labelledby="label-due-date" />
					</label>
				</div>

				<div style="display: flex; gap: 1rem">
					<label class="form-label" style="flex: 1" id="label-status"
						>Status
						<select
							class="form-control"
							key="status"
							name="status"
							aria-labelledby="label-status">
							<option value="">Status</option>
							<option value="New">New</option>
							<option value="Inprogress">Inprogress</option>
							<option value="Open">Open</option>
							<option value="Closed">Closed</option>
						</select>
					</label>

					<label
						class="form-label"
						style="flex: 1"
						id="label-priority"
						>Priority
						<select
							class="form-control"
							key="priority"
							name="priority"
							aria-labelledby="label-priority">
							<option value="">Priority</option>
							<option value="High">High</option>
							<option value="Medium">Medium</option>
							<option value="Low">Low</option>
						</select>
					</label>
				</div>

				<label class="form-label" id="label-description"
					>Description
					<textarea
						key="description"
						name="description"
						class="form-control"
						placeholder="Enter description"
						aria-labelledby="label-description"></textarea>
				</label>

				<div
					src="/components/form-buttons.html"
					role="region"
					aria-label="Form Actions"></div>
			</div>
		</div>
	</div>
</form>
