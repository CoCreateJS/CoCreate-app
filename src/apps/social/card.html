<article class="card mb-0">
	<div class="card-body d-flex flex-column gap-3">
		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="d-flex align-items-center gap-3 min-width:0">
				<div
					class="avatar-sm rounded-circle overflow-hidden flex-shrink-0">
					<div class="avatar-title bg-info-subtle text-info">
						<i class="ri-share-line fs-4"></i>
					</div>
				</div>
				<div class="min-width:0">
					<h5
						class="mb-1 text-truncate"
						key="title"></h5>
					<span class="text-muted fs-12"
						>By <span key="author"></span
					></span>
				</div>
			</div>
			<span
				class="badge bg-success-subtle text-success text-capitalize"
				key="status"></span>
		</div>
		<p
			class="text-muted mb-0 line-clamp:2"
			key="caption"></p>
		<div class="d-flex flex-wrap gap-3">
			<span
				><i class="ri-heart-line me-1"></i
				><span key="engagement.likes"></span></span
			><span
				><i class="ri-chat-3-line me-1"></i
				><span key="engagement.comments"></span></span
			><span
				><i class="ri-share-forward-line me-1"></i
				><span key="engagement.shares"></span
			></span>
		</div>
		<div class="text-muted fs-12 pt-2 border-top border-top-dashed">
			Scheduled: <span key="scheduled_time"></span>
		</div>
	</div>
</article>
