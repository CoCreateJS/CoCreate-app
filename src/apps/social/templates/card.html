<article
	class="card flex-grow-1 mb-0"
	style="flex-basis: 320px; min-width: min(280px, 100%)"
	template role="row" aria-selected="false" array="{{object.$array[0]}}" object="{{object._id}}" read="false">
	<div class="card-body d-flex flex-column gap-3 text-reset"><span
			state-to="offcanvas-app-form"
			state.array="posts"
			state.object="{{object._id}}" hidden></span>
		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="d-flex align-items-center gap-3 min-width:0">
				<div
					class="avatar-sm rounded-circle overflow-hidden flex-shrink-0">
					<div class="avatar-title bg-info-subtle text-info">
						<i src="/assets/svg/remix/share-line.svg" class="fs-4"></i>
					</div>
				</div>
				<div class="min-width:0">
					<h5 class="mb-1 text-truncate"><a
	 class="text-reset text-decoration-none"
		role="button"
		tabindex="0"
		state-to="offcanvas-app-view"
		state.src="/apps/blog/app.html"
		aria-controls="offcanvas-app"
		aria-open>{{object.title}}</a></h5>
					<span class="text-muted fs-12">By {{object.author}}</span>
				</div>
			</div>
			<span class="badge bg-success-subtle text-success text-capitalize"
				>{{object.status}}</span
			>
		</div>
		<p class="text-muted mb-0 line-clamp:2">{{object.caption}}</p>
		<div class="d-flex flex-wrap gap-3">
			<span
				><i src="/assets/svg/remix/heart-line.svg" class="me-1"></i>{{object.engagement.likes}}</span
			><span
				><i src="/assets/svg/remix/chat-3-line.svg" class="me-1"></i>{{object.engagement.comments}}</span
			><span
				><i src="/assets/svg/remix/share-forward-line.svg" class="me-1"></i>{{object.engagement.shares}}</span
			>
		</div>
		<div class="text-muted fs-12 pt-2 border-top border-top-dashed">
			Scheduled: {{object.scheduled_time}}
		</div></div>
</article>
<div
	hidden
	onload.array="posts"
	onload-query="$parent"></div>
