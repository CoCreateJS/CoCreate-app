
<article class="app-card card mb-0">
	<div class="card-body d-flex flex-column gap-3">
		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="app-identity">
				<div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0 app-identity-image"><div class="avatar-title bg-primary-subtle text-primary"><i src="/assets/svg/remix/hand-coin-line.svg" class="fs-4"></i></div></div>
				<div class="min-width:0"><h5 class="app-title mb-1 text-truncate" key="name"></h5><span class="text-muted fs-12">Owner: <span key="assigned_to"></span></span></div>
			</div>
			<span class="badge text-capitalize" key="stage" data-value input.data-value="$value"></span>
		</div>
		<p class="text-muted mb-0 line-clamp:2" key="description"></p>
		<div class="d-flex flex-wrap gap-3">
			<div><span class="text-muted fs-12 d-block">Value</span><strong><span key="currency"></span> <span key="value"></span></strong></div>
			<div><span class="text-muted fs-12 d-block">Expected</span><strong><span key="currency"></span> <span key="expected_revenue"></span></strong></div>
			<div><span class="text-muted fs-12 d-block">Probability</span><strong><span key="probability"></span>%</strong></div>
		</div>
		<div class="d-flex align-items-center justify-content-between gap-3 pt-2 border-top border-top-dashed">
			<span class="text-muted fs-12"><i src="/assets/svg/remix/calendar-line.svg" class="me-1"></i><span key="due_date"></span></span>
			<div class="d-flex gap-1"><span class="badge text-capitalize" key="priority" data-value input.data-value="$value"></span><span class="badge text-capitalize" key="status" data-value input.data-value="$value"></span></div>
		</div>
		<div class="d-flex flex-wrap gap-1" key="tags" render-query="[template='opportunity-card-tag']"><span template="opportunity-card-tag" class="badge border border-secondary text-secondary">{{tags}}</span></div>
	</div>
</article>
