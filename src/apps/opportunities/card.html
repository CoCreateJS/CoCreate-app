<article class="card mb-0">
	<div class="card-body d-flex flex-column gap-3">
		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="d-flex align-items-center gap-3 min-width:0">
				<div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0"><div class="avatar-title bg-primary-subtle text-primary"><i class="ri-hand-coin-line fs-4"></i></div></div>
				<div class="min-width:0"><h5 class="mb-1 text-truncate" key="name"></h5><span class="text-muted fs-12">Owner: <span key="assigned_to"></span></span></div>
			</div>
			<span class="badge bg-primary-subtle text-primary text-capitalize" key="stage"></span>
		</div>
		<p class="text-muted mb-0 line-clamp:2" key="description"></p>
		<div class="d-flex flex-wrap gap-3">
			<div><span class="text-muted fs-12 d-block">Value</span><strong><span key="currency"></span> <span key="value"></span></strong></div>
			<div><span class="text-muted fs-12 d-block">Expected</span><strong><span key="currency"></span> <span key="expected_revenue"></span></strong></div>
			<div><span class="text-muted fs-12 d-block">Probability</span><strong><span key="probability"></span>%</strong></div>
		</div>
		<div class="d-flex align-items-center justify-content-between gap-3 pt-2 border-top border-top-dashed">
			<span class="text-muted fs-12"><i class="ri-calendar-line me-1"></i><span key="due_date"></span></span>
			<div class="d-flex gap-1"><span class="badge bg-warning-subtle text-warning text-capitalize" key="priority"></span><span class="badge bg-success-subtle text-success text-capitalize" key="status"></span></div>
		</div>
		<div class="d-flex flex-wrap gap-1" key="tags" render-query="[template='opportunity-card-tag']"><span template="opportunity-card-tag" class="badge bg-secondary-subtle text-secondary">{{tags}}</span></div>
	</div>
</article>
