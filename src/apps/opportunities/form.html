<form
	state-id="offcanvas-app-form"
	class="app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	data-component-form
	array
	object
	autocomplete="off">
	<header
		class="card-header offcanvas-app-topbar flex-shrink-0"
		src="/apps/opportunities/header.html"
		aria-label="Form controls"></header>
	<div
		class="component-form-body flex-grow-1 min-height:0"
		plugin='{"$SimpleBar": ["$this", {}]}'>
		<div class="card-body d-flex flex-wrap align-items:flex-start">
			<label
				class="form-label flex-grow:2 flex-basis:280px min-width:220px"
				for="opportunity-name-field">
				Opportunity Name
				<input
					type="text"
					id="opportunity-name-field"
					class="form-control"
					placeholder="Enter opportunity name"
					key="name"
					aria-describedby="opportunity-name-field-description" />
			</label>
			<div
				id="opportunity-name-field-description"
				class="sr-only">
				The name of the opportunity.
			</div>
			<label
				class="form-label flex-grow:2 flex-basis:260px min-width:220px"
				for="company-name-field">
				Company Name
				<input
					type="text"
					id="company-name-field"
					class="form-control"
					placeholder="Enter company name"
					key="company"
					aria-describedby="company-name-field-description" />
			</label>
			<div
				id="company-name-field-description"
				class="sr-only">
				The name of the company associated with the opportunity.
			</div>
			<label
				class="form-label flex-grow-1 flex-basis:160px min-width:140px"
				for="amount-field">
				Amount
				<input
					type="number"
					id="amount-field"
					class="form-control"
					placeholder="Enter amount"
					key="amount"
					aria-describedby="amount-field-description" />
			</label>
			<div
				id="amount-field-description"
				class="sr-only">
				The monetary value of the opportunity.
			</div>
			<label
				class="form-label flex-grow-1 flex-basis:180px min-width:160px"
				for="closing-date-field">
				Closing Date
				<input
					type="date"
					id="closing-date-field"
					class="form-control"
					key="closing_date"
					aria-describedby="closing-date-field-description" />
			</label>
			<div
				id="closing-date-field-description"
				class="sr-only">
				The expected date of opportunity closure.
			</div>
			<label
				class="form-label flex-grow:2 flex-basis:240px min-width:200px"
				for="assigned-contact-field">
				Assigned Contact
				<select
					class="form-select"
					id="assigned-contact-field"
					key="contact_id"
					aria-label="Select an assigned contact"
					aria-describedby="assigned-contact-field-description">
					<option value="">Select Contact</option>
					<option
						array="contacts"
						object="{{_id}}"
						key="name"
						template>
						{{name}}
					</option>
				</select>
			</label>
			<div
				id="assigned-contact-field-description"
				class="sr-only">
				Choose a contact person from the list.
			</div>
		</div>
	</div>
	<footer class="card-footer flex-shrink-0">
		<div class="hstack gap-2 justify-content-end">
			<button
				type="button"
				class="btn btn-light"
				aria-label="Cancel form"
				aria-controls="offcanvas-app"
				aria-expanded="true"
				aria-close>
				Cancel
			</button>
			<button
				class="btn btn-success btn-spinner"
				aria-label="Save form"
				actions="validate, disabled, save, timeout(2000), disabled">
				<span
					class="spinner-border spinner-border-sm display:none"
					role="status"
					aria-hidden="true"></span>
				<span class="button-text">Save</span>
			</button>
		</div>
	</footer>
</form>
