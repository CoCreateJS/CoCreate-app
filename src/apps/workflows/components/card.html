<div class="app-card-body">
	<div class="app-heading">
		<div class="app-identity">
			<span class="app-image" aria-hidden="true">
				<i src="/assets/svg/remix/node-tree.svg"></i>
			</span>
			<h5 class="app-title" key="name"></h5>
		</div>
		<div class="app-badges">
			<span class="badge app-badge" role="status" aria-label="Enabled status"
				key="enabled" data-value input.data-value="$value"
				input.value="$(`$value` === 'true' ? 'Enabled' : 'Disabled')"></span>
		</div>
	</div>
	<p class="text-muted mb-0" key="description"></p>
</div>
