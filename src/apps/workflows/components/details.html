<link rel="stylesheet" href="/components/code/index.css" />

<div class="card-body d-flex flex-column gap-4 h-100">
	<section class="app-card d-flex flex-column gap-3 pb-3 w-100"
		src="/apps/workflows/components/card.html"></section>
	<section class="border-top border-top-dashed pt-3">
		<h6 class="text-muted text-uppercase fw-semibold mb-3">Actions</h6>
		<div class="component-code border rounded p-3">
			<pre aria-hidden="true"><code class="language-json"></code></pre>
			<textarea id="workflow-actions-details" key="actions" type="code" lang="json"
				value-type="json" value-evaluate="false" height="auto" rows="8"
				class="form-control font-monospace" spellcheck="false"
				aria-label="Workflow actions" readonly save="false"></textarea>
			<button type="button" class="btn position-absolute top-0 end-0 m-2 p-1 border-0 bg-transparent fs-24"
				clipboard clipboard-query="$parent textarea" aria-label="Copy actions" title="Copy actions">
				<i src="/assets/svg/remix/file-copy-line.svg" aria-hidden="true"></i>
				<i src="/assets/svg/remix/check-line.svg" aria-hidden="true"></i>
			</button>
		</div>
	</section>
	<section class="border-top border-top-dashed pt-3">
		<h6 class="text-muted text-uppercase fw-semibold mb-3">Record information</h6>
		<div class="d-flex flex-wrap gap-4">
			<div><span class="text-muted d-block">Record ID</span><code key="_id"></code></div>
			<div><span class="text-muted d-block">Last updated</span><span key="updated.on"></span></div>
		</div>
	</section>
</div>
