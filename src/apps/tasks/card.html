<article class="card mb-0"><div class="card-body d-flex flex-column gap-3">
	<div class="d-flex align-items-start justify-content-between gap-3"><div class="d-flex align-items-center gap-3 min-width:0"><div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0"><div class="avatar-title bg-info-subtle text-info"><i class="ri-task-line fs-4"></i></div></div><div class="min-width:0"><h5 class="mb-1 text-truncate" key="name"></h5><span class="text-muted fs-12">Project: <span key="project_name"></span></span></div></div><span class="badge bg-primary-subtle text-primary text-capitalize" key="status"></span></div>
	<p class="text-muted mb-0 line-clamp:2" key="description"></p>
	<div class="d-flex align-items-center justify-content-between gap-3 pt-2 border-top border-top-dashed"><span class="text-muted fs-12"><i class="ri-calendar-event-line me-1"></i>Due: <span key="dueDate"></span> <span key="dueTime"></span></span><span class="badge bg-warning-subtle text-warning text-capitalize" key="priority"></span></div>
	<div class="d-flex flex-wrap gap-1" key="tags" render-query="[template='task-card-tag']"><span template="task-card-tag" class="badge bg-secondary-subtle text-secondary">{{tags}}</span></div>
</div></article>
