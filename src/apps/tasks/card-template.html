<article class="card flex-grow-1 mb-0" style="flex-basis:320px; min-width:min(280px,100%); max-width:460px" template><a class="card-body d-flex flex-column gap-3 text-reset" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/tasks/details.html" aria-controls="offcanvas-app" aria-open>
	<div state-to="offcanvas-app-form" state.array="tasks" state.object="{{object._id}}"></div>
	<div class="d-flex align-items-start justify-content-between gap-3"><div class="d-flex align-items-center gap-3 min-width:0"><div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0"><div class="avatar-title bg-info-subtle text-info"><i class="ri-task-line fs-4"></i></div></div><div class="min-width:0"><h5 class="mb-1 text-truncate">{{object.name}}</h5><span class="text-muted fs-12">Project: {{object.project_name}}</span></div></div><span class="badge bg-primary-subtle text-primary text-capitalize">{{object.status}}</span></div>
	<p class="text-muted mb-0 line-clamp:2">{{object.description}}</p>
	<div class="d-flex align-items-center justify-content-between gap-3 pt-2 border-top border-top-dashed"><span class="text-muted fs-12"><i class="ri-calendar-event-line me-1"></i>Due: {{object.dueDate}} {{object.dueTime}}</span><span class="badge bg-warning-subtle text-warning text-capitalize">{{object.priority}}</span></div>
	<div class="d-flex flex-wrap gap-1" array="tasks" object="{{object._id}}" key="tags" render-query="[template='task-card-tag']"><span template="task-card-tag" class="badge bg-secondary-subtle text-secondary">{{tags}}</span></div>
</a></article><div onload.array="tasks" onload-query="$parent"></div>
