
<article class="app-card card mb-0"><div class="card-body d-flex flex-column gap-3">
	<div class="d-flex align-items-start justify-content-between gap-3"><div class="app-identity"><div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0 app-identity-image"><div class="avatar-title bg-info-subtle text-info"><i src="/assets/svg/remix/task-line.svg" class="fs-4"></i></div></div><div class="min-width:0"><h5 class="app-title mb-1 text-truncate" key="name"></h5><span class="text-muted fs-12">Project: <span key="project_name"></span></span></div></div><span class="badge text-capitalize" key="status" data-value input.data-value="$value"></span></div>
	<p class="text-muted mb-0 line-clamp:2" key="description"></p>
	<div class="d-flex align-items-center justify-content-between gap-3 pt-2 border-top border-top-dashed"><span class="text-muted fs-12"><i src="/assets/svg/remix/calendar-event-line.svg" class="me-1"></i>Due: <span key="dueDate"></span> <span key="dueTime"></span></span><span class="badge text-capitalize" key="priority" data-value input.data-value="$value"></span></div>
	<div class="d-flex flex-wrap gap-1" key="tags" render-query="[template='task-card-tag']"><span template="task-card-tag" class="badge border border-secondary text-secondary">{{tags}}</span></div>
</div></article>
