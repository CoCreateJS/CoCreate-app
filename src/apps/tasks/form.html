<form
	class="card mb-0"
	array="tasks"
	object
	state-id="offcanvas-app-form"
	state-overwrite>
	<div
		class="card-header text-center border-bottom-0"
		input-query=".details-view-btn[]"
		input.state.src="/apps/tasks/details.html"
		src="components/offcanvas-header.html"></div>

	<div
		class="card-body d-flex flex-wrap gap-4"
		plugin='{"SimpleBar": ["$this", {}]}'>
		<label class="form-label w-100">
			Task Name
			<input
				type="text"
				key="name"
				id="task-name-field"
				class="form-control"
				placeholder="Enter task name"
				aria-label="Task Name" />
		</label>

		<div class="d-flex gap-3 w-100">
			<label class="form-label flex-grow-1">
				Due Date
				<input
					type="date"
					key="dueDate"
					id="due-date-field"
					class="form-control"
					aria-label="Due Date" />
			</label>
			<label class="form-label flex-grow-1">
				Due Time
				<input
					type="time"
					key="dueTime"
					id="due-time-field"
					class="form-control"
					aria-label="Due Time" />
			</label>
		</div>

		<div class="d-flex gap-3 w-100">
			<label class="form-label flex-grow-1">
				Status
				<select
					class="form-control"
					key="status"
					id="status-field"
					aria-label="Status">
					<option value="">Select Status</option>
					<option value="To Do">To Do</option>
					<option value="Inprogress">Inprogress</option>
					<option value="In Reviews">In Reviews</option>
					<option value="Completed">Completed</option>
				</select>
			</label>

			<label class="form-label flex-grow-1">
				Priority
				<select
					class="form-control"
					key="priority"
					id="priority-field"
					aria-label="Priority">
					<option value="">Select Priority</option>
					<option value="High">High</option>
					<option value="Medium">Medium</option>
					<option value="Low">Low</option>
				</select>
			</label>
		</div>

		<label class="form-label w-100">
			Description
			<textarea
				key="description"
				id="description-field"
				class="form-control"
				rows="3"
				placeholder="Add description"
				aria-label="Description"></textarea>
		</label>

		<div src="/components/form-buttons.html"></div>
	</div>
</form>
