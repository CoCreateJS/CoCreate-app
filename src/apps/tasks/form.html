<form
	class="app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	data-component-form
	array
	object
	autocomplete="off">
<header
		class="card-header offcanvas-app-topbar flex-shrink-0"
		src="/apps/tasks/header.html"
		aria-label="Form controls"></header>
	<div
		class="component-form-body flex-grow-1 min-height:0"
		plugin='{"$SimpleBar": ["$this", {}]}'>
<div class="card-body d-flex flex-wrap align-items:flex-start">
		<label class="form-label width:100%" for="task-name-field">
			Task Name
			<input
				type="text"
				key="name"
				id="task-name-field"
				class="form-control"
				placeholder="Enter task name"
				aria-label="Task Name" />
		</label>

		<label
			class="form-label flex-grow-1 flex-basis:180px min-width:160px"
			for="due-date-field">
				Due Date
				<input
					type="date"
					key="dueDate"
					id="due-date-field"
					class="form-control"
					aria-label="Due Date" />
		</label>
		<label
			class="form-label flex-grow-1 flex-basis:160px min-width:140px"
			for="due-time-field">
				Due Time
				<input
					type="time"
					key="dueTime"
					id="due-time-field"
					class="form-control"
					aria-label="Due Time" />
		</label>

		<label
			class="form-label flex-grow-1 flex-basis:180px min-width:160px"
			for="status-field">
				Status
				<select
					class="form-control"
					key="status"
					id="status-field"
					aria-label="Status">
					<option value="">Select Status</option>
					<option value="To Do">To Do</option>
					<option value="Inprogress">Inprogress</option>
					<option value="In Reviews">In Reviews</option>
					<option value="Completed">Completed</option>
				</select>
		</label>

		<label
			class="form-label flex-grow-1 flex-basis:180px min-width:160px"
			for="priority-field">
				Priority
				<select
					class="form-control"
					key="priority"
					id="priority-field"
					aria-label="Priority">
					<option value="">Select Priority</option>
					<option value="High">High</option>
					<option value="Medium">Medium</option>
					<option value="Low">Low</option>
				</select>
		</label>

		<label class="form-label width:100%" for="description-field">
			Description
			<textarea
				key="description"
				id="description-field"
				class="form-control"
				rows="3"
				placeholder="Add description"
				aria-label="Description"></textarea>
		</label>
		</div>
	</div>
	<footer class="card-footer flex-shrink-0">
		<div class="hstack gap-2 justify-content-end">
			<button
				type="button"
				class="btn btn-light"
				data-component-form-close
				aria-label="Cancel form"
				aria-expanded="true"
				aria-close>Cancel</button>
			<button
				class="btn btn-success btn-spinner"
				aria-label="Save form"
				actions="validate, disabled, save, timeout(2000), disabled">
				<span class="spinner-border spinner-border-sm display:none" role="status" aria-hidden="true"></span>
				<span class="button-text">Save</span>
			</button>
		</div>
	</footer>
</form>
