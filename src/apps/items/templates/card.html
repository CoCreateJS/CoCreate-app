<article class="card flex-grow-1 mb-0 app-card app-with-image" style="flex-basis:320px;min-width:min(280px,100%);max-width:460px" template data-select-card array="{{object.$array[0]}}" object="{{object._id}}" read="false">
<div class="card-body d-flex flex-column gap-3 text-reset"><span state-to="offcanvas-app-form" state.array="items" state.object="{{object._id}}" hidden></span><div class="d-flex align-items-start justify-content-between gap-3"><div class="d-flex align-items-center gap-3 min-width:0"><span class="app-avatar"><img src="{{object.images[0].src}}" alt="" width="50" height="50" onload="this.hidden = false" onerror="this.hidden = true" /></span><div class="min-width:0"><h5 class="text-truncate app-title mb-1"><a class="text-reset text-decoration-none" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/items/app.html" aria-controls="offcanvas-app" aria-open data-card-open>{{object.name}}</a></h5><span class="text-muted fs-12">{{object.category}}</span></div></div><span class="badge border border-success text-success text-capitalize">{{object.status}}</span></div><p class="text-muted mb-0 line-clamp:2">{{object.short_description}}</p><div class="d-flex flex-wrap gap-3"><div><span class="text-muted fs-12 d-block">Price</span><strong>{{object.price}}</strong></div><div><span class="text-muted fs-12 d-block">Stock</span><strong>{{object.stock}}</strong></div><div><span class="text-muted fs-12 d-block">Orders</span><strong>{{object.orders}}</strong></div></div><div class="d-flex justify-content-between gap-3 pt-2 border-top border-top-dashed text-muted fs-12"><span><i src="/assets/svg/remix/building-line.svg" class="me-1"></i>{{object.manufacturer.name}}</span><span><i src="/assets/svg/remix/price-tag-3-line.svg" class="me-1"></i>{{object.type}}</span></div></div></article><div onload.array="items" onload-query="$parent"></div>
