<form
	id="item-form"
	autocomplete="off"
	class="needs-validation"
	array
	object
	state-id="offcanvas-app-form"
	state-overwrite
	novalidate>
	<div
		class="card-header text-center border-bottom-0"
		input-query=".details-view-btn[]"
		input.state.src="/apps/items/details.html"
		src="components/offcanvas-header.html"></div>

	<div
		class="form-container p-3"
		plugin='{"$SimpleBar": ["$this", {}]}'>
		<div class="d-flex flex-wrap gap-3">
			<div class="d-flex flex-column flex-grow-1 width:500px">
				<div class="card">
					<div class="card-body">
						<input
							type="hidden"
							class="form-control"
							id="item-id-input"
							key="_id" />

						<label class="form-label w-100" for="item-title-input">
							Item Name
							<input
								type="text"
								class="form-control"
								id="item-name-input"
								value=""
								placeholder="Enter item name"
								key="name" />
							<div class="invalid-feedback">
								Please Enter a item name.
							</div>
						</label>

						<label class="w-100"
							>Item Description
							<div class="border rounded p-2">
								<div
									editor="ckeditor-classic"
									key="description"></div>
							</div>
						</label>

						<label class="w-100 mt-3"
							>Item Detail
							<div class="border rounded p-2">
								<div
									editor="ckeditor-classic"
									key="detail"></div>
							</div>
						</label>
					</div>
				</div>
				<!-- end card -->

				<div class="card">
					<div class="card-header">
						<h5 class="card-title mb-0">Item Gallery</h5>
					</div>
					<div class="card-body mb-4">
						<h5 class="fs-14 mb-1">Item Image</h5>
						<p class="text-muted">Add Item main Image.</p>
						<div
							class="text-center w-100"
							src="components/item-img.html"></div>
					</div>
				</div>
				<!-- end card -->

				<div class="card">
					<div class="card-header">
						<ul
							class="nav nav-tabs-custom card-header-tabs border-bottom-0"
							role="tablist">
							<li class="nav-item">
								<a
									class="nav-link active"
									data-bs-toggle="tab"
									href="#addproduct-general-info"
									role="tab">
									General Info
								</a>
							</li>
							<li class="nav-item">
								<a
									class="nav-link"
									data-bs-toggle="tab"
									href="#addproduct-metadata"
									role="tab">
									Meta Data
								</a>
							</li>
						</ul>
					</div>
					<!-- end card header -->
					<div class="card-body">
						<div class="tab-content">
							<div
								class="tab-pane active"
								id="addproduct-general-info"
								role="tabpanel">
								<div class="d-flex flex-wrap gap-3 mb-3">
									<label
										class="form-label"
										for="manufacturer-name-input"
										>Manufacturer Name
										<input
											type="text"
											class="form-control"
											id="manufacturer-name-input"
											placeholder="Enter manufacturer name"
											key="manufacturer.name" />
									</label>
									<label
										class="form-label"
										for="manufacturer-name-input"
										>Manufacturer Name
										<input
											type="text"
											class="form-control"
											id="manufacturer-name-input"
											placeholder="Enter manufacturer name"
											key="manufacturer.name" />
									</label>
									<label
										class="form-label"
										for="manufacturer-brand-input"
										>Manufacturer Brand
										<input
											type="text"
											class="form-control"
											id="manufacturer-brand-input"
											placeholder="Enter manufacturer brand"
											key="manufacturer.brand" />
									</label>
									<label
										class="form-label"
										for="items-seller-id-input"
										>Seller ID
										<input
											type="text"
											class="form-control"
											id="items-seller-id-input"
											placeholder="Enter seller_id (reference)"
											key="seller_id" />
									</label>
								</div>

								<div class="d-flex flex-wrap gap-3 mb-3">
									<div
										class="d-flex flex-wrap flex-grow-1 gap-3 width:250px">
										<label
											class="form-label flex-grow-1 width:100px"
											for="stock-input"
											>Stock
											<input
												type="text"
												class="form-control"
												id="stock-input"
												placeholder="Stock"
												key="stock" />
											<div class="invalid-feedback">
												Please Enter a product stock.
											</div>
										</label>
										<label
											class="form-label flex-grow-1 width:120px"
											for="item-price-input">
											Price
											<div
												class="input-group has-validation mb-3">
												<span
													class="input-group-text"
													id="item-price-addon"
													>$</span
												>
												<input
													type="text"
													class="form-control"
													id="item-price-input"
													placeholder="Enter price"
													aria-label="Price"
													aria-describedby="item-price-addon"
													key="price" />
												<div class="invalid-feedback">
													Please Enter a product
													price.
												</div>
											</div>
										</label>
									</div>
									<div
										class="d-flex flex-wrap flex-grow-1 gap-3 width:250px">
										<label
											class="form-label flex-grow-1 width:100px"
											for="item-discount-input">
											Discount
											<div
												class="input-group has-validation mb-3">
												<span
													class="input-group-text"
													id="item-discount-addon"
													>%</span
												>
												<input
													type="number"
													class="form-control"
													id="item-discount-input"
													placeholder="Enter discount"
													aria-label="discount"
													aria-describedby="item-discount-addon"
													key="discount" />
											</div>
										</label>
										<label
											class="form-label flex-grow-1 width:120px"
											for="orders-input">
											Orders
											<input
												type="text"
												class="form-control"
												id="orders-input"
												placeholder="Orders"
												key="orders" />
											<div class="invalid-feedback">
												Please Enter a product orders.
											</div>
										</label>
									</div>
								</div>
								<!-- end row -->
							</div>
							<!-- end tab-pane -->

							<div
								class="tab-pane"
								id="addproduct-metadata"
								role="tabpanel">
								<div class="row">
									<div class="col-lg-6">
										<div class="mb-3">
											<label
												class="form-label"
												for="meta-title-input"
												>Meta title</label
											>
											<input
												type="text"
												class="form-control"
												placeholder="Enter meta title"
												id="meta-title-input"
												key="meta.title" />
										</div>
									</div>
									<!-- end col -->

									<div class="col-lg-6">
										<div class="mb-3">
											<label
												class="form-label"
												for="meta-keywords-input"
												>Meta Keywords</label
											>
											<input
												type="text"
												class="form-control"
												placeholder="Enter meta keywords"
												id="meta-keywords-input"
												key="meta.keywords" />
										</div>
									</div>
									<!-- end col -->
								</div>
								<!-- end row -->

								<div>
									<label
										class="form-label"
										for="meta-description-input"
										>Meta Description</label
									>
									<textarea
										class="form-control"
										id="meta-description-input"
										placeholder="Enter meta description"
										rows="3"
										key="meta.description"></textarea>
								</div>
							</div>
							<!-- end tab pane -->
						</div>
						<!-- end tab content -->
					</div>
					<!-- end card body -->
				</div>
			</div>
			<!-- end col -->

			<div class="d-flex flex-column flex-grow-1 width:300px">
				<div class="card">
					<div class="card-header">
						<h5 class="card-title mb-0">Publish</h5>
					</div>
					<div class="card-body">
						<div class="mb-3">
							<label
								for="choices-publish-status-input"
								class="form-label"
								>Status
							</label>

							<select
								class="form-select"
								id="choices-publish-status-input"
								data-choices
								data-choices-search-false
								key="publish.status">
								<option value="Published" selected>
									Published
								</option>
								<option value="Scheduled">Scheduled</option>
								<option value="Draft">Draft</option>
							</select>
						</div>

						<div>
							<label
								for="choices-publish-visibility-input"
								class="form-label"
								>Visibility</label
							>
							<select
								class="form-select"
								id="choices-publish-visibility-input"
								data-choices
								data-choices-search-false
								key="publish.visibility">
								<option value="Public" selected>Public</option>
								<option value="Hidden">Hidden</option>
							</select>
						</div>
					</div>
					<!-- end card body -->
				</div>
				<!-- end card -->

				<div class="card">
					<div class="card-header">
						<h5 class="card-title mb-0">Publish Schedule</h5>
					</div>
					<!-- end card body -->
					<div class="card-body">
						<div>
							<label
								for="datepicker-publish-input"
								class="form-label"
								>Publish Date & Time</label
							>
							<input
								type="text"
								id="datepicker-publish-input"
								class="form-control"
								placeholder="Enter publish date"
								data-provider="flatpickr"
								data-date-format="d.m.y"
								data-enable-time
								key="publish.on" />
						</div>
					</div>
				</div>
				<!-- end card -->

				<div class="card">
					<div class="card-header">
						<h5 class="card-title mb-0">Item Categories</h5>
					</div>
					<div class="card-body">
						<p class="text-muted mb-2">
							<a
								href="#"
								class="float-end text-decoration-underline"
								>Add New</a
							>Select product category
						</p>
						<select
							class="form-select"
							id="choices-category-input"
							name="choices-category-input"
							data-choices
							data-choices-search-false
							key="category">
							<option value="Appliances">Appliances</option>
							<option value="Automotive Accessories">
								Automotive Accessories
							</option>
							<option value="Electronics">Electronics</option>
							<option value="Fashion">Fashion</option>
							<option value="Furniture">Furniture</option>
							<option value="Grocery">Grocery</option>
							<option value="Kids">Kids</option>
							<option value="Watches">Watches</option>
						</select>
					</div>
					<!-- end card body -->
				</div>
				<!-- end card -->
				<div class="card">
					<div class="card-header">
						<h5 class="card-title mb-0">Item Tags</h5>
					</div>
					<div class="card-body">
						<div class="hstack gap-3 align-items-start">
							<div class="flex-grow-1">
								<select
									class="form-select"
									id="items-tags-select"
									data-choices
									data-choices-search-false
									multiple
									key="tags">
									<option value="new">New</option>
									<option value="sale">Sale</option>
									<option value="featured">Featured</option>
									<option value="clearance">Clearance</option>
								</select>
							</div>
						</div>
					</div>
					<!-- end card body -->
				</div>
				<!-- end card -->

				<div class="card">
					<div class="card-header">
						<h5 class="card-title mb-0">Item Short Description</h5>
					</div>
					<div class="card-body">
						<p class="text-muted mb-2">
							Add short description for item
						</p>
						<textarea
							class="form-control"
							placeholder="Must enter minimum of a 100 characters"
							rows="3"
							key="shortDescription"></textarea>
					</div>
					<!-- end card body -->
				</div>
				<!-- end card -->
			</div>
		</div>
		<div src="/components/form-buttons.html"></div>
	</div>
</form>
