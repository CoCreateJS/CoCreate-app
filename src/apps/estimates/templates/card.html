<article class="card flex-grow-1 mb-0 app-card app-without-image" style="flex-basis:320px;min-width:min(280px,100%);max-width:460px" template data-select-card array="{{object.$array[0]}}" object="{{object._id}}" read="false">
<div class="card-body d-flex flex-column gap-3 text-reset"><span state-to="offcanvas-app-form" state.array="invoices" state.object="{{object._id}}" hidden></span><div class="d-flex align-items-start justify-content-between gap-3"><div class="d-flex align-items-center gap-3 min-width:0"><div class="min-width:0"><h5 class="text-truncate app-title mb-1"><a class="text-reset text-decoration-none" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/estimates/aside.html" aria-controls="offcanvas-app" aria-open data-card-open>{{object.title}}</a></h5><span class="text-muted fs-12">{{object.client_name}}</span></div></div><span class="badge border border-success text-success text-capitalize">{{object.payment_status}}</span></div><p class="text-muted mb-0 line-clamp:2">{{object.notes}}</p><div class="d-flex flex-wrap gap-3"><div><span class="text-muted fs-12 d-block">Estimate</span><strong>{{object.estimate_no}}</strong></div><div><span class="text-muted fs-12 d-block">Total</span><strong>{{object.total_amount}}</strong></div><div><span class="text-muted fs-12 d-block">Paid</span><strong>{{object.amount_total_pay}}</strong></div></div><div class="d-flex justify-content-between gap-3 pt-2 border-top border-top-dashed text-muted fs-12"><span><i src="/assets/svg/remix/calendar-line.svg" class="me-1"></i>{{object.dat}}</span><span><i src="/assets/svg/remix/bank-card-line.svg" class="me-1"></i>{{object.payment_method}}</span></div></div></article><div onload.array="invoices" onload-query="$parent"></div>
