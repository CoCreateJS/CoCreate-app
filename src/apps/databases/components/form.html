<link rel="stylesheet" href="/components/codearea/index.css" />

<div class="card-body d-flex flex-column gap-4 h-100">
	<input
		type="hidden"
		key="_id" />

	<section>
		<h5 class="text-uppercase fw-semibold mb-2">Record data</h5>
		<p class="text-muted mb-3">
			Edit this record as JSON. The record is saved to the selected array.
		</p>
		<codearea class="component-codearea border rounded p-3">
			<pre aria-hidden="true"><code class="language-json"></code></pre>
			<textarea
				id="database-record-json"
				key="{}"
				type="code"
				lang="json"
				value-type="object"
				value-evaluate="false"
				height="auto"
				rows="1"
				class="form-control font-monospace"
				spellcheck="false"
				aria-label="Record JSON"
				required></textarea>
			<button
				type="button"
				class="btn position-absolute top-0 end-0 m-2 p-1 border-0 bg-transparent fs-24"
				clipboard
				clipboard-query="$parent textarea"
				aria-label="Copy record JSON"
				title="Copy JSON">
				<i
					src="/assets/svg/remix/file-copy-line.svg"
					aria-hidden="true"></i>
				<i
					src="/assets/svg/remix/check-line.svg"
					aria-hidden="true"></i>
			</button>
		</codearea>
	</section>
</div>
