<div class="app-identity app-list-identity">
	<span
		class="avatar-xs app-list-image rounded-circle position-relative overflow-hidden flex-shrink-0 app-identity-image">
		<span class="avatar-title bg-primary-subtle text-primary">
			<span
				class="avatar-initial"
				key="first_name[0]"></span>
			<span
				class="avatar-initial"
				key="last_name[0]"></span>
			<img
				class="position-absolute object-fit-cover"
				key="avatar[0].src"
				src="/assets/images/transparent.png"
				alt="Lead avatar"
				width="100%"
				height="100%"
				onerror="
					this.onerror = null;
					this.src = '/assets/images/transparent.png';
				" />
		</span>
	</span>
	<span class="app-title">
		<span key="name"></span>
	</span>
</div>
