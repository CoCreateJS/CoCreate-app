<template>
<article class="card app-card" role="row" aria-selected="false" array="{{object.$array[0]}}" object="{{object._id}}" read="false">
<div class="card-body d-flex flex-column gap-3 text-reset">

	<div class="d-flex align-items-start justify-content-between gap-3"><div class="app-identity"><div class="avatar-sm rounded-circle position-relative overflow-hidden flex-shrink-0 app-identity-image"><div class="avatar-title bg-primary-subtle text-primary"><span class="avatar-initial">{{object.first_name[0]}}</span><span class="avatar-initial">{{object.last_name[0]}}</span><img class="position-absolute object-fit-cover" src="{{object.avatar[0].src}}" alt="{{object.name}}" width="100%" height="100%" onerror="this.onerror=null; this.src='/assets/images/transparent.png';" /></div></div><div class="min-width:0"><h5 class="text-truncate app-title mb-1"><a class="text-reset text-decoration-none" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/leads/app.html" aria-controls="offcanvas-app" aria-open><span state-to="offcanvas-app-form" state.array="contacts" state.object="{{object._id}}" hidden></span>{{object.name}}</a></h5><span class="text-muted text-truncate d-block">{{object.company}}</span></div></div><span class="badge text-capitalize" key="status" data-value="{{object.status}}">{{object.status}}</span></div>
	<div><p class="text-muted mb-1 line-clamp:2">{{object.description}}</p><button class="btn btn-link btn-sm p-0" type="button" onclick="event.preventDefault(); event.stopPropagation(); const description=this.previousElementSibling; description.classList.toggle('line-clamp:2'); this.textContent=description.classList.contains('line-clamp:2')?'Show more':'Show less';">Show more</button></div>
	<div class="d-flex flex-column gap-2 text-muted fs-12"><span><i src="/assets/svg/remix/mail-line.svg" class="me-2"></i>{{object.email}}</span><span><i src="/assets/svg/remix/phone-line.svg" class="me-2"></i>{{object.phone}}</span><span><i src="/assets/svg/remix/map-pin-line.svg" class="me-2"></i>{{object.city}}, {{object.country}}</span></div>
	<div class="d-flex flex-wrap gap-1 pt-2 border-top border-top-dashed" array="contacts" object="{{object._id}}" key="type" render-query="[template='lead-card-type']"><span template="lead-card-type" class="badge border border-info text-info">{{type}}</span></div>
	<div class="d-flex flex-wrap gap-1" array="contacts" object="{{object._id}}" key="tags" render-query="[template='lead-card-tag']"><span template="lead-card-tag" class="badge border border-secondary text-secondary">{{tags}}</span></div>
</div></article>
</template>
<div onload.array="contacts" onload-query="$parent"></div>
