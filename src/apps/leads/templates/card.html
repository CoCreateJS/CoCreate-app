<article class="card flex-grow-1 mb-0" style="flex-basis:320px; min-width:min(280px,100%); max-width:460px" template><a class="card-body d-flex flex-column gap-3 text-reset" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/leads/details.html" aria-controls="offcanvas-app" aria-open>
	<div state-to="offcanvas-app-form" state.array="contacts" state.object="{{object._id}}"></div>
	<div class="d-flex align-items-start justify-content-between gap-3"><div class="d-flex align-items-center gap-3 min-width:0"><div class="avatar-sm rounded-circle position-relative overflow-hidden flex-shrink-0"><div class="avatar-title bg-primary-subtle text-primary"><span class="avatar-initial">{{object.first_name[0]}}</span><span class="avatar-initial">{{object.last_name[0]}}</span><img class="position-absolute object-fit-cover" src="{{object.avatar[0].src}}" alt="{{object.name}}" width="100%" height="100%" onerror="this.onerror=null; this.src='/assets/images/transparent.png';" /></div></div><div class="min-width:0"><h5 class="mb-1 text-truncate">{{object.name}}</h5><span class="text-muted text-truncate d-block">{{object.company}}</span></div></div><span class="badge bg-success-subtle text-success text-capitalize">{{object.status}}</span></div>
	<div><p class="text-muted mb-1 line-clamp:2">{{object.description}}</p><button class="btn btn-link btn-sm p-0" type="button" onclick="event.preventDefault(); event.stopPropagation(); const description=this.previousElementSibling; description.classList.toggle('line-clamp:2'); this.textContent=description.classList.contains('line-clamp:2')?'Show more':'Show less';">Show more</button></div>
	<div class="d-flex flex-column gap-2 text-muted fs-12"><span><i class="ri-mail-line me-2"></i>{{object.email}}</span><span><i class="ri-phone-line me-2"></i>{{object.phone}}</span><span><i class="ri-map-pin-line me-2"></i>{{object.city}}, {{object.country}}</span></div>
	<div class="d-flex flex-wrap gap-1 pt-2 border-top border-top-dashed" array="contacts" object="{{object._id}}" key="type" render-query="[template='lead-card-type']"><span template="lead-card-type" class="badge bg-info-subtle text-info">{{type}}</span></div>
	<div class="d-flex flex-wrap gap-1" array="contacts" object="{{object._id}}" key="tags" render-query="[template='lead-card-tag']"><span template="lead-card-tag" class="badge bg-secondary-subtle text-secondary">{{tags}}</span></div>
</a></article><div onload.array="contacts" onload-query="$parent"></div>
