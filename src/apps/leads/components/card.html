
<article class="app-card card mb-0"><div class="card-body d-flex flex-column gap-3">
	<div class="d-flex align-items-start justify-content-between gap-3"><div class="d-flex align-items-center gap-3 min-width:0"><div class="avatar-sm rounded-circle position-relative overflow-hidden flex-shrink-0"><div class="avatar-title bg-primary-subtle text-primary"><span class="avatar-initial" key="first_name[0]"></span><span class="avatar-initial" key="last_name[0]"></span><img class="position-absolute object-fit-cover" key="avatar[0].src" src="/assets/images/transparent.png" alt="Lead avatar" width="100%" height="100%" onerror="this.onerror=null; this.src='/assets/images/transparent.png';" /></div></div><div class="min-width:0"><h5 class="app-title mb-1 text-truncate" key="name"></h5><span class="text-muted text-truncate d-block" key="company"></span></div></div><span class="badge border border-success text-success text-capitalize" key="status"></span></div>
	<div><p class="text-muted mb-1 line-clamp:2" key="description"></p><button class="btn btn-link btn-sm p-0" type="button" onclick="const description=this.previousElementSibling; description.classList.toggle('line-clamp:2'); this.textContent=description.classList.contains('line-clamp:2')?'Show more':'Show less';">Show more</button></div>
	<div class="d-flex flex-column gap-2 text-muted fs-12"><span><i class="ri-mail-line me-2"></i><span key="email"></span></span><span><i class="ri-phone-line me-2"></i><span key="phone"></span></span><span><i class="ri-map-pin-line me-2"></i><span key="city"></span>, <span key="country"></span></span></div>
	<div class="d-flex flex-wrap gap-1 pt-2 border-top border-top-dashed" key="type" render-query="[template='lead-card-type']"><span template="lead-card-type" class="badge border border-info text-info">{{type}}</span></div>
	<div class="d-flex flex-wrap gap-1" key="tags" render-query="[template='lead-card-tag']"><span template="lead-card-tag" class="badge border border-secondary text-secondary">{{tags}}</span></div>
</div></article>
