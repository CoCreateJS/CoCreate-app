
<link rel="stylesheet" href="/apps/apps/components/card.css" />
<article class="card mb-0 app-card"><div class="card-body d-flex flex-column gap-3">
	<div class="app-heading"><div class="d-flex align-items-center gap-3 min-width:0"><div class="avatar-sm flex-shrink-0"><span class="avatar-title bg-primary-subtle rounded-circle fs-2 material-shadow"><i src="/assets/svg/remix/apps-2-line.svg" style="font-size:1.5rem" key="icon" input.class="$value" aria-hidden="true"></i></span></div><div class="min-width:0"><h5 class="app-title mb-1 text-truncate" key="name"></h5></div></div><div class="app-badges"><span class="badge border border-primary text-primary" key="category"></span><span class="apps-card-status"><input type="hidden" key="status" input-query="$parent" input.data-status="$value" /><span class="apps-card-enabled badge border border-success text-success">Enabled</span><span class="apps-card-disabled badge border text-muted">Disabled</span></span></div></div>
	<p class="text-muted mb-0 line-clamp:2" key="description"></p>
	<div class="d-flex flex-wrap gap-3"><div><span class="text-muted fs-12 d-block">Array</span><code key="array"></code></div></div>
	<div class="text-muted fs-12 pt-2 border-top border-top-dashed"><i src="/assets/svg/remix/folder-line.svg" class="me-1"></i><span key="path"></span></div>
</div></article>
