<article class="card mb-0 app-card">
	<div class="card-body d-flex flex-column gap-3">
		<div class="app-heading">
			<div class="app-identity">
				<div class="avatar-sm app-card-icon flex-shrink-0 app-identity-image">
					<span
						class="avatar-title bg-primary-subtle rounded-circle fs-2 material-shadow"
						><i
							src="/assets/svg/remix/apps-2-line.svg"
							key="icon"
							input.class="$value"
							aria-hidden="true"></i
					></span>
				</div>
				<div class="min-width:0">
					<h5
						class="app-title mb-0 text-capitalize text-break"
						key="name"></h5>
				</div>
			</div>
			<div class="app-badges">
				<span
					class="badge"
					key="category" data-value input.data-value="$value"></span
				><span class="badge text-capitalize" role="status" aria-label="Enabled status" key="enabled" data-value input.data-value="$value"></span>
			</div>
		</div>
		<p
			class="text-muted mb-0 line-clamp:2"
			key="description"></p>
		<div class="d-flex flex-wrap gap-3">
			<div>
				<span class="text-muted fs-12 d-block">Array</span
				><code key="array"></code>
			</div>
		</div>
		<div class="text-muted fs-12 pt-2 border-top border-top-dashed">
			<i
				src="/assets/svg/remix/folder-line.svg"
				class="me-1"></i
			><span key="path"></span>
		</div>
	</div>
</article>
