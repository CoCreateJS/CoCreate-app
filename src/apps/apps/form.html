<form
	state-id="offcanvas-app-form"
	class="app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	array
	object
	autocomplete="off">
	<header
		class="card-header offcanvas-app-topbar flex-shrink-0"
		src="/apps/apps/header.html"
		aria-label="Form controls"></header>
	<div
		class="card-body flex-grow-1 min-height:0"
		plugin='{"$SimpleBar": ["$this", {}]}'>
		<div class="card-body d-flex flex-column gap-3">
			<label
				class="form-label"
				id="name-label">
				Name
				<input
					type="text"
					key="name"
					name="name"
					class="form-control"
					placeholder="Enter name"
					aria-labelledby="name-label" />
			</label>

			<label
				class="form-label"
				id="singular-name-label">
				Singular Name
				<input
					type="text"
					key="singularName"
					name="singularName"
					class="form-control"
					placeholder="Enter singular name"
					aria-labelledby="singular-name-label" />
			</label>

			<label
				class="form-label"
				id="path-label">
				Path
				<input
					type="text"
					key="path"
					name="path"
					class="form-control"
					placeholder="Enter path"
					aria-labelledby="path-label" />
			</label>

			<label
				class="form-label"
				id="array-label">
				Array
				<input
					type="text"
					key="array"
					name="array"
					class="form-control"
					placeholder="Enter array name"
					aria-labelledby="array-label" />
			</label>

			<label
				class="form-label"
				id="main-views-label">
				Main Views
				<select
					class="form-control"
					key="mainViews"
					name="mainViews"
					multiple
					aria-labelledby="main-views-label">
					<option value="table">Table</option>
					<option value="grid">Grid</option>
					<option value="kanban">Kanban</option>
				</select>
			</label>

			<label
				class="form-label"
				id="secondary-views-label">
				Secondary Views
				<select
					class="form-control"
					key="secondaryViews"
					name="secondaryViews"
					multiple
					aria-labelledby="secondary-views-label">
					<option value="details">Details</option>
					<option value="form">Form</option>
				</select>
			</label>
			<div src="./apps/apps/components/fieldBuilder.html"></div>
		</div>
	</div>
	<footer class="card-footer flex-shrink-0">
		<div class="hstack gap-2 justify-content-end">
			<button
				type="button"
				class="btn btn-light"
				aria-label="Cancel form"
				aria-controls="offcanvas-app"
				data-panel-close="offcanvas-app"
				aria-expanded="true"
				aria-close>
				Cancel
			</button>
			<button
				type="button"
				class="btn btn-light"
				aria-label="Cancel form"
				aria-controls="create-panel"
				data-panel-close="create-panel"
				aria-expanded="true"
				aria-close>
				Cancel
			</button>
			<button
				class="btn btn-success btn-spinner"
				aria-label="Save form"
				actions="validate, disabled, save, timeout(2000), disabled">
				<span
					class="spinner-border spinner-border-sm display:none"
					role="status"
					aria-hidden="true"></span>
				<span class="button-text">Save</span>
			</button>
		</div>
	</footer>
</form>
