
<link rel="stylesheet" href="/apps/apps/components/card.css" />
<article class="card flex-grow-1 mb-0 app-card app-with-image" style="flex-basis:320px;min-width:min(280px,100%);max-width:460px" template data-select-card array="{{object.$array[0]}}" object="{{object._id}}" read="false">
<div class="card-body d-flex flex-column gap-3 text-reset">
	<div class="app-heading"><div class="d-flex align-items-center gap-3 min-width:0"><div class="avatar-sm flex-shrink-0"><span class="avatar-title bg-primary-subtle rounded-circle fs-2 material-shadow"><i class="{{object.icon}}" style="font-size:1.5rem" aria-hidden="true"></i></span></div><div class="min-width:0"><h5 class="text-truncate app-title mb-1"><a class="text-reset text-decoration-none" role="button" tabindex="0" state-to="offcanvas-app-form" state.array="apps" state.object="{{object._id}}" aria-controls="offcanvas-app" aria-haspopup="dialog" aria-expanded="false" aria-open data-card-open><span state-to="offcanvas-app-view" state.src="/apps/apps/aside.html" hidden></span>{{object.name}}</a></h5></div></div><div class="app-badges"><span class="badge border border-primary text-primary">{{object.category}}</span><span class="apps-card-status" data-status="{{object.status}}"><span class="apps-card-enabled badge border border-success text-success">Enabled</span><span class="apps-card-disabled badge border text-muted">Disabled</span></span></div></div>
	<p class="text-muted mb-0 line-clamp:2">{{object.description}}</p>
	<div class="d-flex flex-wrap align-items-center gap-2 text-muted fs-12 pt-2 border-top border-top-dashed" style="margin-top: auto;">
		<span class="d-flex align-items-center gap-1 min-width:0" style="flex: 1 1 10rem" title="{{object.path}}">
			<i src="/assets/svg/remix/folder-line.svg" class="flex-shrink-0" aria-hidden="true"></i>
			<span class="text-truncate">{{object.path}}</span>
		</span>
		<span class="d-flex align-items-center gap-1 ms-auto min-width:0" style="max-width: 100%" title="Array: {{object.array}}">
			<i src="/assets/svg/remix/database-2-line.svg" class="flex-shrink-0" aria-hidden="true"></i>
			<span class="visually-hidden">Array: </span>
			<span class="text-truncate">{{object.array}}</span>
		</span>
	</div>
</div></article><div onload.array="apps" onload-query="$parent"></div>
