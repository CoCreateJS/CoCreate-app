<div class="card-body d-flex flex-column gap-4">
	<input type="hidden" key="_id" />
	<section>
		<h5 class="text-uppercase fw-semibold mb-3">Instruction identity</h5>
		<div class="d-flex flex-wrap gap-3">
			<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:220px min-width:190px">Name<input type="text" id="ai-instruction-name" key="name" class="form-control text-lowercase" placeholder="crud" required /></label>
			<label class="form-label d-flex flex-column gap-1 flex-grow:2 flex-basis:360px min-width:260px">Description<input type="text" id="ai-instruction-description" key="description" class="form-control" placeholder="CoCreate CRUD guidance" required /></label>
		</div>
	</section>
	<section class="border-top border-top-dashed pt-3">
		<h5 class="text-uppercase fw-semibold mb-2">Loading behavior</h5>
		<p class="text-muted mb-3">Default instructions are loaded into the shared instruction map when the AI server starts.</p>
		<div class="d-flex flex-wrap gap-4">
			<label class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="ai-instruction-default" key="default" /><span class="form-check-label">Load by default</span></label>
			<label class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="ai-instruction-enabled" key="enabled" /><span class="form-check-label">Enabled</span></label>
		</div>
	</section>
	<section class="border-top border-top-dashed pt-3">
		<label class="form-label d-flex flex-column gap-1">Instructions<textarea id="ai-instruction-instructions" key="instructions" class="form-control font-monospace" rows="24" spellcheck="true" placeholder="Describe the rules, context, and workflow for this capability." required></textarea></label>
	</section>
	<section class="border-top border-top-dashed pt-3">
		<div class="d-flex flex-wrap gap-3">
			<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:360px min-width:260px">Examples<textarea id="ai-instruction-examples" key="examples" value-type="json" class="form-control font-monospace" rows="14" spellcheck="false" placeholder="[]"></textarea></label>
			<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:360px min-width:260px">Sources<textarea id="ai-instruction-sources" key="sources" value-type="json" class="form-control font-monospace" rows="14" spellcheck="false" placeholder="[]"></textarea></label>
		</div>
	</section>
	<p class="text-muted fs-12 mb-0">Restart the AI server after changing an enabled default instruction so its in-memory copy is refreshed.</p>
</div>
