<form
	class="card mb-0"
	array="ai-instructions"
	object
	state-id="offcanvas-app-form"
	state-overwrite>
	<div
		class="card-header text-center border-bottom-0"
		input-query=".details-view-btn[]"
		input.hidden="true"
		src="components/offcanvas-header.html"
		aria-label="AI Instruction Form Header"></div>

	<div class="form-container" plugin='{"$SimpleBar": ["$this", {}]}'>
		<div class="card-body d-flex flex-column gap-4">
			<input type="hidden" key="_id" />

			<section>
				<h5 class="text-uppercase fw-semibold mb-3">Instruction identity</h5>
				<div class="d-flex flex-wrap gap-3">
					<label class="form-label d-flex flex-column gap-1 flex-grow-2 flex-basis:360px min-width:260px">
						Title
						<input
							type="text"
							id="ai-instruction-description"
							key="description"
							class="form-control"
							placeholder="API integration instructions"
							required />
					</label>
					<label class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:220px min-width:190px">
						Topic
						<input
							type="text"
							id="ai-instruction-topic"
							key="topic"
							class="form-control text-lowercase"
							placeholder="apis"
							required />
					</label>
				</div>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<h5 class="text-uppercase fw-semibold mb-2">Loading behavior</h5>
				<p class="text-muted mb-3">Default and core instructions are cached when the AI server starts. Other enabled topics are loaded on demand for the requesting organization.</p>
				<div class="d-flex flex-wrap gap-4">
					<label class="form-check form-switch">
						<input
							class="form-check-input"
							type="checkbox"
							role="switch"
							id="ai-instruction-default"
							key="default" />
						<span class="form-check-label">Default system instruction</span>
					</label>
					<label class="form-check form-switch">
						<input
							class="form-check-input"
							type="checkbox"
							role="switch"
							id="ai-instruction-core"
							key="core" />
						<span class="form-check-label">Core instruction</span>
					</label>
					<label class="form-check form-switch">
						<input
							class="form-check-input"
							type="checkbox"
							role="switch"
							id="ai-instruction-enabled"
							key="enabled" />
						<span class="form-check-label">Enabled</span>
					</label>
				</div>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<label class="form-label d-flex flex-column gap-1">
					Instructions
					<textarea
						id="ai-instruction-content"
						key="content"
						class="form-control font-monospace"
						rows="24"
						spellcheck="true"
						placeholder="Describe the rules, context, and workflow the AI should follow for this topic."
						required></textarea>
				</label>
				<p class="text-muted fs-12 mb-0">Changes to cached default or core instructions take effect after the AI server restarts.</p>
			</section>
		</div>
	</div>

	<div
		class="card-footer flex-shrink-0"
		src="/components/form-buttons.html"
		role="region"
		aria-label="AI instruction form actions"></div>
</form>
