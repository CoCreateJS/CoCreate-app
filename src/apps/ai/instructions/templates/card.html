<article class="card flex-grow-1 mb-0 app-card app-with-image" style="flex-basis:320px;min-width:min(280px,100%);max-width:460px" template data-select-card array="{{object.$array[0]}}" object="{{object._id}}" read="false">
	<div class="card-body d-flex flex-column gap-3 text-reset">
		<div class="app-heading">
			<div class="d-flex align-items-center gap-3 min-width:0">
				<span class="avatar-sm app-card-icon flex-shrink-0">
					<span class="avatar-title bg-primary-subtle text-primary rounded-circle">
						<i src="/assets/svg/remix/file-list-3-line.svg" aria-hidden="true"></i>
					</span>
				</span>
				<div class="min-width:0">
					<h5 class="app-title mb-0 text-capitalize"><a class="text-reset text-decoration-none text-truncate" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/ai/instructions/aside.html" aria-controls="offcanvas-app" aria-haspopup="dialog" aria-expanded="false" aria-open data-card-open><span state-to="offcanvas-app-form" state.array="ai-instructions" state.object="{{object._id}}" hidden></span>{{object.name}}</a></h5>
				</div>
			</div>
			<div class="app-badges">
				<span class="app-enabled-status" data-enabled="{{object.enabled}}" role="status" aria-label="Status">
					<span class="app-enabled badge border border-success text-success">Enabled</span>
					<span class="app-disabled badge border text-muted">Disabled</span>
				</span>
			</div>
		</div>
		<p class="text-muted mb-0 line-clamp:2">{{object.description}}</p>
		<div class="d-flex align-items-center gap-2 pt-2 border-top border-top-dashed" style="margin-top: auto">
			<i src="/assets/svg/remix/flashlight-line.svg" class="text-warning" aria-hidden="true"></i>
			<span class="text-muted fs-12">Loaded by default</span>
			<span class="badge border border-secondary text-secondary text-capitalize ms-auto">{{object.default}}</span>
		</div>
	</div>
</article>
<div onload.array="ai-instructions" onload-query="$parent"></div>
