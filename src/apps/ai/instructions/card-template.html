<article class="card flex-grow-1 mb-0" style="flex-basis:320px;min-width:min(280px,100%);max-width:460px" template>
	<a class="card-body d-flex flex-column gap-3 text-reset" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/ai/instructions/details.html" aria-controls="offcanvas-app" aria-open>
		<div state-to="offcanvas-app-form" state.array="ai-instructions" state.object="{{object._id}}"></div>
		<div class="d-flex align-items-start justify-content-between gap-3">
			<div class="d-flex align-items-center gap-3 min-width:0">
				<div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0">
					<div class="avatar-title bg-primary-subtle text-primary material-shadow">
						<i class="ri-file-list-3-line fs-4"></i>
					</div>
				</div>
				<div class="min-width:0">
					<h5 class="mb-1 text-truncate text-capitalize">{{object.name}}</h5>
					<span class="text-muted fs-12">AI instruction</span>
				</div>
			</div>
			<span class="badge bg-success-subtle text-success text-capitalize">{{object.enabled}}</span>
		</div>
		<p class="text-muted mb-0 line-clamp:3">{{object.description}}</p>
		<div class="d-flex align-items-center gap-2 pt-2 border-top border-top-dashed">
			<i class="ri-flashlight-line text-warning"></i>
			<span class="text-muted fs-12">Loaded by default</span>
			<span class="badge bg-secondary-subtle text-secondary text-capitalize ms-auto">{{object.default}}</span>
		</div>
	</a>
</article>
<div onload.array="ai-instructions" onload-query="$parent"></div>
