<form
	class="app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	data-component-form
	array
	object
	autocomplete="off">
	<header
		class="card-header offcanvas-app-topbar flex-shrink-0"
		src="/apps/ai/instructions/header.html"
		aria-label="Details controls"></header>

	<div
		class="component-form-body flex-grow-1 min-height:0"
		plugin='{"$SimpleBar": ["$this", {}]}'>
		<div class="card-body d-flex flex-column gap-4">
	<section class="d-flex flex-wrap align-items-center gap-3">
		<div class="avatar-lg rounded-circle d-flex align-items-center justify-content-center bg-primary-subtle text-primary material-shadow fs-24"><i class="ri-file-list-3-line"></i></div>
		<div class="flex-grow-1" style="min-width:220px"><h4 class="mb-1 text-capitalize" key="name"></h4><p class="text-muted mb-0" key="description"></p></div>
		<div class="d-flex flex-wrap gap-2">
			<span class="badge bg-success-subtle text-success">Enabled: <strong class="text-capitalize" key="enabled"></strong></span>
			<span class="badge bg-warning-subtle text-warning">Default: <strong class="text-capitalize" key="default"></strong></span>
		</div>
	</section>
	<section class="border-top border-top-dashed pt-3"><h5 class="text-uppercase fw-semibold mb-3">Instructions</h5><pre class="bg-light border rounded p-3 mb-0 text-wrap"><code key="instructions"></code></pre></section>
	<section class="border-top border-top-dashed pt-3"><h5 class="text-uppercase fw-semibold mb-3">Examples</h5><pre class="bg-light border rounded p-3 mb-0 text-wrap"><code key="examples" value-type="json"></code></pre></section>
	<section class="border-top border-top-dashed pt-3"><h5 class="text-uppercase fw-semibold mb-3">Sources</h5><pre class="bg-light border rounded p-3 mb-0 text-wrap"><code key="sources" value-type="json"></code></pre></section>
</div>
	</div>
</form>
