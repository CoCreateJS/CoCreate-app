<textarea
	class="ai-prompt"
	height="auto"
	rows="1"
	placeholder="Message CoCreate AI…"
	aria-label="Prompt"
	required></textarea>
<!--
	Request envelope for the enclosing socket="ai.chat" form.
	index.js sets optional socket-key values immediately before the declarative
	actions="send" control runs, so blank optional fields stay out of the payload.
-->
<input
	type="hidden"
	data-ai-socket-field="uuid"
	socket-key="uuid" />
<input
	type="hidden"
	data-ai-socket-field="ai.prompt"
	value-evaluate="false"
	socket-key="ai.prompt" />
<input
	type="hidden"
	data-ai-socket-field="ai.persist"
	socket-key="ai.persist"
	value-type="boolean" />
<input
	type="hidden"
	data-ai-socket-field="ai.signal"
	value-evaluate="false" />
<input
	type="hidden"
	data-ai-socket-field="ai.parent_id"
	value-evaluate="false" />
<input
	type="hidden"
	data-ai-socket-field="ai.conversation_id"
	value-evaluate="false" />
<input
	type="hidden"
	data-ai-socket-field="ai.provider"
	socket-key="ai.provider" />
<input
	type="hidden"
	data-ai-socket-field="ai.model"
	socket-key="ai.model" />
<button
	class="ai-socket-send"
	type="button"
	actions="send"
	hidden
	aria-hidden="true"
	tabindex="-1"></button>
<div class="ai-composer-toolbar">
	<div class="ai-attach-picker">
		<button
			class="ai-attach"
			type="button"
			aria-label="Add to message"
			aria-controls="ai-attach-options"
			aria-expanded="false"
			aria-haspopup="menu"
			title="Add to message">
			<i
				src="/assets/svg/remix/add-line.svg"
				aria-hidden="true"></i>
		</button>
		<div
			id="ai-attach-options"
			class="ai-attach-options"
			role="menu"
			aria-label="Add to message"
			aria-hidden="true"
			aria-close-on="inside, outside">
			<button
				class="ai-attach-option"
				type="button"
				role="menuitem">
				<i
					src="/assets/svg/remix/attachment-2.svg"
					aria-hidden="true"></i>
				<span>Upload</span>
			</button>
		</div>
	</div>
	<div class="ai-composer-actions">
		<span class="ai-status">Connecting</span>
		<label class="ai-model-picker">
			<span class="visually-hidden">AI model</span>
			<select
				class="ai-model"
				state-id="ai-chat-model"
				aria-label="AI model">
				<optgroup label="Copilot">
					<option
						value="copilot:gpt-5-mini"
						data-provider="copilot"
						data-model="gpt-5-mini">
						gpt-5-mini
					</option>
				</optgroup>
				<optgroup label="OpenAI">
					<option
						value="openai:gpt-5.6-terra"
						data-provider="openai"
						data-model="gpt-5.6-terra"
						selected>
						gpt-5.6-terra
					</option>
					<option
						value="openai:gpt-5.6-sol"
						data-provider="openai"
						data-model="gpt-5.6-sol">
						gpt-5.6-sol
					</option>
					<option
						value="openai:gpt-5.6-luna"
						data-provider="openai"
						data-model="gpt-5.6-luna">
						gpt-5.6-luna
					</option>
					<option
						value="openai:gpt-5.5"
						data-provider="openai"
						data-model="gpt-5.5">
						gpt-5.5
					</option>
					<option
						value="openai:gpt-5.5-pro"
						data-provider="openai"
						data-model="gpt-5.5-pro">
						gpt-5.5-pro
					</option>
					<option
						value="openai:gpt-5.4"
						data-provider="openai"
						data-model="gpt-5.4">
						gpt-5.4
					</option>
					<option
						value="openai:gpt-5.4-pro"
						data-provider="openai"
						data-model="gpt-5.4-pro">
						gpt-5.4-pro
					</option>
					<option
						value="openai:gpt-5.4-mini"
						data-provider="openai"
						data-model="gpt-5.4-mini">
						gpt-5.4-mini
					</option>
					<option
						value="openai:gpt-5.4-nano"
						data-provider="openai"
						data-model="gpt-5.4-nano">
						gpt-5.4-nano
					</option>
					<option
						value="openai:gpt-5.3-codex"
						data-provider="openai"
						data-model="gpt-5.3-codex">
						gpt-5.3-codex
					</option>
					<option
						value="openai:gpt-5.2"
						data-provider="openai"
						data-model="gpt-5.2">
						gpt-5.2
					</option>
					<option
						value="openai:gpt-5.2-pro"
						data-provider="openai"
						data-model="gpt-5.2-pro">
						gpt-5.2-pro
					</option>
					<option
						value="openai:gpt-5.1"
						data-provider="openai"
						data-model="gpt-5.1">
						gpt-5.1
					</option>
					<option
						value="openai:gpt-5-pro"
						data-provider="openai"
						data-model="gpt-5-pro">
						gpt-5-pro
					</option>
					<option
						value="openai:gpt-5"
						data-provider="openai"
						data-model="gpt-5">
						gpt-5
					</option>
					<option
						value="openai:gpt-5-mini"
						data-provider="openai"
						data-model="gpt-5-mini">
						gpt-5-mini
					</option>
					<option
						value="openai:gpt-4.1"
						data-provider="openai"
						data-model="gpt-4.1">
						gpt-4.1
					</option>
				</optgroup>
				<optgroup label="Gemini">
					<option
						value="gemini:gemini-1.5-flash"
						data-provider="gemini"
						data-model="gemini-1.5-flash">
						gemini-1.5-flash
					</option>
					<option
						value="gemini:gemini-1.5-pro"
						data-provider="gemini"
						data-model="gemini-1.5-pro">
						gemini-1.5-pro
					</option>
				</optgroup>
			</select>
		</label>
		<button
			class="ai-dictate"
			type="button"
			speech-recognition
			speech-recognition-query="$closest .ai-composer .ai-prompt"
			speech-recognition-lang="en-US"
			speech-recognition-interim-results="true"
			aria-label="Start dictation"
			title="Start dictation">
			<i
				src="/assets/svg/remix/mic-line.svg"
				aria-hidden="true"></i>
			<i
				src="/assets/svg/remix/stop-fill.svg"
				aria-hidden="true"></i>
		</button>
		<button
			class="ai-send"
			type="submit"
			aria-label="Send message">
			<i
				src="/assets/svg/remix/arrow-up-line.svg"
				aria-hidden="true"></i>
		</button>
		<button
			class="ai-stop"
			type="button"
			aria-label="Stop generating"
			hidden>
			<i
				src="/assets/svg/remix/stop-fill.svg"
				aria-hidden="true"></i>
		</button>
	</div>
</div>
