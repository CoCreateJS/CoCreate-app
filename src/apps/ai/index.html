<link
	rel="stylesheet"
	href="/apps/ai/index.css" />

<div
	class="ai-shell"
	data-ai-chat>
	<aside class="ai-sidebar">
		<div class="ai-sidebar-heading">
			<div class="ai-sidebar-label">Conversations</div>
			<button
				class="ai-new-chat"
				type="button"
				aria-label="New conversation"
				title="New conversation">
				<i
					class="ri-add-line"
					aria-hidden="true"></i>
			</button>
		</div>
		<div
			class="ai-thread-list"
			array="ai-conversations"
			object
			render-query="[template='ai-conversation-template']"
			filter-query-key="user_id"
			filter-query-value="$user_id"
			filter-sort-key="modified.on"
			filter-sort-direction="desc">
			<button
				template="ai-conversation-template"
				type="button"
				class="ai-thread"
				data-conversation-id="{{object._id}}"
				data-provider="{{object.provider}}"
				data-model="{{object.model}}">
				<div class="ai-thread-title">
					<span>{{object.title}}</span>
					<small>
						<input
							type="date"
							value="{{object.modified.on}}"
							value-type="timeAgo"
							time-ago-units="week, day"
							onload-query="$next"
							onload.value="$value"
							hidden />
						<span></span>
					</small>
				</div>
			</button>
		</div>
	</aside>

	<main class="ai-main">
		<header class="ai-header">
			<div class="ai-brand">
				<div
					class="ai-logo"
					aria-hidden="true">
					AI
				</div>
				<div class="ai-brand-copy">
					<strong>CoCreate AI</strong>
					<div class="ai-model-picker">
						<button
							class="ai-model-trigger"
							type="button"
							aria-controls="ai-model-options"
							aria-expanded="false"
							aria-haspopup="listbox">
							<span class="ai-model-value">OpenAI · gpt-5.6-terra</span>
						</button>
						<div
							id="ai-model-options"
							class="ai-model-options"
							role="listbox"
							aria-hidden="true"
							aria-close-on="inside, outside"
							aria-label="AI model"></div>
					</div>
					<input
						class="ai-provider"
						type="hidden"
						value="openai" />
					<input
						class="ai-model"
						type="hidden"
						value="gpt-5.6-terra" />
				</div>
			</div>

			<div class="ai-settings">
				<span class="ai-status">Connecting</span>
			</div>
		</header>

		<section
			class="ai-messages"
			aria-live="polite">
			<div class="ai-empty">
				<h1>What will you build today?</h1>
				<p>
					Build apps and websites, manage servers, organize CRM work, and
					turn your next business task into action—without leaving CoCreate.
				</p>
			</div>
		</section>

		<form class="ai-composer">
			<textarea
				class="ai-prompt"
				rows="1"
				placeholder="Message CoCreate AI…"
				aria-label="Prompt"
				required></textarea>
			<button
				class="ai-send"
				type="submit"
				aria-label="Send message">
				<i
					class="ri-arrow-up-line"
					aria-hidden="true"></i>
			</button>
		</form>
	</main>
</div>

<script src="/apps/ai/index.js"></script>
