<div
	class="ai-shell"
	plugin='{"$Prism.highlightAllUnder":["$this"]}'
	state-id="aiChat"
	conversation-id=""
	data-ai-chat>
	<link
		rel="stylesheet"
		href="/apps/ai/index.css" />

	<aside
		id="ai-conversations-sidebar"
		class="ai-sidebar"
		aria-hidden="true">
		<div class="ai-sidebar-heading">
			<div class="ai-sidebar-label">Conversations</div>
			<button
				class="ai-new-chat"
				type="button"
				state-to="aiChat"
				state.conversation-id=""
				aria-label="New conversation"
				title="New conversation">
				<i
					class="ri-add-line"
					aria-hidden="true"></i>
			</button>
		</div>
		<div class="search-box flex-shrink-0">
			<div class="input-group">
				<input
					id="search-ai-conversations"
					type="text"
					class="form-control search search-sm"
					placeholder="Search for..."
					filter-search
					filter-query="$document #ai-conversations-sidebar .ai-thread-list" />
			</div>
			<i
				class="ri-search-line search-icon"
				style="pointer-events: none"></i>
		</div>
		<div class="ai-thread-scroll-container">
			<div
				class="ai-thread-scroll"
				plugin='{"$SimpleBar": ["$this", {}]}'>
				<div
					class="ai-thread-list"
					array="ai-conversations"
					object
					render-query="[template='ai-conversation-template']"
					filter-query-key="user_id"
					filter-query-value="$user_id"
					filter-sort-key="modified.on"
					filter-sort-direction="desc">
					<button
						template="ai-conversation-template"
						type="button"
						class="ai-thread"
						data-conversation-id="{{object._id}}"
						state-to="aiChat"
						state.conversation-id="{{object._id}}"
						data-provider="{{object.provider}}"
						data-model="{{object.model}}">
						<div class="ai-thread-title">
							<span>{{object.title}}</span>
						</div>
					</button>
				</div>
			</div>
		</div>
	</aside>
	<button
		type="button"
		tabindex="-1"
		class="ai-sidebar-backdrop"
		aria-label="Close conversations"
		aria-controls="ai-conversations-sidebar"
		aria-close
		aria-expanded="false"
		state-to="ai-chat-btn"
		state.$unset="$click"></button>

	<main class="ai-main">
		<header
			class="ai-topbar"
			role="toolbar"
			aria-label="AI chat controls">
			<button
				class="ai-sidebar-toggle"
				type="button"
				aria-label="Toggle conversations"
				aria-controls="ai-conversations-sidebar"
				aria-expanded="false"
				title="Conversations">
				<i
					class="ri-menu-2-line align-middle fs-22"
					aria-hidden="true"></i>
			</button>
			<button
				class="ai-new-chat"
				type="button"
				state-to="aiChat"
				state.conversation-id=""
				aria-label="New conversation"
				title="New conversation">
				<i
					class="ri-add-line"
					aria-hidden="true"></i>
			</button>
			<div
				class="ai-topbar-actions"
				role="group"
				aria-label="Window controls">
				<button
					type="button"
					class="ai-chat-panel-fullscreen"
					fullscreen
					fullscreen-query="$closest .ai-shell"
					aria-label="Toggle fullscreen"
					title="Fullscreen">
					<i
						class="ri-fullscreen-line align-middle fs-22"
						aria-hidden="true"></i>
					<i
						class="ri-fullscreen-exit-line align-middle fs-22"
						aria-hidden="true"></i>
				</button>
				<button
					type="button"
					class="ai-chat-panel-dock d-none d-md-grid"
					aria-label="Dock AI chat in main view"
					aria-controls="ai-chat-panel"
					aria-close
					aria-expanded="false"
					title="Dock left">
					<i
						class="align-middle fs-22"
						src="/assets/svg/sidebar-fold-line.svg"
						aria-hidden="true"></i>
				</button>
				<button
					type="button"
					class="ai-chat-panel-close"
					aria-label="Close AI chat"
					aria-controls="ai-chat-panel"
					aria-close
					aria-expanded="false"
					title="Close">
					<i
						class="ri-close-line align-middle fs-22"
						aria-hidden="true"></i>
				</button>
			</div>
		</header>

		<section
			class="ai-message-scroll"
			plugin='{"$SimpleBar": ["$this", {}]}'>
			<div
				class="ai-messages"
				aria-live="polite">
				<div class="ai-empty">
					<h1>What will you build today?</h1>
					<p>
						Build apps and websites, manage servers, organize CRM
						work, and turn your next business task into
						action—without leaving CoCreate.
					</p>
				</div>
			</div>
		</section>

		<form class="ai-composer">
			<details
				class="ai-steer-queue"
				hidden>
				<summary>
					<i
						class="ri-stack-line"
						aria-hidden="true"></i>
					<span class="ai-steer-count">0 queued messages</span>
				</summary>
				<div class="ai-steer-items"></div>
			</details>
			<textarea
				class="ai-prompt"
				rows="1"
				placeholder="Message CoCreate AI…"
				aria-label="Prompt"
				required></textarea>
			<div class="ai-composer-toolbar">
				<div class="ai-attach-picker">
					<button
						class="ai-attach"
						type="button"
						aria-label="Add to message"
						aria-controls="ai-attach-options"
						aria-expanded="false"
						aria-haspopup="menu"
						title="Add to message">
						<i
							class="ri-add-line"
							aria-hidden="true"></i>
					</button>
					<div
						id="ai-attach-options"
						class="ai-attach-options"
						role="menu"
						aria-label="Add to message"
						aria-hidden="true"
						aria-close-on="inside, outside">
						<button
							class="ai-attach-option"
							type="button"
							role="menuitem">
							<i
								class="ri-attachment-2"
								aria-hidden="true"></i>
							<span>Upload</span>
						</button>
					</div>
				</div>
				<div class="ai-composer-actions">
					<span class="ai-status">Connecting</span>
					<div class="ai-model-picker">
						<button
							class="ai-model-trigger"
							type="button"
							aria-controls="ai-model-options"
							aria-expanded="false"
							aria-haspopup="listbox">
							<span class="ai-model-value"
								>OpenAI · gpt-5.6-terra</span
							>
						</button>
						<div
							id="ai-model-options"
							class="ai-model-options"
							role="listbox"
							aria-hidden="true"
							aria-close-on="inside, outside"
							aria-label="AI model"></div>
					</div>
					<button
						class="ai-dictate"
						type="button"
						speech-recognition
						speech-recognition-query="$closest .ai-composer .ai-prompt"
						speech-recognition-lang="en-US"
						speech-recognition-interim-results="true"
						aria-label="Start dictation"
						title="Start dictation">
						<i
							class="ri-mic-line"
							aria-hidden="true"></i>
						<i
							class="ri-stop-fill"
							aria-hidden="true"></i>
					</button>
					<button
						class="ai-send"
						type="submit"
						aria-label="Send message"
						hidden>
						<i
							class="ri-arrow-up-line"
							aria-hidden="true"></i>
					</button>
					<button
						class="ai-stop"
						type="button"
						aria-label="Stop generating"
						hidden>
						<i
							class="ri-stop-fill"
							aria-hidden="true"></i>
					</button>
				</div>
				<input
					class="ai-provider"
					type="hidden"
					value="openai" />
				<input
					class="ai-model"
					type="hidden"
					value="gpt-5.6-terra" />
			</div>
		</form>
	</main>

	<script
		src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"
		crossorigin="anonymous"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"
		crossorigin="anonymous"></script>
	<script src="/apps/ai/index.js"></script>
</div>
