<form
	class="app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	data-component-form
	array
	object
	autocomplete="off">
	<header
		class="card-header offcanvas-app-topbar flex-shrink-0"
		src="/apps/files/header.html"
		aria-label="Details controls"></header>

	<div
		class="component-form-body flex-grow-1 min-height:0"
		plugin='{"$SimpleBar": ["$this", {}]}'>
		<div class="card-body d-flex flex-column gap-4">
	<section class="d-flex flex-wrap align-items-center gap-3">
		<div
			class="avatar-lg rounded-circle d-flex align-items-center justify-content-center bg-primary-subtle text-primary material-shadow fs-24">
			<i class="ri-file-code-line"></i>
		</div>
		<div
			class="flex-grow-1"
			style="min-width: 220px">
			<h4
				class="mb-1 text-break"
				key="name"></h4>
			<code
				class="text-muted text-break"
				key="pathname"></code>
		</div>
		<span
			class="badge bg-primary-subtle text-primary"
			key="content-type"></span>
	</section>

	<section class="border-top border-top-dashed pt-3">
		<h6 class="text-muted text-uppercase fw-semibold mb-3">
			File metadata
		</h6>
		<div class="d-flex flex-wrap gap-3">
			<div
				class="border border-dashed rounded p-3 flex-grow-1"
				style="flex-basis: 220px; min-width: 180px">
				<span class="text-muted d-block mb-1">Directory</span>
				<code
					class="text-break"
					key="directory"></code>
			</div>
			<div
				class="border border-dashed rounded p-3 flex-grow-1"
				style="flex-basis: 160px; min-width: 140px">
				<span class="text-muted d-block mb-1">Size</span>
				<span key="size"></span>
				<span class="text-muted"> bytes</span>
			</div>
			<div
				class="border border-dashed rounded p-3 flex-grow-1"
				style="flex-basis: 160px; min-width: 140px">
				<span class="text-muted d-block mb-1">Status</span>
				<span key="status"></span>
			</div>
		</div>
	</section>

	<section class="border-top border-top-dashed pt-3">
		<h6 class="text-muted text-uppercase fw-semibold mb-3">Headers</h6>
		<pre
			class="bg-light border rounded p-3 mb-0 text-wrap"><code key="headers" value-type="json"></code></pre>
	</section>
</div>
	</div>
</form>
