<link rel="stylesheet" href="/apps/files/templates/card.css" />
<article class="card files-media-card mb-0" template data-select-card
    array="{{object.$array[0]}}" object="{{object._id}}" read="false"
    data-media-type="{{object.content-type}}" data-media-path="{{object.pathname}}">
    <div class="files-media-header">
        <i class="ri-file-fill files-media-kind-icon" aria-hidden="true"></i>
        <h5 class="files-media-name" title="{{object.name}}"><span class="files-record-name" data-file-kind="{{object.content-type}}"><a class="files-folder-link text-reset text-decoration-none" role="button" tabindex="0" state="{&quot;files-folders&quot;:{&quot;hidden&quot;:false,&quot;read&quot;:&quot;true&quot;},&quot;list&quot;:{&quot;filter-query-value&quot;:&quot;text/directory&quot;,&quot;filter-sort-key&quot;:&quot;name&quot;,&quot;filter-sort-direction&quot;:&quot;asc&quot;},&quot;files-path&quot;:{&quot;value&quot;:&quot;{{object.pathname}}&quot;}}">{{object.name}}</a><a class="files-file-link text-reset text-decoration-none" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/files/aside.html" aria-controls="offcanvas-app" aria-open data-card-open><span hidden state-to="offcanvas-app-form" state.array="files" state.object="{{object._id}}"></span>{{object.name}}</a></span></h5>
        <button type="button" class="files-media-menu-toggle" aria-expanded="false"
            aria-haspopup="menu" aria-controls="file-card-menu-{{object._id}}"
            aria-label="Actions for {{object.name}}">
            <i class="ri-more-2-fill" aria-hidden="true"></i>
        </button>
        <ul id="file-card-menu-{{object._id}}" class="dropdown-menu dropdown-menu-end"
            aria-hidden="true" aria-close-on="anywhere">
            <li>
                <button type="button" class="dropdown-item files-media-favorite" aria-pressed="false"
                    aria-label="Favorite {{object.name}}">
                    <i class="ri-star-line me-2" aria-hidden="true"></i><span data-media-favorite-label>Add to favorites</span>
                </button>
            </li>
        </ul>
    </div>
    <div class="files-media-preview">
        <div class="files-media-placeholder" aria-hidden="true">
            <i class="ri-file-line"></i><span data-media-label>File</span>
        </div>
        <input type="hidden" data-media-stars key="starred" value-type="json" />
        <input type="hidden" data-media-user value="$user_id" />
    </div>
    <span class="files-media-error text-danger" role="status"></span>
</article>
<script src="/apps/files/templates/card.js"></script>
