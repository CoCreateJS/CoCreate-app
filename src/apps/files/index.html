<link rel="stylesheet" href="/apps/files/index.css" />

<div class="container-fluid">
	<div class="chat-wrapper d-lg-flex gap-1 p-1">
		<div
			class="file-manager-sidebar minimal-border"
			src="/portal/apps/files/components/sidenav.html"></div>

		<div class="file-manager-content minimal-border w-100 p-3 py-0">
			<div
				class="mx-n3 pt-4 px-4 file-manager-content-scroll"
				plugin='{"$SimpleBar": ["$this", {}]}'>
				<div id="folder-list" class="mb-2">
					<div class="row justify-content-beetwen g-2 mb-3">
						<div class="col">
							<div class="d-flex align-items-center">
								<div
									class="flex-shrink-0 me-2 d-block d-lg-none">
									<button
										type="button"
										class="btn btn-soft-success btn-icon btn-sm fs-16 file-menu-btn">
										<i
											class="ri-menu-2-fill align-bottom"></i>
									</button>
								</div>
								<div class="flex-grow-1">
									<h5 class="fs-16 mb-0">Folders</h5>
								</div>
							</div>
						</div>
						<!--end col-->
						<div class="col-auto">
							<div class="d-flex gap-2 align-items-start">
								<select
									class="form-control"
									plugin='{"$Choices":["$this",{}]}'
									data-choices-search-false
									name="choices-single-default"
									id="file-type">
									<option value="">File Type</option>
									<option value="All" selected>All</option>
									<option value="Video">Video</option>
									<option value="Images">Images</option>
									<option value="Music">Music</option>
									<option value="Documents">Documents</option>
								</select>

								<button
									class="btn btn-success w-sm create-folder-modal flex-shrink-0"
									data-bs-toggle="modal"
									data-bs-target="#createFolderModal">
									<i
										class="ri-add-line align-bottom me-1"></i>
									Create Folders
								</button>
							</div>
						</div>
						<!--end col-->
					</div>
					<!--end row-->
					<div filter-query="$next" filter-query-key="pathname" filter-query-value=""></div>
					<div
						class="d-flex flex-wrap gap-3"
						id="folderlist-data"
						array="files"
						object
						render-query="[template]"
						filter-limit="20"
						filter-query-key="content-type"
						filter-query-value="text/directory">
						<div class="card bg-light shadow-none flex-grow-1 width:200px mb-0" template>
							<div class="card-body d-flex align-items-center gap-3">
								<i
									class="ri-folder-2-fill align-bottom text-warning font-size-24"></i>

								<h6 class="flex-grow-1 fs-15 folder-name">
									{{object.name}}
								</h6>
								<div
									class="dropdown"
									src="/portal/apps/files/components/options-dropdown.html"></div>

								<!-- <div class="hstack mt-4 text-muted">
									<span class="me-auto"
										><b>{{object.fileCount}}</b> Files</span
									>
									<span><b>{{object.size}}</b>GB</span>
								</div> -->
							</div>
						</div>
					</div>
					<div>
						<div class="d-flex align-items-center mb-3">
							<h5
								class="flex-grow-1 fs-16 mb-0"
								id="filetype-title">
								Recent File
							</h5>
							<div class="flex-shrink-0">
								<button
									class="btn btn-success createFile-modal"
									data-bs-toggle="modal"
									data-bs-target="#createFileModal">
									<i
										class="ri-add-line align-bottom me-1"></i>
									Create File
								</button>
							</div>
						</div>
						<div class="table-responsive">
							<table class="table align-middle table-nowrap mb-0">
								<thead class="table-active">
									<tr>
										<th scope="col">Name</th>
										<th scope="col">File Item</th>
										<th scope="col">File Size</th>
										<th scope="col">Recent Date</th>
										<th scope="col" class="text-center">
											Actions
										</th>
									</tr>
								</thead>
								<tbody id="file-list"></tbody>
							</table>
						</div>
						<ul
							id="pagination"
							class="pagination pagination-lg"></ul>
						<div
							class="align-items-center mt-2 row g-3 text-center text-sm-start">
							<div class="col-sm">
								<div class="text-muted">
									Showing<span class="fw-semibold">4</span> of
									<span class="fw-semibold">125</span> Results
								</div>
							</div>
							<div class="col-sm-auto">
								<ul
									class="pagination pagination-separated pagination-sm justify-content-center justify-content-sm-start mb-0">
									<li class="page-item disabled">
										<a href="#" class="page-link">←</a>
									</li>
									<li class="page-item">
										<a href="#" class="page-link">1</a>
									</li>
									<li class="page-item active">
										<a href="#" class="page-link">2</a>
									</li>
									<li class="page-item">
										<a href="#" class="page-link">3</a>
									</li>
									<li class="page-item">
										<a href="#" class="page-link">→</a>
									</li>
								</ul>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div
				class="file-manager-detail-content minimal-border p-3 py-0"
				src="components/overview.html"></div>
		</div>
	</div>
	<!-- container-fluid -->

	<!-- apexcharts -->
	<script src="/assets/libs/apexcharts/apexcharts.min.js"></script>
</div>

<style>
	/* Responsive folder grid: auto-fit columns with base 150px and max 200px */
	.folder-grid {
		display: grid;
		grid-template-columns: repeat(auto-fit, minmax(150px, 200px));
		gap: 1rem;
		align-items: start;
	}

	/* Make each card fill its grid cell and layout content vertically */
	.folder-grid .card {
		width: 100%;
		height: 100%;
		display: flex;
		flex-direction: column;
	}

	/* Ensure the card body expands so footer/stats stay at bottom */
	.folder-grid .card .card-body {
		display: flex;
		flex-direction: column;
		justify-content: space-between;
		height: 100%;
		padding: 1rem;
	}

	/* Slightly scale folder icon to look consistent in tiles */
	.folder-grid .card .ri-folder-2-fill {
		font-size: 2.5rem;
		line-height: 1;
	}

	/* Smaller screens: allow narrower tiles and tighter gaps */
	@media (max-width: 480px) {
		.folder-grid {
			grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
			gap: 0.5rem;
		}
	}
</style>
