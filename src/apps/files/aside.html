<div
	id="files-aside"
	class="offcanvas-app-shell app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	role="region"
	aria-label="Files record">
	<header
		src="/components/offcanvas-app/header.html"
		value-replace="/\{\{app\.name\}\}/g"
		value-replacement="Files"
		value-type="outerHtml"></header>
	<div
		class="component-form-body flex-grow-1 min-height:0"
		onload.plugin='({"$SimpleBar": ["$this", {}]})'
		onload-query=".offcanvas-app-view > form > .card-body[]">
		<div
			id="Files-details-view"
			class="offcanvas-app-view"
			data-view="details"
			role="tabpanel"
			aria-labelledby="Files-details-btn"
			tabindex="0"
			src="/apps/files/components/details.html"
			aria-hidden="false"
			state-id="files-details"
			state.aria-hidden
			hidden></div>
		<div
			id="Files-form-view"
			class="offcanvas-app-view"
			data-view="form"
			role="tabpanel"
			aria-labelledby="Files-form-btn"
			tabindex="0"
			src="/apps/files/components/form.html"
			aria-hidden="true"
			state-id="files-form"
			state.aria-hidden
			hidden></div>
		<div
			id="Files-codearea-view"
			class="offcanvas-app-view"
			data-view="codearea"
			role="tabpanel"
			aria-labelledby="Files-codearea-btn"
			tabindex="0"
			src="/components/offcanvas-app/codearea.html"
			aria-hidden="true"
			state-id="files-codearea"
			state.aria-hidden
			hidden></div>
	</div>
</div>
