<link rel="stylesheet" href="/apps/files/index.css" />

<div class="card flex-grow-1 min-height:0 mb-0 overflow-hidden">
	<div class="card-body min-height:0">
		<div class="table-responsive">
			<table class="table align-middle table-nowrap mb-0">
				<thead class="table-active">
					<tr>
						<th scope="col">Name</th>
						<th scope="col">Type</th>
						<th scope="col">File Size</th>
						<th scope="col">Modified</th>
						<th scope="col" class="text-center">Actions</th>
					</tr>
				</thead>
				<tbody
					id="file-list"
					array="files"
					object
					filter-query-key="path"
					filter-query-value="/"
					filter-sort-key="name"
					filter-sort-direction="asc"
					filter-limit="20"
					render-query="[template]">
					<tr class="d-none">
						<td
							filter-query="$parent"
							filter-query-key="content-type.$ne"
							filter-query-value="text/directory"></td>
					</tr>
					<tr template>
						<td>
							<a
								role="button"
								state-to="offcanvas-app-view"
								state.src="/apps/files/aside.html"
								aria-controls="offcanvas-app"
								aria-expanded="false"
								aria-open>
								<span
									hidden
									state-to="offcanvas-app-form"
									state.array="files"
									state.object="{{object._id}}"></span>
								<i class="ri-file-line me-2 text-muted"></i>
								{{object.name}}
							</a>
						</td>
						<td>{{object.content-type}}</td>
						<td>{{object.size}}</td>
						<td>{{object.modified.on}}</td>
						<td class="text-center">
							<div class="dropdown" src="/apps/files/components/options-dropdown.html"></div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>
