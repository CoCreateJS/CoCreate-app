<form
	state-id="offcanvas-app-form"
	class="app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	data-component-form
	array
	object
	autocomplete="off">
	<header
		class="card-header offcanvas-app-topbar flex-shrink-0"
		src="/apps/files/header.html"
		aria-label="Form controls"></header>
	<div
		class="component-form-body flex-grow-1 min-height:0"
		plugin='{"$SimpleBar": ["$this", {}]}'>
		<div class="card-body d-flex flex-column gap-4">
			<input
				type="hidden"
				key="_id" />

			<section>
				<h5 class="text-uppercase fw-semibold mb-3">File identity</h5>
				<div class="d-flex flex-wrap gap-3">
					<label
						class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:240px min-width:200px">
						Name
						<input
							type="text"
							key="name"
							class="form-control"
							placeholder="index.html"
							required />
					</label>
					<label
						class="form-label d-flex flex-column gap-1 flex-grow-2 flex-basis:360px min-width:240px">
						Pathname
						<input
							type="text"
							key="pathname"
							class="form-control font-monospace"
							placeholder="/index.html"
							required />
					</label>
					<label
						class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:220px min-width:180px">
						Directory
						<input
							type="text"
							key="directory"
							class="form-control font-monospace"
							placeholder="/" />
					</label>
				</div>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<h5 class="text-uppercase fw-semibold mb-3">Metadata</h5>
				<div class="d-flex flex-wrap gap-3">
					<label
						class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:240px min-width:200px">
						Content type
						<input
							type="text"
							key="content-type"
							class="form-control"
							placeholder="text/html" />
					</label>
					<label
						class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:180px min-width:160px">
						Type
						<input
							type="text"
							key="type"
							class="form-control"
							placeholder="file" />
					</label>
					<label
						class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:180px min-width:160px">
						Status
						<input
							type="text"
							key="status"
							class="form-control"
							placeholder="active" />
					</label>
					<label
						class="form-label d-flex flex-column gap-1 flex-grow-1 flex-basis:160px min-width:140px">
						Size (bytes)
						<input
							type="number"
							key="size"
							class="form-control"
							readonly />
					</label>
				</div>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<h5 class="text-uppercase fw-semibold mb-3">
					Serving configuration
				</h5>
				<div class="d-flex flex-column gap-3">
					<label class="form-label d-flex flex-column gap-1">
						Headers
						<textarea
							key="headers"
							value-type="json"
							class="form-control font-monospace"
							rows="6"
							spellcheck="false"
							placeholder='{"cache-control":"public, max-age=3600"}'></textarea>
					</label>
					<label class="form-label d-flex flex-column gap-1">
						Languages
						<textarea
							key="languages"
							value-type="json"
							class="form-control font-monospace"
							rows="3"
							spellcheck="false"
							placeholder='["en", "es"]'></textarea>
					</label>
					<label class="form-label d-flex flex-column gap-1">
						Sitemap
						<textarea
							key="sitemap"
							value-type="json"
							class="form-control font-monospace"
							rows="5"
							spellcheck="false"
							placeholder="{}"></textarea>
					</label>
				</div>
			</section>
		</div>
	</div>
	<footer class="card-footer flex-shrink-0">
		<div class="hstack gap-2 justify-content-end">
			<button
				type="button"
				class="btn btn-light"
				aria-label="Cancel form"
				aria-controls="offcanvas-app"
				data-panel-close="offcanvas-app"
				aria-expanded="true"
				aria-close>
				Cancel
			</button>
			<button
				type="button"
				class="btn btn-light"
				aria-label="Cancel form"
				aria-controls="create-panel"
				data-panel-close="create-panel"
				aria-expanded="true"
				aria-close>
				Cancel
			</button>
			<button
				class="btn btn-success btn-spinner"
				aria-label="Save form"
				actions="validate, disabled, save, timeout(2000), disabled">
				<span
					class="spinner-border spinner-border-sm display:none"
					role="status"
					aria-hidden="true"></span>
				<span class="button-text">Save</span>
			</button>
		</div>
	</footer>
</form>
