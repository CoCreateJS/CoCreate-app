<div
	class="files-grid-sections"
	aria-label="Starred files and folders">
	<div
		class="files-card-grid"
		array="files"
		object
		filter-query-key="starred"
		filter-query-value="$user_id"
		filter-sort-key="name"
		filter-sort-direction="asc"
		filter-limit="20"
		render-query="[template]">
		<div
			class="d-none"
			filter-query="$parent"
			filter-query-key="deleted.$ne"
			value="true"
			value-type="boolean"></div>

		<div
			class="card bg-light shadow-none mb-0"
			template>
			<div class="card-body d-flex align-items-center gap-3">
				<i src="/assets/svg/remix/folder-2-fill.svg" class="fs-24 flex-shrink-0"></i>
				<div class="flex-grow-1 min-width:0">
					<h6 class="fs-15 mb-1 text-truncate">{{object.name}}</h6>
				</div>
				<i src="/assets/svg/remix/star-fill.svg" class="text-warning flex-shrink-0"
					aria-hidden="true"></i>
			</div>
		</div>
	</div>
</div>
