<div class="component-list-table">
	<link
		rel="stylesheet"
		href="/components/list/table.css" />
		<div class="app-panel-body">
			<div class="table-card">
				<table
					id="table"
					data-row-selection
					state-id="app"
					array="apps"
					object=""
					key="fields"
					filter-limit
					render-query="[template='column'][]"
					input.array=""
					input-set-timeout="500"
					input-query="tbody:not([hidden])[]"
					class="table align-middle">
					<colgroup>
						<col class="table-selection-track" />
					</colgroup>
					<thead>
						<tr>
							<th
								class="table-selection-column"
								scope="col">
								<div class="form-check mb-0">
									<input
										class="form-check-input"
										type="checkbox"
										data-select-all
										aria-label="Select all loaded rows" />
								</div>
							</th>
							<!-- Render each column header dynamically -->
							<th
								template="column"
								render-as="column"
								data-export-key="{{column.key}}"
								data-export-label="{{column.label}}"
								scope="col">
								<div
									class="d-flex align-items-center justify-content-between gap-2">
									<span>{{column.label}}</span>
									<a
										class="float-end"
										filter-query="$closest table tbody:not([hidden])[]"
										filter-sort-key="{{column.key}}"
										filter-sort-direction=""
										click
										click.filter-sort-direction="asc, desc">
										<i
											toggle.src="/assets/svg/sort-down.svg, /assets/svg/sort-up.svg"
											src="/assets/svg/sort.svg"></i>
									</a>
								</div>
							</th>
							<th
								class="table-fill-column"
								aria-hidden="true"></th>
						</tr>
					</thead>
					<tbody
						class="form-check-all list-view"
						state-id="files-folders" read="false" hidden data-files-results
                        filter-query-key="content-type" filter-query-value="text/directory"
						filter-sort-key="name"
						filter-sort-direction="asc"
						array="files"
						object
						filter-limit="0"
						render-query="tr[template]">
						<tr template>
							<td class="table-selection-column">
								<div class="form-check mb-0">
									<input
										class="form-check-input"
										type="checkbox"
										name="selected[]"
										value="{{object._id}}"
										array="{{object.$array[0]}}"
										object="{{object._id}}"
										data-select-row
										aria-label="Select row {{object._id}}" />
								</div>
							</td>
							<td
								template="column"
								render-as="column"
								value-type="html">
								{{column.tableTemplate}}
							</td>
							<td
								class="table-fill-column"
								aria-hidden="true"></td>
						</tr>
					</tbody>
					<tbody
						class="form-check-all list-view"
						state-id="list" data-files-results
                        filter-query-key="content-type.$ne" filter-query-value=""
						filter-sort-key="modified.on"
						filter-sort-direction="desc"
						array="files"
						object
						filter-limit="10"
						render-query="tr[template]">
						<tr template>
							<td class="table-selection-column">
								<div class="form-check mb-0">
									<input
										class="form-check-input"
										type="checkbox"
										name="selected[]"
										value="{{object._id}}"
										array="{{object.$array[0]}}"
										object="{{object._id}}"
										data-select-row
										aria-label="Select row {{object._id}}" />
								</div>
							</td>
							<td
								template="column"
								render-as="column"
								value-type="html">
								{{column.tableTemplate}}
							</td>
							<td
								class="table-fill-column"
								aria-hidden="true"></td>
						</tr>
						<tr
							style="height: 20px"
							filter-limit="10" filter-on="scroll"
							filter-query="$parent"></tr>
					</tbody>
				</table>

			</div>
			<!-- <div class="d-flex justify-content-end mt-3">
			<div class="pagination-wrap hstack gap-2">
				<a class="page-item pagination-prev disabled" href="#">
					Previous
				</a>
				<ul class="pagination listjs-pagination mb-0"></ul>
				<a class="page-item pagination-next" href="#"> Next </a>
			</div>
		</div> -->
		</div>
</div>
<!--end card-->
<script src="/components/list/selection.js"></script>
