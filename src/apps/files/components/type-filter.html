<style>
	#fileTypeMoreButton {
		border-bottom-left-radius: 0;
		border-left: 0;
		border-top-left-radius: 0;
		border-left-width: 0;
	}

	#fileTypeMoreMenu .btn-check:checked + .dropdown-item {
		color: var(--coc-primary);
		background-color: var(--coc-primary-bg-subtle);
	}

	#fileTypeMoreMenu .btn-check:focus-visible + .dropdown-item {
		outline: 2px solid var(--coc-primary);
		outline-offset: -2px;
	}

	.dropdown:has(> #fileTypeMoreMenu .btn-check:checked) > #fileTypeMoreButton {
		color: var(--coc-btn-active-color);
		background-color: var(--coc-primary);
	}
</style>
