<div
	id="folderlist-data"
	class="file-folder-cards files-card-grid"
	array="files"
	object
	filter-query-key="path"
	filter-query-value="/"
	filter-sort-key="name"
	filter-sort-direction="asc"
	filter-limit="20"
	render-query="[template]">
	<div
		class="d-none"
		filter-query="$parent"
		filter-query-key="content-type"
		filter-query-value="text/directory"></div>
	<div class="card bg-light shadow-none mb-0" template>
		<div class="card-body d-flex align-items-center gap-3">
			<i class="ri-folder-2-fill text-warning font-size-24"></i>
			<h6 class="flex-grow-1 fs-15 mb-0 text-truncate">{{object.name}}</h6>
			<div class="dropdown" src="/apps/files/components/options-dropdown.html"></div>
		</div>
	</div>
</div>
