<div class="app-panel component-list-table">
	<link
		rel="stylesheet"
		href="/components/list/table.css" />
	<div
		class="h-100"
		scrollbar>
		<div class="table-card">
			<table
				id="table"
				data-row-selection
				state-id="app"
				array="apps"
				object=""
				key="fields"
				filter-limit
				render-query="[template='column'][]"
				class="table align-middle">
				<colgroup>
					<col class="table-selection-track" />
				</colgroup>
				<thead>
					<tr>
						<th
							class="table-selection-column"
							scope="col">
							<div class="form-check mb-0">
								<input
									class="form-check-input"
									type="checkbox"
									data-select-all
									aria-label="Select all loaded rows" />
							</div>
						</th>
						<!-- Render each column header dynamically -->
						<th
							template="column"
							render-as="column"
							data-export-key="{{column.key}}"
							data-export-label="{{column.label}}"
							scope="col">
							<div
								class="d-flex align-items-center justify-content-between gap-2">
								<span>{{column.label}}</span>
								<a
									class="float-end"
									filter-query="$closest table tbody:not([hidden])[]"
									filter-sort-key="{{column.key}}"
									filter-sort-direction=""
									click
									click.filter-sort-direction="asc, desc">
									<i
										toggle.src="/assets/svg/sort-down.svg, /assets/svg/sort-up.svg"
										src="/assets/svg/sort.svg"></i>
								</a>
							</div>
						</th>
						<th
							class="table-fill-column"
							aria-hidden="true"></th>
					</tr>
				</thead>
				<tbody
					class="form-check-all list-view"
					id="files-folders"
					state-id="files-folders"
					data-files-results
					data-files-kind="folders"
					hidden
					filter-query-key="content-type"
					filter-query-value="text/directory"
					filter-sort-key="name"
					filter-sort-direction="asc"
					array=""
					object
					filter-limit="20"
					render-query="tr[template]">
					<tr template>
						<td class="table-selection-column">
							<div class="form-check mb-0">
								<input
									class="form-check-input"
									type="checkbox"
									name="selected[]"
									value="{{object._id}}"
									array="{{object.$array[0]}}"
									object="{{object._id}}"
									data-select-row
									aria-label="Select row {{object._id}}" />
							</div>
						</td>
						<td
							template="column"
							render-as="column"
							value-type="html">
							{{column.tableTemplate}}
						</td>
						<td
							class="table-fill-column"
							aria-hidden="true"></td>
					</tr>
				</tbody>
				<tbody
					class="form-check-all list-view"
					id="files-list"
					state-id="files-list"
					data-files-results
					data-files-kind="files"
					filter-query-key="content-type.$ne"
					filter-query-value="text/directory"
					filter-sort-key="name"
					filter-sort-direction="asc"
					array="files"
					object
					filter-limit="20"
					render-query="tr[template]">
					<tr template>
						<td class="table-selection-column">
							<div class="form-check mb-0">
								<input
									class="form-check-input"
									type="checkbox"
									name="selected[]"
									value="{{object._id}}"
									array="{{object.$array[0]}}"
									object="{{object._id}}"
									data-select-row
									aria-label="Select row {{object._id}}" />
							</div>
						</td>
						<td
							template="column"
							render-as="column"
							value-type="html">
							{{column.tableTemplate}}
						</td>
						<td
							class="table-fill-column"
							aria-hidden="true"></td>
					</tr>
					<tr
						style="height: 20px"
						filter-limit="10"
						filter-on="scroll"
						filter-query="$parent"></tr>
				</tbody>
			</table>
		</div>
	</div>
</div>
<!--end card-->
<script src="/components/list/selection.js"></script>
