<div
	class="files-grid-sections"
	aria-label="Deleted files and folders">
	<div
		class="files-card-grid"
		array="files"
		object
		filter-sort-key="modified.on"
		filter-sort-direction="desc"
		filter-limit="20"
		render-query="[template]">
		<div
			class="d-none"
			filter-query="$parent"
			filter-query-key="deleted"
			value="true"
			value-type="boolean"></div>

		<div
			class="card bg-light shadow-none mb-0"
			template>
			<div class="card-body d-flex align-items-center gap-3">
				<i class="ri-folder-2-fill fs-24 flex-shrink-0"></i>
				<div class="flex-grow-1 min-width:0">
					<h6 class="fs-15 mb-1 text-truncate">{{object.name}}</h6>
				</div>
			</div>
		</div>
	</div>
</div>
