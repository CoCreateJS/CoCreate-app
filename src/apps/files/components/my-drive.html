<div class="files-grid-view">
	<div
		id="folderlist-data"
		class="file-folder-cards files-card-grid files-grid-section"
		array="files"
		object
		state-id="folder-filter"
		state-overwrite
		filter-query-key="path"
		filter-query-value="/"
		filter-sort-key="name"
		filter-sort-direction="asc"
		filter-limit="20"
		render-query="[template]">
		<div
			class="d-none"
			filter-query="$parent"
			filter-query-key="deleted.$ne"
			filter-query-value="true"></div>
		<div
			class="d-none"
			filter-query="$parent"
			filter-query-key="owner"
			filter-query-value="$user_id"></div>
		<div
			class="d-none"
			filter-query="$parent"
			filter-query-key="content-type"
			filter-query-value="text/directory"></div>
		<div class="card bg-light shadow-none mb-0" template>
			<div class="card-body d-flex align-items-center gap-3">
				<a
					class="d-flex align-items-center gap-3 flex-grow-1 min-width:0 text-reset"
					role="button"
					state='{"folder-filter":{"filter-query-value":"{{object.pathname}}"},"file-filter":{"filter-query-value":"{{object.pathname}}"}}'
					aria-label="Open {{object.name}} folder">
					<i class="ri-folder-2-fill fs-24 flex-shrink-0"></i>
					<h6 class="flex-grow-1 fs-15 mb-0 text-truncate">
						{{object.name}}
					</h6>
				</a>
				<div
					class="dropdown"
					src="/apps/files/components/options-dropdown.html"></div>
			</div>
		</div>
	</div>

	<div
		id="file-card-list"
		class="files-card-grid files-grid-section"
		array="files"
		object
		state-id="file-filter"
		state-overwrite
		filter-query-key="path"
		filter-query-value="/"
		filter-sort-key="name"
		filter-sort-direction="asc"
		filter-limit="20"
		render-query="[template]">
		<div
			class="d-none"
			filter-query="$parent"
			filter-query-key="deleted.$ne"
			filter-query-value="true"></div>
		<div
			class="d-none"
			filter-query="$parent"
			filter-query-key="owner"
			filter-query-value="$user_id"></div>
		<div
			class="d-none"
			filter-query="$parent"
			filter-query-key="content-type.$ne"
			filter-query-value="text/directory"></div>
		<div class="card bg-light shadow-none mb-0" template>
			<div class="card-body d-flex align-items-center gap-3">
				<a
					class="d-flex align-items-center gap-3 flex-grow-1 min-width:0"
					role="button"
					state-to="offcanvas-app-view"
					state.src="/apps/files/details.html"
					aria-controls="offcanvas-app"
					aria-expanded="false"
					aria-open>
					<span
						hidden
						state-to="offcanvas-app-form"
						state.array="files"
						state.object="{{object._id}}"></span>
					<i class="ri-file-line fs-24 flex-shrink-0"></i>
					<h6 class="flex-grow-1 fs-15 mb-0 text-truncate">
						{{object.name}}
					</h6>
				</a>
				<div
					class="dropdown"
					src="/apps/files/components/options-dropdown.html"></div>
			</div>
		</div>
	</div>
</div>
