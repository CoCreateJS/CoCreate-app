<div class="p-3 d-flex flex-column h-100">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h5 class="mb-0">Files</h5>
        <button type="button" class="file-menu-btn" aria-label="Close files menu" aria-controls="files-sidebar" aria-close aria-expanded="true"><i class="ri-close-line" aria-hidden="true"></i></button>
    </div>
	<div class="search-box">
		<input
			type="text"
			class="form-control bg-light border-light"
			placeholder="Search here..." />
		<i class="ri-search-2-line search-icon"></i>
	</div>
	<div
		class="mt-3 mx-n4 px-4 file-menu-sidebar-scroll"
		plugin='{"$SimpleBar": ["$this", {}]}'>
		<ul class="list-unstyled file-manager-menu">
            <li><a id="files-library-btn" role="button" tabindex="0" state="{&quot;app&quot;:{&quot;object&quot;:&quot;68741e1d07a037d0d6d00ef3&quot;,&quot;input.array&quot;:&quot;files&quot;},&quot;files-folders&quot;:{&quot;hidden&quot;:true,&quot;read&quot;:&quot;false&quot;},&quot;list&quot;:{&quot;array&quot;:&quot;files&quot;,&quot;src&quot;:&quot;/apps/files/templates/card.html&quot;,&quot;filter-query-key&quot;:&quot;content-type.$ne&quot;,&quot;filter-query-value&quot;:&quot;&quot;,&quot;filter-sort-key&quot;:&quot;name&quot;,&quot;filter-sort-direction&quot;:&quot;asc&quot;},&quot;files-path&quot;:{&quot;value&quot;:&quot;&quot;},&quot;files-owner&quot;:{&quot;value&quot;:&quot;&quot;},&quot;files-starred&quot;:{&quot;value&quot;:&quot;&quot;},&quot;files-deleted&quot;:{&quot;value&quot;:&quot;{\&quot;$ne\&quot;:true}&quot;}}"><i class="ri-file-2-line align-bottom me-2"></i><span class="file-list-link">File library</span></a></li>
            <li><a id="files-organization-btn" role="button" tabindex="0" state="{&quot;app&quot;:{&quot;object&quot;:&quot;68741e1d07a037d0d6d00ef3&quot;,&quot;input.array&quot;:&quot;files&quot;},&quot;files-folders&quot;:{&quot;hidden&quot;:false,&quot;read&quot;:&quot;true&quot;},&quot;list&quot;:{&quot;array&quot;:&quot;files&quot;,&quot;src&quot;:&quot;/apps/files/templates/card.html&quot;,&quot;filter-query-key&quot;:&quot;content-type.$ne&quot;,&quot;filter-query-value&quot;:&quot;text/directory&quot;,&quot;filter-sort-key&quot;:&quot;name&quot;,&quot;filter-sort-direction&quot;:&quot;asc&quot;},&quot;files-path&quot;:{&quot;value&quot;:&quot;/&quot;},&quot;files-owner&quot;:{&quot;value&quot;:&quot;&quot;},&quot;files-starred&quot;:{&quot;value&quot;:&quot;&quot;},&quot;files-deleted&quot;:{&quot;value&quot;:&quot;{\&quot;$ne\&quot;:true}&quot;}}"><i class="ri-building-line align-bottom me-2"></i><span class="file-list-link">Organization</span></a></li>
            <li><a id="files-my-drive-btn" role="button" tabindex="0" state="{&quot;app&quot;:{&quot;object&quot;:&quot;68741e1d07a037d0d6d00ef3&quot;,&quot;input.array&quot;:&quot;files&quot;},&quot;files-folders&quot;:{&quot;hidden&quot;:false,&quot;read&quot;:&quot;true&quot;},&quot;list&quot;:{&quot;array&quot;:&quot;files&quot;,&quot;src&quot;:&quot;/apps/files/templates/card.html&quot;,&quot;filter-query-key&quot;:&quot;content-type.$ne&quot;,&quot;filter-query-value&quot;:&quot;text/directory&quot;,&quot;filter-sort-key&quot;:&quot;name&quot;,&quot;filter-sort-direction&quot;:&quot;asc&quot;},&quot;files-path&quot;:{&quot;value&quot;:&quot;/&quot;},&quot;files-owner&quot;:{&quot;value&quot;:&quot;$user_id&quot;},&quot;files-starred&quot;:{&quot;value&quot;:&quot;&quot;},&quot;files-deleted&quot;:{&quot;value&quot;:&quot;{\&quot;$ne\&quot;:true}&quot;}}"><i class="ri-folder-2-line align-bottom me-2"></i><span class="file-list-link">My Drive</span></a></li>
            <li><a id="files-recent-btn" role="button" tabindex="0" state="{&quot;app&quot;:{&quot;object&quot;:&quot;68741e1d07a037d0d6d00ef3&quot;,&quot;input.array&quot;:&quot;files&quot;},&quot;files-folders&quot;:{&quot;hidden&quot;:true,&quot;read&quot;:&quot;false&quot;},&quot;list&quot;:{&quot;array&quot;:&quot;files&quot;,&quot;src&quot;:&quot;/apps/files/templates/card.html&quot;,&quot;filter-query-key&quot;:&quot;content-type.$ne&quot;,&quot;filter-query-value&quot;:&quot;&quot;,&quot;filter-sort-key&quot;:&quot;modified.on&quot;,&quot;filter-sort-direction&quot;:&quot;desc&quot;},&quot;files-path&quot;:{&quot;value&quot;:&quot;&quot;},&quot;files-owner&quot;:{&quot;value&quot;:&quot;&quot;},&quot;files-starred&quot;:{&quot;value&quot;:&quot;&quot;},&quot;files-deleted&quot;:{&quot;value&quot;:&quot;{\&quot;$ne\&quot;:true}&quot;}}"><i class="ri-history-line align-bottom me-2"></i><span class="file-list-link">Recent</span></a></li>
            <li><a id="files-favorites-btn" role="button" tabindex="0" state="{&quot;app&quot;:{&quot;object&quot;:&quot;68741e1d07a037d0d6d00ef3&quot;,&quot;input.array&quot;:&quot;files&quot;},&quot;files-folders&quot;:{&quot;hidden&quot;:true,&quot;read&quot;:&quot;false&quot;},&quot;list&quot;:{&quot;array&quot;:&quot;files&quot;,&quot;src&quot;:&quot;/apps/files/templates/card.html&quot;,&quot;filter-query-key&quot;:&quot;content-type.$ne&quot;,&quot;filter-query-value&quot;:&quot;&quot;,&quot;filter-sort-key&quot;:&quot;name&quot;,&quot;filter-sort-direction&quot;:&quot;asc&quot;},&quot;files-path&quot;:{&quot;value&quot;:&quot;&quot;},&quot;files-owner&quot;:{&quot;value&quot;:&quot;&quot;},&quot;files-starred&quot;:{&quot;value&quot;:&quot;$user_id&quot;},&quot;files-deleted&quot;:{&quot;value&quot;:&quot;{\&quot;$ne\&quot;:true}&quot;}}"><i class="ri-star-line align-bottom me-2"></i><span class="file-list-link">Favorites</span></a></li>
            <li><a id="files-trash-btn" role="button" tabindex="0" state="{&quot;app&quot;:{&quot;object&quot;:&quot;68741e1d07a037d0d6d00ef3&quot;,&quot;input.array&quot;:&quot;files&quot;},&quot;files-folders&quot;:{&quot;hidden&quot;:true,&quot;read&quot;:&quot;false&quot;},&quot;list&quot;:{&quot;array&quot;:&quot;files&quot;,&quot;src&quot;:&quot;/apps/files/templates/card.html&quot;,&quot;filter-query-key&quot;:&quot;content-type.$ne&quot;,&quot;filter-query-value&quot;:&quot;&quot;,&quot;filter-sort-key&quot;:&quot;modified.on&quot;,&quot;filter-sort-direction&quot;:&quot;desc&quot;},&quot;files-path&quot;:{&quot;value&quot;:&quot;&quot;},&quot;files-owner&quot;:{&quot;value&quot;:&quot;&quot;},&quot;files-starred&quot;:{&quot;value&quot;:&quot;&quot;},&quot;files-deleted&quot;:{&quot;value&quot;:&quot;true&quot;}}"><i class="ri-delete-bin-line align-bottom me-2"></i><span class="file-list-link">Trash</span></a></li>
		</ul>
	</div>

	<div class="mt-auto">
		<h6 class="fs-11 text-muted text-uppercase mb-3">Storage Status</h6>
		<div class="d-flex align-items-center">
			<div class="flex-shrink-0">
				<i class="ri-database-2-line fs-17"></i>
			</div>
			<div class="flex-grow-1 ms-3 overflow-hidden">
				<div class="progress mb-2 progress-sm">
					<div
						class="progress-bar bg-success"
						role="progressbar"
						style="width: 25%"
						aria-valuenow="25"
						aria-valuemin="0"
						aria-valuemax="100"></div>
				</div>
				<span class="text-muted fs-12 d-block text-truncate"
					><b>47.52</b>GB used of <b>119</b>GB</span
				>
			</div>
		</div>
	</div>
</div>
