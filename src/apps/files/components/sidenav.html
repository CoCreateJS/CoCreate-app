<div class="p-3 d-flex flex-column h-100">
	<div class="search-box">
		<input
			type="text"
			class="form-control bg-light border-light"
			placeholder="Search here..." />
		<i class="ri-search-2-line search-icon"></i>
	</div>
	<div
		class="mt-3 mx-n4 px-4 file-menu-sidebar-scroll"
		plugin='{"$SimpleBar": ["$this", {}]}'>
		<ul class="list-unstyled file-manager-menu">
			<li>
				<a
					class="active"
					href="#!"
					aria-current="page"
					state='{"file-view":{"src":"/apps/files/components/drive.html"},"folder-filter":{"filter-query-value":"/"},"file-filter":{"filter-query-value":"/"}}'>
					<i class="ri-building-line align-bottom me-2"></i>
					<span class="file-list-link">Organization</span>
				</a>
			</li>
			<li>
				<a
					href="#!"
					state-to="file-view"
					state.src="/apps/files/components/my-drive.html">
					<i class="ri-folder-2-line align-bottom me-2"></i>
					<span class="file-list-link">My Drive</span>
				</a>
			</li>
			<li>
				<a
					href="#!"
					state-to="file-view"
					state.src="/apps/files/components/recent.html">
					<i class="ri-history-line align-bottom me-2"></i>
					<span class="file-list-link">Recent</span>
				</a>
			</li>
			<li>
				<a
					href="#!"
					state-to="file-view"
					state.src="/apps/files/components/starred.html">
					<i class="ri-star-line align-bottom me-2"></i>
					<span class="file-list-link">Starred</span>
				</a>
			</li>
			<li>
				<a
					href="#!"
					state-to="file-view"
					state.src="/apps/files/components/trash.html">
					<i class="ri-delete-bin-line align-bottom me-2"></i>
					<span class="file-list-link">Trash</span>
				</a>
			</li>
		</ul>
	</div>

	<div class="mt-auto">
		<h6 class="fs-11 text-muted text-uppercase mb-3">Storage Status</h6>
		<div class="d-flex align-items-center">
			<div class="flex-shrink-0">
				<i class="ri-database-2-line fs-17"></i>
			</div>
			<div class="flex-grow-1 ms-3 overflow-hidden">
				<div class="progress mb-2 progress-sm">
					<div
						class="progress-bar bg-success"
						role="progressbar"
						style="width: 25%"
						aria-valuenow="25"
						aria-valuemin="0"
						aria-valuemax="100"></div>
				</div>
				<span class="text-muted fs-12 d-block text-truncate"
					><b>47.52</b>GB used of <b>119</b>GB</span
				>
			</div>
		</div>
	</div>
</div>
