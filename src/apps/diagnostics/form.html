<form
	class="app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	data-component-form
	array
	object
	autocomplete="off">
<header
		class="card-header offcanvas-app-topbar flex-shrink-0"
		src="/apps/diagnostics/header.html"
		aria-label="Form controls"></header>
	<div
		class="component-form-body flex-grow-1 min-height:0"
		plugin='{"$SimpleBar": ["$this", {}]}'>
<div class="card-body d-flex flex-wrap gap-3">
			<div class="d-flex flex-column flex-grow-1 width:500px">
				<div class="card">
					<div class="card-header">
						<h5 class="card-title mb-0">
							Demographics & Key Status
						</h5>
					</div>
					<div class="card-body">
						<input
							type="hidden"
							class="form-control"
							id="diagnostic-id-input"
							key="_id" />

						<div class="row">
							<div class="col-md-6 mb-3">
								<label class="form-label" for="first-name-input"
									>First Name</label
								>
								<input
									type="text"
									class="form-control"
									id="first-name-input"
									key="first_name"
									placeholder="First Name" />
							</div>
							<div class="col-md-6 mb-3">
								<label
									class="form-label"
									for="last-updated-input"
									>Last Updated</label
								>
								<input
									type="date"
									class="form-control"
									id="last-updated-input"
									key="lastUpdated" />
							</div>
						</div>

						<div class="row">
							<div class="col-md-6 mb-3">
								<label
									class="form-label"
									for="health-score-input"
									>Health Score</label
								>
								<input
									type="number"
									class="form-control"
									id="health-score-input"
									key="healthScore"
									placeholder="e.g. 88" />
							</div>
						</div>
					</div>
				</div>
				<!-- end card -->

				<div class="card">
					<div class="card-header">
						<h5 class="card-title mb-0">Dimensions & Results</h5>
					</div>
					<div class="card-body">
						<div class="row">
							<div class="col-md-6 mb-3">
								<label class="form-label" for="chrono-age"
									>Chronological Age</label
								>
								<input
									type="number"
									class="form-control"
									id="chrono-age"
									key="chronologicalAge" />
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label" for="bio-age"
									>Biological Age</label
								>
								<input
									type="number"
									class="form-control"
									id="bio-age"
									key="biologicalAge" />
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label" for="age-diff"
									>Age Difference</label
								>
								<input
									type="number"
									class="form-control"
									id="age-diff"
									key="ageDifference" />
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label" for="pace"
									>Pace of Aging (DunedinPACE)</label
								>
								<input
									type="text"
									class="form-control"
									id="pace"
									key="paceOfAging" />
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label" for="pace-diff"
									>Pace Difference (%)</label
								>
								<input
									type="number"
									class="form-control"
									id="pace-diff"
									key="paceDifference" />
							</div>
						</div>
						<hr class="my-3" />
						<div class="row">
							<div class="col-md-4 mb-3">
								<label class="form-label" for="cardio-stat"
									>Cardiovascular</label
								>
								<input
									type="text"
									class="form-control"
									id="cardio-stat"
									key="cardioStat" />
							</div>
							<div class="col-md-4 mb-3">
								<label class="form-label" for="meta-stat"
									>Metabolism</label
								>
								<input
									type="text"
									class="form-control"
									id="meta-stat"
									key="metabolismStat" />
							</div>
							<div class="col-md-4 mb-3">
								<label class="form-label" for="nutri-stat"
									>Nutrition</label
								>
								<input
									type="text"
									class="form-control"
									id="nutri-stat"
									key="nutritionStat" />
							</div>
							<div class="col-md-4 mb-3">
								<label class="form-label" for="horm-stat"
									>Hormones</label
								>
								<input
									type="text"
									class="form-control"
									id="horm-stat"
									key="hormonesStat" />
							</div>
							<div class="col-md-4 mb-3">
								<label class="form-label" for="gut-stat"
									>Gut Health</label
								>
								<input
									type="text"
									class="form-control"
									id="gut-stat"
									key="gutHealthStat" />
							</div>
							<div class="col-md-4 mb-3">
								<label class="form-label" for="genet-stat"
									>Genetics</label
								>
								<input
									type="text"
									class="form-control"
									id="genet-stat"
									key="geneticsStat" />
							</div>
							<div class="col-md-4 mb-3">
								<label class="form-label" for="cell-stat"
									>Cellular Health</label
								>
								<input
									type="text"
									class="form-control"
									id="cell-stat"
									key="cellularStat" />
							</div>
						</div>
					</div>
				</div>
				<!-- end card -->

				<div class="card">
					<div class="card-header">
						<h5 class="card-title mb-0">Protocols State</h5>
					</div>
					<div class="card-body">
						<div class="row">
							<div class="col-12">
								<h6 class="text-info">Discover</h6>
							</div>
							<div class="col-md-4 mb-2">
								<label class="form-label">Status</label>
								<input
									type="text"
									class="form-control"
									key="discoverStatus" />
							</div>
							<div class="col-md-4 mb-2">
								<label class="form-label">Plan</label>
								<input
									type="text"
									class="form-control"
									key="discoverPlan" />
							</div>
							<div class="col-md-4 mb-2">
								<label class="form-label">Next</label>
								<input
									type="date"
									class="form-control"
									key="discoverNext" />
							</div>
							<div class="col-md-4 mb-2">
								<label class="form-label">Cycle (Days)</label>
								<input
									type="number"
									class="form-control"
									key="diagnosticCycleDays" />
							</div>
							<div class="col-md-4 mb-2">
								<label class="form-label">Format</label>
								<input
									type="text"
									class="form-control"
									key="discoverFormat" />
							</div>
						</div>
						<hr class="my-3" />
						<div class="row">
							<div class="col-12">
								<h6 class="text-success">Optimize</h6>
							</div>
							<div class="col-md-4 mb-2">
								<label class="form-label">Status</label>
								<input
									type="text"
									class="form-control"
									key="optimizeStatus" />
							</div>
							<div class="col-md-4 mb-2">
								<label class="form-label">Plan</label>
								<input
									type="text"
									class="form-control"
									key="optimizePlan" />
							</div>
							<div class="col-md-4 mb-2">
								<label class="form-label">Next Delivery</label>
								<input
									type="date"
									class="form-control"
									key="optimizeNextDelivery" />
							</div>
							<div class="col-md-4 mb-2">
								<label class="form-label">Format</label>
								<input
									type="text"
									class="form-control"
									key="optimizeFormat" />
							</div>
						</div>
						<hr class="my-3" />
						<div class="row">
							<div class="col-12">
								<h6 class="text-primary">Regenerate</h6>
							</div>
							<div class="col-md-4 mb-2">
								<label class="form-label">Status</label>
								<input
									type="text"
									class="form-control"
									key="regenerateStatus" />
							</div>
							<div class="col-md-4 mb-2">
								<label class="form-label">Plan</label>
								<input
									type="text"
									class="form-control"
									key="regeneratePlan" />
							</div>
							<div class="col-md-4 mb-2">
								<label class="form-label">Price</label>
								<input
									type="number"
									class="form-control"
									key="regeneratePrice" />
							</div>
						</div>
					</div>
				</div>
				<!-- end card -->
			</div>
		</div>
	</div>
	<footer class="card-footer flex-shrink-0">
		<div class="hstack gap-2 justify-content-end">
			<button
				type="button"
				class="btn btn-light"
				data-component-form-close
				aria-label="Cancel form"
				aria-expanded="true"
				aria-close>Cancel</button>
			<button
				class="btn btn-success btn-spinner"
				aria-label="Save form"
				actions="validate, disabled, save, timeout(2000), disabled">
				<span class="spinner-border spinner-border-sm display:none" role="status" aria-hidden="true"></span>
				<span class="button-text">Save</span>
			</button>
		</div>
	</footer>
</form>
