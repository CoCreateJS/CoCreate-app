<div class="app-heading">
	<div class="app-badges">
		<span
			class="badge text-uppercase"
			key="method" data-value input.data-value="$value"></span
		><span class="badge text-capitalize" role="status" aria-label="Enabled status" key="enabled" data-value input.data-value="$value"></span>
	</div>

	<div class="app-identity">
		<div
			value-type="outerHTML"
			src="/apps/apis/components/provider-icon.html" class="app-identity-image"></div>
		<div class="min-width:0">
			<h5
				class="app-title mb-0 text-break"
				key="name"></h5>
		</div>
	</div>
</div>
<p
	class="text-muted mb-0 line-clamp:2"
	key="description"></p>
