<style>
.storage-provider-brand { width: 28px; height: 28px; flex: 0 0 28px; object-fit: contain; }
.storage-connection-option [hidden] { display: none !important; }
.storage-connection-option > label:not(.form-switch) { cursor: pointer; }
.storage-connection-option { transition: border-color 0.15s ease, background-color 0.15s ease; }
.storage-connection-option:has(input[name="storage-expansion"]:checked) {
    border-color: var(--coc-primary) !important;
    background: rgba(var(--coc-primary-rgb), 0.08);
}
.storage-connection-option > label > input[name="storage-expansion"] {
    position: absolute; opacity: 0; pointer-events: none;
}
</style>
<section class="app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden" data-component-form data-storage-providers data-provider-type="routing" crud="true">
    <header class="card-header d-flex align-items-center justify-content-between flex-shrink-0">
        <span class="fw-medium">Routing Providers</span>
        <button type="button" class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle text-muted"
            aria-label="Close routing providers" title="Close" aria-controls="create-panel" aria-expanded="true" aria-close>
            <i class="ri-close-line align-middle fs-22" aria-hidden="true"></i>
        </button>
    </header>
    <div class="component-form-body flex-grow-1 min-height:0" plugin='{"$SimpleBar": ["$this", {}]}'>
        <div class="card-body d-flex flex-column gap-4 min-height:100%">
            <section>
                <h5 class="mb-1">Configure routing providers</h5>
                <p class="text-muted">Configure DNS and traffic routing services for your cloud infrastructure. Enable the connections you want to use.</p>
                <p data-storage-status role="status" aria-live="polite" class="text-muted">
                    <span class="d-inline-flex align-items-center gap-2">
                        <span class="spinner-border spinner-border-sm text-primary" aria-hidden="true"></span>
                        <span>Loading routing providers…</span>
                    </span>
                </p>
                <div class="d-flex flex-column gap-3" data-storage-rows></div>
            </section>
        </div>
    </div>
    <template data-storage-card-template><div class="storage-connection-option border rounded position-relative">
						<label class="d-flex align-items-start gap-3 p-3 mb-0"><input type="checkbox" name="storage-expansion"><i class="ri-route-line fs-24 text-primary"></i><span class="flex-grow-1"><strong class="d-block"></strong><small class="text-muted"></small></span></label>
						<div data-provider-credential-fields="" hidden=""></div>
					</div></template>
</section>
<script src="/apps/storage-providers/index.js"></script>
