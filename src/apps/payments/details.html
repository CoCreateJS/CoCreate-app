<form
	class="card mb-0"
	array="transactions"
	object
	state-id="offcanvas-app-form"
	state-overwrite>
	<div
		class="card-header text-center border-bottom-0"
		input-query=".form-view-btn[]"
		input.state.src="/apps/payments/form.html"
		src="components/offcanvas-header.html"></div>

	<div class="form-container" plugin='{"$SimpleBar": ["$this", {}]}'>
		<div class="card-body d-flex flex-column gap-4">
			<section class="bg-success-subtle rounded p-4">
				<div class="d-flex flex-wrap align-items-center gap-3">
					<div class="avatar-lg flex-shrink-0">
						<div class="avatar-title rounded-circle bg-white text-success fs-28">
							<i class="ri-wallet-3-line"></i>
						</div>
					</div>

					<div class="d-flex flex-column gap-2 flex-grow-1 min-width:220px">
						<div class="text-muted text-uppercase fw-semibold">Payment</div>
						<h4 class="mb-0 text-break" key="_id" aria-label="Payment ID"></h4>
						<div class="d-flex flex-wrap align-items-center gap-2">
							<span
								class="badge rounded-pill bg-success text-uppercase"
								key="status"
								aria-label="Payment status"></span>
							<span
								class="badge rounded-pill bg-primary-subtle text-primary text-uppercase"
								key="type"
								aria-label="Transaction type"></span>
							<span
								class="badge rounded-pill bg-info-subtle text-info text-uppercase"
								key="payment_type"
								aria-label="Payment type"></span>
						</div>
					</div>

					<div class="text-end flex-shrink-0">
						<div class="text-muted mb-1">Amount</div>
						<div class="fs-24 fw-bold">
							<span key="currency"></span>
							<span key="amount"></span>
						</div>
					</div>
				</div>
			</section>

			<section>
				<h5 class="text-uppercase fw-semibold mb-3">Payment information</h5>
				<div class="d-flex flex-wrap gap-3">
					<div class="border border-dashed rounded p-3 flex-grow-1 flex-basis:240px min-width:220px">
						<div class="text-muted mb-1">Customer</div>
						<div class="fw-medium" key="customer_id"></div>
					</div>
					<div class="border border-dashed rounded p-3 flex-grow-1 flex-basis:240px min-width:220px">
						<div class="text-muted mb-1">Product</div>
						<div class="fw-medium" key="product"></div>
					</div>
					<div class="border border-dashed rounded p-3 flex-grow-1 flex-basis:240px min-width:220px">
						<div class="text-muted mb-1">Payment Date</div>
						<div class="fw-medium" key="date"></div>
					</div>
					<div class="border border-dashed rounded p-3 flex-grow-1 flex-basis:240px min-width:220px">
						<div class="text-muted mb-1">Payment Method</div>
						<div class="fw-medium" key="method"></div>
					</div>
				</div>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<h5 class="text-uppercase fw-semibold mb-3">Related records</h5>
				<div class="table-responsive">
					<table class="table table-borderless mb-0">
						<tbody>
							<tr>
								<td class="fw-medium text-muted">Invoice ID</td>
								<td>
									<a
										role="button"
										tabindex="0"
										class="link-primary"
										state-to="offcanvas-app-view"
										state.src="/apps/invoices/details.html"
										state.array="invoices"
										state.object="{{invoice_id}}"
										key="invoice_id"
										aria-label="View related invoice"></a>
								</td>
							</tr>
							<tr>
								<td class="fw-medium text-muted">Reference</td>
								<td key="reference"></td>
							</tr>
							<tr>
								<td class="fw-medium text-muted">Due Date</td>
								<td key="due_date"></td>
							</tr>
							<tr>
								<td class="fw-medium text-muted">Approved By</td>
								<td key="approval_by"></td>
							</tr>
							<tr>
								<td class="fw-medium text-muted">Remaining Due</td>
								<td>
									<span key="currency"></span>
									<span key="remaining_due"></span>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<h5 class="text-uppercase fw-semibold mb-3">Tags</h5>
				<div class="d-flex flex-wrap gap-2" key="tags" render-query="[template]">
					<span template class="badge bg-primary-subtle text-primary">{{tags}}</span>
				</div>
			</section>

			<section class="border-top border-top-dashed pt-3">
				<h5 class="text-uppercase fw-semibold mb-3">Notes</h5>
				<p class="text-muted mb-2" key="notes"></p>
				<p class="text-muted mb-0" key="note"></p>
			</section>

			<div
				class="border-top border-top-dashed pt-3"
				src="components/activities.html"
				aria-label="Payment activities"></div>
		</div>
	</div>
</form>
