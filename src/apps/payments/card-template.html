<article class="card flex-grow-1 mb-0" style="flex-basis:320px;min-width:min(280px,100%);max-width:460px" template><a class="card-body d-flex flex-column gap-3 text-reset" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/payments/details.html" aria-controls="offcanvas-app" aria-open><div state-to="offcanvas-app-form" state.array="transactions" state.object="{{object._id}}"></div><div class="d-flex align-items-start justify-content-between gap-3"><div class="d-flex align-items-center gap-3 min-width:0"><div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0"><div class="avatar-title bg-primary-subtle text-primary"><i class="ri-bank-card-line fs-4"></i></div></div><div class="min-width:0"><h5 class="mb-1 text-truncate">{{object.reference}}</h5><span class="text-muted fs-12">{{object.customer_id}}</span></div></div><span class="badge bg-success-subtle text-success text-capitalize">{{object.status}}</span></div><p class="text-muted mb-0 line-clamp:2">{{object.notes}}</p><div class="d-flex flex-wrap gap-3"><div><span class="text-muted fs-12 d-block">Currency</span><strong>{{object.currency}}</strong></div><div><span class="text-muted fs-12 d-block">Amount</span><strong>{{object.amount}}</strong></div><div><span class="text-muted fs-12 d-block">Remaining</span><strong>{{object.remaining_due}}</strong></div></div><div class="d-flex justify-content-between gap-3 pt-2 border-top border-top-dashed text-muted fs-12"><span><i class="ri-calendar-line me-1"></i>{{object.date}}</span><span><i class="ri-bank-card-line me-1"></i>{{object.method}}</span></div></a></article><div onload.array="transactions" onload-query="$parent"></div>
