<template>
	<article
		class="card app-card"
		role="row"
		aria-selected="false"
		array="{{object.$array[0]}}"
		object="{{object._id}}"
		read="false">
		<div class="card-body d-flex flex-column gap-3">
			<div class="app-heading">
				<div class="app-identity">
					<div
						value-type="outerHTML"
						src="/apps/apis/components/provider-icon.html" class="app-identity-image"></div>
					<div class="min-width:0">
						<h5 class="app-title mb-0 text-break">
							<a
								class="text-reset text-decoration-none"
								role="button"
								tabindex="0"
								state-to="offcanvas-app-view"
								state.src="/apps/webhooks/app.html"
								aria-controls="offcanvas-app"
								aria-open
								><span
									hidden
									state-to="offcanvas-app-form"
									state.array="webhooks"
									state.object="{{object._id}}"></span
								>{{object.path}}</a
							>
						</h5>
					</div>
				</div>
				<div class="app-badges">
					<span class="badge text-uppercase" key="method" data-value="POST">POST</span><span class="badge text-capitalize" role="status" aria-label="Enabled status" key="enabled" data-value="{{object.enabled}}">{{object.enabled}}</span>
				</div>
			</div>
			<p class="text-muted mb-0 line-clamp:2">{{object.description}}</p>
		</div>
	</article>
</template>
<div
	onload.array="webhooks"
	onload-query="$parent"></div>
