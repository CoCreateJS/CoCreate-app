<div
	id="apis-webhooks-aside"
	class="offcanvas-app-shell app-panel d-flex flex-column width:100% height:100% min-height:0 overflow-hidden"
	role="region"
	aria-label="Apis Webhooks record">
	<header
		src="/components/offcanvas-app/header.html"
		value-replace="/\{\{app\.name\}\}/g"
		value-replacement="ApisWebhooks"
		value-type="outerHtml"></header>
	<div
		class="component-form-body flex-grow-1 min-height:0">
		<div
			id="ApisWebhooks-details-view"
			class="offcanvas-app-view"
			data-view="details"
			role="tabpanel"
			aria-labelledby="ApisWebhooks-details-btn"
			tabindex="0"
			aria-hidden="false"
			state-id="apis-webhooks-details"
			state.aria-hidden
			hidden>
			<form state-id="offcanvas-app-form" array object autocomplete="off" class="app-details app-with-image">
				<div scrollbar>
					<div src="/apps/webhooks/components/details.html"></div>
				</div>
			</form>
		</div>
		<div
			id="ApisWebhooks-form-view"
			class="offcanvas-app-view"
			data-view="form"
			role="tabpanel"
			aria-labelledby="ApisWebhooks-form-btn"
			tabindex="0"
			aria-hidden="true"
			state-id="apis-webhooks-form"
			state.aria-hidden
			hidden>
			<form state-id="offcanvas-app-form" class="app-form app-with-image" array object autocomplete="off">
				<div scrollbar>
					<div src="/apps/webhooks/components/form.html"></div>
				</div>
				<footer src="/components/offcanvas-app/footer.html" value-type="outerHtml"></footer>
			</form>
		</div>
		<div
			id="ApisWebhooks-codearea-view"
			class="offcanvas-app-view"
			data-view="codearea"
			role="tabpanel"
			aria-labelledby="ApisWebhooks-codearea-btn"
			tabindex="0"
			aria-hidden="true"
			state-id="apis-webhooks-codearea"
			state.aria-hidden
			hidden>
			<form state-id="offcanvas-app-form" array object autocomplete="off">
				<div scrollbar>
					<div src="/components/offcanvas-app/codearea.html"></div>
				</div>
				<footer src="/components/offcanvas-app/footer.html" value-type="outerHtml"></footer>
			</form>
		</div>
	</div>
</div>
