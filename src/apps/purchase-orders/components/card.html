
<article class="app-card card mb-0"><div class="card-body d-flex flex-column gap-3">
	<div class="d-flex align-items-start justify-content-between gap-3"><div class="app-identity"><div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0 app-identity-image"><div class="avatar-title bg-warning-subtle text-warning"><i src="/assets/svg/remix/shopping-bag-line.svg" class="fs-4"></i></div></div><div class="min-width:0"><span class="text-muted fs-12">Purchase order</span><h5 class="mb-0 text-truncate app-title" key="po_number"></h5></div></div><span class="badge text-capitalize" key="status" data-value input.data-value="$value"></span></div>
	<div><span class="text-muted fs-12 d-block">Supplier</span><strong key="supplier"></strong></div>
	<div class="d-flex flex-wrap gap-3"><div><span class="text-muted fs-12 d-block">Subtotal</span><strong key="subtotal"></strong></div><div><span class="text-muted fs-12 d-block">Tax</span><strong key="tax"></strong></div><div><span class="text-muted fs-12 d-block">Total</span><strong key="total"></strong></div></div>
	<div class="d-flex justify-content-between pt-2 border-top border-top-dashed text-muted fs-12"><span>Ordered: <span key="order_date"></span></span><span>Expected: <span key="expected_delivery"></span></span></div>
</div></article>
