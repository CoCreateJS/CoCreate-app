<article class="card flex-grow-1 mb-0" style="flex-basis:320px;min-width:min(280px,100%);max-width:460px" template><a class="card-body d-flex flex-column gap-3 text-reset" role="button" tabindex="0" state-to="offcanvas-app-view" state.src="/apps/purchase-orders/details.html" aria-controls="offcanvas-app" aria-open><div state-to="offcanvas-app-form" state.array="purchase_orders" state.object="{{object._id}}"></div>
	<div class="d-flex align-items-start justify-content-between gap-3"><div class="d-flex align-items-center gap-3 min-width:0"><div class="avatar-sm rounded-circle overflow-hidden flex-shrink-0"><div class="avatar-title bg-warning-subtle text-warning"><i class="ri-shopping-bag-line fs-4"></i></div></div><div class="min-width:0"><span class="text-muted fs-12">Purchase order</span><h5 class="mb-0 text-truncate">{{object.po_number}}</h5></div></div><span class="badge bg-primary-subtle text-primary text-capitalize">{{object.status}}</span></div>
	<div><span class="text-muted fs-12 d-block">Supplier</span><strong>{{object.supplier}}</strong></div>
	<div class="d-flex flex-wrap gap-3"><div><span class="text-muted fs-12 d-block">Subtotal</span><strong>{{object.subtotal}}</strong></div><div><span class="text-muted fs-12 d-block">Tax</span><strong>{{object.tax}}</strong></div><div><span class="text-muted fs-12 d-block">Total</span><strong>{{object.total}}</strong></div></div>
	<div class="d-flex justify-content-between pt-2 border-top border-top-dashed text-muted fs-12"><span>Ordered: {{object.order_date}}</span><span>Expected: {{object.expected_delivery}}</span></div>
</a></article><div onload.array="purchase_orders" onload-query="$parent"></div>
