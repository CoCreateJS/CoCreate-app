<div class="card">
	<div class="card-body">
		<h5 class="card-title">Projects</h5>
		<!-- Swiper -->
		<div class="swiper project-swiper">
			<div class="d-flex justify-content-end gap-2 mb-2">
				<div class="slider-button-prev">
					<div
						class="avatar-title fs-18 rounded px-1 material-shadow">
						<i src="/assets/svg/arrow-left-s-line.svg"></i>
					</div>
				</div>
				<div class="slider-button-next">
					<div
						class="avatar-title fs-18 rounded px-1 material-shadow">
						<i src="/assets/svg/arrow-right-s-line.svg"></i>
					</div>
				</div>
			</div>
			<div
				class="swiper-wrapper"
				array="projects"
				object=""
				filter-limit="10"
				render-query="[template]">
				<div class="swiper-slide" template>
					<div
						class="card profile-project-card shadow-none mb-0 material-shadow profile-project-success">
						<div class="card-body p-4">
							<div class="d-flex">
								<div
									class="flex-grow-1 text-muted overflow-hidden">
									<h5 class="fs-14 text-truncate mb-1">
										<a href="#" class="text-body"
											>{{object.name}}</a
										>
									</h5>
									<p class="text-muted text-truncate mb-0">
										Last Update :
										<span
											type="date-time"
											value-type="ago"
											class="fw-semibold text-body"
											>{{object.modified.on}}</span
										>
									</p>
								</div>
								<div class="flex-shrink-0 ms-2">
									<div class="badge fs-10">
										{{object.status}}
									</div>
								</div>
							</div>
							<div class="d-flex mt-4">
								<div class="flex-grow-1">
									<div
										class="d-flex align-items-center gap-2">
										<div>
											<h5 class="fs-12 text-muted mb-0">
												Members :
											</h5>
										</div>
										<div
											src="components/avatar-group.html"></div>
										<!-- <div class="avatar-group" array="projects" object="{{object._id}}" key="members" render-query="[template]">
											<div class="avatar-group-item material-shadow" template>
												<div class="avatar-xs rounded-circle position-relative overflow-hidden">
													<div class="avatar-title bg-secondary-subtle text-secondary material-shadow">
														<span array="contacts" object="{{members}}" key="first_name" style="width: 1ch; letter-spacing: 1em; overflow: hidden;"></span>
														<span array="contacts" object="{{members}}" key="last_name" style="width: 1ch; letter-spacing: 1em; overflow: hidden;"></span>
														<img
															class="position-absolute avatar-xs"
															src="/assets/svg/user.svg"
															array="contacts" 
															object="{{members}}"
															key="avatar[0].src"
															alt="Header Avatar" 
															onerror="this.style.display='none'"/>
													</div>
												</div>
											</div>
										</div> -->
									</div>
								</div>
							</div>
						</div>
						<!-- end card body -->
					</div>
					<!-- end card -->
				</div>
				<!-- end template -->
			</div>
		</div>
	</div>
	<!-- end card body -->
</div>
<!-- end card -->
