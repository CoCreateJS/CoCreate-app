<div class="card">
	<div class="card-body">
		<h5 class="fs-15 fw-semibold">Brand Logo Design - MD</h5>
		<p class="text-muted">Graphics Work</p>
		<div class="d-flex flex-wrap justify-content-evenly">
			<p class="text-muted mb-0">
				<i
					class="mdi mdi-numeric-1-circle text-success fs-18 align-middle me-2"></i
				>Completed
			</p>
			<p class="text-muted mb-0">
				<i
					class="mdi mdi-numeric-3-circle text-info fs-18 align-middle me-2"></i
				>In Progress
			</p>
			<p class="text-muted mb-0">
				<i
					class="mdi mdi-numeric-2-circle text-primary fs-18 align-middle me-2"></i
				>To Do
			</p>
		</div>
	</div>
	<div
		class="progress animated-progress rounded-bottom rounded-0"
		style="height: 6px">
		<div
			class="progress-bar bg-success rounded-0"
			role="progressbar"
			style="width: 30%"
			aria-valuenow="30"
			aria-valuemin="0"
			aria-valuemax="100"></div>
		<div
			class="progress-bar bg-info rounded-0"
			role="progressbar"
			style="width: 50%"
			aria-valuenow="50"
			aria-valuemin="0"
			aria-valuemax="100"></div>
		<div
			class="progress-bar rounded-0"
			role="progressbar"
			style="width: 20%"
			aria-valuenow="20"
			aria-valuemin="0"
			aria-valuemax="100"></div>
	</div>
</div>
