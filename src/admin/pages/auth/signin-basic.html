<div class="auth-page-wrapper pt-5">
	<!-- auth page bg -->
	<div class="auth-one-bg-position auth-one-bg" id="auth-particles">
		<div class="bg-overlay"></div>

		<div class="shape">
			<svg
				xmlns="http://www.w3.org/2000/svg"
				version="1.1"
				xmlns:xlink="http://www.w3.org/1999/xlink"
				viewBox="0 0 1440 120">
				<path
					d="M 0,36 C 144,53.6 432,123.2 720,124 C 1008,124.8 1296,56.8 1440,40L1440 140L0 140z"></path>
			</svg>
		</div>
	</div>

	<!-- auth page content -->
	<div class="auth-page-content">
		<div class="container">
			<div class="d-flex flex-wrap">
				<div class="width:100%">
					<div class="text-center mt-sm-5 mb-4 text-white-50">
						<div>
							<a
								href="index.html"
								class="d-inline-block auth-logo">
								<img
									src="/assets/images/logos/light.png"
									alt=""
									height="40" />
							</a>
						</div>
						<p class="mt-3 fs-15 fw-medium">
							Premium Admin & Dashboard Template
						</p>
					</div>
				</div>
			</div>
			<!-- end row -->

			<div class="d-flex flex-wrap justify-content-center">
				<div class="flex-grow-1 flex-basis:320px max-width:560px">
					<div class="card mt-4 card-bg-fill">
						<div class="card-body p-4">
							<div class="text-center mt-2">
								<h5 class="text-primary">Welcome Back !</h5>
								<p class="text-muted">
									Sign in to continue to CoCreate.
								</p>
							</div>
							<div class="p-2 mt-4">
								<!-- Single CoCreate sign-in form -->
								<form
									array="contacts"
									class="coform"
									autocomplete="on"
									role="form"
									aria-label="Sign in form">
									<div class="mb-3">
										<label for="email" class="form-label"
											>Email</label
										>
										<input
											type="email"
											class="form-control"
											id="email"
											name="email"
											key="email"
											placeholder="Enter email"
											required
											autocomplete="email"
											aria-required="true"
											aria-label="Email address" />
									</div>

									<div class="mb-3">
										<div class="float-end">
											<a
												state-to="adminView"
												state.src="pages/auth/pass-reset-basic.html"
												class="text-muted"
												>Forgot password?</a
											>
										</div>
										<label
											class="form-label"
											for="password-input"
											>Password</label
										>
										<div
											class="position-relative auth-pass-inputgroup mb-3">
											<input
												type="password"
												class="form-control pe-5 password-input"
												placeholder="Enter password"
												id="password-input"
												name="password"
												key="password"
												required
												autocomplete="current-password"
												aria-required="true"
												aria-label="Password" />
											<button
												class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted password-addon material-shadow-none"
												type="button"
												id="password-addon"
												aria-label="Toggle password visibility">
												<i
													class="ri-eye-fill align-middle"></i>
											</button>
										</div>
									</div>

									<div class="form-check">
										<input
											class="form-check-input"
											type="checkbox"
											value=""
											id="auth-remember-check" />
										<label
											class="form-check-label"
											for="auth-remember-check"
											>Remember me</label
										>
									</div>

									<div class="mt-4">
										<button
											class="btn btn-success w-100"
											actions="validate,signIn"
											type="button"
											aria-label="Sign in to CoCreate">
											Sign In
										</button>
									</div>
								</form>
							</div>
							<div class="mt-4 text-center">
								<div class="signin-other-title">
									<h5 class="fs-13 mb-4 title">
										Sign In with
									</h5>
								</div>
								<div>
									<button
										type="button"
										class="btn btn-primary btn-icon waves-effect waves-light">
										<i class="ri-facebook-fill fs-16"></i>
									</button>
									<button
										type="button"
										class="btn btn-danger btn-icon waves-effect waves-light">
										<i class="ri-google-fill fs-16"></i>
									</button>
									<button
										type="button"
										class="btn btn-dark btn-icon waves-effect waves-light">
										<i class="ri-github-fill fs-16"></i>
									</button>
									<button
										type="button"
										class="btn btn-info btn-icon waves-effect waves-light">
										<i class="ri-twitter-fill fs-16"></i>
									</button>
								</div>
							</div>
						</div>
						<!-- end card body -->
					</div>
					<!-- end card -->

					<div class="mt-4 text-center">
						<p class="mb-0">
							Don't have an account ?
							<a
								state-to="adminView"
								state.src="pages/auth/signup-basic.html"
								class="fw-semibold text-primary text-decoration-underline">
								Signup
							</a>
						</p>
					</div>
				</div>
			</div>
			<!-- end row -->
		</div>
		<!-- end container -->
	</div>
	<!-- end auth page content -->
</div>
<!-- end auth-page-wrapper -->

<!-- particles js -->

<!-- particles app js -->
<script src="/assets/js/pages/particles.app.js"></script>
