<!-- auth-page wrapper -->
<div
	class="auth-page-wrapper auth-bg-cover py-5 d-flex justify-content-center align-items-center min-vh-100">
	<div class="bg-overlay"></div>
	<!-- auth-page content -->
	<div class="auth-page-content overflow-hidden pt-lg-5">
		<div class="container">
			<div class="d-flex flex-wrap">
				<div class="width:100%">
					<div
						class="card overflow-hidden galaxy-border-none card-bg-fill">
						<div class="d-flex flex-wrap justify-content-center">
							<div class="flex-grow-1 flex-basis:320px">
								<div class="p-lg-5 p-4 auth-one-bg h-100">
									<div class="bg-overlay"></div>
									<div
										class="position-relative h-100 d-flex flex-column">
										<div class="mb-4">
											<a
												href="index.html"
												class="d-block">
												<img
													src="/assets/images/logos/light.png"
													alt=""
													height="40" />
											</a>
										</div>
										<div
											class="mt-auto"
											src="pages/auth/components/carousel.html"></div>
									</div>
								</div>
								<!-- end col -->

								<div class="flex-grow-1 flex-basis:320px">
									<div class="p-lg-5 p-4">
										<div>
											<h5 class="text-primary">
												Lock Screen
											</h5>
											<p class="text-muted">
												Enter your password to unlock
												the screen!
											</p>
										</div>
										<div class="user-thumb text-center">
											<img
												src="/assets/images/users/avatar-1.jpg"
												class="rounded-circle img-thumbnail avatar-lg material-shadow"
												alt="thumbnail" />
											<h5 class="mt-3">Anna Adame</h5>
										</div>

										<div class="mt-4">
											<form>
												<div class="mb-3">
													<label
														class="form-label"
														for="userpassword"
														>Password</label
													>
													<input
														type="password"
														class="form-control"
														id="userpassword"
														placeholder="Enter password"
														required />
												</div>
												<div class="mb-2 mt-4">
													<button
														class="btn btn-success w-100"
														type="submit">
														Unlock
													</button>
												</div>
											</form>
											<!-- end form -->
										</div>

										<div class="mt-5 text-center">
											<p class="mb-0">
												Not you ? return
												<a
													state-to="adminView"
													state.src="pages/auth/signin-cover.html"
													class="fw-semibold text-primary text-decoration-underline">
													Signin</a
												>
											</p>
										</div>
									</div>
								</div>
								<!-- end col -->
							</div>
							<!-- end row -->
						</div>
						<!-- end card -->
					</div>
					<!-- end col -->
				</div>
				<!-- end row -->
			</div>
			<!-- end container -->
		</div>
		<!-- end auth page content -->
	</div>
	<!-- end auth-page-wrapper -->
</div>
