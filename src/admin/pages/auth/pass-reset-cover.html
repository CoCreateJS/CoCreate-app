<!-- auth-page wrapper -->
<div
	class="auth-page-wrapper auth-bg-cover py-5 d-flex justify-content-center align-items-center min-vh-100">
	<div class="bg-overlay"></div>
	<!-- auth-page content -->
	<div class="auth-page-content overflow-hidden pt-lg-5">
		<div class="container">
			<div class="d-flex flex-wrap">
				<div class="width:100%">
					<div
						class="card overflow-hidden card-bg-fill galaxy-border-none">
						<div class="d-flex flex-wrap justify-content-center">
							<div class="flex-grow-1 flex-basis:320px">
								<div class="p-lg-5 p-4 auth-one-bg h-100">
									<div class="bg-overlay"></div>
									<div
										class="position-relative h-100 d-flex flex-column">
										<div class="mb-4">
											<a
												href="index.html"
												class="d-block">
												<img
													src="/assets/images/logos/light.png"
													alt=""
													height="40" />
											</a>
										</div>
										<div
											class="mt-auto"
											src="pages/auth/components/carousel.html"></div>
									</div>
								</div>
								<!-- end col -->

								<div class="flex-grow-1 flex-basis:320px">
									<div class="p-lg-5 p-4">
										<h5 class="text-primary">
											Forgot Password?
										</h5>
										<p class="text-muted">
											Reset password with CoCreate
										</p>

										<div class="mt-2 text-center">
											<lord-icon
												src="https://cdn.lordicon.com/rhvddzym.json"
												trigger="loop"
												colors="primary:#0ab39c"
												class="avatar-xl">
											</lord-icon>
										</div>

										<div
											class="alert border-0 alert-warning text-center mb-2 mx-2"
											role="alert">
											Enter your email and instructions
											will be sent to you!
										</div>
										<div class="p-2">
											<form>
												<div class="mb-4">
													<label class="form-label"
														>Email</label
													>
													<input
														type="email"
														class="form-control"
														id="email"
														placeholder="Enter email address" />
												</div>

												<div class="text-center mt-4">
													<button
														class="btn btn-success w-100"
														type="submit">
														Send Reset Link
													</button>
												</div>
											</form>
											<!-- end form -->
										</div>

										<div class="mt-5 text-center">
											<p class="mb-0">
												Wait, I remember my password...
												<a
													state-to="adminView"
													state.src="pages/auth/signin-cover.html"
													class="fw-semibold text-primary text-decoration-underline">
													Click here
												</a>
											</p>
										</div>
									</div>
								</div>
								<!-- end col -->
							</div>
							<!-- end row -->
						</div>
						<!-- end card -->
					</div>
					<!-- end col -->
				</div>
				<!-- end row -->
			</div>
			<!-- end container -->
		</div>
		<!-- end auth page content -->
	</div>
	<!-- end auth-page-wrapper -->
</div>
