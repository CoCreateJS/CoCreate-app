<!-- auth-page wrapper -->
<div
	class="auth-page-wrapper auth-bg-cover py-5 d-flex justify-content-center align-items-center min-vh-100">
	<div class="bg-overlay"></div>
	<!-- auth-page content -->
	<div class="auth-page-content overflow-hidden pt-lg-5">
		<div class="container">
			<div class="row">
				<div class="col-lg-12">
					<div
						class="card overflow-hidden card-bg-fill galaxy-border-none">
						<div class="row g-0">
							<div class="col-lg-6">
								<div class="p-lg-5 p-4 auth-one-bg h-100">
									<div class="bg-overlay"></div>
									<div
										class="position-relative h-100 d-flex flex-column">
										<div class="mb-4">
											<a
												href="index.html"
												class="d-block">
												<img
													src="/assets/images/logos/light.png"
													alt=""
													height="40" />
											</a>
										</div>
										<div
											class="mt-auto"
											src="pages/auth/components/carousel.html"></div>
									</div>
								</div>
							</div>
							<!-- end col -->
							<div class="col-lg-6">
								<div class="p-lg-5 p-4">
									<div>
										<h5 class="text-primary">
											Welcome Back !
										</h5>
										<p class="text-muted">
											Sign in to continue to CoCreate.
										</p>
									</div>

									<div class="mt-4">
										<!-- CoCreate sign-in form (array bound, actions on the button) -->
										<form
											array="contacts"
											class="coform"
											id="signin-cover"
											role="form"
											aria-label="Sign in to CoCreate"
											autocomplete="on">
											<div class="mb-3">
												<label
													for="signin-cover-email"
													class="form-label"
													>Email</label
												>
												<input
													type="email"
													id="signin-cover-email"
													name="email"
													key="email"
													class="form-control"
													placeholder="Enter email"
													required
													autocomplete="email"
													aria-required="true"
													aria-label="Email address" />
											</div>

											<div class="mb-3">
												<div class="float-end">
													<a
														state-to="adminView"
														state.src="pages/auth/pass-reset-cover.html"
														class="text-muted"
														>Forgot password?</a
													>
												</div>
												<label
													class="form-label"
													for="signin-cover-password"
													>Password</label
												>
												<div
													class="position-relative auth-pass-inputgroup mb-3">
													<input
														type="password"
														id="signin-cover-password"
														name="password"
														key="password"
														class="form-control pe-5 password-input"
														placeholder="Enter password"
														required
														autocomplete="current-password"
														aria-required="true"
														aria-label="Password" />
													<button
														class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted password-addon material-shadow-none"
														type="button"
														id="password-addon"
														aria-label="Toggle password visibility">
														<i
															class="ri-eye-fill align-middle"
															aria-hidden="true"></i>
													</button>
												</div>
											</div>

											<div class="form-check">
												<input
													class="form-check-input"
													type="checkbox"
													value=""
													id="auth-remember-check" />
												<label
													class="form-check-label"
													for="auth-remember-check"
													>Remember me</label
												>
											</div>

											<div class="mt-4">
												<button
													class="btn btn-success w-100"
													actions="validate,signIn"
													type="button"
													aria-label="Sign in to CoCreate">
													Sign In
												</button>
											</div>
										</form>
									</div>

									<div class="mt-5 text-center">
										<p class="mb-0">
											Don't have an account ?
											<a
												state-to="adminView"
												state.src="pages/auth/signup-cover.html"
												class="fw-semibold text-primary text-decoration-underline">
												Signup</a
											>
										</p>
									</div>
								</div>
							</div>
							<!-- end col -->
						</div>
						<!-- end row -->
					</div>
					<!-- end card -->
				</div>
				<!-- end col -->
			</div>
			<!-- end row -->
		</div>
		<!-- end container -->
	</div>

	<!-- end auth-page-wrapper -->
</div>
