<div class="auth-page-wrapper pt-5">
	<!-- auth page bg -->
	<div class="auth-one-bg-position auth-one-bg" id="auth-particles">
		<div class="bg-overlay"></div>

		<div class="shape">
			<svg
				xmlns="http://www.w3.org/2000/svg"
				version="1.1"
				xmlns:xlink="http://www.w3.org/1999/xlink"
				viewBox="0 0 1440 120">
				<path
					d="M 0,36 C 144,53.6 432,123.2 720,124 C 1008,124.8 1296,56.8 1440,40L1440 140L0 140z"></path>
			</svg>
		</div>
	</div>

	<!-- auth page content -->
	<div class="auth-page-content">
		<div class="container">
			<div class="d-flex flex-wrap">
				<div class="width:100%">
					<div class="text-center mt-sm-5 mb-4 text-white-50">
						<div>
							<a
								href="index.html"
								class="d-inline-block auth-logo">
								<img
									src="/assets/images/logos/light.png"
									alt=""
									height="40" />
							</a>
						</div>
						<p class="mt-3 fs-15 fw-medium">
							Premium Admin & Dashboard Template
						</p>
					</div>
				</div>
			</div>
			<!-- end row -->

			<div class="d-flex flex-wrap justify-content-center">
				<div class="flex-grow-1 flex-basis:320px max-width:560px">
					<div class="card mt-4 card-bg-fill">
						<div class="card-body p-4 text-center">
							<div class="avatar-lg mx-auto mt-2">
								<div
									class="avatar-title bg-light text-success display-3 rounded-circle">
									<i class="ri-checkbox-circle-fill"></i>
								</div>
							</div>
							<div class="mt-4 pt-2">
								<h4>Well done !</h4>
								<p class="text-muted mx-4">
									Aww yeah, you successfully read this
									important message.
								</p>
								<div class="mt-4">
									<a
										state-to="adminView"
										state.src="pages/auth/signin-basic.html"
										class="btn btn-success w-100"
										>Back to Dashboard</a
									>
								</div>
							</div>
						</div>
						<!-- end card body -->
					</div>
					<!-- end card -->
				</div>
			</div>
			<!-- end row -->
		</div>
		<!-- end container -->
	</div>
	<!-- end auth page content -->
</div>
<!-- end auth-page-wrapper -->
