<!-- auth-page wrapper -->
<div
	class="auth-page-wrapper auth-bg-cover py-5 d-flex justify-content-center align-items-center min-vh-100">
	<div class="bg-overlay"></div>
	<!-- auth-page content -->
	<div class="auth-page-content overflow-hidden pt-lg-5">
		<div class="container">
			<div class="d-flex flex-wrap">
				<div class="width:100%">
					<div
						class="card overflow-hidden card-bg-fill galaxy-border-none">
						<div class="d-flex flex-wrap justify-content-center">
							<div class="flex-grow-1 flex-basis:320px">
								<div class="p-lg-5 p-4 auth-one-bg h-100">
									<div class="bg-overlay"></div>
									<div
										class="position-relative h-100 d-flex flex-column">
										<div class="mb-4">
											<a
												href="index.html"
												class="d-block">
												<img
													src="/assets/images/logos/light.png"
													alt=""
													height="40" />
											</a>
										</div>
										<div
											class="mt-auto"
											src="pages/auth/components/carousel.html"></div>
									</div>
								</div>
								<!-- end col -->

								<div class="flex-grow-1 flex-basis:320px">
									<div class="p-lg-5 p-4 text-center">
										<div class="avatar-lg mx-auto mt-2">
											<div
												class="avatar-title bg-light text-success display-3 rounded-circle">
												<i
													class="ri-checkbox-circle-fill"></i>
											</div>
										</div>
										<div class="mt-4 pt-2">
											<h4>Well done !</h4>
											<p class="text-muted mx-4">
												Aww yeah, you successfully read
												this important message.
											</p>
											<div class="mt-4">
												<a
													state-to="adminView"
													state.src="pages/auth/signin-basic.html"
													class="btn btn-success w-100"
													>Back to Dashboard</a
												>
											</div>
										</div>
									</div>
								</div>
								<!-- end col -->
							</div>
							<!-- end row -->
						</div>
						<!-- end card -->
					</div>
					<!-- end col -->
				</div>
				<!-- end row -->
			</div>
			<!-- end container -->
		</div>
		<!-- end auth page content -->
	</div>
	<!-- end auth-page-wrapper -->
</div>
