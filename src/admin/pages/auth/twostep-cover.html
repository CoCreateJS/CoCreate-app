<!-- auth-page wrapper -->
<div
	class="auth-page-wrapper auth-bg-cover py-5 d-flex justify-content-center align-items-center min-vh-100">
	<div class="bg-overlay"></div>
	<!-- auth-page content -->
	<div class="auth-page-content overflow-hidden pt-lg-5">
		<div class="container">
			<div class="d-flex flex-wrap">
				<div class="width:100%">
					<div
						class="card overflow-hidden card-bg-fill galaxy-border-none">
						<div class="d-flex flex-wrap justify-content-center">
							<div class="flex-grow-1 flex-basis:320px">
								<div class="p-lg-5 p-4 auth-one-bg h-100">
									<div class="bg-overlay"></div>
									<div
										class="position-relative h-100 d-flex flex-column">
										<div class="mb-4">
											<a
												href="index.html"
												class="d-block">
												<img
													src="/assets/images/logos/light.png"
													alt=""
													height="40" />
											</a>
										</div>
										<div
											class="mt-auto"
											src="pages/auth/components/carousel.html"></div>
									</div>
								</div>
							</div>
							<!-- end col -->

							<div class="flex-grow-1 flex-basis:320px">
								<div class="p-lg-5 p-4">
									<div class="mb-4">
										<div class="avatar-lg mx-auto">
											<div
												class="avatar-title bg-light text-primary display-5 rounded-circle">
												<i class="ri-mail-line"></i>
											</div>
										</div>
									</div>
									<div class="text-muted text-center mx-lg-3">
										<h4 class="">Verify Your Email</h4>
										<p>
											Please enter the 4 digit code sent
											to
											<span class="fw-semibold"
												>example@abc.com</span
											>
										</p>
									</div>

									<div class="mt-4">
										<form autocomplete="off">
											<div class="d-flex flex-wrap">
												<div class="flex-grow-1 flex-basis:48px">
													<div class="mb-3">
														<label
															for="digit1-input"
															class="visually-hidden"
															>Digit 1</label
														>
														<input
															type="text"
															class="form-control form-control-lg bg-light border-light text-center"
															onkeyup="moveToNext(1, event)"
															maxlength="1"
															id="digit1-input" />
													</div>
												</div>
												<!-- end col -->

												<div class="flex-grow-1 flex-basis:48px">
													<div class="mb-3">
														<label
															for="digit2-input"
															class="visually-hidden"
															>Digit 2</label
														>
														<input
															type="text"
															class="form-control form-control-lg bg-light border-light text-center"
															onkeyup="moveToNext(2, event)"
															maxlength="1"
															id="digit2-input" />
													</div>
												</div>
												<!-- end col -->

												<div class="flex-grow-1 flex-basis:48px">
													<div class="mb-3">
														<label
															for="digit3-input"
															class="visually-hidden"
															>Digit 3</label
														>
														<input
															type="text"
															class="form-control form-control-lg bg-light border-light text-center"
															onkeyup="moveToNext(3, event)"
															maxlength="1"
															id="digit3-input" />
													</div>
												</div>
												<!-- end col -->

												<div class="flex-grow-1 flex-basis:48px">
													<div class="mb-3">
														<label
															for="digit4-input"
															class="visually-hidden"
															>Digit 4</label
														>
														<input
															type="text"
															class="form-control form-control-lg bg-light border-light text-center"
															onkeyup="moveToNext(4, event)"
															maxlength="1"
															id="digit4-input" />
													</div>
												</div>
												<!-- end col -->
											</div>

											<div class="mt-3">
												<button
													type="button"
													class="btn btn-success w-100">
													Confirm
												</button>
											</div>
										</form>
									</div>

									<div class="mt-5 text-center">
										<p class="mb-0">
											Didn't receive a code ?
											<a
												state-to="adminView"
												state.src="pages/auth/pass-reset-cover.html"
												class="fw-semibold text-primary text-decoration-underline"
												>Resend</a
											>
										</p>
									</div>
								</div>
							</div>
							<!-- end col -->
						</div>
						<!-- end row -->
					</div>
					<!-- end card -->
				</div>
				<!-- end col -->
			</div>
			<!-- end row -->
		</div>
		<!-- end container -->
	</div>
	<!-- end auth page content -->
</div>
<!-- end auth-page-wrapper -->

<!-- CoCreate Observer -->
<script type="module" src="https://cocreate.app/CoCreate-modules/CoCreate-observer/src/index.js"></script>

<!-- two-step-verification js -->
<script src="/assets/js/pages/two-step-verification.init.js"></script>
