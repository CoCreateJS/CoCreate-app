<!doctype html>
<html
	state-id="theme"
	lang="en"
	data-layout="vertical"
	data-topbar-color="defualt"
	data-sidebar-color="dark"
	data-sidebar-size="sm-hover"
	data-sidebar-image="none"
	data-preloader="disable"
	data-theme="default"
	data-theme-colors="default"
	data-bs-theme=""
	session>
	<head>
		<meta charset="utf-8" />
		<title>CoCreate - Regenerative Health Catalog</title>

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Regenerative Health & Longevity product catalog for discover, optimize, and regenerate care pathways." />

		<meta
			content="CoCreate"
			name="author" />

		<!-- Favicon -->
		<link
			rel="shortcut icon"
			href="/assets/images/icons/favicon.ico" />

		<!-- Bootstrap -->
		<link
			href="/assets/css/bootstrap.min.css"
			rel="stylesheet"
			type="text/css" />

		<!-- Icons -->
		<link
			href="/assets/css/icons.min.css"
			rel="stylesheet"
			type="text/css" />

		<!-- Menu Icon -->
		<link
			href="/assets/css/menu-icon.css"
			rel="stylesheet"
			type="text/css" />

		<!-- Plugins -->
		<link plugins />

		<!-- App -->
		<link
			href="/assets/css/index.css"
			rel="stylesheet"
			type="text/css" />

		<!-- Custom -->
		<link
			href="/assets/css/custom.css"
			rel="stylesheet"
			type="text/css"
			parse="true"
			save="false" />

		<!-- Manifest -->
		<link
			rel="manifest"
			href="/manifest.webmanifest" />
	</head>

	<body
		id="layout-wrapper"
		class="height:100dvh overflow:hidden">
		<a
			href="/auth/"
			session="false"
			hidden></a>
		<a
			state-to="authRedirect"
			state.href="/admin/"
			onload
			onload.click
			onload-on="stateLoaded"
			hidden></a>

		<!-- Header Start -->
		<header
			id="page-topbar"
			src="/admin/components/header.html"
			scroll="topbar-shadow"
			scroll-attribute="class"
			scroll-top="50"></header>
		<!-- Header End -->

		<!-- Menu Start -->
		<menu
			class="app-menu navbar-menu"
			src="/admin/components/menu.html"></menu>
		<!-- Menu End -->

		<!-- Main Content Start-->
		<main
			class="main-content display:flex flex-direction:column height:100dvh overflow:hidden">
			<!-- start page title -->
			<div
				class="flex-shrink-0"
				src="/components/breadcrumbs.html"></div>
			<!-- end page title -->

			<!-- TODO: use the src change to mark the the navigation menu item as active -->
			<!-- Page Content Start -->
			<div
				class="page-content d-flex flex-grow-1 min-height:0 overflow:hidden">
				<div
					id="main-view"
					class="display:flex flex-direction:column flex-grow-1 min-height:0 overflow:hidden min-width:200px"
					src=""
					state-id="adminView"
					state.onstoragechange="false"
					state-overwrite>
					<!-- <div
						onload.src="/apps/calendar/index.html"
						onload-query="$parent"
						onload-setTimeout="3000"></div> -->
				</div>

				<div
					id="offcanvas-app"
					resizable
					role="dialog"
					class="card offcanvas offcanvas-end flex-grow-1 min-height:0 mb-0 overflow:hidden"
					tabindex="-1"
					aria-labelledby="offcanvas-app-label"
					aria-close-on="button">
					<form
						class="card mb-0 d-flex flex-column flex-grow-1 min-height:0 h-100 overflow:hidden"
						array
						object
						state-id="offcanvas-app-form"
						state-overwrite>
						<div
							class="card-header text-center border-bottom-0"
							src="components/offcanvas-header.html"
							aria-label="App details header"></div>
						<div
							class="flex-grow-1 min-height:0 height:0"
							plugin='{"$SimpleBar": ["$this", {}]}'>
							<div
								id="offcanvas-app-view"
								state-id="offcanvas-app-view"
								state-overwrite
								input-query="$closest form .offcanvas-src"
								input.value="$getAttribute(src)"
								src=""></div>
						</div>
						<div
							class="card-footer flex-shrink-0"
							src="/components/form-buttons.html"
							role="region"
							aria-label="Form actions"></div>
					</form>
					<div resize="left"></div>
				</div>
			</div>
			<!-- Page Content End -->
		</main>
		<!-- Main Content End -->

		<!-- AI Chat Start -->
		<aside
			id="ai-chat-panel"
			class="ai-chat-panel"
			open="false"
			state-id="ai-chat-panel-drawer"
			state-overwrite
			aria-label="CoCreate AI"
			resizable
			resize
			resize-query="$document #page-topbar, $document .main-content, $document #offcanvas-app"
			resize.style="margin-right:$width">
			<button
				type="button"
				class="ai-chat-panel-refresh"
				aria-label="Refresh AI chat"
				title="Refresh AI chat">
				<i
					class="ri-refresh-line"
					aria-hidden="true"></i>
			</button>
			<button
				type="button"
				class="ai-chat-panel-close"
				aria-label="Close AI chat"
				aria-controls="ai-chat-panel"
				aria-close
				aria-expanded="false"
				state-id="ai-chat-panel-drawer"
				state-to="ai-chat-panel-drawer"
				state-overwrite
				state.open="false"
				state.aria-expanded="false">
				<i
					class="ri-close-line"
					aria-hidden="true"></i>
			</button>
			<div
				class="ai-chat-panel-content"
				src="/apps/ai/index.html"></div>
			<div resize="left"></div>
		</aside>
		<!-- AI Chat End -->

		<!-- Preloader Start -->
		<div id="preloader">
			<div id="status">
				<div
					class="spinner-border text-primary avatar-sm"
					role="status">
					<span class="visually-hidden">Loading...</span>
				</div>
			</div>
		</div>
		<!-- Preloader End -->

		<!-- Activities Start -->
		<div src="/apps/activities/index.html"></div>
		<!-- Activities End -->

		<!-- Theme Settings Start -->
		<div src="/components/theme-settings.html"></div>
		<!-- Theme Settings End -->

		<!-- Remove Item Start -->
		<div src="/components/remove-item.html"></div>
		<!-- Remove Item End -->

		<!-- Remove Item Start -->
		<div src="/components/members.html"></div>
		<!-- Remove Item End -->

		<!-- Notification Start -->
		<div
			class="position:fixed!important bottom:15px right:15px"
			aria-live="polite"
			role="status"
			aria-atomic="true">
			<div
				template="notification"
				class="card position:relative margin-top:10px padding:20px {{status}}">
				<span class="{{type}} font-weight:400">{{message}}</span>
				<a
					actions="remove"
					class="position:absolute top:4px right:4px"
					aria-label="Dismiss notification">
					<i
						src="/assets/svg/times.svg"
						aria-hidden="true"></i>
				</a>
			</div>
		</div>
		<!-- Notification End -->

		<!-- Back To Top Start -->
		<div src="/components/scroll-to-top.html"></div>
		<!-- Back To Top End -->

		<!-- Vertical Overlay Start -->
		<div
			class="vertical-overlay"
			toggle.class="vertical-sidebar-enable"
			toggle-query="$document body"></div>
		<!-- Vertical Overlay End -->

		<!-- JAVASCRIPT -->
		<script src="/dist/CoCreate.js"></script>
		<script src="/assets/js/lord-icon-2.1.0.js"></script>
	</body>
</html>
