<div
	class="offcanvas offcanvas-end"
	tabindex="-1"
	id="filters-view"
	aria-labelledby="offcanvasExampleLabel"
	aria-close-on="outside"
	aria-modal="true"
	role="dialog">
	<div class="offcanvas-header bg-light">
		<h5 class="offcanvas-title" id="offcanvasExampleLabel">
			<span 
				state-id="app"
				state-overwrite
				array="apps"
				object=""
				key="singularName"></span> 
				<span>Filters</span>
		</h5>
		<button
			type="button"
			class="btn-close text-reset"
			aria-controls="filters-view"
			aria-haspopup="dialog"
			aria-expanded="true"
			aria-label="Close"></button>
	</div>
	<!--end offcanvas-header-->
	<form action="" class="d-flex flex-column justify-content-end h-100">
		<div class="offcanvas-body">
			<!-- Render filter fields dynamically from object.fields[] -->
			<div
				state-id="app"
				render-query="[template='filter']"
				array="apps"
				object=""
				key="fields">
				<div
					class="mb-4"
					template="filter"
					render-as="fields"
					value-type="html">
					<label
						class="form-label text-muted text-uppercase fw-semibold mb-3"
						for="{{fields.key}}-filter">
						{{fields.label}}
					</label>
					<!-- <div src="components/templates/{{fields.tag}}.html"></div> -->
					{{fields.filterTemplate}}
				</div>
			</div>
			<template
				observe-target="[template='filter'] [tag='input']:empty"
				observe-query="$parent [tag='input']:empty"
				observe-insert-adjacent="afterbegin">
				<input
					id="{{fields.key}}-filter"
					class="{{fields.attributes.class}}"
					type="{{fields.attributes.type}}"
					placeholder="Enter {{fields.label}}" />
			</template>
			<template
				observe-target="#filters-view [tag='select']:empty"
				observe-query="$parent [tag='select']:empty"
				observe-insert-adjacent="afterbegin">
				<select
					id="{{fields.key}}-filter"
					class="{{fields.attributes.class}}"
					multiple
					render="fields.options">
					<option value="">Select {{fields.label}}</option>
					<span
						render-query="[template='option']"
						array="apps"
						object="686c630106fe282e338c1056"
						key="fields"
						filter-key="{{fields.key}}">
					</span>
				</select>
			</template>
			<template
				observe-target="#filters-view [tag='div']:empty"
				observe-query="$parent [tag='div']:empty"
				observe-insert-adjacent="afterbegin">
				<div class="{{fields.attributes.class}}" render>
					<!-- You can add dynamic content for div tagname here if needed -->
				</div>
			</template>
		</div>
		<!--end offcanvas-body-->
		<div class="offcanvas-footer border-top p-3 text-center hstack gap-2">
			<button class="btn btn-light w-100">Clear Filter</button>
			<button type="submit" class="btn btn-success w-100">Filters</button>
		</div>
		<!--end offcanvas-footer-->
	</form>
</div>
<!--end offcanvas-->
