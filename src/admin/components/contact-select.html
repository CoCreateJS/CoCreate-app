<div array="contacts" object render-query="[tempalte]">
	<div template class="d-flex align-items-center">
		<div class="avatar-sm rounded-circle position-relative overflow-hidden">
			<div
				class="avatar-title bg-secondary-subtle text-secondary material-shadow">
				<span class="overflow:hidden width:1ch letter-spacing:1em">
					{{object.first_name}}
				</span>
				<span class="overflow:hidden width:1ch letter-spacing:1em">
					{{object.last_name}}
				</span>
				<img
					class="position-absolute object-fit-cover"
					src="{{avatar[0].src}}"
					alt="Header Avatar"
					width="100%"
					height="100%" />
			</div>
		</div>
		<span class="text-start ms-xl-2">
			<span class="ms-1 fw-medium user-name-text">
				<span>{{object.first_name}}</span>
				<span>{{object.last_name}}</span>
			</span>
			<span class="ms-1 fs-12 user-name-sub-text">{{object.email}}</span>
		</span>
	</div>
</div>
