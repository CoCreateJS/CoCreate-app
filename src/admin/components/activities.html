<div
	id="activities-offcanvas"
	class="col-auto layout-rightside-col"
	aria-close-on="outside"
	aria-hidden="true">
	<div class="overlay"></div>
	<div class="layout-rightside">
		<div class="card h-100 rounded-0">
			<h5 class="card-title mb-3">Activities</h5>
			<div class="acitivity-timeline" array="activities" object render-query="[template]">
				<div class="acitivity-item d-flex" template>
					<div class="flex-shrink-0">
						<!-- Fetch avatar from the contacts array using the user_id from the activity -->
						<img
							src="/assets/images/users.jpg"
							array="contacts"
							object="{{object.modified.by}}"
							key="avatar[0].src"
							alt=""
							class="avatar-xs rounded-circle acitivity-avatar material-shadow" />
						<div
							class="avatar-xs acitivity-avatar"
							show-key="initials"
							show-value="true">
							<div
								class="avatar-title rounded-circle bg-success-subtle text-success material-shadow"
								key="initials">
							</div>
						</div>
						<div
							class="avatar-xs acitivity-avatar"
							show-key="icon"
							show-value="true">
							<div
								class="avatar-title rounded-circle bg-danger-subtle text-danger material-shadow">
								<i class="" key="icon"></i>
							</div>
						</div>
					</div>
					<div class="flex-grow-1 ms-3">
						<!-- Fetch name from the contacts array using the user_id from the activity -->
						<h6 class="mb-1" array="contacts" object="{{user_id}}" key="name">
							<span class="badge bg-primary-subtle text-primary align-middle" key-class="badge_class" key="badge_text"></span>
						</h6>
						<p class="text-muted mb-2" key="description"></p>
						
						<!-- Attachments -->
						<div class="row" show-key="attachments" show-value="true">
							<div class="col-xxl-4">
								<div class="row border border-dashed gx-2 p-2 mb-2" key="attachments" render-query="[template]">
									<div class="col-4" template>
										<img
											src=""
											key="src"
											alt=""
											class="img-fluid rounded material-shadow" />
									</div>
								</div>
							</div>
						</div>

						<!-- Avatar Group -->
						<div class="avatar-group mb-2" show-key="members" show-value="true" key="members" render-query="[template]">
							<a
								href="javascript: void(0);"
								class="avatar-group-item material-shadow"
								template>
								<img
									src=""
									key="avatar"
									alt=""
									class="rounded-circle avatar-xs" />
							</a>
						</div>

						<small class="mb-0 text-muted" key="date"></small>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
