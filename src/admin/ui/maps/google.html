<div plugin='{"$Prism.highlightAllUnder":["$this"]}'>
	<div class="d-flex flex-wrap gap-4">
		<div class="w-400 flex-grow-1">
			<div
				class="card"
				show="preview">
				<div class="card-header">
					<h4 class="card-title mb-0">Markers</h4>
				</div>
				<!-- end card header -->

				<div class="card-body">
					<div
						id="gmaps-markers"
						class="gmaps"></div>
				</div>
				<!-- end card-body -->
			</div>
			<!-- end card -->
		</div>
		<!-- end flex item -->

		<div class="w-400 flex-grow-1">
			<div
				class="card"
				show="preview">
				<div class="card-header">
					<h4 class="card-title mb-0">Overlays</h4>
				</div>
				<!-- end card header -->

				<div class="card-body">
					<div
						id="gmaps-overlay"
						class="gmaps"></div>
				</div>
				<!-- end card-body -->
			</div>
			<!-- end card -->
		</div>
		<!-- end flex item -->
	</div>
	<!-- end flex layout -->

	<div class="d-flex flex-wrap gap-4">
		<div class="w-400 flex-grow-1">
			<div
				class="card"
				show="preview">
				<div class="card-header">
					<h4 class="card-title mb-0">Street View Panoramas</h4>
				</div>
				<!-- end card header -->

				<div class="card-body">
					<div
						id="panorama"
						class="gmaps-panaroma"></div>
				</div>
				<!-- end card-body -->
			</div>
			<!-- end card -->
		</div>
		<!-- end flex item -->

		<div class="w-400 flex-grow-1">
			<div
				class="card"
				show="preview">
				<div class="card-header">
					<h4 class="card-title mb-0">Map Types</h4>
				</div>
				<!-- end card header -->

				<div class="card-body">
					<div
						id="gmaps-types"
						class="gmaps"></div>
				</div>
				<!-- end card-body -->
			</div>
			<!-- end card -->
		</div>
		<!-- end flex item -->
	</div>
	<!-- end flex layout -->
</div>
<!-- container -->

<!-- google maps api -->
<script src="https://maps.google.com/maps/api/js?key=AIzaSyCtSAR45TFgZjOs4nBFFZnII-6mMHLfSYI"></script>

<!-- gmaps plugins -->


<!-- gmaps init -->
<script>
	var map;
	document.addEventListener("DOMContentLoaded", function (e) {
		(document.getElementById("gmaps-markers") &&
			(map = new GMaps({
				div: "#gmaps-markers",
				lat: -12.043333,
				lng: -77.028333
			})).addMarker({
				lat: -12.043333,
				lng: -77.03,
				title: "Lima",
				details: { database_id: 42, author: "HPNeo" },
				click: function (e) {
					(console.log && console.log(e),
						alert("You clicked in this marker"));
				}
			}),
			document.getElementById("gmaps-overlay") &&
				(map = new GMaps({
					div: "#gmaps-overlay",
					lat: -12.043333,
					lng: -77.028333
				})).drawOverlay({
					lat: map.getCenter().lat(),
					lng: map.getCenter().lng(),
					content:
						'<div class="gmaps-overlay">Lima<div class="gmaps-overlay_arrow above"></div></div>',
					verticalAlign: "top",
					horizontalAlign: "center"
				}),
			document.getElementById("panorama") &&
				(map = GMaps.createPanorama({
					el: "#panorama",
					lat: 42.3455,
					lng: -71.0983
				})),
			document.getElementById("gmaps-types") &&
				((map = new GMaps({
					div: "#gmaps-types",
					lat: -12.043333,
					lng: -77.028333,
					mapTypeControlOptions: {
						mapTypeIds: [
							"hybrid",
							"roadmap",
							"satellite",
							"terrain",
							"osm"
						]
					}
				})).addMapType("osm", {
					getTileUrl: function (e, a) {
						return (
							"https://a.tile.openstreetmap.org/" +
							a +
							"/" +
							e.x +
							"/" +
							e.y +
							".png"
						);
					},
					tileSize: new google.maps.Size(256, 256),
					name: "OpenStreetMap",
					maxZoom: 18
				}),
				map.setMapTypeId("osm")));
	});
</script>
