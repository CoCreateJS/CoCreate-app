<div class="container-fluid">
	<div class="row">
		<div class="col-xl-6">
			<div class="card" show="preview">
				<div class="card-header">
					<h4 class="card-title mb-0">Line Chart</h4>
				</div>
				<div class="card-body">
					<canvas
						id="lineChart"
						class="chartjs-chart"
						data-colors='["--coc-primary-rgb, 0.2", "--coc-primary", "--coc-success-rgb, 0.2", "--coc-success"]'></canvas>
				</div>
			</div>
		</div>
		<!-- end col -->

		<div class="col-xl-6">
			<div class="card" show="preview">
				<div class="card-header">
					<h4 class="card-title mb-0">Bar Chart</h4>
				</div>
				<div class="card-body">
					<canvas
						id="bar"
						class="chartjs-chart"
						data-colors='["--coc-primary-rgb, 0.8", "--coc-primary-rgb, 0.9"]'></canvas>
				</div>
			</div>
		</div>
		<!-- end col -->
	</div>
	<!-- end row -->

	<div class="row">
		<div class="col-xl-6">
			<div class="card" show="preview">
				<div class="card-header">
					<h4 class="card-title mb-0">Pie Chart</h4>
				</div>
				<div class="card-body">
					<canvas
						id="pieChart"
						class="chartjs-chart"
						data-colors='["--coc-success", "--coc-light"]'></canvas>
				</div>
			</div>
		</div>
		<!-- end col -->

		<div class="col-xl-6">
			<div class="card" show="preview">
				<div class="card-header">
					<h4 class="card-title mb-0">Donut Chart</h4>
				</div>
				<div class="card-body">
					<canvas
						id="doughnut"
						class="chartjs-chart"
						data-colors='["--coc-primary", "--coc-light"]'></canvas>
				</div>
			</div>
		</div>
		<!-- end col -->
	</div>
	<!-- end row -->

	<div class="row">
		<div class="col-xl-6">
			<div class="card" show="preview">
				<div class="card-header">
					<h4 class="card-title mb-0">Polar Chart</h4>
				</div>
				<div class="card-body">
					<canvas
						id="polarArea"
						class="chartjs-chart"
						data-colors='["--coc-danger", "--coc-success", "--coc-warning", "--coc-primary"]'>
					</canvas>
				</div>
			</div>
		</div>
		<!-- end col -->

		<div class="col-xl-6">
			<div class="card" show="preview">
				<div class="card-header">
					<h4 class="card-title mb-0">Radar Chart</h4>
				</div>
				<div class="card-body">
					<canvas
						id="radar"
						class="chartjs-chart"
						data-colors='["--coc-success-rgb, 0.2", "--coc-success", "--coc-primary-rgb, 0.2", "--coc-primary"]'></canvas>
				</div>
			</div>
		</div>
		<!-- end col -->
	</div>
	<!-- end row -->
</div>
<!-- container-fluid -->
