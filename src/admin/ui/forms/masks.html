<div>
	<div class="d-flex flex-wrap gap-4">
		<div class="w-100">
			<div
				class="card"
				show="preview">
				<div class="card-header">
					<h4 class="card-title mb-0">Examples</h4>
				</div>
				<!-- end card header -->

				<div class="card-body">
					<form action="#">
						<div>
							<h5 class="fs-14 mb-3 text-muted">
								Date Formatting
							</h5>
							<div class="d-flex flex-wrap gap-4">
								<div class="w-400 flex-grow-1">
									<div class="mb-3">
										<label
											for="cleave-date"
											class="form-label"
											>Date</label
										>
										<input
											type="text"
											class="form-control"
											placeholder="DD-MM-YYYY"
											id="cleave-date" />
									</div>
								</div>
								<!-- end flex item -->

								<div class="w-400 flex-grow-1">
									<div class="mb-3">
										<label
											for="cleave-date-format"
											class="form-label"
											>Date Formatting</label
										>
										<input
											type="text"
											class="form-control"
											placeholder="MM/YY"
											id="cleave-date-format" />
									</div>
								</div>
								<!-- end flex item -->
							</div>
							<!-- end flex layout -->
						</div>

						<div class="border mt-3 border-dashed"></div>

						<div class="mt-4">
							<h6 class="mb-3 fs-14 text-muted">
								Time Formatting
							</h6>
							<div class="d-flex flex-wrap gap-4">
								<div class="w-400 flex-grow-1">
									<div class="mb-3">
										<label
											for="cleave-time"
											class="form-label"
											>Time</label
										>
										<input
											type="text"
											class="form-control"
											placeholder="hh:mm:ss"
											id="cleave-time" />
									</div>
								</div>
								<!-- end flex item -->

								<div class="w-400 flex-grow-1">
									<div class="mb-3">
										<label
											for="cleave-time-format"
											class="form-label"
											>Time Formatting</label
										>
										<input
											type="text"
											class="form-control"
											placeholder="hh:mm"
											id="cleave-time-format" />
									</div>
								</div>
								<!-- end flex item -->
							</div>
							<!-- end flex layout -->
						</div>

						<div class="border mt-3 border-dashed"></div>

						<div class="mt-4">
							<h5 class="fs-14 mb-3 text-muted">
								Custom Options
							</h5>
							<div class="d-flex flex-wrap gap-4">
								<div class="w-400 flex-grow-1">
									<div class="mb-3">
										<label
											for="cleave-ccard"
											class="form-label"
											>Credit Card</label
										>
										<input
											type="text"
											class="form-control"
											id="cleave-ccard"
											placeholder="xxxx xxxx xxxx xxxx" />
									</div>
								</div>
								<!-- end flex item -->

								<div class="w-400 flex-grow-1">
									<div class="mb-3">
										<label
											for="cleave-delimiter"
											class="form-label"
											>Delimiter</label
										>
										<input
											type="text"
											class="form-control"
											id="cleave-delimiter"
											placeholder="xxx·xxx·xxx" />
									</div>
								</div>
								<!-- end flex item -->
							</div>
							<!-- end flex layout -->

							<div class="d-flex flex-wrap gap-4">
								<div class="w-400 flex-grow-1">
									<div class="mb-3">
										<label
											for="cleave-delimiters"
											class="form-label"
											>Delimiters</label
										>
										<input
											type="text"
											class="form-control"
											id="cleave-delimiters"
											placeholder="xxx.xxx.xxx-xx" />
									</div>
								</div>
								<!-- end flex item -->

								<div class="w-400 flex-grow-1">
									<div class="mb-3">
										<label
											for="cleave-prefix"
											class="form-label"
											>Prefix</label
										>
										<input
											type="text"
											class="form-control"
											id="cleave-prefix" />
									</div>
								</div>
								<!-- end flex item -->
							</div>
							<!-- end flex layout -->

							<div class="d-flex flex-wrap gap-4">
								<div class="w-400 flex-grow-1">
									<div class="mb-3 mb-xl-0">
										<label
											for="cleave-phone"
											class="form-label"
											>Phone</label
										>
										<input
											type="text"
											class="form-control"
											id="cleave-phone"
											placeholder="(xxx)xxx-xxxx" />
									</div>
								</div>
								<!-- end flex item -->

								<div class="w-400 flex-grow-1">
									<div class="mb-0">
										<label
											for="cleave-numeral"
											class="form-label"
											>Numeral Formatting</label
										>
										<input
											type="text"
											class="form-control"
											placeholder="Enter numeral"
											id="cleave-numeral" />
									</div>
								</div>
								<!-- end flex item -->
							</div>
							<!-- end flex layout -->
						</div>
					</form>
					<!-- end form -->
				</div>
				<!-- end card-body -->
			</div>
			<!-- end card -->
		</div>
		<!-- end flex item -->
	</div>
	<!-- end flex layout -->
</div>
<!-- container -->

<!-- cleave.js -->

<!-- form masks init -->
<script>
	var cleaveDate,
		cleaveDateFormat,
		cleaveTime,
		cleaveTimeFormat,
		cleaveNumeral,
		cleaveDelimiter,
		cleaveDelimiters,
		cleavePrefix,
		cleaveBlocks;
	(document.querySelector("#cleave-date") &&
		(cleaveDate = new Cleave("#cleave-date", {
			date: !0,
			delimiter: "-",
			datePattern: ["d", "m", "Y"]
		})),
		document.querySelector("#cleave-date-format") &&
			(cleaveDateFormat = new Cleave("#cleave-date-format", {
				date: !0,
				datePattern: ["m", "y"]
			})),
		document.querySelector("#cleave-time") &&
			(cleaveTime = new Cleave("#cleave-time", {
				time: !0,
				timePattern: ["h", "m", "s"]
			})),
		document.querySelector("#cleave-time-format") &&
			(cleaveTimeFormat = new Cleave("#cleave-time-format", {
				time: !0,
				timePattern: ["h", "m"]
			})),
		document.querySelector("#cleave-numeral") &&
			(cleaveNumeral = new Cleave("#cleave-numeral", {
				numeral: !0,
				numeralThousandsGroupStyle: "thousand"
			})),
		document.querySelector("#cleave-ccard") &&
			(cleaveBlocks = new Cleave("#cleave-ccard", {
				blocks: [4, 4, 4, 4],
				uppercase: !0
			})),
		document.querySelector("#cleave-delimiter") &&
			(cleaveDelimiter = new Cleave("#cleave-delimiter", {
				delimiter: "·",
				blocks: [3, 3, 3],
				uppercase: !0
			})),
		document.querySelector("#cleave-delimiters") &&
			(cleaveDelimiters = new Cleave("#cleave-delimiters", {
				delimiters: [".", ".", "-"],
				blocks: [3, 3, 3, 2],
				uppercase: !0
			})),
		document.querySelector("#cleave-prefix") &&
			(cleavePrefix = new Cleave("#cleave-prefix", {
				prefix: "PREFIX",
				delimiter: "-",
				blocks: [6, 4, 4, 4],
				uppercase: !0
			})),
		document.querySelector("#cleave-phone") &&
			(cleaveBlocks = new Cleave("#cleave-phone", {
				delimiters: ["(", ")", "-"],
				blocks: [0, 3, 3, 4]
			})));
</script>
