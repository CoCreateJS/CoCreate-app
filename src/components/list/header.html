<div
	class="list-header d-flex flex-wrap justify-content-between align-items-center gap-2">
	<link rel="stylesheet" href="/components/list/header.css" />

	<div class="list-header-primary d-flex align-items-center gap-2">
		<button
			type="button"
			class="list-toolbar-control list-compact-action list-filter-button btn btn-light"
			aria-controls="context-sidebar"
			aria-haspopup="dialog"
			aria-expanded="false"
			aria-label="Filters"
			title="Filters">
			<i
				class="ri-filter-3-line"
				aria-hidden="true"></i>
			<span class="list-action-label">Filters</span>
		</button>
		<div
			class="list-header-extension d-flex align-items-center min-width:0"
			src="">
			<input
				type="hidden"
				state-id="app"
				array="apps"
				object
				key="listHeader"
				input.src="$value"
				input-query="$parent" />
		</div>
	</div>

	<!-- List actions -->
	<div class="list-header-actions hstack gap-2 ms-auto">
		<div class="dropdown">
			<button
				class="list-toolbar-control list-compact-action btn btn-light dropdown-toggle"
				type="button"
				id="viewDropdown"
				aria-expanded="false"
				aria-controls="viewDropdownMenu"
				aria-haspopup="menu"
				aria-label="Change view"
				title="Change view">
				<i
					state-id="list-view"
					class="ri-layout-grid-line"></i>
				<span class="list-action-label">View</span>
			</button>
			<ul
				id="viewDropdownMenu"
				class="dropdown-menu"
				role="menu"
				aria-labelledby="viewDropdown"
				aria-close-on="anywhere"
				aria-hidden="true">
				<li>
					<a
						class="dropdown-item"
						href="#"
						state-to="list-view"
						state.src="/components/list/grid.html">
						<i class="ri-layout-grid-line me-2"></i>
						Grid
					</a>
				</li>
				<li>
					<a
						class="dropdown-item"
						href="#"
						state-to="list-view"
						state.src="/components/list/table.html">
						<i class="ri-table-line me-2"></i>
						Table
					</a>
				</li>
			</ul>
		</div>

		<button
			type="button"
			class="list-toolbar-control list-toolbar-icon btn btn-soft-danger"
			id="remove-actions"
			actions="delete"
			delete-query="$document #list-view table[data-row-selection] tbody [data-select-row]:checked[]"
			aria-label="Delete selected items"
			title="Delete selected items">
			<i class="ri-delete-bin-2-line" aria-hidden="true"></i>
		</button>
		<button
			type="button"
			class="list-toolbar-control list-compact-action btn btn-success add-btn"
			aria-controls="offcanvas-app"
			aria-open
			aria-haspopup="dialog"
			aria-expanded="false"
			state-to="offcanvas-app-view"
			state.src=""
			id="create-btn"
			aria-label="Create item"
			title="Create item">
			<input
				type="hidden"
				state-id="app"
				array="apps"
				object
				key="path"
				value-suffix="/form.html"
				input.state.src="$value"
				input-query="$parent" />
			<div
				state-to="offcanvas-app-form"
				state.$reset
				state.array="">
				<input
					type="hidden"
					state-id="app"
					array="apps"
					object
					key="array"
					input.state.array="$value"
					input-query="$parent" />
			</div>

			<i class="ri-add-line" aria-hidden="true"></i>
			<span class="list-action-label">
				New
				<span
					state-id="app"
					array="apps"
					object
					key="singularName"></span>
			</span>
		</button>
		<span class="dropdown">
			<button
				class="list-toolbar-control list-toolbar-icon btn btn-light"
				type="button"
				id="settingsDropdownButton"
				aria-controls="settingsDropdownMenu"
				aria-haspopup="menu"
				aria-expanded="false"
				title="More actions"
				aria-label="More actions">
				<i class="ri-more-2-fill" aria-hidden="true"></i>
			</button>
			<ul
				id="settingsDropdownMenu"
				class="dropdown-menu dropdown-menu-end"
				role="menu"
				aria-labelledby="settingsDropdownButton"
				aria-hidden="true"
				aria-close-on="anywhere">
				<li>
					<a
						class="dropdown-item"
						href="#"
						role="menuitem"
						>Copy</a
					>
				</li>
				<li>
					<a
						class="dropdown-item"
						href="#"
						role="menuitem"
						>Import</a
					>
				</li>
				<li>
					<a
						class="dropdown-item"
						href="#"
						role="menuitem"
						>Export</a
					>
				</li>
				<li>
					<a
						class="dropdown-item"
						href="#"
						role="menuitem"
						>Print</a
					>
				</li>
				<li>
					<a
						class="dropdown-item"
						href="#"
						role="menuitem"
						>Download as CSV</a
					>
				</li>
				<li><hr class="dropdown-divider" /></li>
				<li>
					<a
						class="dropdown-item text-danger"
						role="menuitem"
						actions="delete"
						delete-query="$document #list-view table[data-row-selection] tbody [data-select-row]:checked[]">
						<i class="ri-delete-bin-2-line me-2"></i>
						Delete selected
					</a>
				</li>
				<!-- <li><a class="dropdown-item" href="#" role="menuitem">Customize Columns</a></li> -->
				<!-- <li><a class="dropdown-item" href="#" role="menuitem">Reset board view to default</a></li> -->
			</ul>
		</span>
	</div>
</div>
