<div class="d-flex align-items-center">
	<div class="flex-shrink-0">
		<a
			role="button"
			tabindex="0"
			state-to="offcanvas-app-view"
			state.src="/apps/contacts/details.html"
			aria-controls="offcanvas-app"
			aria-open=""
			aria-haspopup="dialog"
			aria-expanded="false">
			<div
				state-to="offcanvas-app-form"
				state.array="contacts"
				state.object="{{object._id}}"></div>

			<div
				class="avatar-xs rounded-circle position-relative overflow-hidden"
				state-to="offcanvas-app-form"
				state.array="contacts"
				state.object="{{object._id}}">
				<div
					class="avatar-title bg-secondary-subtle text-secondary material-shadow">
					<span class="overflow-hidden width:1ch letter-spacing:1em"
						>{{object.first_name}}</span
					>
					<img
						class="position-absolute object-fit-cover"
						src="/assets/images/transparent.png"
						alt="Avatar"
						width="100%"
						height="100%"
						array="contacts"
						object="{{object._id}}"
						key="avatar[0].src"
						onerror="this.onerror=null; this.src='/assets/images/transparent.png';" />
				</div>
			</div>
		</a>
	</div>
	<a
		role="button"
		tabindex="0"
		class="flex-grow-1 ms-2 name"
		state-to="offcanvas-app-view"
		state.src="/apps/contacts/details.html"
		aria-controls="offcanvas-app"
		aria-open=""
		aria-haspopup="dialog"
		aria-expanded="false">
		<div
			state-to="offcanvas-app-form"
			state.array="contacts"
			state.object="{{object._id}}"></div>
		<span>{{object.name}}</span>
	</a>
</div>
