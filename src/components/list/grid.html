<div
	id="grid"
	array=""
	object
	filter-limit="20"
	render-query="[template]"
	state-id="list"
	state-overwrite
	class="d-flex flex-wrap gap-3">
	<!-- Card template for rendering each lead -->
	<div class="card flex-grow-1" template>
		<div class="card-body">
			<button
				type="button"
				class="btn btn-icon btn-soft-primary float-end"
				aria-pressed="true" toggle.class="active" toggle.aria-pressed="true, false">
				<i class="mdi mdi-cards-heart fs-16"></i>
			</button>
			<div class="avatar-sm mb-4">
				<div class="avatar-title bg-light rounded">
					<img
						src="{{object.avatar}}{{object.icon}}"
						alt="{{object.name}}{{object.title}}"
						class="avatar-xxs" />
				</div>
			</div>
			<a href="#!">
				<h5>{{object.name}}{{object.title}}</h5>
			</a>
			<p class="text-muted">{{object.company}}</p>
			<div class="d-flex gap-4 mb-3">
				<div>
					<i
						class="ri-map-pin-2-line text-primary me-1 align-bottom"></i>
					<!-- Location not in data -->
				</div>
				<div>
					<i class="ri-time-line text-primary me-1 align-bottom"></i>
					{{object.created.on}}
				</div>
			</div>
			<p class="text-muted">
				Email: {{object.email}}<br />
				Phone: {{object.phone}}
			</p>
			<div class="hstack gap-2">
				<span class="badge bg-success-subtle text-success" 
					render="object.status" 
					render-as="status">
					{{status}}
				</span>
				<span class="badge bg-primary-subtle text-primary" 
					render="object.tags" 
					render-as="tags"
					>{{tags}}</span
				>
				<span class="badge bg-danger-subtle text-danger"
					>{{object.views}} views</span
				>
			</div>
			<!-- Actions below are generic, you can update or remove as needed for leads -->
			<div class="mt-4 hstack gap-2">
				<a
					state.src="/apps/job/application.html"
					state-to="adminView"
					class="btn btn-soft-primary w-100"
					>Apply Job</a
				>
				<a
					state.src="/apps/job/details.html"
					state-to="adminView"
					class="btn btn-soft-success w-100"
					>Overview</a
				>
			</div>
		</div>
	</div>
</div>
<!-- end grid -->

<div class="row g-0 justify-content-end mb-4" id="pagination-element">
	<!-- end col -->
	<div class="col-sm-6">
		<div
			class="pagination-block pagination pagination-separated justify-content-center justify-content-sm-end mb-sm-0">
			<div class="page-item">
				<a href="javascript:void(0);" class="page-link" id="page-prev"
					>Previous</a
				>
			</div>
			<span id="page-num" class="pagination"></span>
			<div class="page-item">
				<a href="javascript:void(0);" class="page-link" id="page-next"
					>Next</a
				>
			</div>
		</div>
	</div>
	<!-- end col -->
</div>
<!-- end row -->
