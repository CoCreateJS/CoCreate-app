<div
	class="card h-100 mb-0"
	plugin='{"$SimpleBar": ["$this", {}]}'>
	<div class="card-body">
		<div class="table-card">
			<table
				id="table"
				data-row-selection
				state-id="app"
				state-overwrite
				array="apps"
				object=""
				key="fields"
				filter-limit
				render-query="[template='column'][]"
				input.array=""
				input-set-timeout="500"
				input-query="tbody"
				class="table align-middle">
				<thead>
					<tr>
						<th scope="col" style="width: 56px; padding-left: 26px">
							<div class="form-check mb-0">
								<input
									class="form-check-input"
									type="checkbox"
									data-select-all
									aria-label="Select all loaded rows" />
							</div>
						</th>
						<!-- Render each column header dynamically -->
						<th
							template="column"
							render-as="column"
							scope="col">
							<div
								class="d-flex align-items-center justify-content-between gap-2">
								<span>{{column.label}}</span>
								<a
									class="float-end"
									filter-query="$closest table tbody"
									filter-sort-key="{{column.key}}"
									filter-sort-direction=""
									click.value="asc, desc"
									click.filter-sort-direction="$value">
									<i
										toggle.src="/assets/svg/sort-down.svg, assets/svg/sort-up.svg"
										src="/assets/svg/sort.svg"></i>
								</a>
							</div>
						</th>
					</tr>
				</thead>
				<tbody
					class="form-check-all list-view"
					state-id="table"
					state-overwrite
					filter-sort-key="modified.on"
					filter-sort-direction="desc"
					array=""
					object
					filter-limit="20"
					render-query="tr[template]">
					<tr template>
						<td style="padding-left: 26px">
							<div class="form-check mb-0">
								<input
									class="form-check-input"
									type="checkbox"
									name="selected[]"
									value="{{object._id}}"
									data-select-row
									aria-label="Select row {{object._id}}" />
							</div>
						</td>
						<td
							template="column"
							render-as="column"
							value-type="html">
							{{column.tableTemplate}}
						</td>
					</tr>
					<tr
						style="height: 20px"
						filter-on="scroll"
						filter-query="$parent"></tr>
				</tbody>
			</table>

			<div
				class="noresult"
				style="display: none">
				<div class="text-center">
					<lord-icon
						src="https://cdn.lordicon.com/msoeawqm.json"
						trigger="loop"
						colors="primary:#121331,secondary:#08a88a"
						style="width: 75px; height: 75px"></lord-icon>
					<h5 class="mt-2">Sorry! No Result Found</h5>
					<p class="text-muted mb-0">
						We've searched more than 150+ leads We did not find any
						leads for you search.
					</p>
				</div>
			</div>
		</div>
		<!-- <div class="d-flex justify-content-end mt-3">
			<div class="pagination-wrap hstack gap-2">
				<a class="page-item pagination-prev disabled" href="#">
					Previous
				</a>
				<ul class="pagination listjs-pagination mb-0"></ul>
				<a class="page-item pagination-next" href="#"> Next </a>
			</div>
		</div> -->
	</div>
</div>
<!--end card-->
<script src="/components/list/table.js"></script>
