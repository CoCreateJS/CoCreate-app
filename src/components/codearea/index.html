<link
	rel="stylesheet"
	href="/components/codearea/index.css" />

<codearea class="component-codearea">
	<pre aria-hidden="true"><code class="language-json"></code></pre>
	<textarea
		height="auto"
		type="code"
		lang="json"
		key="{}"
		value-type="object"
		validate
		aria-label="JSON editor"
		value-evaluate="false"
		spellcheck="false"></textarea>
	<button
		type="button"
		class="btn position-absolute top-0 end-0 m-2 p-1 border-0 bg-transparent fs-24"
		clipboard
		clipboard-query="$parent textarea"
		aria-label="Copy code"
		title="Copy code">
		<i src="/assets/svg/remix/file-copy-line.svg" aria-hidden="true"></i>
		<i src="/assets/svg/remix/check-line.svg" aria-hidden="true"></i>
	</button>
</codearea>
