<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="X-UA-Compatible"
			content="IE=edge" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="../assets/favicon.ico" />
		<title>Text | CoCreate</title>

		<link
			rel="manifest"
			href="/manifest.webmanifest" />
	</head>

	<body>
		<div class="padding:20px">
			<section class="margin-bottom:25px">
				<h2>Native camera label test</h2>
				<input
					id="native-camera-input"
					type="file"
					accept="image/*" />
				<label
					for="native-camera-input"
					file-for="native-camera-input"
					file-capture="user"
					click-group="native-camera-source"
					click.class="active"
					aria-controls="native-camera-aria-panel"
					class="btn btn-primary active">
					Open front camera
				</label>
				<label
					for="native-camera-input"
					file-for="native-camera-input"
					file-capture="environment"
					click-group="native-camera-source"
					click.class="active"
					aria-controls="native-camera-aria-panel"
					class="btn btn-secondary">
					Open rear camera
				</label>
				<label
					for="native-camera-input"
					file-for="native-camera-input"
					file-capture="false"
					click-group="native-camera-source"
					click.class="active"
					aria-controls="native-camera-aria-panel"
					class="btn btn-light">
					Open device picker
				</label>
				<div
					id="native-camera-aria-panel"
					class="padding:10px margin-top:10px border:1px_solid_#ddd"
					aria-hidden="true">
					ARIA-controlled test panel
				</div>

				<hr />
				<input
					id="native-rear-camera-input"
					type="file"
					accept="image/*"
					capture="environment" />
				<label
					for="native-rear-camera-input"
					class="btn btn-warning">
					Native static rear camera
				</label>

				<hr />
				<h3>Android controller-shape tests</h3>
				<input
					id="native-hidden-camera-input"
					type="file"
					accept="image/*"
					capture="user"
					hidden />
				<label
					for="native-hidden-camera-input"
					class="btn btn-info">
					Hidden single input
				</label>

				<input
					id="native-hidden-multiple-camera-input"
					type="file"
					accept="image/*"
					capture="user"
					multiple
					hidden />
				<label
					for="native-hidden-multiple-camera-input"
					class="btn btn-dark">
					Hidden multiple input
				</label>
			</section>

			<!--<input    array="modules" realtime="true" object="5e6d06ab430580425dd9e950" key="inputText" style="width: 500px; display: block">-->
			<!--<textarea array="modules" realtime="true" object="5e6d06ab430580425dd9e950" key="nameOtro" id="textare_test" rows="10" style="width: 500px; display: block" ></textarea>-->
			<!--<textarea array="modules" realtime="true" object="5e6d06ab430580425dd9e950" key="nameOtro2" id="textare_test" rows="10" style="width: 500px; display: block" ></textarea>-->
			<form
				realtime="true"
				array="testing"
				object="5ef50326e0219c2a488dc6bc"
				class="margin-bottom:75px"
				id="form">
				<textarea
					realtime="true"
					key="html"
					rows="10"
					class="floating-label"></textarea>

                    realtime="true"

                <div
                    realtime="true"

                    class="floating-label" 
                    contenteditable="true">
                </div> -->
			</form>
		</div>

		<!--<script src="../dist/CoCreate-text.js"></script>-->

	</body>
</html>
