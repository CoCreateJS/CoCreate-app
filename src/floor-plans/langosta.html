<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Villa - Wood Floors & Top Suites</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: white; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui-panel {
            position: absolute; top: 0; left: 0; width: 100%;
            background: rgba(20, 20, 20, 0.95);
            padding: 15px; border-bottom: 1px solid #444; 
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
            box-sizing: border-box;
        }
        h1 { margin: 0; font-size: 18px; color: #e67e22; font-weight: 700; }
        .legend { font-size: 12px; color: #888; display: flex; gap: 15px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h1>Wood Floors & Top Suites</h1>
        <div class="legend">
             <div><span class="dot" style="background:#8b4513;"></span> Wood Floors</div>
             <div><span class="dot" style="background:#006994;"></span> Pool</div>
             <div><span class="dot" style="background:#87CEEB;"></span> 2 Luxury Suites (Top)</div>
        </div>
    </div>

    <div id="canvas-container"></div>

<script>
    // --- DIMENSIONS (Feet) ---
    const M2FT = 3.28084;
    
    // Site Constraints
    const FRUIT_W = 6.0 * M2FT;    
    const REST_D  = 27.0 * M2FT;   
    const REST_W  = 11.0 * M2FT;   
    const GAP_W   = 18.0;          
    const EXT_D   = 60.0;          
    
    const FRONT_W = FRUIT_W + GAP_W; 

    // House Dimensions
    const C_LEN = 40; 
    const C_WID = 8;
    const C_HGT = 9.5;
    
    let scene, camera, renderer, controls;
    let houseGroup;

    // --- Texture Generator ---
    function createTexture(color, type) {
        const c = document.createElement('canvas'); c.width = 512; c.height = 512;
        const ctx = c.getContext('2d');
        ctx.fillStyle = color; ctx.fillRect(0,0,512,512);
        
        if(type === 'grass') {
            for(let i=0; i<3000; i++) {
                ctx.fillStyle = (Math.random()>0.5)?'#3a5a3a':'#4a6a4a';
                ctx.fillRect(Math.random()*512, Math.random()*512, 2, 2);
            }
        } else if(type === 'wood') {
            const g = ctx.createLinearGradient(0,0,512,0);
            g.addColorStop(0,'#8b4513'); g.addColorStop(1,'#a0522d');
            ctx.fillStyle = g; ctx.fillRect(0,0,512,512);
            ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=2;
            for(let i=0;i<512;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(512,i);ctx.stroke();}
        } else if(type === 'horizontal_wood') {
            ctx.fillStyle = '#221100'; ctx.fillRect(0,0,512,512);
            const slatH = 30; const gap = 3;
            for(let y=0; y<512; y+= (slatH+gap)) {
                const g = ctx.createLinearGradient(0,y, 0,y+slatH);
                g.addColorStop(0,'#8b4513'); g.addColorStop(0.5,'#a0522d'); g.addColorStop(1,'#8b4513');
                ctx.fillStyle = g; ctx.fillRect(0, y, 512, slatH);
                ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, y + Math.random()*slatH); ctx.lineTo(512, y + Math.random()*slatH); ctx.stroke();
            }
            ctx.fillStyle='#5a3210'; ctx.fillRect(0,0,15,512); ctx.fillRect(497,0,15,512);
        } else if(type === 'vertical_wood') {
            ctx.fillStyle = '#221100'; ctx.fillRect(0,0,512,512);
            const slatW = 30; const gap = 3;
            for(let x=0; x<512; x+= (slatW+gap)) {
                const g = ctx.createLinearGradient(x,0, x+slatW,0);
                g.addColorStop(0,'#8b4513'); g.addColorStop(0.5,'#a0522d'); g.addColorStop(1,'#8b4513');
                ctx.fillStyle = g; ctx.fillRect(x, 0, slatW, 512);
                ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(x + Math.random()*slatW, 0); ctx.lineTo(x + Math.random()*slatW, 512); ctx.stroke();
            }
            ctx.fillStyle='#5a3210'; ctx.fillRect(0,0,512,15); ctx.fillRect(0,497,512,15);
        } else if(type === 'pavement') {
            ctx.fillStyle = '#444'; ctx.fillRect(0,0,512,512);
            ctx.fillStyle = '#eee';
            ctx.fillRect(0, 10, 512, 10); ctx.fillRect(0, 502, 512, 10); ctx.fillRect(250, 100, 12, 312); 
        } else if(type === 'water') {
            ctx.fillStyle = '#006994'; ctx.fillRect(0,0,512,512);
            for(let i=0;i<50;i++) {
                ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth=2;
                ctx.beginPath(); 
                ctx.arc(Math.random()*512, Math.random()*512, 20+Math.random()*50, 0, Math.PI*2);
                ctx.stroke();
            }
        }
        return new THREE.CanvasTexture(c);
    }

    function createDoorTexture(type) {
        const c = document.createElement('canvas'); c.width = 512; c.height = 512;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#87CEEB'; ctx.fillRect(0,0,512,512);
        
        if(type === 'pure_glass') { 
            ctx.lineWidth = 5; ctx.strokeStyle = '#333'; ctx.strokeRect(0,0,512,512); 
        } else { 
            ctx.lineWidth = 20; ctx.strokeStyle = '#222'; ctx.strokeRect(0,0,512,512); 
        }
        
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath(); ctx.moveTo(0,512); ctx.lineTo(512,0); ctx.lineTo(512,200); ctx.lineTo(200,512); ctx.fill();
        ctx.strokeStyle = '#333'; ctx.lineWidth = 8;
        
        if (type === 'single') {
            ctx.strokeRect(60, 60, 200, 452); ctx.fillStyle = 'silver'; ctx.fillRect(230, 250, 10, 40); 
        } else if (type === 'double') {
            ctx.strokeRect(40, 60, 200, 452); ctx.strokeRect(272, 60, 200, 452); 
            ctx.fillStyle = 'silver'; ctx.fillRect(215, 250, 10, 40); ctx.fillRect(287, 250, 10, 40); 
        } else if (type === 'slider') {
            ctx.strokeRect(10, 10, 492, 492);
            ctx.fillStyle = '#333'; ctx.fillRect(250, 10, 12, 492);
            ctx.fillStyle = 'silver'; ctx.fillRect(230, 250, 8, 40); ctx.fillRect(274, 250, 8, 40);
        } else if (type === 'suite_entry') {
            ctx.fillStyle = '#333'; ctx.fillRect(250, 0, 12, 512);
            const doorW = 50; const doorH = 380; const doorY = 512 - doorH;
            ctx.strokeRect(100, doorY, doorW, doorH); 
            ctx.fillStyle = 'silver'; ctx.fillRect(140, doorY + 200, 6, 20); 
            ctx.strokeRect(360, doorY, doorW, doorH); 
            ctx.fillStyle = 'silver'; ctx.fillRect(365, doorY + 200, 6, 20); 
            ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 200); ctx.lineTo(512, 200); ctx.stroke();
        }
        ctx.fillStyle = '#111'; ctx.fillRect(0, 508, 512, 4);
        return new THREE.CanvasTexture(c);
    }

    const texGrass = createTexture('#4a6b4a', 'grass');
    const texWood = createTexture('#cd853f', 'wood');
    const texHorizWood = createTexture('#cd853f', 'horizontal_wood');
    const texVertWood = createTexture('#cd853f', 'vertical_wood'); 
    const texPave = createTexture('#444', 'pavement');
    const texWater = createTexture('#006994', 'water');
    
    const texGlassPlain = createDoorTexture('plain');
    const texGlassSingle = createDoorTexture('single');
    const texGlassDouble = createDoorTexture('double');
    const texGlassSlider = createDoorTexture('slider');
    const texGlassSuite = createDoorTexture('suite_entry'); 
    const texGlassPure = createDoorTexture('pure_glass');

    function init() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 1, 2000);
        camera.position.set(-80, 100, 80); 
        camera.lookAt(60, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(60, 0, 0);
        controls.enableDamping = true;

        const amb = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(amb);
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(-50, 100, 50);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        scene.add(sun);

        buildSite();
        
        houseGroup = new THREE.Group();
        buildHouse();     // Main Front Building
        buildPerimeter(); // Left & Back Wing (No Right)
        buildPool();      // Pool & Spa
        scene.add(houseGroup);

        window.addEventListener('resize', onResize);
        animate();
    }

    function buildSite() {
        const alignOffsetZ = -3;

        const road = new THREE.Mesh(new THREE.PlaneGeometry(30, 300), new THREE.MeshStandardMaterial({ color: 0x333333 }));
        road.rotation.x = -Math.PI/2; road.position.set(-15, 0.05, 0); scene.add(road);

        const parking = new THREE.Mesh(new THREE.PlaneGeometry(24, FRONT_W), new THREE.MeshStandardMaterial({ map: texPave }));
        parking.rotation.x = -Math.PI/2;
        parking.position.set(12, 0.06, -10 + alignOffsetZ); 
        scene.add(parking);

        const restZ = (GAP_W/2) + (REST_W/2); 
        const rest = new THREE.Mesh(new THREE.BoxGeometry(REST_D, 15, REST_W), new THREE.MeshStandardMaterial({ color: 0x7f8c8d, transparent: true, opacity: 0.8 }));
        rest.position.set(REST_D/2, 7.5, restZ);
        scene.add(rest);

        const landMat = new THREE.MeshStandardMaterial({ map: texGrass });
        const frontLot = new THREE.Mesh(new THREE.PlaneGeometry(FRUIT_W + GAP_W, FRONT_W), landMat);
        frontLot.rotation.x = -Math.PI/2; 
        frontLot.position.set((FRUIT_W+GAP_W)/2, 0.05, -10 + alignOffsetZ); 
        scene.add(frontLot);
        
        const midD = REST_D - FRUIT_W;
        const midYard = new THREE.Mesh(new THREE.PlaneGeometry(midD, FRONT_W), landMat);
        midYard.rotation.x = -Math.PI/2; 
        midYard.position.set(FRUIT_W + midD/2, 0.1, -10 + alignOffsetZ); 
        scene.add(midYard);
        
        const deepW = FRONT_W + REST_W;
        const deepYard = new THREE.Mesh(new THREE.PlaneGeometry(EXT_D, deepW), landMat);
        deepYard.rotation.x = -Math.PI/2; deepYard.position.set(REST_D + EXT_D/2, 0.1, 8); scene.add(deepYard);
    }

    function buildHouse() {
        const matStone = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.9 });
        const matConcrete = new THREE.MeshStandardMaterial({ color: 0x808080, roughness: 0.5 });
        const matWood = new THREE.MeshStandardMaterial({ map: texWood });
        const matMetal = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.4 });
        
        const matGlassP = new THREE.MeshStandardMaterial({ map: texGlassPlain, transparent: true, opacity: 0.7 });
        const matGlassS = new THREE.MeshStandardMaterial({ map: texGlassSingle, transparent: true, opacity: 0.7 });
        const matGlassD = new THREE.MeshStandardMaterial({ map: texGlassDouble, transparent: true, opacity: 0.7 });
        const matGlassPure = new THREE.MeshStandardMaterial({ map: texGlassPure, transparent: true, opacity: 0.7 });
        const matGlassSlider = new THREE.MeshStandardMaterial({ map: texGlassSlider, transparent: true });
        const matHorizWood = new THREE.MeshStandardMaterial({ map: texHorizWood, roughness: 0.8 });
        const matVertWood = new THREE.MeshStandardMaterial({ map: texVertWood, roughness: 0.8 });
        const matInvisible = new THREE.MeshBasicMaterial({ visible: false });

        const layout = [
            // Level 1 - Commercial
            { x: -12, y: 0, z: 0, m: matGlassPure, f: matGlassPure }, 
            { x: -4,  y: 0, z: 0, m: matGlassPure, f: matGlassD }, 
            { x: 4,   y: 0, z: 0, m: matGlassPure, f: matGlassS }, 
            { x: 12,  y: 0, z: 0, m: matGlassPure, f: matGlassPure },
            // Level 2
            { x: -12, y: 1, z: 0, m: matMetal, e: matWood, f: matGlassPure },
            { x: -4,  y: 1, z: 0, m: matMetal, e: matWood, f: matGlassPure },
            { x: 4,   y: 1, z: 0, m: matMetal, e: matWood, f: matGlassPure },
            { x: 12,  y: 1, z: 0, m: matMetal, e: matWood, f: matGlassPure },
            // Level 3
            { x: -12, y: 2, z: 8, m: matMetal, s: matGlassP, front: matGlassPure },
            { x: -4,  y: 2, z: 8, m: matMetal, s: matGlassP, front: matGlassSlider }, 
            { x: 4,   y: 2, z: 8, m: matMetal, s: matGlassP, front: matGlassSlider }, 
            { x: 12,  y: 2, z: 8, m: matMetal, s: matGlassP, front: matGlassPure }
        ];

        const mainOffsetX = 44;
        const mainOffsetZ = -13; 

        layout.forEach(d => {
            const geo = new THREE.BoxGeometry(C_WID, C_HGT, C_LEN);
            // Ensure Top(2) and Bot(3) are Wood for upper floor ceilings/floors
            let mats = [d.m, d.m, matWood, matWood, d.m, d.f || d.m];
            
            if (d.e) { mats[4] = d.e; mats[5] = d.e; }
            if(d.f) mats[5] = d.f; 
            if (d.y === 2 && d.front) { mats[5] = d.front; }

            // Side Walls Logic
            if (d.y === 0) {
                if (d.x === -12) mats[0] = matInvisible; 
                if (d.x === -4)  mats[1] = matInvisible; 
                if (d.x === 4)   mats[0] = matInvisible; 
                if (d.x === 12)  mats[1] = matInvisible; 
                
                // Restaurant Wall Solid
                if (d.x === -12) mats[1] = matStone;
                
                // Rear Face Glass
                mats[4] = matGlassSlider; 
            }
            if (d.y === 1) { 
                if(d.x === -12) { mats[1] = matHorizWood; mats[0] = matInvisible; }
                if(d.x === 12)  { mats[0] = matHorizWood; mats[1] = matInvisible; }
                if (d.x === -4) { mats[1] = matInvisible; mats[0] = matInvisible; } 
                if (d.x === 4)  { mats[1] = matInvisible; mats[0] = matInvisible; } 
            }
            // Level 3 Logic (2 Suites)
            if (d.y === 2) { 
                // Outer Walls (Vertical Wood)
                if (d.x === -12) { mats[1] = matVertWood; mats[0] = matInvisible; } 
                if (d.x === 12)  { mats[0] = matVertWood; mats[1] = matInvisible; } 
                
                // Inner Walls
                // Remove divider between -12 and -4
                if (d.x === -4) mats[1] = matInvisible; // Hide Right face (looking from front)
                // Remove divider between 12 and 4
                if (d.x === 4) mats[0] = matInvisible; // Hide Left face
                
                // Center Wall (-4 <-> 4) remains Visible (default metal or wood)
            }
            
            if (d.s) mats[0] = d.s; 
            if (d.y === 2 && d.x === 12) mats[0] = matVertWood;
            if (d.y === 2 && d.x === -12) mats[1] = matVertWood;

            const mesh = new THREE.Mesh(geo, mats);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            const globX = mainOffsetX + d.z;
            const globZ = mainOffsetZ - d.x; 
            mesh.rotation.y = Math.PI/2;
            mesh.position.set(globX, (C_HGT/2)+(d.y*C_HGT), globZ);
            houseGroup.add(mesh);

            // FIX: Add Floor Plane for Ground Level (Level 1)
            if (d.y === 0) {
                const floorGeo = new THREE.PlaneGeometry(C_LEN, C_WID);
                const floor = new THREE.Mesh(floorGeo, matConcrete);
                floor.rotation.x = -Math.PI/2;
                floor.rotation.z = Math.PI/2; 
                floor.position.set(globX, 0.15, globZ); 
                houseGroup.add(floor);
            }
        });
        
        // --- FRONT DECK ---
        const deckFront = new THREE.Mesh(new THREE.BoxGeometry(32, 0.5, 8), matWood);
        deckFront.rotation.y = Math.PI/2;
        deckFront.position.set(mainOffsetX - 16, (C_HGT*2)+0.1, mainOffsetZ);
        houseGroup.add(deckFront);
        
        const railGlassMat = new THREE.MeshStandardMaterial({color: 0x87CEEB, transparent: true, opacity: 0.3});
        
        const railFront = new THREE.Mesh(new THREE.BoxGeometry(32, 3, 0.1), railGlassMat);
        railFront.rotation.y = Math.PI/2;
        railFront.position.set(mainOffsetX - 19.9, (C_HGT*2)+1.5, mainOffsetZ);
        houseGroup.add(railFront);

        const railFrontSideGeo = new THREE.BoxGeometry(0.1, 3, 8);
        const railFLeft = new THREE.Mesh(railFrontSideGeo, railGlassMat);
        railFLeft.rotation.y = Math.PI/2;
        railFLeft.position.set(mainOffsetX - 16, (C_HGT*2)+1.5, mainOffsetZ + 15.95); 
        houseGroup.add(railFLeft);

        const railFRight = new THREE.Mesh(railFrontSideGeo, railGlassMat);
        railFRight.rotation.y = Math.PI/2;
        railFRight.position.set(mainOffsetX - 16, (C_HGT*2)+1.5, mainOffsetZ - 15.95);
        houseGroup.add(railFRight);

        // Roof Rail
        const roofRailFront = new THREE.Mesh(new THREE.BoxGeometry(32, 3, 0.1), railGlassMat);
        roofRailFront.rotation.y = Math.PI/2;
        roofRailFront.position.set(mainOffsetX - 11.9, 30, mainOffsetZ);
        houseGroup.add(roofRailFront);
        
        const roofRailBack = new THREE.Mesh(new THREE.BoxGeometry(32, 3, 0.1), railGlassMat);
        roofRailBack.rotation.y = Math.PI/2;
        roofRailBack.position.set(mainOffsetX + 27.9, 30, mainOffsetZ);
        houseGroup.add(roofRailBack);
        
        const roofRailSideGeo = new THREE.BoxGeometry(0.1, 3, 40);
        const roofRailLeft = new THREE.Mesh(roofRailSideGeo, railGlassMat);
        roofRailLeft.rotation.y = Math.PI/2;
        roofRailLeft.position.set(mainOffsetX + 8, 30, mainOffsetZ + 15.95);
        houseGroup.add(roofRailLeft);
        
        const roofRailRight = new THREE.Mesh(roofRailSideGeo, railGlassMat);
        roofRailRight.rotation.y = Math.PI/2;
        roofRailRight.position.set(mainOffsetX + 8, 30, mainOffsetZ - 15.95);
        houseGroup.add(roofRailRight);
    }

    function buildPerimeter() {
        const matWood = new THREE.MeshStandardMaterial({ map: texWood });
        const matStone = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.9 });
        const matHorizWood = new THREE.MeshStandardMaterial({ map: texHorizWood, roughness: 0.8 });
        const matVertWood = new THREE.MeshStandardMaterial({ map: texVertWood, roughness: 0.8 });
        const matSuiteEntry = new THREE.MeshStandardMaterial({ map: texGlassSuite, transparent: true });
        
        const pContainers = [];
        
        // LEFT WING 
        pContainers.push({ x: 84, y: 0, z: -25, rot: 0 });
        pContainers.push({ x: 84, y: 1, z: -25, rot: 0 });
        pContainers.push({ x: 84, y: 2, z: -25, rot: 0 }); 
        
        pContainers.push({ x: 124, y: 0, z: -25, rot: 0 });
        pContainers.push({ x: 124, y: 1, z: -25, rot: 0 });
        pContainers.push({ x: 124, y: 2, z: -25, rot: 0 }); 
        
        // Inner Row
        pContainers.push({ x: 84, y: 0, z: -17, rot: 0, inner: true });
        pContainers.push({ x: 84, y: 1, z: -17, rot: 0 });
        pContainers.push({ x: 124, y: 0, z: -17, rot: 0, inner: true });
        pContainers.push({ x: 124, y: 1, z: -17, rot: 0 });

        // BACK WALL
        pContainers.push({ x: 144, y: 0, z: -10, rot: Math.PI/2 });
        pContainers.push({ x: 144, y: 1, z: -10, rot: Math.PI/2 });
        pContainers.push({ x: 144, y: 2, z: -10, rot: Math.PI/2 }); 
        
        pContainers.push({ x: 144, y: 0, z: 30, rot: Math.PI/2 });
        pContainers.push({ x: 144, y: 1, z: 30, rot: Math.PI/2 });
        pContainers.push({ x: 144, y: 2, z: 30, rot: Math.PI/2 }); 
        
        // Inner Row
        pContainers.push({ x: 136, y: 0, z: -10, rot: Math.PI/2, inner: true });
        pContainers.push({ x: 136, y: 1, z: -10, rot: Math.PI/2 });
        pContainers.push({ x: 136, y: 0, z: 30, rot: Math.PI/2, inner: true });
        pContainers.push({ x: 136, y: 1, z: 30, rot: Math.PI/2 });

        pContainers.forEach(c => {
            const geo = new THREE.BoxGeometry(40, 9.5, 8);
            let mats = [matStone, matStone, matStone, matStone, matStone, matStone];
            if(c.y === 1) mats = [matHorizWood, matHorizWood, matHorizWood, matHorizWood, matHorizWood, matHorizWood];
            if(c.y === 2) mats = [matVertWood, matVertWood, matVertWood, matVertWood, matVertWood, matVertWood]; 
            if (c.y === 0 && c.inner) {
                if (c.rot === 0) mats[4] = matSuiteEntry;
                if (c.rot !== 0) mats[5] = matSuiteEntry;
            }
            const mesh = new THREE.Mesh(geo, mats);
            mesh.position.set(c.x, 4.75 + (c.y*9.5), c.z);
            mesh.rotation.y = c.rot;
            mesh.castShadow = true;
            houseGroup.add(mesh);
        });
        
        const railGlassMat = new THREE.MeshStandardMaterial({color: 0x87CEEB, transparent: true, opacity: 0.3});
        
        // LEFT WING WALKWAY & RAIL
        const walkLGeo = new THREE.BoxGeometry(68, 0.5, 4);
        const walkL = new THREE.Mesh(walkLGeo, matWood);
        walkL.position.set(98, 19.1, -11);
        houseGroup.add(walkL);
        
        const railLGeo = new THREE.BoxGeometry(68, 3, 0.1);
        const railL = new THREE.Mesh(railLGeo, railGlassMat);
        railL.position.set(98, 20.6, -13); 
        houseGroup.add(railL);

        // BACK WING WALKWAY & RAIL
        const walkBGeo = new THREE.BoxGeometry(4, 0.5, 63);
        const walkB = new THREE.Mesh(walkBGeo, matWood);
        walkB.position.set(130, 19.1, 18.5); 
        houseGroup.add(walkB);
        
        const railBGeo = new THREE.BoxGeometry(0.1, 3, 63);
        const railB = new THREE.Mesh(railBGeo, railGlassMat);
        railB.position.set(132, 20.6, 18.5); 
        houseGroup.add(railB);

        // --- STAIRCASE ---
        const stairStartX = 82;
        const stairEndX = 72; 
        const stairZ = -15;
        const startY = 19.1;
        const endY = 28.6;
        
        const steps = 12;
        const xStep = (stairEndX - stairStartX) / steps; 
        const yStep = (endY - startY) / steps;
        
        const stepGeo = new THREE.BoxGeometry(1.5, 0.2, 4); 
        const matStair = new THREE.MeshStandardMaterial({ color: 0x333333 }); 
        
        for(let i=0; i<steps; i++) {
            const step = new THREE.Mesh(stepGeo, matStair);
            const x = stairStartX + (i * xStep);
            const y = startY + (i * yStep);
            step.position.set(x, y, stairZ);
            houseGroup.add(step);
            
            const glassL = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 0.1), railGlassMat);
            glassL.position.set(x, y+1.5, stairZ - 2);
            glassL.rotation.z = Math.atan(yStep/xStep); 
            houseGroup.add(glassL);

            const glassR = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 0.1), railGlassMat);
            glassR.position.set(x, y+1.5, stairZ + 2);
            glassR.rotation.z = Math.atan(yStep/xStep);
            houseGroup.add(glassR);
        }
        
        const landing = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 4), matWood);
        landing.position.set(71, endY, stairZ);
        houseGroup.add(landing);
    }

    function buildPool() {
        const cx = 110;
        const cz = 15; 
        
        const matWater = new THREE.MeshStandardMaterial({ map: texWater, roughness: 0.1, transparent: true, opacity: 0.8 });
        const matCoping = new THREE.MeshStandardMaterial({ color: 0xdddddd }); 
        const matPaver = new THREE.MeshStandardMaterial({ color: 0x999999 }); 

        const paverSize = 4;
        const gap = 1.5;
        const areaW = 50; 
        const areaD = 60; 
        
        const startX = cx - (areaW/2);
        const startZ = cz - (areaD/2);
        
        for (let x = startX; x < cx + (areaW/2); x += (paverSize + gap)) {
            for (let z = startZ; z < cz + (areaD/2); z += (paverSize + gap)) {
                if (x > (cx - 11) && x < (cx + 11) && z > (cz - 22) && z < (cz + 22)) continue; 
                if (x > (cx + 6) && x < (cx + 18) && z > (cz + 10) && z < (cz + 22)) continue;
                const paver = new THREE.Mesh(new THREE.BoxGeometry(paverSize, 0.2, paverSize), matPaver);
                paver.position.set(x, 0.15, z); 
                paver.receiveShadow = true;
                houseGroup.add(paver);
            }
        }

        const poolGeo = new THREE.PlaneGeometry(18, 40);
        const pool = new THREE.Mesh(poolGeo, matWater);
        pool.rotation.x = -Math.PI/2;
        pool.position.set(cx, 0.35, cz); 
        houseGroup.add(pool);
        
        const cpW = 1.5;
        const cpH = 0.2;
        const cp1 = new THREE.Mesh(new THREE.BoxGeometry(cpW, cpH, 43), matCoping);
        cp1.position.set(cx - 9.75, 0.4, cz); houseGroup.add(cp1);
        const cp2 = new THREE.Mesh(new THREE.BoxGeometry(cpW, cpH, 43), matCoping);
        cp2.position.set(cx + 9.75, 0.4, cz); houseGroup.add(cp2);
        const cp3 = new THREE.Mesh(new THREE.BoxGeometry(18, cpH, cpW), matCoping);
        cp3.position.set(cx, 0.4, cz - 20.75); houseGroup.add(cp3);
        const cp4 = new THREE.Mesh(new THREE.BoxGeometry(18, cpH, cpW), matCoping);
        cp4.position.set(cx, 0.4, cz + 20.75); houseGroup.add(cp4);

        const jX = cx + 12; 
        const jZ = cz + 15; 
        const jRad = 4;
        const jHeight = 3; 
        
        const jacBase = new THREE.Mesh(new THREE.CylinderGeometry(jRad, jRad, jHeight-0.2, 32), matCoping);
        jacBase.position.set(jX, (jHeight-0.2)/2, jZ); 
        houseGroup.add(jacBase);

        const jacWater = new THREE.Mesh(new THREE.CircleGeometry(jRad-0.4, 32), matWater);
        jacWater.rotation.x = -Math.PI/2;
        jacWater.position.set(jX, jHeight - 0.1, jZ); 
        houseGroup.add(jacWater);

        const matDeepWater = new THREE.MeshStandardMaterial({ color: 0x004060, transparent: true, opacity: 0.7 });
        const jacDeep = new THREE.Mesh(new THREE.CircleGeometry(jRad-1.5, 32), matDeepWater);
        jacDeep.rotation.x = -Math.PI/2;
        jacDeep.position.set(jX, jHeight - 0.08, jZ); 
        houseGroup.add(jacDeep);
        
        const jacRim = new THREE.Mesh(new THREE.TorusGeometry(jRad-0.2, 0.2, 16, 32), matCoping);
        jacRim.rotation.x = Math.PI/2;
        jacRim.position.set(jX, jHeight - 0.1, jZ); 
        houseGroup.add(jacRim);
        
        const spillX = jX - 2.5;
        const spillZ = jZ;
        const flowGeo = new THREE.BoxGeometry(2, jHeight - 0.5, 0.1);
        const flow = new THREE.Mesh(flowGeo, matWater);
        flow.position.set(spillX, jHeight/2, spillZ);
        flow.rotation.y = 0; 
        flow.rotation.z = Math.PI / 4; 
        houseGroup.add(flow);
        
        const splash = new THREE.Mesh(new THREE.CircleGeometry(2, 16), new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.3}));
        splash.rotation.x = -Math.PI/2;
        splash.position.set(spillX - 1, 0.36, spillZ);
        houseGroup.add(splash);
    }

    function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
