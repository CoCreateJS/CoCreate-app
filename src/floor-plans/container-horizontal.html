<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Clinic Floor Plan (40' W x 24' D - 3 Containers)</title>
		<style>
			:root {
				--bg-color: #f8f9fa;
				--wall-color: #333;
				--grid-color: #e0e0e0;
				--furniture-stroke: #000;
				--furniture-fill: #fff;
				--text-color: #000;

				/* Layer Colors */
				--elec-color: #d32f2f; /* Red */
				--data-color: #1976d2; /* Blue */
				--hvac-color: #00897b; /* Teal */
				--light-color: #fbc02d; /* Yellow/Gold */
				--gas-color: #795548; /* Brown for Brown Gas */
				--equip-color: #9b59b6;
				--dims-color: #e74c3c;
			}

			body {
				font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
				background-color: var(--bg-color);
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				margin: 0;
				padding: 20px;
			}

			h1 {
				font-size: 1.2rem;
				margin-bottom: 10px;
				color: #444;
				text-align: center;
			}

			/* Controls */
			.controls {
				display: flex;
				gap: 10px;
				margin-bottom: 20px;
				flex-wrap: wrap;
				justify-content: center;
			}

			.toggle-btn {
				padding: 8px 16px;
				border: 2px solid #ccc;
				background: white;
				border-radius: 20px;
				cursor: pointer;
				font-weight: 600;
				font-size: 14px;
				transition: all 0.2s ease;
				color: #777;
			}

			.toggle-btn.active {
				border-color: transparent;
				color: white;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
			}

			/* Specific Button Colors when Active */
			.toggle-btn[data-target="furniture"].active {
				background-color: #555;
			}
			.toggle-btn[data-target="equipment"].active {
				background-color: var(--equip-color);
			}
			.toggle-btn[data-target="dimensions"].active {
				background-color: var(--dims-color);
			}
			.toggle-btn[data-target="electrical"].active {
				background-color: var(--elec-color);
			}
			.toggle-btn[data-target="hvac"].active {
				background-color: var(--hvac-color);
			}
			.toggle-btn[data-target="data"].active {
				background-color: var(--data-color);
			}
			.toggle-btn[data-target="browngas"].active {
				background-color: var(--gas-color);
			}

			.blueprint-container {
				background: white;
				padding: 40px;
				box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
				border-radius: 8px;
				max-width: 100%;
				overflow: auto;
				position: relative;
			}

			/* SVG Styles */
			svg {
				display: block;
				max-width: 100%;
				height: auto;
			}

			/* Legend Styles */
			.legend {
				margin-top: 30px;
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
				gap: 15px;
				width: 100%;
				border-top: 1px solid #eee;
				padding-top: 20px;
			}
			.legend-item {
				display: flex;
				align-items: center;
				font-size: 12px;
				color: #555;
			}
			.legend-icon {
				width: 24px;
				height: 24px;
				margin-right: 8px;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			/* Transition for layers */
			g.layer {
				transition: opacity 0.3s ease;
			}
			g.layer.hidden {
				opacity: 0;
				pointer-events: none; /* Prevent clicking hidden items */
			}

			.grid-line {
				stroke: var(--grid-color);
				stroke-width: 1;
			}

			.container-seam {
				stroke: #bbb;
				stroke-width: 2;
				stroke-dasharray: 10, 5;
				opacity: 0.6;
			}

			/* Standard Interior Partition (4.5") */
			/* Changed to BUTT cap to ensure flush connections without overlap */
			.wall {
				stroke: var(--wall-color);
				stroke-width: 7.5;
				fill: none;
				stroke-linecap: butt;
			}

			/* Exterior Insulated Wall Rendering */
			.wall-insulation-fill {
				fill: #aaa; /* Grey fill for insulation cavity */
				opacity: 0.3;
			}
			.wall-outer-line {
				stroke: #000;
				stroke-width: 2;
				fill: none;
			}
			.wall-inner-line {
				stroke: #555;
				stroke-width: 2;
				fill: none;
			}

			/* Thin lines for details */
			.wall-thin {
				stroke: var(--wall-color);
				stroke-width: 3;
				fill: none;
			}

			.furniture {
				stroke: var(--furniture-stroke);
				stroke-width: 2;
				fill: var(--furniture-fill);
			}

			.furniture-detail {
				stroke: var(--furniture-stroke);
				stroke-width: 1;
				fill: none;
			}

			.door-swing {
				stroke: var(--wall-color);
				stroke-width: 1;
				fill: none;
				stroke-dasharray: 4, 2;
			}

			.dimension-line {
				stroke: #666;
				stroke-width: 1;
			}

			.dimension-text {
				font-size: 12px;
				fill: #333;
				font-weight: 600;
				text-anchor: middle;
				background: white; /* to hide lines behind text */
			}

			.label-text {
				font-size: 14px;
				font-weight: bold;
				fill: #000;
				text-anchor: middle;
				dominant-baseline: middle;
			}

			.sub-label-text {
				font-size: 11px;
				fill: #333;
				text-anchor: middle;
				dominant-baseline: middle;
			}

			/* Symbol Styles */
			.elec-symbol {
				stroke: var(--elec-color);
				stroke-width: 1.5;
				fill: white;
			}
			.elec-text {
				font-size: 9px;
				fill: var(--elec-color);
				font-weight: bold;
				text-anchor: middle;
			}

			.light-symbol {
				stroke: var(--light-color);
				stroke-width: 2;
				fill: none;
			}

			.data-symbol {
				stroke: var(--data-color);
				stroke-width: 2;
				fill: var(--data-color);
			}
			.data-text {
				font-size: 8px;
				fill: var(--data-color);
				font-weight: bold;
				text-anchor: middle;
			}

			.hvac-symbol {
				stroke: var(--hvac-color);
				stroke-width: 1.5;
				fill: white;
			}
			.hvac-text {
				font-size: 8px;
				fill: var(--hvac-color);
				font-weight: bold;
				text-anchor: middle;
				dominant-baseline: middle;
			}

			.gas-symbol {
				stroke: var(--gas-color);
				stroke-width: 1.5;
				fill: white;
			}
			.gas-text {
				font-size: 7px;
				fill: var(--gas-color);
				font-weight: bold;
				text-anchor: middle;
				dominant-baseline: middle;
			}

			/* Utility classes for text rotation */
			.rotate-neg-90 {
				transform-box: fill-box;
				transform-origin: center;
				transform: rotate(-90deg);
			}
			.rotate-90 {
				transform-box: fill-box;
				transform-origin: center;
				transform: rotate(90deg);
			}
		</style>
	</head>
	<body>
		<h1>Clinic Floor Plan (40' W x 24' D - 3 Containers)</h1>

		<!-- Toggle Controls -->
		<div class="controls">
			<button
				class="toggle-btn active"
				data-target="furniture"
				onclick="toggleLayer('furniture', this)">
				Furniture
			</button>
			<button
				class="toggle-btn active"
				data-target="equipment"
				onclick="toggleLayer('equipment', this)">
				Equipment
			</button>
			<button
				class="toggle-btn active"
				data-target="dimensions"
				onclick="toggleLayer('dimensions', this)">
				Dimensions
			</button>
			<button
				class="toggle-btn active"
				data-target="electrical"
				onclick="toggleLayer('electrical', this)">
				Electrical
			</button>
			<button
				class="toggle-btn active"
				data-target="data"
				onclick="toggleLayer('data', this)">
				Data
			</button>
			<button
				class="toggle-btn active"
				data-target="hvac"
				onclick="toggleLayer('hvac', this)">
				HVAC
			</button>
			<button
				class="toggle-btn active"
				data-target="browngas"
				onclick="toggleLayer('browngas', this)">
				Brown Gas
			</button>
		</div>

		<div class="blueprint-container">
			<!-- Scale: 20px = 1ft. 
             40ft Width = 800px. 
             24ft Depth = 480px.
             Exterior Shell: 0-800, 0-480.
             Interior Face: 10-790, 10-470.
             Expanded ViewBox to show outer dimensions clearly.
        -->
			<svg
				width="1050"
				height="640"
				viewBox="-150 -100 1050 640"
				xmlns="http://www.w3.org/2000/svg">
				<!-- Definitions for Arrowheads and Grid -->
				<defs>
					<marker
						id="arrow"
						markerWidth="10"
						markerHeight="10"
						refX="9"
						refY="3"
						orient="auto"
						markerUnits="strokeWidth">
						<path d="M0,0 L0,6 L9,3 z" fill="#666" />
					</marker>
					<marker
						id="arrow-start"
						markerWidth="10"
						markerHeight="10"
						refX="0"
						refY="3"
						orient="auto"
						markerUnits="strokeWidth">
						<path d="M9,0 L9,6 L0,3 z" fill="#666" />
					</marker>
					<pattern
						id="grid"
						width="20"
						height="20"
						patternUnits="userSpaceOnUse">
						<path
							d="M 20 0 L 0 0 0 20"
							fill="none"
							stroke="#eee"
							stroke-width="1" />
					</pattern>

					<!-- NEW SYMBOLS -->
					<g id="outlet">
						<circle cx="0" cy="0" r="5" class="elec-symbol" />
						<line
							x1="5"
							y1="-2.2"
							x2="-12"
							y2="-2.2"
							stroke="#d32f2f"
							stroke-width="1.2" />
						<line
							x1="5"
							y1="2.2"
							x2="-12"
							y2="2.2"
							stroke="#d32f2f"
							stroke-width="1.2" />
					</g>

					<g id="outlet-dedicated">
						<circle
							cx="0"
							cy="0"
							r="6"
							class="elec-symbol"
							stroke-width="2" />
						<line
							x1="6"
							y1="-2.2"
							x2="-13"
							y2="-2.2"
							stroke="#d32f2f"
							stroke-width="1.5" />
						<line
							x1="6"
							y1="2.2"
							x2="-13"
							y2="2.2"
							stroke="#d32f2f"
							stroke-width="1.5" />
						<text
							x="0"
							y="2.5"
							class="elec-text"
							style="font-size: 6.5px">
							D
						</text>
					</g>

					<g id="switch">
						<circle cx="0" cy="0" r="5" fill="#d32f2f" />
						<text x="8" y="4" class="elec-text">S</text>
					</g>

					<g id="light-recessed">
						<circle cx="0" cy="0" r="8" class="light-symbol" />
						<line x1="-5" y1="-5" x2="5" y2="5" stroke="#fbc02d" />
						<line x1="5" y1="-5" x2="-5" y2="5" stroke="#fbc02d" />
					</g>

					<g id="data-port">
						<rect
							x="-5"
							y="-5"
							width="10"
							height="10"
							class="data-symbol" />
					</g>

					<g id="ac-unit-top">
						<rect
							x="-15"
							y="-6"
							width="30"
							height="12"
							class="hvac-symbol"
							rx="2" />
						<line
							x1="-15"
							y1="2"
							x2="15"
							y2="2"
							stroke="#00897b"
							stroke-opacity="0.2" />
						<text y="1" class="hvac-text">AC</text>
					</g>
					<g id="ac-unit-bottom">
						<rect
							x="-15"
							y="-6"
							width="30"
							height="12"
							class="hvac-symbol"
							rx="2" />
						<line
							x1="-15"
							y1="-2"
							x2="15"
							y2="-2"
							stroke="#00897b"
							stroke-opacity="0.2" />
						<text y="1" class="hvac-text">AC</text>
					</g>

					<g id="gas-outlet">
						<polygon
							points="0,-6 5.2,-3 5.2,3 0,6 -5.2,3 -5.2,-3"
							class="gas-symbol" />
						<text y="1.5" class="gas-text">BG</text>
					</g>

					<!-- Toilet Symbol -->
					<g id="toilet">
						<rect
							x="-8"
							y="-12"
							width="16"
							height="8"
							fill="white"
							stroke="#333"
							stroke-width="1.5" />
						<ellipse
							cx="0"
							cy="4"
							rx="7"
							ry="10"
							fill="white"
							stroke="#333"
							stroke-width="1.5" />
					</g>
				</defs>

				<!-- Draw Grid Background -->
				<rect x="0" y="0" width="800" height="480" fill="url(#grid)" />

				<!-- Container Modules (Visual Guide) -->
				<!-- 3 Containers of 8ft height (160px) stacked -->
				<line
					x1="0"
					y1="160"
					x2="800"
					y2="160"
					class="container-seam" />
				<line
					x1="0"
					y1="320"
					x2="800"
					y2="320"
					class="container-seam" />
				<text
					x="790"
					y="80"
					class="sub-label-text rotate-90"
					style="fill: #bbb; font-size: 14px">
					CONTAINER 1
				</text>
				<text
					x="790"
					y="240"
					class="sub-label-text rotate-90"
					style="fill: #bbb; font-size: 14px">
					CONTAINER 2
				</text>
				<text
					x="790"
					y="400"
					class="sub-label-text rotate-90"
					style="fill: #bbb; font-size: 14px">
					CONTAINER 3
				</text>

				<!-- === OUTER WALLS & ENTRANCE === -->

				<!-- Wall Insulation Fill (The solid part between metal and drywall) -->
				<!-- Path defines the shape: Outer Box minus Inner Box -->
				<path
					d="M0 0 H800 V480 H0 Z M10 10 V470 H790 V10 Z"
					class="wall-insulation-fill"
					fill-rule="evenodd" />

				<!-- Outer Metal Skin (Container Exterior) -->
				<rect
					x="0"
					y="0"
					width="800"
					height="480"
					class="wall-outer-line" />

				<!-- Inner Drywall Face (Interior Boundary) -->
				<rect
					x="10"
					y="10"
					width="780"
					height="460"
					class="wall-inner-line" />

				<!-- Main Entrance Door (Bottom Left) - Double Door (60" total, 30" each) -->
				<!-- Located on bottom wall of Container 3 -->
				<!-- Cut through both wall lines - MASKING RECTANGLE -->
				<!-- Covers insulation and inner/outer lines from x=40 to x=140 (100px width) -->
				<rect x="40" y="468" width="100" height="14" fill="white" />

				<!-- Left Leaf: Hinge at 40,480. Swing In. -->
				<path d="M 90 480 A 50 50 0 0 0 40 430" class="door-swing" />
				<line x1="40" y1="480" x2="40" y2="430" class="wall-thin" />

				<!-- Right Leaf: Hinge at 140,480. Swing In. -->
				<path d="M 90 480 A 50 50 0 0 1 140 430" class="door-swing" />
				<line x1="140" y1="480" x2="140" y2="430" class="wall-thin" />

				<!-- === INTERNAL PARTITIONS === -->
				<!-- Note: Internal walls are 4.5" thick (stroke 7.5). 
                 Positioning needs to be precise for 55" clear space.
            -->

				<!-- Horizontal Central Corridor/Reception Divider -->
				<!-- Moved to y=240 (Middle of layout) -->
				<!-- Starts exactly at x=10 (Interior Face) -->
				<line x1="10" y1="240" x2="280" y2="240" class="wall" />
				<!-- Pocket Door Gap for Reception -->
				<line
					x1="280"
					y1="240"
					x2="360"
					y2="240"
					stroke="white"
					stroke-width="8" />
				<!-- Doorway -->
				<line
					x1="200"
					y1="240"
					x2="280"
					y2="240"
					stroke="white"
					stroke-width="2" />
				<!-- Pocket -->

				<!-- Vertical Divider 1 (Separating Reception from Middle) -->
				<!-- Moved to x=360 (18ft mark) -->
				<!-- Ends exactly at y=470 (Interior Face) -->
				<!-- Split for Bathroom Pocket Door (Shifted UP to y=380-440) -->
				<line x1="360" y1="240" x2="360" y2="380" class="wall" />
				<line x1="360" y1="440" x2="360" y2="470" class="wall" />

				<!-- Mech Wall (Old IV Prep Wall) -->
				<!-- Horizontal MOVED UP slightly to y=370 -->
				<!-- Extended to x=550 to meet new wall -->
				<line x1="360" y1="370" x2="550" y2="370" class="wall" />

				<!-- New Bathroom / Mech Divider -->
				<!-- Vertical wall at x=460 (5ft from 360) -->
				<line x1="460" y1="370" x2="460" y2="470" class="wall" />

				<!-- IV PREP WALLS (Top Left) -->
				<!-- Left Wall (Shared with Lounge): x=350. -->
				<!-- Length adjusted to 8ft container width (ends at 160) -->
				<line x1="350" y1="10" x2="350" y2="160" class="wall" />

				<!-- Right Wall (Shared with Cryo): MOVED RIGHT to x=450 -->
				<!-- Length adjusted to 8ft container width (ends at 160) -->
				<line x1="450" y1="10" x2="450" y2="160" class="wall" />

				<!-- New Bottom Wall (Enclosing IV Prep): Center at y=156. -->
				<!-- Partial wall behind cabinet. x=350 to 390. -->
				<!-- Cabinet ends at x=394. Wall to 390 covers it partially. Need to cover fully? -->
				<!-- Cabinet: translate(354, 12) -> Rect width 40 -> x=394. -->
				<!-- Wall should go to 394+. Let's make it 395 for cleanliness. -->
				<line x1="350" y1="156" x2="395" y2="156" class="wall" />

				<!-- Vertical Divider 2 (Separating Middle from Right Rooms) -->
				<!-- TOP SECTION (Cryo/XP3 Divider) -->
				<!-- MOVED RIGHT to x=550. -->
				<line x1="550" y1="10" x2="550" y2="160" class="wall" />

				<!-- BOTTOM SECTION (IV Prep/HBOT Divider) STAYS at x=550 -->
				<!-- Ends exactly at y=470 (Interior Face) -->
				<line x1="550" y1="240" x2="550" y2="470" class="wall" />
				<!-- Bottom Wall -->

				<!-- Horizontal Room Divider (Top Right) -->
				<!-- Ends exactly at x=790 (Interior Face) -->
				<!-- Starts at x=550 (New partition) -->
				<line x1="550" y1="240" x2="790" y2="240" class="wall" />
				<!-- Connection from Top Wall (550) to Bottom Wall (550) along the hallway line -->
				<!-- <line x1="550" y1="240" x2="550" y2="240" class="wall" /> -->

				<!-- Cryotech / Prep Vertical Divider (Right Wall of Cryo) is x=550. Left is x=450. -->
				<!-- Line already drawn above. -->

				<!-- === DOORS === -->

				<!-- IV Prep Door REMOVED - Solid Wall -->

				<!-- Bathroom Door (Bottom Left Middle) - POCKET DOOR -->
				<!-- On wall x=360. Opening Shifted UP to y=380 to 440 (3ft/60px) -->
				<!-- Bottom wall segment is now longer (440 to 470) -->
				<line
					x1="360"
					y1="380"
					x2="360"
					y2="440"
					stroke="white"
					stroke-width="8" />
				<!-- Pocket Door sliding UP into wall (y=320 to 380) -->
				<line
					x1="360"
					y1="380"
					x2="360"
					y2="320"
					stroke="white"
					stroke-width="2" />

				<!-- Cryotech Door (Vertical Wall) - OPEN 48" -->
				<!-- Moved to new wall x=450, opening starts at y=160 -->
				<line
					x1="450"
					y1="160"
					x2="450"
					y2="240"
					stroke="white"
					stroke-width="8" />

				<!-- XP-3 Door (Top Right Room) - POCKET DOOR 48" -->
				<!-- Moved to new wall x=550 -->
				<!-- Opening 160 to 240 is exactly 80px (4ft) -->
				<line
					x1="550"
					y1="160"
					x2="550"
					y2="240"
					stroke="white"
					stroke-width="8" />
				<line
					x1="550"
					y1="160"
					x2="550"
					y2="80"
					stroke="white"
					stroke-width="2" />

				<!-- Hyperbaric Door (Bottom Right Room) - POCKET DOOR 48" -->
				<!-- Moved to new wall x=550 -->
				<line
					x1="550"
					y1="240"
					x2="550"
					y2="320"
					stroke="white"
					stroke-width="8" />
				<line
					x1="550"
					y1="320"
					x2="550"
					y2="400"
					stroke="white"
					stroke-width="2" />

				<!-- === FURNITURE LAYER === -->
				<g id="furniture-layer" class="layer">
					<!-- RECEPTION AREA -->
					<text
						x="180"
						y="400"
						class="label-text"
						style="font-size: 16px; fill: #555">
						RECEPTION
					</text>
					<text
						x="180"
						y="420"
						class="sub-label-text"
						style="font-size: 12px; fill: #777">
						AREA
					</text>

					<!-- Seating Area (Bottom Wall) -->
					<!-- Interior Wall y=470. Chair depth 30px (1.5ft). y position = 440. -->
					<g transform="translate(180, 440)">
						<rect
							x="0"
							y="0"
							width="40"
							height="30"
							rx="5"
