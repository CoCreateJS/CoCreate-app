<!DOCTYPE html>
<html
	state-id="theme"
	lang="en"

	data-topbar-color="defualt"
	data-sidebar-color="dark"

	data-preloader="disable"
	data-theme="default"
	data-theme-colors="default"

	<head>
		<meta charset="utf-8" />
        <title>Geneomes - Regenerative Health & Medicine Store</title>
        <meta name="keywords" content="geneomes, cells, peptides, exosomes, regenerative medicine, health, medicines, growth factors, health supplies, biotech, wellness, ecommerce, store" />
        <meta name="description" content="Geneomes is an ecommerce store for regenerative health and medicine, offering peptides, exosomes, cell growth factors, and innovative health supplies." />

		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<meta content="Geneomes" name="author" />

		<!-- Favicon -->
		<link rel="shortcut icon" href="/assets/images/icons/favicon.ico" />

		<!-- Bootstrap -->
		<link
			href="/assets/css/bootstrap.min.css"
			rel="stylesheet"
			type="text/css" />

		<!-- Icons -->
		<link
			href="/assets/css/icons.min.css"
			rel="stylesheet"
			type="text/css" />

		<!-- Menu Icon -->
		<link
			href="/assets/css/menu-icon.css"
			rel="stylesheet"
			type="text/css" />

		<!-- Plugins -->
		<link plugins />
		
		<!-- App -->
		<link href="/assets/css/app.css" rel="stylesheet" type="text/css" />

		<!-- Custom -->
		<link href="/assets/css/custom.css" 
			rel="stylesheet" 
			type="text/css" 
			parse="true" 
			save="false" />

		<!-- Manifest -->
		<link rel="manifest" href="/manifest.webmanifest" />
	</head>

	<body data-bs-spy="scroll" data-bs-target="#navbar-example">
		<!-- Begin page -->
		<div class="layout-wrapper landing">
            
			<!-- Nav Start -->
			<nav src="/components/nav.html" value-type="outerHTML"></nav>
            <!-- Nav End -->
			
			<!-- start hero section -->
			<section class="section hero-section" id="hero">
				<video
					class="position-absolute top-0 start-0 w-100 h-100"
					autoplay
					muted
					loop
					playsinline
					preload="metadata"
					style="object-fit: cover"
					aria-hidden="true">
					<source src="/assets/videos/home.mp4" type="video/mp4" />
				</video>
				<div
					class="position-absolute top-0 start-0 w-100 h-100"
					style="background: rgba(10, 19, 33, 0.55)"></div>
				<div class="container">
					<div class="row justify-content-center">
						<div class="col-lg-10">
							<div class="text-center mt-lg-5 pt-5">
								<h1 class="text-white display-4 fw-bolder mb-0">
									Discover. Optimize. Regenerate.
									<span class="d-block fs-5 fw-normal mt-4 lh-lg" style="max-width: 800px; margin: 0 auto;">
										Map your unique biological blueprint with precision diagnostics. Optimize your molecular chemistry with personalized formulations. Signal cellular renewal to maximize your performance and longevity.
									</span>
								</h1>
								<div class="d-flex gap-2 justify-content-center mt-4">
									<a href="#process" class="btn btn-primary">How It Works
										<i class="ri-information-line align-middle ms-1"></i>
									</a>
									<a 
										state-to="authView"
										state.src="./signup.html"
										href="/auth/" 
										class="btn btn-outline-secondary">Start Your Journey
										<i class="ri-arrow-right-line align-middle ms-1"></i>
									</a>
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>
			<!-- end hero section -->

			<!-- start client section -->
			<!-- <section class="pt-5 mt-5" src="/components/clients.html"></section> -->
			<!-- end client section -->

			<!-- start process -->
			<section class="section" id="process" src="/components/process.html"></section>
			<!-- end process -->

			<!-- start cta -->
			<section class="py-5 bg-primary position-relative" src="/components/cta.html"></section>
			<!-- end cta -->

			<!-- start marketplace -->
			<!-- <section class="section bg-light" id="marketplace" src="/components/marketplace.html"></section> -->
			<!-- end marketplace -->
			
			<!-- start plan -->
			<!-- <section class="section bg-light" id="plans" src="/components/plans.html"></section> -->
			<!-- end plan -->

			<!-- start faqs -->
			<section class="section" id="faqs" src="/components/faqs.html"></section>
			<!-- end faqs -->

			<!-- start review -->
			<section class="section bg-primary" id="reviews" src="/components/reviews.html"></section>
			<!-- end review -->

			<!-- start counter -->
			<!-- <section class="py-5 position-relative bg-light" src="/components/counter.html"></section> -->
			<!-- end counter -->

			<!-- start team -->
			<section class="section bg-light" id="team" src="/components/team.html"></section>
			<!-- end team -->

			<!-- start contact -->
			<section class="section" id="contact" src="/components/contact.html"></section>
			<!-- end contact -->

			<!-- start cta -->
			<section class="py-5 bg-primary position-relative" src="/components/cta.html"></section>
			<!-- end cta -->

            <!-- Footer Start -->
            <footer 
                class="custom-footer bg-dark py-5 position-relative" 
                src="/components/footer.html" value-type="outerHTML">
            </footer>
            <!-- Footer End -->

			<!-- Back To Top Start -->
			 <div src="/components/scroll-to-top.html"></div>
			<!-- Back To Top End -->
