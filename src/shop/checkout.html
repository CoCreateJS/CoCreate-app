<div class="p-3 p-md-4">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<div>
			<div class="fw-semibold">Checkout</div>
			<div class="small text-muted">3 items in order</div>
		</div>
		<span class="badge bg-success-subtle text-success">$9,000</span>
	</div>

	<div class="border rounded-3 p-3 bg-light mb-3">
		<div class="fw-semibold mb-2">Order Summary</div>
		<div class="d-flex justify-content-between align-items-start mb-2 gap-3">
			<div>
				<div class="fw-medium small">Discover</div>
				<div class="text-muted small">Baseline testing</div>
			</div>
			<div class="small fw-medium">$2,500</div>
		</div>
		<div class="d-flex justify-content-between align-items-start mb-2 gap-3">
			<div>
				<div class="fw-medium small">Cell Growth Factors - Full Vial</div>
				<div class="text-muted small">Clinical loading dose</div>
			</div>
			<div class="small fw-medium">$5,000</div>
		</div>
		<div class="d-flex justify-content-between align-items-start mb-2 gap-3">
			<div>
				<div class="fw-medium small">Needleless Injection</div>
				<div class="text-muted small">At-home maintenance hardware</div>
			</div>
			<div class="small fw-medium">$1,500</div>
		</div>
		<hr class="my-3" />
		<div class="d-flex justify-content-between small mb-1">
			<span class="text-muted">Shipping</span>
			<span>Free</span>
		</div>
		<div class="d-flex justify-content-between fw-semibold">
			<span>Total</span>
			<span>$9,000</span>
		</div>
	</div>

	<div class="vstack gap-3">
		<div>
			<label class="form-label small mb-1">Full Name</label>
			<input class="form-control" type="text" placeholder="Your full name" />
		</div>
		<div>
			<label class="form-label small mb-1">Email</label>
			<input class="form-control" type="email" placeholder="you@example.com" />
		</div>
		<div>
			<label class="form-label small mb-1">Phone</label>
			<input class="form-control" type="text" placeholder="Phone number" />
		</div>
		<div>
			<label class="form-label small mb-1">Country</label>
			<select class="form-select">
				<option src="/components/countries" value-type="outerHTML">Select country</option>
			</select>
		</div>
		<div>
			<label class="form-label small mb-1">Address</label>
			<input class="form-control mb-2" type="text" placeholder="Street address" />
			<input class="form-control" type="text" placeholder="Apartment, suite, unit (optional)" />
		</div>
		<div>
			<label class="form-label small mb-1">Payment Method</label>
			<select class="form-select">
				<option>Direct bank transfer</option>
				<option>Check payments</option>
				<option>Cash on delivery</option>
				<option>PayPal</option>
			</select>
		</div>
		<div>
			<label class="form-label small mb-1">Order Notes</label>
			<textarea class="form-control" rows="3" placeholder="Scheduling or delivery notes"></textarea>
		</div>
		<div class="form-check">
			<input class="form-check-input" type="checkbox" id="checkout-terms" />
			<label class="form-check-label small text-muted" for="checkout-terms">
				I agree to the terms and conditions.
			</label>
		</div>
		<button class="btn btn-primary w-100" type="button">
			Place Order
			<i class="ri-arrow-right-line align-middle ms-1"></i>
		</button>
	</div>
</div>
