<div class="layout-width">
	<div class="navbar-header">
		<div class="d-flex">
			<!-- LOGO -->
			<div class="navbar-brand-box horizontal-logo">
				<a href="index.html" class="logo logo-dark">
					<span class="logo-sm">
						<img
							src="/assets/images/icons/512x512.png"
							alt=""
							height="22" />
					</span>
					<span class="logo-lg">
						<img
							src="/assets/images/logos/dark.png"
							alt=""
							height="40" />
					</span>
				</a>

				<a href="index.html" class="logo logo-light">
					<span class="logo-sm">
						<img
							src="/assets/images/icons/512x512.png"
							alt=""
							height="22" />
					</span>
					<span class="logo-lg">
						<img
							src="/assets/images/logos/light.png"
							alt=""
							height="40" />
					</span>
				</a>
			</div>

			<div class="px-3 font-size:16px header-item vertical-menu-btn topnav-hamburger material-shadow-none">
				<span
					class="hamburger-icon"
					click.class="vertical-sidebar-enable,"
					click-query="$document body">
					<span></span>
					<span></span>
					<span></span>
				</span>
			</div>

			<!-- App Search-->
			<form class="app-search d-none d-md-block">
				<div class="position-relative">
					<input
						type="text"
						class="form-control"
						placeholder="Search products, protocols, or kits..."
						autocomplete="off"
						id="search-options"
						aria-controls="search-dropdown"
						aria-expanded="false"
						aria-haspopup="listbox"
						value="" />
					<span class="ri-search-line search-widget-icon"></span>
					<span
						class="ri-close-circle-line search-widget-icon search-widget-icon-close d-none"
						id="search-close-options"></span>
				</div>
				<div
					class="dropdown-menu dropdown-menu-lg"
					id="search-dropdown"
					role="listbox"
					aria-labelledby="search-options"
					src="/components/search.html"></div>
			</form>
		</div>

		<div class="d-flex align-items-center">
			<div class="dropdown d-md-none topbar-head-dropdown header-item">
				<button
					type="button"
					class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle"
					id="header-search-button"
					aria-haspopup="true"
					aria-expanded="false"
					aria-controls="header-search-dropdown">
					<i class="ri-search-line fs-22"></i>
				</button>
				<div
					class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-0 right:0 top:72px"
					id="header-search-dropdown"
					aria-labelledby="header-search-button">
					<form class="p-3">
						<div class="form-group m-0">
							<div class="input-group">
								<input
									type="text"
									class="form-control"
									placeholder="Search products, protocols, or kits..."
									aria-label="Recipient's username" />
								<button class="btn btn-primary" type="submit">
									<i class="ri-search-line"></i>
								</button>
							</div>
						</div>
					</form>
				</div>
			</div>

			<!-- Fullscreen Icon with Badge -->
			<div class="ms-1 header-item">
				<button
					type="button"
					class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle"
					fullscreen>
					<i class="ri-fullscreen-line fs-22"></i>
					<i class="ri-fullscreen-exit-line fs-22"></i>
				</button>
			</div>

			<!-- Light/Dark theme Icon -->
			<div class="ms-1 header-item">
				<button
					type="button"
					array="contacts"
					object="$user_id"
					key="theme.colorScheme"
					value=""
					realtime="true"
					input.data-bs-theme="$value"
					input-query="$document html"
					click
					click.value="dark, light"
					class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle light-dark-mode"
					title="Toggle Light/Dark Mode">
					<i class="ri-moon-line fs-22"></i>
				</button>
			</div>

			<!-- Notifications Icon with Badge -->
			<div
				class="dropdown topbar-head-dropdown ms-1 header-item"
				id="notificationDropdown">
				<button
					type="button"
					class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle"
					id="header-notifications-button"
					aria-haspopup="dialog"
					aria-expanded="false"
					aria-controls="header-notifications-dropdown">
					<i class="ri-notification-line fs-22"></i>
					<!-- <span
						class="position-absolute topbar-badge fs-10 translate-middle badge rounded-pill bg-danger">
						3<span class="visually-hidden"> unread messages </span>
					</span> -->
				</button>
				<div
					class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-0 right:0 top:72px"
					aria-labelledby="header-notifications-button"
					id="header-notifications-dropdown"
					role="dialog"
					aria-close-on="outside, btn"
					src="/components/notifications.html"></div>
			</div>

			<div class="dropdown ms-sm-3 header-item topbar-user">
				<button
					type="button"
					class="btn material-shadow-none"
					id="header-user-button"
					aria-haspopup="true"
					aria-expanded="false"
					aria-controls="header-user-dropdown">
					<form
						class="d-flex align-items-center"
						array="contacts"
						object="$user_id">
						<div
							class="avatar-sm rounded-circle position-relative overflow-hidden">
							<div
								class="avatar-title bg-secondary-subtle text-secondary material-shadow">
								<span
									key="first_name"
									class="overflow-hidden width:1ch letter-spacing:1em"></span>
								<span
									key="last_name"
									class="overflow-hidden width:1ch letter-spacing:1em"></span>
								<img
									class="position-absolute object-fit-cover"
									src="/assets/images/transparent.png"
									key="avatar[0].src"
									alt="Header Avatar"
									width="100%"
									height="100%" />
							</div>
						</div>
						<span class="text-start ms-xl-2">
							<span
								class="d-none d-sm-inline-block ms-1 fw-medium user-name-text">
								<span key="first_name"></span>
								<span key="last_name"></span>
							</span>
							<span
								class="d-none d-sm-block ms-1 fs-12 user-name-sub-text"
								key="title"></span>
						</span>
					</form>
				</button>
				<div
					class="dropdown-menu dropdown-menu-end right:0 top:72px"
					id="header-user-dropdown"
					aria-labelledby="header-user-button"
					aria-close-on="anywhere"
					src="/components/user-dropdown.html"></div>
			</div>
		</div>
	</div>
</div>
