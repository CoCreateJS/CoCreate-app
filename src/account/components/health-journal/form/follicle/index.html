
<!-- Follicle Group -->
<input
	type="hidden"
	id="concern-follicle"
	array="contacts"
	object="$user_id"
	name="biometrics.follicle.group.status"
	key="biometrics.follicle.group.status"
	value="active" />

<div id="sub-follicle" class="d-flex flex-column gap-2">
	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="concern-hair-scalp">
			<input class="form-check-input" type="checkbox" id="concern-hair-scalp" array="contacts" object="$user_id" name="biometrics.follicle.scalp.status" key="biometrics.follicle.scalp.status" value="active">
			Scalp
		</label>
	</div>
	<textarea data-show-for="concern-hair-scalp" array="contacts" object="$user_id" name="biometrics.follicle.scalp.details" key="biometrics.follicle.scalp.details" placeholder="Details..." class="form-control border border-secondary rounded-2 w-100" rows="2" hidden></textarea>

	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="concern-hair-face">
			<input class="form-check-input" type="checkbox" id="concern-hair-face" array="contacts" object="$user_id" name="biometrics.follicle.face.status" key="biometrics.follicle.face.status" value="active">
			Facial Hair
		</label>
	</div>
	<textarea data-show-for="concern-hair-face" array="contacts" object="$user_id" name="biometrics.follicle.face.details" key="biometrics.follicle.face.details" placeholder="Details..." class="form-control border border-secondary rounded-2 w-100" rows="2" hidden></textarea>
</div>
