<!-- Right Wrist canonical -->

<!-- hidden concern input removed; overlay manages selection -->

<div id="sub-wrist-right" class="d-flex flex-column gap-2">
	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="wrist-right-carpal">
			<input
				type="checkbox"
				id="wrist-right-carpal"
				array="contacts"
				object="$user_id"
				name="biometrics.wrists.right.carpal_bones.status"
				key="biometrics.wrists.right.carpal_bones.status"
				value="active"
				class="form-check-input d-none"
				input-query="$parent $next"
				input.class="show," />
			<div
				class="border border-secondary rounded-1 d-flex align-items-center justify-content-center me-2"
				style="width: 0.75rem; height: 0.75rem"></div>
			<span class="text-uppercase">Carpal Bones</span>
		</label>
		<textarea
			array="contacts"
			object="$user_id"
			name="biometrics.wrists.right.carpal_bones.details"
			key="biometrics.wrists.right.carpal_bones.details"
			placeholder="Details..."
			class="form-control bg-opacity-50 border border-secondary fs-12 mt-1 mb-2 p-2 rounded-2 w-100"
			rows="2"
			style="resize: none; outline: none; box-shadow: none"
			hidden></textarea>
	</div>

	<div class="form-check form-check-secondary">
