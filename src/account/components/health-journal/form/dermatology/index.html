<!-- Dermatology Group -->
<input
	type="hidden"
	id="concern-dermatology"
	array="contacts"
	object="$user_id"
	name="biometrics.dermatology.group.status"
	key="biometrics.dermatology.group.status"
	value="active" />

<div id="sub-dermatology" class="d-flex flex-column gap-2">
	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="concern-skin-face">
			<input class="form-check-input" type="checkbox" id="concern-skin-face" array="contacts" object="$user_id" name="biometrics.dermatology.face.status" key="biometrics.dermatology.face.status" value="active">
			Facial Skin
		</label>
	</div>
	<textarea data-show-for="concern-skin-face" array="contacts" object="$user_id" name="biometrics.dermatology.face.details" key="biometrics.dermatology.face.details" placeholder="Details..." class="form-control border border-secondary rounded-2 w-100" rows="2" hidden></textarea>

	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="concern-skin-torso">
			<input class="form-check-input" type="checkbox" id="concern-skin-torso" array="contacts" object="$user_id" name="biometrics.dermatology.torso.status" key="biometrics.dermatology.torso.status" value="active">
			Torso Skin
		</label>
	</div>
	<textarea data-show-for="concern-skin-torso" array="contacts" object="$user_id" name="biometrics.dermatology.torso.details" key="biometrics.dermatology.torso.details" placeholder="Details..." class="form-control border border-secondary rounded-2 w-100" rows="2" hidden></textarea>

	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="concern-skin-limbs">
			<input class="form-check-input" type="checkbox" id="concern-skin-limbs" array="contacts" object="$user_id" name="biometrics.dermatology.limbs.status" key="biometrics.dermatology.limbs.status" value="active">
			Limbs Skin
		</label>
	</div>
	<textarea data-show-for="concern-skin-limbs" array="contacts" object="$user_id" name="biometrics.dermatology.limbs.details" key="biometrics.dermatology.limbs.details" placeholder="Details..." class="form-control border border-secondary rounded-2 w-100" rows="2" hidden></textarea>
</div>
