<!-- Gastrointestinal Group -->
<input
	type="hidden"
	id="concern-gastrointestinal"
	array="contacts"
	object="$user_id"
	name="biometrics.gastrointestinal.group.status"
	key="biometrics.gastrointestinal.group.status"
	value="active" />

<div id="sub-gastrointestinal" class="d-flex flex-column gap-2">
	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="concern-gi-stomach">
			<input class="form-check-input" type="checkbox" id="concern-gi-stomach" array="contacts" object="$user_id" name="biometrics.gastrointestinal.stomach.status" key="biometrics.gastrointestinal.stomach.status" value="active">
			Stomach
		</label>
	</div>
	<textarea data-show-for="concern-gi-stomach" array="contacts" object="$user_id" name="biometrics.gastrointestinal.stomach.details" key="biometrics.gastrointestinal.stomach.details" placeholder="Details..." class="form-control border border-secondary rounded-2 w-100" rows="2" hidden></textarea>

	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="concern-gi-liver">
			<input class="form-check-input" type="checkbox" id="concern-gi-liver" array="contacts" object="$user_id" name="biometrics.gastrointestinal.liver.status" key="biometrics.gastrointestinal.liver.status" value="active">
			Liver
		</label>
	</div>
	<textarea data-show-for="concern-gi-liver" array="contacts" object="$user_id" name="biometrics.gastrointestinal.liver.details" key="biometrics.gastrointestinal.liver.details" placeholder="Details..." class="form-control border border-secondary rounded-2 w-100" rows="2" hidden></textarea>

	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="concern-gi-intestines">
			<input class="form-check-input" type="checkbox" id="concern-gi-intestines" array="contacts" object="$user_id" name="biometrics.gastrointestinal.intestines.status" key="biometrics.gastrointestinal.intestines.status" value="active">
			Intestines
		</label>
	</div>
	<textarea data-show-for="concern-gi-intestines" array="contacts" object="$user_id" name="biometrics.gastrointestinal.intestines.details" key="biometrics.gastrointestinal.intestines.details" placeholder="Details..." class="form-control border border-secondary rounded-2 w-100" rows="2" hidden></textarea>
</div>
