<!-- Right Hip Group canonical -->

<!-- hidden concern input removed; overlay manages selection -->

<div id="sub-hip-right" class="d-flex flex-column gap-2">
	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="hip-right-femoro">
			<input
				type="checkbox"
				id="hip-right-femoro"
				array="contacts"
				object="$user_id"
				name="biometrics.hips.right.femoroacetabular.status"
				key="biometrics.hips.right.femoroacetabular.status"
				value="active"
				class="form-check-input" />

			<span class="text-uppercase">Femoroacetabular Joint</span>
		</label>
		<textarea
			data-show-for="hip-right-femoro"
			array="contacts"
			object="$user_id"
			name="biometrics.hips.right.femoroacetabular.details"
			key="biometrics.hips.right.femoroacetabular.details"
			placeholder="Details..."
			class="form-control bg-opacity-50 border border-secondary fs-12 mt-1 mb-2 p-2 rounded-2 w-100"
			rows="2"
			style="resize: none; outline: none; box-shadow: none"
			hidden></textarea>
	</div>

	<div class="form-check form-check-secondary">

			rows="2"
			style="resize: none; outline: none; box-shadow: none"
			hidden></textarea>
	</div>

	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="hip-right-si">
