<!-- Left Shoulder Group -->
<input
	type="hidden"
	id="concern-shoulder-left"
	array="contacts"
	object="$user_id"
	name="biometrics.shoulders.left.joint.status"
	key="biometrics.shoulders.left.joint.status"
	value="active" />

<div id="sub-shoulder-left" class="d-flex flex-column gap-2">
	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="shoulder-left-rotator">
			<input
				class="form-check-input"
				type="checkbox"
				id="shoulder-left-rotator"
				array="contacts"
				object="$user_id"
				name="biometrics.shoulders.left.rotator_cuff.status"
				key="biometrics.shoulders.left.rotator_cuff.status"
				value="active" />
			Rotator Cuff
		</label>
	</div>
	<textarea
		data-show-for="shoulder-left-rotator"
		array="contacts"
		object="$user_id"
		name="biometrics.shoulders.left.rotator_cuff.details"
		key="biometrics.shoulders.left.rotator_cuff.details"
		placeholder="Details..."
		class="form-control border border-secondary rounded-2 w-100"
		rows="2"
		hidden></textarea>

	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="shoulder-left-labrum">
			<input
				class="form-check-input"
				type="checkbox"
				id="shoulder-left-labrum"
				array="contacts"
				object="$user_id"
				name="biometrics.shoulders.left.labrum.status"
				key="biometrics.shoulders.left.labrum.status"
				value="active" />
			Labrum / Glenoid
		</label>
	</div>
	<textarea
		data-show-for="shoulder-left-labrum"
		array="contacts"
		object="$user_id"
		name="biometrics.shoulders.left.labrum.details"
		key="biometrics.shoulders.left.labrum.details"
		placeholder="Details..."
		class="form-control border border-secondary rounded-2 w-100"
		rows="2"
		hidden></textarea>

	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="shoulder-left-ac">
			<input
				class="form-check-input"
				type="checkbox"
				id="shoulder-left-ac"
				array="contacts"
				object="$user_id"
				name="biometrics.shoulders.left.ac_joint.status"
				key="biometrics.shoulders.left.ac_joint.status"
				value="active" />
			AC Joint
		</label>
	</div>
	<textarea
		data-show-for="shoulder-left-ac"
		array="contacts"
		object="$user_id"
		name="biometrics.shoulders.left.ac_joint.details"
		key="biometrics.shoulders.left.ac_joint.details"
		placeholder="Details..."
		class="form-control border border-secondary rounded-2 w-100"
		rows="2"
		hidden></textarea>

	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="shoulder-left-biceps">
			<input
				class="form-check-input"
				type="checkbox"
				id="shoulder-left-biceps"
				array="contacts"
				object="$user_id"
				name="biometrics.shoulders.left.biceps_tendon.status"
				key="biometrics.shoulders.left.biceps_tendon.status"
				value="active" />
			Biceps Tendon
		</label>
	</div>
	<textarea
		data-show-for="shoulder-left-biceps"
		array="contacts"
		object="$user_id"
		name="biometrics.shoulders.left.biceps_tendon.details"
		key="biometrics.shoulders.left.biceps_tendon.details"
		placeholder="Details..."
		class="form-control border border-secondary rounded-2 w-100"
		rows="2"
		hidden></textarea>
</div>
