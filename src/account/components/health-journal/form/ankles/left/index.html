<!-- Left Ankle Group -->

<div id="sub-ankle-left" class="d-flex flex-column gap-2">
	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="Achilles">
			<input
				class="form-check-input"
				type="checkbox"
				id="Achilles"
				array="contacts"
				object="$user_id"
				name="biometrics.ankles.left.achilles.status"
				key="biometrics.ankles.left.achilles.status"
				value="active"
				input-query="$parent $next"
				input.class="show," />
			Achilles Tendon
		</label>
	</div>
	<textarea
		array="contacts"
		object="$user_id"
		name="biometrics.ankles.left.achilles.details"
		key="biometrics.ankles.left.achilles.details"
		placeholder="Details..."
		class="form-control border border-secondary rounded-2 w-100"
		rows="2"
		hidden></textarea>
