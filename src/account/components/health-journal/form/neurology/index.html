<!-- Neurology canonical -->
<div>
	<div id="acc-neuro" class="pt-1 pb-2 mt-1 gap-2 d-flex flex-column">
		<!-- hidden concern input removed; overlay manages selection -->

		<div class="d-flex flex-column gap-2">
			<div class="form-check form-check-secondary">
				<label class="form-check-label" for="neuro-left">
					<input
						type="checkbox"
						id="neuro-left"
						array="contacts"
						object="$user_id"
						name="biometrics.neuro.left_hemisphere.status"
						key="biometrics.neuro.left_hemisphere.status"
						value="active"
						class="form-check-input"
						input-query="$parent $next"
						input.class="show," />

					<span class="fs-12 text-secondary">Left Hemisphere</span>
				</label>
				<textarea
					array="contacts"
					object="$user_id"
					name="biometrics.neuro.left_hemisphere.details"
					key="biometrics.neuro.left_hemisphere.details"
					placeholder="Details..."
					class="form-control bg-opacity-50 border border-secondary fs-12 mt-1 mb-2 p-2 rounded-2 w-100"
					rows="2"
					style="resize: none; outline: none; box-shadow: none"
					hidden></textarea>
			</div>

			<div class="form-check form-check-secondary">
				<label class="form-check-label" for="neuro-right">
					<input
						type="checkbox"
						id="neuro-right"
						array="contacts"
						object="$user_id"
						name="biometrics.neuro.right_hemisphere.status"
						key="biometrics.neuro.right_hemisphere.status"
						value="active"
						class="form-check-input"
						input-query="$parent $next"
						input.class="show," />

					<span class="fs-12 text-secondary">Right Hemisphere</span>
				</label>
				<textarea
					array="contacts"
					object="$user_id"
					name="biometrics.neuro.right_hemisphere.details"
					key="biometrics.neuro.right_hemisphere.details"
					placeholder="Details..."
					class="form-control bg-opacity-50 border border-secondary fs-12 mt-1 mb-2 p-2 rounded-2 w-100"
					rows="2"
					style="resize: none; outline: none; box-shadow: none"
					hidden></textarea>
			</div>

			<div class="form-check form-check-secondary">
				<label class="form-check-label" for="neuro-stem">
					<input
						type="checkbox"
						id="neuro-stem"
						array="contacts"
						object="$user_id"
						name="biometrics.neuro.brain_stem.status"
						key="biometrics.neuro.brain_stem.status"
						value="active"
						class="form-check-input"
						input-query="$parent $next"
						input.class="show," />

					<span class="fs-12 text-secondary">Brain Stem</span>
				</label>
				<textarea
					array="contacts"
					object="$user_id"
					name="biometrics.neuro.brain_stem.details"
					key="biometrics.neuro.brain_stem.details"
					placeholder="Details..."
					class="form-control bg-opacity-50 border border-secondary fs-12 mt-1 mb-2 p-2 rounded-2 w-100"
					rows="2"
					style="resize: none; outline: none; box-shadow: none"
					hidden></textarea>
			</div>
		</div>
	</div>
</div>
