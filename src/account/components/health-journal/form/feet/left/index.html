<!-- Left Foot Group -->
<input
	type="hidden"
	id="concern-foot-left"
	array="contacts"
	object="$user_id"
	name="biometrics.feet.left.joint.status"
	key="biometrics.feet.left.joint.status"
	value="active" />

				value="active"
				input-query="$parent $next"
				input.class="show," />

			name="biometrics.feet.left.plantar_fascia.details"
