<!-- hidden concern input removed; overlay manages selection -->

<!-- Female System Options -->
<div id="repro-female-options" class="gap-2 d-flex flex-column">
	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="repro-ovaries">
			<input
				type="checkbox"
				id="repro-ovaries"
				array="contacts"
				object="$user_id"
				name="biometrics.reproductive.female.ovaries.status"
				key="biometrics.reproductive.female.ovaries.status"
				value="active"
				class="form-check-input" />

			<span class="fs-12 text-secondary">Ovaries / Fallopian</span>
		</label>
		<textarea
			data-show-for="repro-ovaries"
			array="contacts"
			object="$user_id"
			name="biometrics.reproductive.female.ovaries.details"
			key="biometrics.reproductive.female.ovaries.details"
			placeholder="Details..."
			class="form-control bg-opacity-50 border border-secondary fs-12 mt-1 mb-2 p-2 rounded-2 w-100"
			rows="2"
			style="resize: none; outline: none; box-shadow: none"
			hidden></textarea>
	</div>

	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="repro-uterus">
			<input
				type="checkbox"
				id="repro-uterus"
				array="contacts"
				object="$user_id"
				name="biometrics.reproductive.female.uterus.status"
				key="biometrics.reproductive.female.uterus.status"
				value="active"
				class="form-check-input" />

			<span class="fs-12 text-secondary">Uterus / Cervix</span>
		</label>
		<textarea
			data-show-for="repro-uterus"
			array="contacts"
			object="$user_id"
			name="biometrics.reproductive.female.uterus.details"
			key="biometrics.reproductive.female.uterus.details"
			placeholder="Details..."
			class="form-control bg-opacity-50 border border-secondary fs-12 mt-1 mb-2 p-2 rounded-2 w-100"
			rows="2"
			style="resize: none; outline: none; box-shadow: none"
			hidden></textarea>
	</div>
</div>
