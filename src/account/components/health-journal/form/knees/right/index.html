<!-- Right Knee canonical -->

<!-- hidden concern input removed; overlay manages selection -->

<div id="sub-knee-right" class="d-flex flex-column gap-2">
	<div class="form-check form-check-secondary">
		<label class="form-check-label" for="knee-right-acl">
			<input
				type="checkbox"
				id="knee-right-acl"
				array="contacts"
				object="$user_id"
				name="biometrics.knees.right.acl.status"
				key="biometrics.knees.right.acl.status"
				value="active"
				class="form-check-input"
				input-query="$parent $next"
				input.class="show," />

			<span class="text-uppercase">ACL (Anterior Cruciate)</span>
		</label>
		<textarea
			array="contacts"
			object="$user_id"
			name="biometrics.knees.right.acl.details"
			key="biometrics.knees.right.acl.details"
			placeholder="Details..."
			class="form-control bg-opacity-50 border border-secondary fs-12 mt-1 mb-2 p-2 rounded-2 w-100"
			rows="2"
			style="resize: none; outline: none; box-shadow: none"
			hidden></textarea>
	</div>
