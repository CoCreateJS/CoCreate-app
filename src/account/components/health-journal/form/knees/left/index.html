<!-- Left Knee canonical -->
<input
	type="hidden"
	id="concern-knee-left"
	array="contacts"
	object="$user_id"
	name="biometrics.knees.left.joint.status"
	key="biometrics.knees.left.joint.status"
	value="active"
	class="d-none" />

<div id="sub-knee-left" class="d-flex flex-column gap-2">
	<div class="form-check form-check-secondary">
		<label
			class="form-check-label" for="knee-left-acl">
			<input
				type="checkbox"
				id="knee-left-acl"
				array="contacts"
				object="$user_id"
				name="biometrics.knees.left.acl.status"
				key="biometrics.knees.left.acl.status"
				value="active"
				class="form-check-input" />
			<span class="text-uppercase">ACL (Anterior Cruciate)</span>
		</label>
		<textarea
			data-show-for="knee-left-acl"
			array="contacts"
			object="$user_id"
			name="biometrics.knees.left.acl.details"
			key="biometrics.knees.left.acl.details"
			placeholder="Details..."
			class="form-control bg-opacity-50 border border-secondary fs-12 mt-1 mb-2 p-2 rounded-2 w-100"
			rows="2"
			style="resize: none; outline: none; box-shadow: none"
			hidden></textarea>
	</div>

	<div class="form-check form-check-secondary">
		<label
			class="form-check-label" for="knee-left-mcl">
