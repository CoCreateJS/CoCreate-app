<div class="container-fluid pb-5">
<div class="card bg-opacity-75 border-secondary shadow-sm mb-4">
<div class="card-body p-4">
<div class="d-flex align-items-center gap-3 mb-3">
<div class="avatar-md">
<span
class="avatar-title bg-secondary bg-opacity-25 text-warning rounded fs-2">
<i class="ri-walk-line"></i>
</span>
</div>
<div>
<h4 class="fs-24 fw-bold text-white mb-1">
Musculoskeletal System
</h4>
<p class="text-muted fs-14 mb-0">
Diagnostic breakdown for
<span
array="contacts"
object="$user_id"
key="first_name"
>Eleanor Vance</span
>
</p>
</div>
</div>
<p class="text-muted lh-base">
Comprehensive analysis of musculoskeletal markers derived from
epigenetic and systemic diagnostics.
</p>
</div>
</div>

<div class="row g-4">
<!-- System Score -->
<div class="col-md-4">
<div
class="card bg-opacity-50 border-secondary rounded-4 p-4 shadow-sm h-100">
<div class="card-body">
<div class="d-flex align-items-center mb-3">
<i class="ri-dashboard-line fs-2 text-warning me-2"></i>
<h5 class="text-white mb-0">System Score</h5>
</div>
<div class="mb-3">
<h3 class="fw-bold text-white mb-0">
<span
class="diagnostic"
array="diagnostics"
key="systems.musculoskeletal.score"
>--</span
>
</h3>
</div>
</div>
</div>
</div>
<!-- Functional Age -->
<div class="col-md-4">
<div
class="card bg-opacity-50 border-secondary rounded-4 p-4 shadow-sm h-100">
<div class="card-body">
<div class="d-flex align-items-center mb-3">
<i class="ri-calendar-event-line fs-2 text-info me-2"></i>
<h5 class="text-white mb-0">Functional Age</h5>
</div>
<div class="mb-3">
<h3 class="fw-bold text-white mb-0">
<span
class="diagnostic"
array="diagnostics"
key="systems.musculoskeletal.age"
>--</span
>
<small class="fs-12 text-muted fw-normal"
>yrs</small
>
</h3>
</div>
</div>
</div>
</div>
<!-- Status -->
<div class="col-md-4">
<div
class="card bg-opacity-50 border-secondary rounded-4 p-4 shadow-sm h-100">
<div class="card-body">
<div class="d-flex align-items-center mb-3">
<i class="ri-heart-pulse-line fs-2 text-success me-2"></i>
<h5 class="text-white mb-0">Clinical Status</h5>
</div>
<div class="mb-3">
<h3 class="fw-bold text-white mb-0 text-uppercase">
<span
class="diagnostic"
array="diagnostics"
key="systems.musculoskeletal.status"
>--</span
>
</h3>
</div>
</div>
</div>
</div>
</div>
</div>
