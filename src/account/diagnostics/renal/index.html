<div class="container-fluid pb-5">
<div class="card bg-opacity-75 border-secondary shadow-sm mb-4">

<div class="d-flex align-items-center gap-3 mb-3">

<span
class="avatar-title bg-secondary bg-opacity-25 text-info rounded fs-2">

</span>
</div>
<div>
<h4 class="fs-24 fw-bold text-white mb-1">
Renal (Kidney) System
</h4>
<p class="text-muted fs-14 mb-0">
Diagnostic breakdown for
<span
array="contacts"
object="$user_id"
key="first_name"
>Eleanor Vance</span
>
</p>
</div>
</div>

<!-- Category Overview -->
<div class="mt-4">
	<h5 class="fs-16 fw-semibold mb-2">Category Overview</h5>
	<div class="d-flex flex-wrap gap-3 w-100">
		<!-- Uric Acid Pathway -->
		<div class="w-300 flex-grow-1">
			<div state-to="accountView" class="card border-secondary border-opacity-50 cursor-pointer card-animate h-100 mb-0">
				<div class="card-body p-3 d-flex align-items-center justify-content-between" state-to="accountView" state.src="./categories/uric-acid-pathway/index.html">
					<div class="d-flex align-items-center gap-3 text-start">
						<div class="avatar-sm"><span class="avatar-title bg-info-subtle rounded text-info fs-4"><i class="ri-flask-line"></i></span></div>
						<div class="d-flex flex-column"><h6 class="fw-medium fs-13 mb-0">Uric Acid Pathway</h6><span class="fs-12 text-muted">Renal purine handling</span></div>
					</div>
					<div class="text-end ms-3"><p class="fs-22 fw-bold mb-0"><span array="diagnostics" object key="reports[1].results.category_scores.13.score"></span><span class="fs-12 text-muted fw-normal">%</span></p></div>
				</div>
			</div>
		</div>
	</div>
</div>
<p class="text-muted lh-base">
Comprehensive analysis of renal markers derived from
epigenetic and systemic diagnostics.
</p>

<div class="row g-4">
<!-- System Score -->
<div class="col-md-4">
<div
class="card bg-opacity-50 border-secondary rounded-4 p-4 shadow-sm h-100">
<div class="card-body">
<div class="d-flex align-items-center mb-3">
<i class="ri-dashboard-line fs-2 text-info me-2"></i>
<h5 class="text-white mb-0">System Score</h5>
</div>
<div class="mb-3">
<h3 class="fw-bold text-white mb-0">
<span
class="diagnostic"
array="diagnostics"
key="systems.renal.score"
>--</span
>
</h3>
</div>
</div>
</div>
</div>
<!-- Functional Age -->
<div class="col-md-4">
<div
class="card bg-opacity-50 border-secondary rounded-4 p-4 shadow-sm h-100">
<div class="card-body">
<div class="d-flex align-items-center mb-3">
<i class="ri-calendar-event-line fs-2 text-info me-2"></i>
<h5 class="text-white mb-0">Functional Age</h5>
</div>
<div class="mb-3">
<h3 class="fw-bold text-white mb-0">
<span
class="diagnostic"
array="diagnostics"
key="systems.renal.age"
>--</span
>
<small class="fs-12 text-muted fw-normal"
>yrs</small
>

</div>
</div>
</div>

<div
class="card bg-opacity-50 border-secondary rounded-4 p-4 shadow-sm h-100">

>--</span

</div>
</div>
