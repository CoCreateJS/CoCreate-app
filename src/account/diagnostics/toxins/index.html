<div class="container-fluid pb-5">
	<div class="card bg-opacity-75 border-secondary shadow-sm mb-4">
		<div class="card-body p-4">
			<div class="d-flex align-items-center gap-3 mb-3">
				<div class="avatar-md">
					<span
						class="avatar-title bg-secondary bg-opacity-25 text-danger rounded fs-2">
						<i class="ri-skull-2-line"></i>
					</span>
				</div>
				<div>
					<h4 class="fs-24 fw-bold text-white mb-1">Toxins</h4>
					<p class="text-muted fs-14 mb-0">
						Diagnostic breakdown for
						<span
							array="contacts"
							object="$user_id"
							key="first_name"></span>
					</p>
				</div>
			</div>
			<p class="text-muted lh-base">
				Overview of toxicant exposure and clearance markers.
			</p>
		</div>
	</div>

	<!-- Category Overview -->
	<div class="mt-4">
		<h5 class="fs-16 fw-semibold mb-2">Category Overview</h5>
		<div class="d-flex flex-wrap gap-3 w-100">
			<!-- Toxins -->
			<div class="w-300 flex-grow-1">
				<div
					state-to="accountView"
					class="card border-secondary border-opacity-50 cursor-pointer card-animate h-100 mb-0">
					<div
						class="card-body p-3 d-flex align-items-center justify-content-between"
						state-to="accountView"
						state.src="./categories/toxins/index.html">
						<div class="d-flex align-items-center gap-3 text-start">
							<div class="avatar-sm">
								<span
									class="avatar-title bg-info-subtle rounded text-info fs-4"
									><i class="ri-skull-2-line"></i
								></span>
							</div>
							<div class="d-flex flex-column">
								<h6 class="fw-medium fs-13 mb-0">Toxins</h6>
								<span class="fs-12 text-muted"
									>Environmental exposures</span
								>
							</div>
						</div>
						<div class="text-end ms-3">
							<p class="fs-22 fw-bold mb-0">
								<span
									array="diagnostics"
									object
									key="reports[1].results.category_scores.12.score"></span
								><span class="fs-12 text-muted fw-normal"
									>%</span
								>
							</p>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
