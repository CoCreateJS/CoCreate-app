<div class="container-fluid pb-5">
	<div class="card bg-opacity-75 border-secondary shadow-sm mb-4">
		<div class="card-body p-4">
			<div class="d-flex align-items-center gap-3 mb-3">
				<div class="avatar-md">
					<span
						class="avatar-title bg-secondary bg-opacity-25 text-success rounded fs-2">
						<i class="ri-drop-line"></i>
					</span>
				</div>
				<div>
					<h4 class="fs-24 fw-bold text-white mb-1">Gut Health</h4>
					<p class="text-muted fs-14 mb-0">
						Diagnostic breakdown for
						<span
							array="contacts"
							object="$user_id"
							key="first_name"
							>Eleanor Vance</span
						>
					</p>
				</div>
			</div>
			<p class="text-muted lh-base">
				Comprehensive analysis of gut health markers derived from
				epigenetic and systemic diagnostics.
			</p>
		</div>
	</div>

	<div class="row g-4">
		<!-- Microbiome Diversity -->
		<div class="col-md-6">
			<div
				class="card bg-opacity-50 border-secondary rounded-4 p-4 shadow-sm h-100">
				<div class="card-body">
					<div class="d-flex align-items-center mb-3">
						<i class="ri-microbe-line fs-2 text-success me-2"></i>
						<h5 class="text-white mb-0">Microbiome Diversity</h5>
					</div>
					<h2 class="display-4 fw-bold text-success mb-2">
						<span
							class="diagnostic"
							array="diagnostics"
							key="biomarkers.vit_b12_methylcobalamin.val"
							>92</span
						>
					</h2>
					<p class="text-muted fs-14">Alpha/Beta Diversity Index</p>
				</div>
			</div>
		</div>
		<!-- Pathogen and SCFA -->
		<div class="col-md-6">
			<div
				class="card bg-opacity-50 border-secondary rounded-4 p-4 shadow-sm h-100">
				<div class="card-body">
					<div class="d-flex align-items-center mb-3">
						<i class="ri-drop-line fs-2 text-primary me-2"></i>
						<h5 class="text-white mb-0">Flora & SCFA</h5>
					</div>
					<div class="mb-3">
						<h6 class="text-muted fs-14 text-uppercase mb-1">
							Pathogen Burden
						</h6>
						<h3 class="fw-bold text-info mb-0">
							<span
								class="diagnostic"
								array="diagnostics"
								key="biomarkers.glyphosate.val"
								>Low</span
							>
						</h3>
					</div>
					<div>
						<h6 class="text-muted fs-14 text-uppercase mb-1">
							SCFA Production
						</h6>
						<h3 class="fw-bold text-white mb-0">
							<span
								class="diagnostic"
								array="diagnostics"
								key="biomarkers.pah_air_pollution.val"
								>45</span
							>
							<small class="fs-12 text-muted fw-normal"
								>mmol/kg</small
							>
						</h3>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
