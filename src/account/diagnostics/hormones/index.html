<div class="container-fluid pb-5">
	<div class="card bg-opacity-75 border-secondary shadow-sm mb-4">
		<div class="card-body p-4">
			<div class="d-flex align-items-center gap-3 mb-3">
				<div class="avatar-md">
					<span
						class="avatar-title bg-secondary bg-opacity-25 text-info rounded fs-2">
						<i class="ri-pulse-line"></i>
					</span>
				</div>
				<div>
					<h4 class="fs-24 fw-bold text-white mb-1">
						Hormone Levels
					</h4>
					<p class="text-muted fs-14 mb-0">
						Diagnostic breakdown for
						<span
							array="contacts"
							object="$user_id"
							key="first_name"
							>Eleanor Vance</span
						>
					</p>
				</div>
			</div>
			<p class="text-muted lh-base">
				Comprehensive analysis of hormone levels markers derived from
				epigenetic and systemic diagnostics.
			</p>
		</div>
	</div>

	<div class="row g-4">
		<!-- Primary Hormones -->
		<div class="col-md-6">
			<div
				class="card bg-opacity-50 border-secondary rounded-4 p-4 shadow-sm h-100">
				<div class="card-body">
					<div class="d-flex align-items-center mb-3">
						<i class="ri-pulse-line fs-2 text-info me-2"></i>
						<h5 class="text-white mb-0">Primary Hormones</h5>
					</div>
					<div class="mb-3">
						<h6 class="text-muted fs-14 text-uppercase mb-1">
							Testosterone
						</h6>
						<h3 class="fw-bold text-success mb-0">
							<span
								class="diagnostic"
								array="diagnostics"
								key="biomarkers.choline_total.val"
								>750</span
							>
							<small class="fs-12 text-muted fw-normal"
								>ng/dL</small
							>
						</h3>
					</div>
					<div class="mb-0">
						<h6 class="text-muted fs-14 text-uppercase mb-1">
							Estradiol
						</h6>
						<h3 class="fw-bold text-white mb-0">
							<span
								class="diagnostic"
								array="diagnostics"
								key="biomarkers.vit_d_cholecalciferol.val"
								>24</span
							>
							<small class="fs-12 text-muted fw-normal"
								>pg/mL</small
							>
						</h3>
					</div>
				</div>
			</div>
		</div>
		<!-- Stress & Adrenal -->
		<div class="col-md-6">
			<div
				class="card bg-opacity-50 border-secondary rounded-4 p-4 shadow-sm h-100">
				<div class="card-body">
					<div class="d-flex align-items-center mb-3">
						<i class="ri-fire-line fs-2 text-warning me-2"></i>
						<h5 class="text-white mb-0">Stress & Adrenal</h5>
					</div>
					<div class="mb-3">
						<h6 class="text-muted fs-14 text-uppercase mb-1">
							Cortisol
						</h6>
						<h3 class="fw-bold text-white mb-0">
							<span
								class="diagnostic"
								array="diagnostics"
								key="biomarkers.crp.val"
								>12</span
							>
							<small class="fs-12 text-muted fw-normal"
								>mcg/dL</small
							>
						</h3>
					</div>
					<div>
						<h6 class="text-muted fs-14 text-uppercase mb-1">
							DHEA-S
						</h6>
						<h3 class="fw-bold text-primary mb-0">
							<span
								class="diagnostic"
								array="diagnostics"
								key="biomarkers.kynurenine.val"
								>350</span
							>
							<small class="fs-12 text-muted fw-normal"
								>ug/dL</small
							>
						</h3>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
